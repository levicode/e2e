name: mcp-publisher
description: >-
  Installs the pinned, checksum-verified MCP Registry publisher at
  $RUNNER_TEMP/mcp-publisher. The release CDN is an external dependency, so a
  download failure is retried with capped exponential backoff; callers that
  only warn about the registry entry can opt out of failing the job.

inputs:
  required:
    description: >-
      Fail when the pinned release cannot be downloaded and verified. Set to
      false where the publisher validates publish-time metadata rather than
      product behavior.
    required: false
    default: 'true'

outputs:
  available:
    description: Whether the verified publisher is installed at $RUNNER_TEMP/mcp-publisher.
    value: ${{ steps.install.outputs.available }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        VERSION: v1.8.1
        SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        REQUIRED: ${{ inputs.required }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
        url="https://github.com/modelcontextprotocol/registry/releases/download/$VERSION/mcp-publisher_linux_amd64.tar.gz"
        rm -f "$archive" "$RUNNER_TEMP/mcp-publisher"
        # The CDN answers 5xx transiently through some runner egress proxies.
        # Each attempt either yields the exact reviewed bytes or is discarded;
        # the pinned digest, not the transport, decides what gets executed.
        delay=2
        for attempt in 1 2 3 4 5 6; do
          if curl -sSfL --connect-timeout 15 --max-time 300 -o "$archive" "$url"; then
            if echo "$SHA256  $archive" | sha256sum -c - >/dev/null 2>&1; then
              tar xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::attempt $attempt downloaded bytes that do not match the pinned sha256"
          else
            echo "::warning::attempt $attempt could not download the pinned MCP Registry publisher"
          fi
          rm -f "$archive"
          if [ "$attempt" -eq 6 ]; then
            if [ "$REQUIRED" = 'true' ]; then
              echo "::error::could not download and verify the pinned MCP Registry publisher after 6 attempts" >&2
              exit 1
            fi
            echo "::warning::MCP Registry publisher unavailable; the entry was not validated against the live registry"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep "$delay"
          delay=$((delay * 2))
        done
