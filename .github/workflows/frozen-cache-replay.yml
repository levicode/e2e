name: Frozen cache cross-engine replay
permissions:
  contents: read
concurrency:
  group: frozen-cache-replay-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  NATIVE_SOURCE_SHA: 496037c4b4b0bb75d3d13186603a7c9e5eaa576d
  NATIVE_SOURCE_TREE: 368c71da0de2ae94f9677a62f0d38fcbad18c576
jobs:
  frozen-original:
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: harness
        sparse-checkout: scripts/ci
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: e557432eb8e535e5862d9ede7eb40c1d92da0948
        path: source
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        package_json_file: source/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Build the original unchanged app and engine
      working-directory: source
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = e557432eb8e535e5862d9ede7eb40c1d92da0948

        pnpm install --frozen-lockfile

        pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build

        pnpm --filter @e2e-dev/github run build

        pnpm --filter @e2e-dev/web-benchmark run build


        '
      timeout-minutes: 15
    - name: Install exact original Playwright Chrome without unconditional fonts
      working-directory: source
      timeout-minutes: 9
      env:
        CACHE_CHROME_EVIDENCE: ${{ github.workspace }}/evidence/original
      run: 'set -euo pipefail

        mkdir -p "$CACHE_CHROME_EVIDENCE"

        node --input-type=module -e ''import assert from "node:assert/strict";import fs from "node:fs";assert.equal(JSON.parse(fs.readFileSync("packages/web/package.json")).dependencies["playwright-core"],"1.64.1")''

        date -u +%FT%TZ > "$CACHE_CHROME_EVIDENCE/browser-install.started"

        pnpm --filter @e2e-dev/web exec playwright-core install chromium

        export CACHE_CHROME_EXECUTABLE="$(cd packages/web && node --input-type=module -e ''import {chromium} from
        "playwright-core";process.stdout.write(chromium.executablePath())'')"

        python3 ../harness/scripts/ci/check-cache-baseline-chrome.py

        date -u +%FT%TZ > "$CACHE_CHROME_EVIDENCE/browser-install.finished"

        git rev-parse HEAD > "$CACHE_CHROME_EVIDENCE/source.sha"

        git rev-parse HEAD^{tree} > "$CACHE_CHROME_EVIDENCE/source.tree"

        '
    - name: Replay the 30 original files with no model and no live input
      working-directory: source
      env:
        CACHE_GATE_EVIDENCE: ${{ github.workspace }}/evidence/original
      run: 'set -euo pipefail

        mkdir -p "$CACHE_GATE_EVIDENCE"

        unset NATIVE_SOURCE_SHA E2E_AGENT_BROWSER_EXECUTABLE AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY
        GH_TOKEN GITHUB_TOKEN

        node ../harness/scripts/ci/frozen-cache-gate.mjs 2>&1 | tee "$CACHE_GATE_EVIDENCE/run.log"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: frozen-cache-original-evidence
        path: evidence/original/
        if-no-files-found: error
        retention-days: 7
  frozen-candidate:
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - run: pnpm install --frozen-lockfile
    - name: Record exact candidate and source pin
      run: 'set -euo pipefail

        mkdir -p evidence/cache-replay evidence/lifecycle

        git rev-parse HEAD > evidence/recipe-source.sha

        git rev-parse HEAD^{tree} > evidence/recipe-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser")''

        '
    - name: Download bounded exact cross-run producer artifact
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/download-interrupt-runtime.py
    - name: Verify explicit producer and native bytes
      timeout-minutes: 1
      run: node scripts/ci/verify-interrupt-runtime.ts "$RUNNER_TEMP/interrupt-native-runtime"
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
    - name: Install browser and build actual packages and unchanged app
      run: 'set -euo pipefail

        pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build

        pnpm --filter @e2e-dev/github run build

        pnpm --filter @e2e-dev/web-benchmark run build

        node --test scripts/ci/frozen-cache-contract.test.mjs

        '
      timeout-minutes: 15
    - name: Typecheck actual new dynamic output integration and all core tests
      run: pnpm --filter e2e exec tsc --noEmit -p tsconfig.json
      timeout-minutes: 10
    - name: Install pinned fixture Playwright Chrome
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium
      timeout-minutes: 8
    - name: Actual frozen cache replay, including seven old output anchors
      run: 'set -euo pipefail

        unset AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY GH_TOKEN GITHUB_TOKEN

        node scripts/ci/frozen-cache-gate.mjs 2>&1 | tee evidence/cache-replay/run.log

        '
    - name: Original new-record/new-replay, handoff and end-state contracts plus fresh output cancellation
      if: ${{ !cancelled() }}
      run: 'set -euo pipefail

        unset AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY GH_TOKEN GITHUB_TOKEN

        tests=(tests/unit/step-cache.test.ts tests/unit/trace-cache.test.ts tests/unit/trace-replay.test.ts tests/integration/agent-trace-cache.test.ts
        tests/integration/trace-cache-replay.test.ts tests/integration/route-announcer-cache.test.ts tests/integration/output-derived-cache.test.ts)

        pnpm --filter e2e exec vitest list "${tests[@]}" --no-staticParse --json="$GITHUB_WORKSPACE/evidence/lifecycle/collect.json"

        set +e

        pnpm --filter e2e exec vitest run "${tests[@]}" --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/lifecycle/result.json"
        2>&1 | tee evidence/lifecycle/run.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/lifecycle/exit

        node --input-type=module - <<''JS''

        import assert from ''node:assert/strict'';import fs from ''node:fs'';

        const collection=JSON.parse(fs.readFileSync(''evidence/lifecycle/collect.json''));

        const result=JSON.parse(fs.readFileSync(''evidence/lifecycle/result.json''));

        assert.equal(new Set(collection.map(row=>row.file)).size,7);

        assert.equal(collection.filter(row=>row.file.endsWith(''/output-derived-cache.test.ts'')).length,1);

        assert.ok(collection.length>100);

        assert.equal(result.numTotalTests,collection.length);

        assert.equal(result.numPassedTests,collection.length);

        assert.equal(result.numFailedTests,0);assert.equal(result.numPendingTests,0);assert.equal(result.numTodoTests,0);assert.equal(result.success,true);

        JS

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: frozen-cache-candidate-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
'on':
  push:
    branches:
    - implement/frozen-cache-replay-ci
  workflow_dispatch: null
