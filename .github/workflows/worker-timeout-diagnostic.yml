name: Focused worker timeout diagnostic
on:
  push:
    branches: [diagnostic/worker-timeout]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter e2e build && pnpm --filter @e2e-dev/web build
      - run: pnpm --filter @e2e-dev/web exec playwright-core install --with-deps chromium
      - name: Independent focused repetitions without changing assertions
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Independent worker timeout run $attempt"
            pnpm --filter e2e exec vitest run --project integration tests/integration/parallel-workers.test.ts -t 'times out a test that blocks its worker'
          done
