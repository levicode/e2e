name: Optional cleanup and stable public identity (focused)
'on':
  push:
    branches:
    - implement/optional-stable-identity-ci
permissions:
  contents: read
concurrency:
  group: optional-stable-identity-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 56ea8aa16d5b61884b90cdccee0cf2f54b410494
  NATIVE_SOURCE_TREE: c721ed48d752aa7bacfd8917d1c3a86928de4514
jobs:
  metadata-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - &id002
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - &id003
      name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native-source
        persist-credentials: false
    - name: Run exact-source existing scripted metadata fixtures
      run: "set -euo pipefail\ntest \"$(git -C native-source rev-parse HEAD)\" = \"$NATIVE_SOURCE_SHA\"\ntest \"\
        $(git -C native-source rev-parse HEAD^{tree})\" = \"$NATIVE_SOURCE_TREE\"\ntest -z \"$(git -C native-source\
        \ status --porcelain)\"\nfor fixture in author-metadata locator-projection query-matcher visibility; do\n\
        \ node \"native-source/cli/tests/fixtures/native-observation-$fixture.cjs\" 2>&1 | tee \"evidence/$fixture.log\"\
        \ndone\nsha256sum native-source/cli/src/native/client_observation.rs native-source/cli/tests/fixtures/native-observation-{author-metadata,locator-projection,query-matcher,visibility}.cjs\
        \ > evidence/fixture-source.sha256\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: i04-scripted-metadata-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  native-runtime:
    uses: ./.github/workflows/native-runtime.yml
  public-browser:
    needs: native-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - *id001
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - *id002
    - *id003
    - run: pnpm install --frozen-lockfile
    - name: Verify same-run source-built production runtime
      uses: ./.github/actions/native-runtime
      with:
        artifact-id: ${{ needs.native-runtime.outputs.artifact-id }}
        manifest-sha256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
        run-attempt: ${{ needs.native-runtime.outputs.run-attempt }}
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
    - name: Collect and run I04 and safe closed-shadow public contracts
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec vitest list tests/integration/observation-control-values.test.ts tests/integration/closed-shadow.test.ts
        --no-staticParse --json="$GITHUB_WORKSPACE/evidence/public.collect.json"

        node --input-type=module - <<''JS''

        import assert from ''node:assert/strict'';import fs from ''node:fs'';const r=JSON.parse(fs.readFileSync(''evidence/public.collect.json'',''utf8''));assert.equal(r.length,5);assert.equal(r.filter(x=>x.file.endsWith(''/observation-control-values.test.ts'')).length,3);assert.equal(r.filter(x=>x.file.endsWith(''/closed-shadow.test.ts'')).length,2);

        JS

        cp "$RUNNER_TEMP/ci-native-runtime/manifest.json" evidence/native-runtime.manifest.json

        sha256sum "$E2E_AGENT_BROWSER_EXECUTABLE" > evidence/native-executable.sha256

        unset GH_TOKEN GITHUB_TOKEN

        set +e

        pnpm --filter @e2e-dev/web exec vitest run tests/integration/observation-control-values.test.ts tests/integration/closed-shadow.test.ts
        --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/public.vitest.json" 2>&1
        | tee evidence/public.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/public.exit

        node --input-type=module - <<''JS''

        import assert from ''node:assert/strict'';import fs from ''node:fs'';const r=JSON.parse(fs.readFileSync(''evidence/public.vitest.json'',''utf8''));assert.equal(r.numTotalTests,5);assert.equal(r.numPassedTests,5);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(r.success,true);

        JS

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: optional-observe-public-browser-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  adapter-units:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
    - name: Full Web unit and source type checks
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec tsc --noEmit

        pnpm exec oxlint packages/web/src/native-surface.ts packages/web/src/native/engine-channel.ts packages/web/src/native/reference-aliases.ts
        packages/web/tests/unit/native-optional-pixel-transfer.test.ts packages/web/tests/integration/closed-shadow.test.ts

        pnpm --filter @e2e-dev/web exec vitest run tests/unit --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/web-units.json"
        2>&1 | tee evidence/web-units.log

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: optional-observe-adapter-unit-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  native-producer-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - name: Compile acceptance-faults exact test harness only
      shell: bash
      run: "set -euo pipefail\nmkdir -p evidence\ncd native/cli\ntest \"$(git rev-parse HEAD)\" = \"$NATIVE_SOURCE_SHA\"\
        \ntest \"$(git rev-parse HEAD^{tree})\" = \"$NATIVE_SOURCE_TREE\"\ntest -z \"$(git status --porcelain)\"\
        \nrustup toolchain install 1.99.1 --profile minimal\nrustc +1.99.1 -Vv > \"$GITHUB_WORKSPACE/evidence/rustc-version.txt\"\
        \ncargo +1.99.1 -Vv > \"$GITHUB_WORKSPACE/evidence/cargo-version.txt\"\nunset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER\
        \ RUSTFLAGS CARGO_ENCODED_RUSTFLAGS\nexport CARGO_TARGET_DIR=\"$RUNNER_TEMP/native-regressions-target\"\n\
        cargo +1.99.1 test --locked --profile ci --timings --no-default-features --features acceptance-faults --bin\
        \ agent-browser -j1 --no-run --message-format=json > \"$GITHUB_WORKSPACE/evidence/harness.jsonl\" 2> \"\
        $GITHUB_WORKSPACE/evidence/harness-build.log\"\npython3 - <<'PY_HARNESS'\nimport json, os\nfrom pathlib\
        \ import Path\nout = Path(os.environ['GITHUB_WORKSPACE']) / 'evidence'\npaths = set()\nbuild_finished =\
        \ []\nfor line in (out / 'harness.jsonl').read_text().splitlines():\n    record = json.loads(line)\n   \
        \ if record.get('reason') == 'build-finished':\n        build_finished.append(record.get('success') is True)\n\
        \    if (record.get('reason') == 'compiler-artifact'\n        and record.get('target', {}).get('name') ==\
        \ 'agent-browser'\n        and 'bin' in record.get('target', {}).get('kind', [])\n        and record.get('profile',\
        \ {}).get('test') is True\n        and record.get('features') == ['acceptance-faults']\n        and record.get('executable')):\n\
        \        paths.add(record['executable'])\nif build_finished != [True]:\n    raise SystemExit('Missing or\
        \ unsuccessful final compiler build receipt')\nif len(paths) != 1:\n    raise SystemExit(f'Expected exactly\
        \ one test executable, got {len(paths)}')\nharness = paths.pop()\nif not Path(harness).is_file():\n    raise\
        \ SystemExit('Compiler-selected harness is missing')\n(out / 'harness.path').write_text(harness + '\\n')\n\
        PY_HARNESS\nmkdir -p \"$GITHUB_WORKSPACE/native-harness\"\nharness=\"$(cat \"$GITHUB_WORKSPACE/evidence/harness.path\"\
        )\"\ncp \"$harness\" \"$GITHUB_WORKSPACE/native-harness/agent-browser-tests\"\ngit rev-parse HEAD > \"$GITHUB_WORKSPACE/native-harness/native-source.sha\"\
        \ngit rev-parse HEAD^{tree} > \"$GITHUB_WORKSPACE/native-harness/native-source.tree\"\n(cd \"$GITHUB_WORKSPACE/native-harness\"\
        ; sha256sum agent-browser-tests > SHA256SUMS)\n\nprintf '%s\\n' acceptance-faults > \"$GITHUB_WORKSPACE/native-harness/features.txt\"\
        \nprintf '%s\\n' \"$GITHUB_RUN_ID\" > \"$GITHUB_WORKSPACE/native-harness/producer-run.id\"\n\nmkdir -p \"\
        $GITHUB_WORKSPACE/evidence/cargo-timings\"\ncp -a \"$RUNNER_TEMP/native-regressions-target/cargo-timings/.\"\
        \ \"$GITHUB_WORKSPACE/evidence/cargo-timings/\"\n\nprintf \"harness-sha=%s\\n\" \"$(sha256sum \"$GITHUB_WORKSPACE/native-harness/agent-browser-tests\"\
        \ | cut -d' ' -f1)\" >> \"$GITHUB_OUTPUT\"\n"
      id: compile
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: harness_artifact
      with:
        name: paired-optional-feature-harness
        path: native-harness/
        if-no-files-found: error
        retention-days: 7
    - name: Run exact optional observation producer inventory
      run: python3 scripts/ci/run-optional-observe-tests.py "$(cat evidence/harness.path)" scripts/ci/optional-observe-inventory.json
        evidence/native-focused
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: optional-observe-native-focused-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    outputs:
      compiled: ${{ steps.compile.outcome }}
      harness-sha: ${{ steps.compile.outputs.harness-sha }}
      artifact-id: ${{ steps.harness_artifact.outputs.artifact-id }}
  original-core-consumers:
    needs: native-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - name: Reject held upper-layer fixture migration
      run: 'set -euo pipefail

        printf ''%s  %s\n'' ''d085ea56f7bcc05c52b11766ace80e3c8c5c9fa468a33950a763fd617fc79eb4'' ''packages/e2e/tests/helpers/fake-loop-model.ts''
        | sha256sum --check

        printf ''%s  %s\n'' ''62050ddd13c46035c4414e5fa51e3ffe18171b2ceaf4db244413d8a819cbfbb0'' ''packages/e2e/tests/helpers/trace-cache.ts''
        | sha256sum --check

        printf ''%s  %s\n'' ''c2f5d7b461254fb7fd0d2e3fb2007fcd658d511f472773af66eeba51c85716bb'' ''packages/e2e/tests/integration/agent-act-pixel-tools.test.ts''
        | sha256sum --check

        printf ''%s  %s\n'' ''270c94821fb3977503f41a261ba7ac429b5fa6231e2dd1f7a1fd2f41a5b65b13'' ''packages/e2e/tests/integration/agent-act-verbs.test.ts''
        | sha256sum --check

        printf ''%s  %s\n'' ''717b663c338ddffb1419f38fc921d295aea379469a47ca7c4e2ae9e0cda31f8b'' ''packages/e2e/tests/integration/agent-act.test.ts''
        | sha256sum --check

        printf ''%s  %s\n'' ''da327cb285108b2f9207db4a8310a463be59ffe391f5271d2d971cc5465dca3a'' ''packages/e2e/tests/integration/agent-ai-trace.test.ts''
        | sha256sum --check

        printf ''%s  %s\n'' ''a410f60a6cba9325280f4e6eedd9b85b3ce65e2378778fb4dcc5fa45206168fe'' ''packages/e2e/tests/integration/agent-policy.test.ts''
        | sha256sum --check

        printf ''%s  %s\n'' ''433230f1d60c0f51c764ab4a52c1203cf0bdc5f534e437c9044680ac50641c48'' ''packages/e2e/tests/integration/agent-trace-cache.test.ts''
        | sha256sum --check

        printf ''%s  %s\n'' ''40d8f9f8ec197119f56d8bf548e692dd7fa575afeee2f336e5234cf60558b51e'' ''packages/e2e/tests/integration/agent.test.ts''
        | sha256sum --check

        printf ''%s  %s\n'' ''bc8d4b38f6aa9e7e5f9c28be37610558c2015abee1a39aa6771b00a1aa09e3df'' ''packages/e2e/tests/integration/mcp-server.test.ts''
        | sha256sum --check

        printf ''%s  %s\n'' ''fcf046d4690910188d13ca3815458cba67188f1df8f19eba287da4abc504ff26'' ''packages/e2e/tests/integration/mcp-test-lines.test.ts''
        | sha256sum --check

        printf ''%s  %s\n'' ''8049c4ccebb14d6f007255957ef2a1ea45a7693a7f877400e854fb9f8f0d78d4'' ''packages/e2e/tests/integration/plain-string-secrets.test.ts''
        | sha256sum --check

        test ! -e packages/e2e/tests/unit/fake-loop-node-id.test.ts

        '
    - run: pnpm install --frozen-lockfile
    - name: Verify same-run source-built production runtime
      uses: ./.github/actions/native-runtime
      with:
        artifact-id: ${{ needs.native-runtime.outputs.artifact-id }}
        manifest-sha256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
        run-attempt: ${{ needs.native-runtime.outputs.run-attempt }}
    - name: Build actual public core and web adapter
      run: pnpm run build
    - name: Install original core fixture Playwright Chromium
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
    - name: Unchanged public reference consumers on the same native runtime
      run: 'set -euo pipefail

        cp "$RUNNER_TEMP/ci-native-runtime/manifest.json" evidence/native-runtime.manifest.json

        set +e

        pnpm --filter e2e exec vitest run tests/integration/agent-act-pixel-tools.test.ts tests/integration/agent-act-verbs.test.ts
        tests/integration/agent-act.test.ts tests/integration/agent-ai-trace.test.ts tests/integration/agent-policy.test.ts
        tests/integration/agent-trace-cache.test.ts tests/integration/agent.test.ts tests/integration/mcp-server.test.ts
        tests/integration/mcp-test-lines.test.ts tests/integration/plain-string-secrets.test.ts tests/integration/canonical-reference-roundtrip.test.ts
        --bail=0 --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/core-consumers.json"
        2>&1 | tee evidence/core-consumers.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/core-consumers.exit

        python3 - <<''PY_COUNTS''

        import json

        from pathlib import Path

        p=json.loads(Path(''evidence/core-consumers.json'').read_text())

        a=[a for t in p[''testResults''] for a in t[''assertionResults'']]

        counts={''total'':len(a),''passed'':sum(x[''status'']==''passed'' for x in a),''failed'':sum(x[''status'']==''failed''
        for x in a),''pending'':sum(x[''status''] not in (''passed'',''failed'') for x in a)}

        Path(''evidence/core-consumers-counts.json'').write_text(json.dumps(counts,indent=2)+''\n'')

        assert counts[''total'']==125 and counts[''pending'']==0 and counts[''passed'']+counts[''failed'']==125,counts

        PY_COUNTS

        exit "$status"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: optional-observe-original-core-consumers
        path: evidence/
        if-no-files-found: error
        retention-days: 7
