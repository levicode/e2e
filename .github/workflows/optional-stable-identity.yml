        run-attempt: ${{ needs.native-runtime.outputs.run-attempt }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.native-producer-tests.outputs.artifact-id }}
        path: native-harness
        merge-multiple: true
    - name: Verify same-run exact harness and installed native Chrome
      env:
        EXPECTED_HARNESS_SHA: ${{ needs.native-producer-tests.outputs.harness-sha }}
      run: 'set -euo pipefail

        test "$(git -C native rev-parse HEAD)" = "$NATIVE_SOURCE_SHA"

        test "$(git -C native rev-parse HEAD^{tree})" = "$NATIVE_SOURCE_TREE"

        test "$(cat native-harness/native-source.sha)" = "$NATIVE_SOURCE_SHA"

        test "$(cat native-harness/native-source.tree)" = "$NATIVE_SOURCE_TREE"

        test "$(cat native-harness/producer-run.id)" = "$GITHUB_RUN_ID"

        test "$(cat native-harness/features.txt)" = acceptance-faults

        printf ''%s  %s\n'' "$EXPECTED_HARNESS_SHA" native-harness/agent-browser-tests | sha256sum --check

        (cd native-harness; sha256sum --check SHA256SUMS)

        chmod +x native-harness/agent-browser-tests

        node scripts/acceptance/installed-chromium.ts "$HOME/.agent-browser/browsers" evidence/chromium-executable.json

        cp native-harness/native-source.* native-harness/features.txt native-harness/producer-run.id evidence/

        cp "$RUNNER_TEMP/ci-native-runtime/manifest.json" evidence/production-runtime.manifest.json

        '
    - name: Original43 in feature mode, not formal default acceptance
      run: python3 scripts/ci/run-optional-reopen43.py native-harness/agent-browser-tests evidence/chromium-executable.json
        evidence/activation43
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: paired-reopen43-feature-diagnostic
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    if: ${{ always() && needs.native-producer-tests.outputs.compiled == 'success' && needs.native-runtime.result
      == 'success' }}
