name: S22 historical native baseline installed diagnostic only
on:
  push:
    branches: [ci/s22-baseline-installed-diagnostic-fix1-20261031]
permissions:
  contents: read
  actions: read
concurrency:
  group: s22-baseline-installed-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installed_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_TELEMETRY_DISABLED: '1'
      E2E_UPDATE_CHECK_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_SCOPE_RETIREMENT_DIAGNOSTIC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      - name: Fresh outside-checkout diagnostic paths, never the pending S23 source
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          mkdir .artifacts/baseline-installed-diagnostic "$RUNNER_TEMP/baseline-installed-home"
          echo "HOME=$RUNNER_TEMP/baseline-installed-home" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/baseline-installed-playwright" >> "$GITHUB_ENV"
          node --version > .artifacts/baseline-installed-diagnostic/node.version
          pnpm --version > .artifacts/baseline-installed-diagnostic/pnpm.version
      - name: Original official locked dependencies and fresh public JS build
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Restore exact historical S22 ordinary ZIP with original run and artifact custody
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/restore-baseline-installed.py
      - name: Verify old runtime tuple and current unchanged production source; derive diagnostic provenance
        id: binding
        run: node scripts/ci/baseline-installed-runtime.mjs bind
      - name: Original official Chrome and real codecs installation
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/baseline-installed-runtime/agent-browser" install --with-deps
          pnpm --filter @e2e-dev/web exec playwright-core install chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version > .artifacts/baseline-installed-diagnostic/ffmpeg.version
          ffprobe -version > .artifacts/baseline-installed-diagnostic/ffprobe.version
          chrome="$(node scripts/acceptance/installed-chromium.ts "$HOME/.agent-browser/browsers" .artifacts/baseline-installed-diagnostic/chromium-executable.json)"
          echo "E2E_CHROMIUM_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
          "$chrome" --version > .artifacts/baseline-installed-diagnostic/chrome.version
      - name: Original live production handshake with current built Web; never reuse old probe
        run: |
          set -euo pipefail
          node --input-type=module -e "import { REQUIRED_CAPABILITIES } from './packages/web/dist/native/capabilities.js'; process.stdout.write(JSON.stringify(REQUIRED_CAPABILITIES))" > .artifacts/baseline-installed-diagnostic/required-capabilities.json
          node scripts/acceptance/probe-native.ts "$RUNNER_TEMP/baseline-installed-runtime/agent-browser" .artifacts/baseline-installed-diagnostic/required-capabilities.json .artifacts/baseline-installed-diagnostic/negotiation.json
      - name: Original public bundle assembly on this exact clean JS HEAD
        id: bundle
        run: |
          set -euo pipefail
          node scripts/acceptance/package-bundle.ts "$RUNNER_TEMP/baseline-installed-runtime/agent-browser" .artifacts/baseline-installed-diagnostic/diagnostic-producer.json .artifacts/baseline-installed-diagnostic/negotiation.json "$RUNNER_TEMP/baseline-installed-bundle"
          digest="$(sha256sum "$RUNNER_TEMP/baseline-installed-bundle/manifest.json" | cut -d ' ' -f 1)"
          echo "manifest_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Original full outside-checkout installed sequence exactly once
        id: installed
        env:
          EXPECTED_MANIFEST_SHA256: ${{ steps.bundle.outputs.manifest_sha256 }}
        run: |
          set +e
          node scripts/acceptance/candidate-installed.ts "$RUNNER_TEMP/baseline-installed-bundle" "$EXPECTED_MANIFEST_SHA256" "$RUNNER_TEMP/baseline-installed-consumer" .artifacts/baseline-installed-diagnostic > .artifacts/baseline-installed-diagnostic/installed-command.stdout.log 2> .artifacts/baseline-installed-diagnostic/installed-command.stderr.log
          s=$?
          printf '%s\n' "$s" > .artifacts/baseline-installed-diagnostic/installed-command.exit
          exit "$s"
      - name: Retain bounded diagnostic facts without replacing business failure
        if: ${{ !cancelled() && steps.installed.outcome != 'skipped' }}
        run: node scripts/ci/baseline-installed-runtime.mjs collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: s22-baseline-installed-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/baseline-installed-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        with:
          name: s22-baseline-installed-unaccepted-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baseline-installed-bundle/
          if-no-files-found: error
          retention-days: 7
