name: final source-pinned ordinary runtime producer
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.build.outputs.manifest-sha256 }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - id: pin
      run: node scripts/ci/native-runtime.ts pin
    - name: Require pin equals reviewed final native commit
      run: test "${{ steps.pin.outputs.sha }}" = "a3c319199c01895ef1036b5ec7b805cff2b41618"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ steps.pin.outputs.sha }}
        path: .artifacts/ci-native-source
        persist-credentials: false
    - name: Require exact reviewed native checkout tree
      run: 'set -euo pipefail

        test "$(git -C .artifacts/ci-native-source rev-parse HEAD)" = "a3c319199c01895ef1036b5ec7b805cff2b41618"

        test "$(git -C .artifacts/ci-native-source rev-parse HEAD^{tree})" = "24e447e640731f6830f8b47ad5b7a92f34cdf4bf"'
    - name: Install native build toolchain
      run: rustup toolchain install 1.99.1 --profile minimal
    - name: Build and seal the exact clean production runtime
      id: build
      env:
        RUSTUP_TOOLCHAIN: 1.99.1
      run: node scripts/ci/native-runtime.ts build .artifacts/ci-native-source "$RUNNER_TEMP/ci-native-target" "$RUNNER_TEMP/ci-native-artifact"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: upload
      with:
        name: ci-native-runtime-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-native-artifact/
        if-no-files-found: error
        retention-days: 7
'on':
  push:
    branches:
    - ci/s22-repair-ordinary-runtime-20261031
