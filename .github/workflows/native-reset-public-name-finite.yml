        chmod +x native-harness/agent-browser-tests

        node scripts/acceptance/installed-chromium.ts "$HOME/.agent-browser/browsers"
        evidence/chromium-executable.json

        cp native-harness/native-source.* native-harness/features.txt native-harness/producer-run.id
        evidence/

        cp "$RUNNER_TEMP/ci-native-runtime/manifest.json" evidence/production-runtime.manifest.json

        '
    - name: Pseudo capture real Chromium six-scenario test in feature mode
      run: python3 scripts/ci/run-pseudo-capture.py native-harness/agent-browser-tests
        evidence/chromium-executable.json evidence/pseudo-capture
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: pseudo-capture-feature-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    if: ${{ always() && needs.native-producer-tests.outputs.compiled == 'success'
      && needs.native-runtime.result == 'success' }}
  attribute-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - name: Run original six actual-source JS fixtures and historical public-name
        fixture
      run: "set -euo pipefail\nmkdir -p evidence\ntest \"$(git -C native rev-parse\
        \ HEAD)\" = \"$NATIVE_SOURCE_SHA\"\ntest \"$(git -C native rev-parse HEAD^{tree})\"\
        \ = \"$NATIVE_SOURCE_TREE\"\nstatus=0\nfor fixture in author-metadata fresh-fields\
        \ locator-projection query-matcher visibility attribute-selectors public-content-name;\
        \ do\n set +e\n node \"native/cli/tests/fixtures/native-observation-${fixture}.cjs\"\
        \ > \"evidence/${fixture}.log\" 2>&1\n result=$?\n set -e\n printf '%s\\n'\
        \ \"$result\" > \"evidence/${fixture}.exit\"\n if [ \"$result\" -ne 0 ]; then\
        \ status=1; fi\ndone\nexit \"$status\"\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: native-attribute-fixtures-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  public-content-name-browser:
    needs:
    - native-producer-tests
    - native-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from
        "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Download exact same-run native artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 3
      with:
        artifact-ids: ${{ needs.native-runtime.outputs.artifact-id }}
        path: ${{ runner.temp }}/ci-native-runtime
        merge-multiple: true
    - name: Verify exact source, compiler, host and binary
      timeout-minutes: 1
      env:
        EXPECTED_MANIFEST_SHA256: ${{ needs.native-runtime.outputs.manifest-sha256
          }}
        PRODUCER_ATTEMPT: ${{ needs.native-runtime.outputs.run-attempt }}
      run: node scripts/ci/native-runtime.ts verify "$RUNNER_TEMP/ci-native-runtime"
        "$EXPECTED_MANIFEST_SHA256" "$PRODUCER_ATTEMPT"
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.native-producer-tests.outputs.artifact-id }}
        path: native-harness
        merge-multiple: true
    - name: Verify same-run exact harness and installed native Chrome
      env:
        EXPECTED_HARNESS_SHA: ${{ needs.native-producer-tests.outputs.harness-sha
          }}
      run: 'set -euo pipefail

        test "$(git -C native rev-parse HEAD)" = "$NATIVE_SOURCE_SHA"

        test "$(git -C native rev-parse HEAD^{tree})" = "$NATIVE_SOURCE_TREE"

        test "$(cat native-harness/native-source.sha)" = "$NATIVE_SOURCE_SHA"

        test "$(cat native-harness/native-source.tree)" = "$NATIVE_SOURCE_TREE"

        test "$(cat native-harness/producer-run.id)" = "$GITHUB_RUN_ID"

        test "$(cat native-harness/features.txt)" = acceptance-faults

        printf ''%s  %s\n'' "$EXPECTED_HARNESS_SHA" native-harness/agent-browser-tests
        | sha256sum --check

        (cd native-harness; sha256sum --check SHA256SUMS)

        chmod +x native-harness/agent-browser-tests

        node scripts/acceptance/installed-chromium.ts "$HOME/.agent-browser/browsers"
        evidence/chromium-executable.json

        cp native-harness/native-source.* native-harness/features.txt native-harness/producer-run.id
        evidence/

        cp "$RUNNER_TEMP/ci-native-runtime/manifest.json" evidence/production-runtime.manifest.json

        '
    - name: Historical public names and ARIA role-selection contract in real Chromium
      run: python3 scripts/ci/run-public-content-name.py native-harness/agent-browser-tests
        evidence/chromium-executable.json evidence/public-content-name
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: historical-public-content-name-browser-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    if: ${{ always() && needs.native-producer-tests.outputs.compiled == 'success'
      && needs.native-runtime.result == 'success' }}
