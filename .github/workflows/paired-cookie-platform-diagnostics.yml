name: Paired cookie custody and original platform chronology
'on':
  push:
    branches:
    - ci/paired-cookie-platform-diagnostics
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: paired-cookie-platform-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: ff4c3a0db75261f2b083b583a740c3290e5b4a1c
  NATIVE_SOURCE_TREE: 8961a69b41b38d47c7e77fc025958e04eba201bf
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  baseline-e557:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: e557432eb8e535e5862d9ede7eb40c1d92da0948
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        path: ci-recipe
        persist-credentials: false
    - name: Add identical two-file test overlay only
      run: 'set -euo pipefail

        cp ci-recipe/packages/web/tests/integration/persistent-cookie-baseline.test.ts
        packages/web/tests/integration/

        cp ci-recipe/packages/web/vitest.persistent-cookie-probe.config.ts packages/web/

        test -z "$(git diff --name-only)"

        '
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Record product and identical probe identity
      run: 'set -euo pipefail

        mkdir -p evidence

        git rev-parse HEAD > evidence/product-checkout.sha

        git rev-parse HEAD^{tree} > evidence/product-checkout.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        sha256sum packages/web/tests/helpers/cdp-host.ts > evidence/host-helper.sha256

        test "$(sha256sum packages/web/tests/helpers/cdp-host.ts | cut -d'' '' -f1)"
        = 2a2bb072e5ed008c9ef350d9966db06b7df9c32c550f2a8bb2daf4ccad45ad0b

        sha256sum packages/web/tests/integration/persistent-cookie-baseline.test.ts
        packages/web/vitest.persistent-cookie-probe.config.ts > evidence/probe-files.sha256

        '
    - run: pnpm install --frozen-lockfile
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
      id: build
    - name: Install and verify the exact original borrowed-host Playwright Chromium
      timeout-minutes: 8
      id: borrowed_chrome
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec playwright-core install chromium

        pnpm --filter @e2e-dev/web exec node --input-type=module - <<''JS_CHROME''

        import { chromium } from ''playwright-core'';

        import { readFileSync, writeFileSync } from ''node:fs'';

        import { createHash } from ''node:crypto'';

        import { execFileSync } from ''node:child_process'';

        import assert from ''node:assert/strict'';

        import { createRequire } from ''node:module'';

        const require=createRequire(import.meta.url);assert.equal(require(''playwright-core/package.json'').version,''1.64.1'');

        const executable=chromium.executablePath();assert(!/[\r\n]/.test(executable));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.json'',JSON.stringify({executable,version:execFileSync(executable,[''--version''],{encoding:''utf8''}).trim(),sha256:createHash(''sha256'').update(readFileSync(executable)).digest(''hex''),playwright:''1.64.1''},null,2));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.path'',executable);

        JS_CHROME

        chrome="$(cat evidence/borrowed-chrome.path)"

        ldd "$chrome" > evidence/borrowed-chrome-ldd.txt

        ! grep -q ''not found'' evidence/borrowed-chrome-ldd.txt

        profile="$(mktemp -d "$RUNNER_TEMP/g2-borrowed-preflight.XXXXXX")"

        trap ''rm -rf -- "$profile"'' EXIT

        timeout --kill-after=2s 20 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage
        --user-data-dir="$profile" --dump-dom about:blank > evidence/borrowed-chrome-preflight.html
        2> evidence/borrowed-chrome-preflight.log

        '
    - name: Typecheck own source with identical cookie probe
      run: 'set -euo pipefail

        node --input-type=module - <<''JS_TYPES''

        import fs from ''node:fs'';

        const config={extends:''./tsconfig.base.json'',compilerOptions:{lib:[''ES2023'',''DOM'',''DOM.Iterable''],noEmit:true,paths:{''e2e'':[''./packages/e2e/src/index.ts''],''e2e/engine'':[''./packages/e2e/src/engine/index.ts''],''@e2e-dev/web'':[''./packages/web/src/index.ts'']}},files:[''packages/web/tests/integration/persistent-cookie-baseline.test.ts'']};

        fs.writeFileSync(''tsconfig.cookie-diagnostic.json'',JSON.stringify(config));

        JS_TYPES

        pnpm exec tsc --noEmit -p tsconfig.cookie-diagnostic.json 2>&1 | tee evidence/types.log

        rm tsconfig.cookie-diagnostic.json

        '
    - name: Collect and execute two diagnostic traces, not acceptance
      run: 'set -euo pipefail

        export E2E_COOKIE_PROBE_DIR="$GITHUB_WORKSPACE/evidence/cookie-probe"

        pnpm --filter @e2e-dev/web exec vitest list --config vitest.persistent-cookie-probe.config.ts
        --no-staticParse --json="$GITHUB_WORKSPACE/evidence/collection.json"

        python3 - <<''PY_LIST''

        import json

        assert len(json.load(open(''evidence/collection.json'')))==2

        PY_LIST

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        set +e

        pnpm --filter @e2e-dev/web exec vitest run --config vitest.persistent-cookie-probe.config.ts
        --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json"
        2>&1 | tee evidence/tests.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/tests.exit

        python3 - <<''PY_COUNT''

        import json

        r=json.load(open(''evidence/results.json''));a=[a for t in r[''testResults'']
        for a in t[''assertionResults'']];c={k:r[k] for k in [''numTotalTests'',''numPassedTests'',''numFailedTests'',''numPendingTests'']};json.dump(c,open(''evidence/counts.json'',''w''),indent=2);assert
        len(a)==r[''numTotalTests'']==2 and r[''numPendingTests'']==0

        PY_COUNT

        exit "$status"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: cookie-baseline-e557-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    env:
      E2E_SCOPE_RETIREMENT_DIAGNOSTIC: '0'
      E2E_INTEROP_BINDING_DIAGNOSTIC: '0'
      E2E_PLATFORM_HANDLER_DIAGNOSTIC: '0'
      E2E_DOWNLOAD_RELEASE_DIAGNOSTIC: '0'
      E2E_COOKIE_PROBE_LABEL: baseline-e557
  candidate-native:
