        import { createRequire } from ''node:module'';

        const require=createRequire(import.meta.url);assert.equal(require(''playwright-core/package.json'').version,''1.64.1'');

        const executable=chromium.executablePath();assert(!/[\r\n]/.test(executable));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.json'',JSON.stringify({executable,version:execFileSync(executable,[''--version''],{encoding:''utf8''}).trim(),sha256:createHash(''sha256'').update(readFileSync(executable)).digest(''hex''),playwright:''1.64.1''},null,2));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.path'',executable);

        JS_CHROME

        chrome="$(cat evidence/borrowed-chrome.path)"

        ldd "$chrome" > evidence/borrowed-chrome-ldd.txt

        ! grep -q ''not found'' evidence/borrowed-chrome-ldd.txt

        profile="$(mktemp -d "$RUNNER_TEMP/g2-borrowed-preflight.XXXXXX")"

        trap ''rm -rf -- "$profile"'' EXIT

        timeout --kill-after=2s 20 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage
        --user-data-dir="$profile" --dump-dom about:blank > evidence/borrowed-chrome-preflight.html
        2> evidence/borrowed-chrome-preflight.log

        '
    - name: Typecheck own source with identical cookie probe
      run: 'set -euo pipefail

        node --input-type=module - <<''JS_TYPES''

        import fs from ''node:fs'';

        const config={extends:''./tsconfig.base.json'',compilerOptions:{lib:[''ES2023'',''DOM'',''DOM.Iterable''],noEmit:true,paths:{''e2e'':[''./packages/e2e/src/index.ts''],''e2e/engine'':[''./packages/e2e/src/engine/index.ts''],''@e2e-dev/web'':[''./packages/web/src/index.ts'']}},files:[''packages/web/tests/integration/persistent-cookie-baseline.test.ts'']};

        fs.writeFileSync(''tsconfig.cookie-diagnostic.json'',JSON.stringify(config));

        JS_TYPES

        pnpm exec tsc --noEmit -p tsconfig.cookie-diagnostic.json 2>&1 | tee evidence/types.log

        rm tsconfig.cookie-diagnostic.json

        '
    - name: Collect and execute two diagnostic traces, not acceptance
      run: 'set -euo pipefail

        export E2E_COOKIE_PROBE_DIR="$GITHUB_WORKSPACE/evidence/cookie-probe"

        pnpm --filter @e2e-dev/web exec vitest list --config vitest.persistent-cookie-probe.config.ts
        --no-staticParse --json="$GITHUB_WORKSPACE/evidence/collection.json"

        python3 - <<''PY_LIST''

        import json

        assert len(json.load(open(''evidence/collection.json'')))==2

        PY_LIST

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        set +e

        pnpm --filter @e2e-dev/web exec vitest run --config vitest.persistent-cookie-probe.config.ts
        --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json"
        2>&1 | tee evidence/tests.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/tests.exit

        python3 - <<''PY_COUNT''

        import json

        r=json.load(open(''evidence/results.json''));a=[a for t in r[''testResults'']
        for a in t[''assertionResults'']];c={k:r[k] for k in [''numTotalTests'',''numPassedTests'',''numFailedTests'',''numPendingTests'']};json.dump(c,open(''evidence/counts.json'',''w''),indent=2);assert
        len(a)==r[''numTotalTests'']==2 and r[''numPendingTests'']==0

        PY_COUNT

        exit "$status"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: cookie-candidate-native-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    env:
      E2E_SCOPE_RETIREMENT_DIAGNOSTIC: '0'
      E2E_INTEROP_BINDING_DIAGNOSTIC: '0'
      E2E_PLATFORM_HANDLER_DIAGNOSTIC: '0'
      E2E_DOWNLOAD_RELEASE_DIAGNOSTIC: '0'
      E2E_COOKIE_PROBE_LABEL: candidate-native
  original-platform43:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from
        "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Restore exact prior ff4c ordinary artifact
      timeout-minutes: 4
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p evidence

        python3 scripts/ci/download-browser-recovery-runtime.py

        '
    - name: Verify exact prior source compiler host and binary
      id: verify
      run: 'set -euo pipefail

        node scripts/ci/verify-browser-recovery-runtime.ts "$RUNNER_TEMP/ci-native-runtime"

        '
      timeout-minutes: 1
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
    - name: Build actual public core and web adapter
      run: pnpm run build
    - name: Install and verify the exact original borrowed-host Playwright Chromium
      timeout-minutes: 8
      id: borrowed_chrome
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec playwright-core install chromium

        pnpm --filter @e2e-dev/web exec node --input-type=module - <<''JS_CHROME''

        import { chromium } from ''playwright-core'';

        import { readFileSync, writeFileSync } from ''node:fs'';

        import { createHash } from ''node:crypto'';

        import { execFileSync } from ''node:child_process'';

        import assert from ''node:assert/strict'';

        import { createRequire } from ''node:module'';

        const require=createRequire(import.meta.url);assert.equal(require(''playwright-core/package.json'').version,''1.64.1'');

        const executable=chromium.executablePath();assert(!/[\r\n]/.test(executable));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.json'',JSON.stringify({executable,version:execFileSync(executable,[''--version''],{encoding:''utf8''}).trim(),sha256:createHash(''sha256'').update(readFileSync(executable)).digest(''hex''),playwright:''1.64.1''},null,2));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.path'',executable);

        JS_CHROME

        chrome="$(cat evidence/borrowed-chrome.path)"

        ldd "$chrome" > evidence/borrowed-chrome-ldd.txt

        ! grep -q ''not found'' evidence/borrowed-chrome-ldd.txt

        profile="$(mktemp -d "$RUNNER_TEMP/g2-borrowed-preflight.XXXXXX")"

        trap ''rm -rf -- "$profile"'' EXIT

        timeout --kill-after=2s 20 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage
        --user-data-dir="$profile" --dump-dom about:blank > evidence/borrowed-chrome-preflight.html
        2> evidence/borrowed-chrome-preflight.log

        '
    - name: Strict typecheck exact platform diagnostic source
      run: 'set -euo pipefail

        cat > tsconfig.platform-diagnostic.json <<''JSON''

        {"extends": "./tsconfig.base.json", "compilerOptions": {"lib": ["ES2023",
        "DOM", "DOM.Iterable"], "noEmit": true, "paths": {"e2e": ["./packages/e2e/src/index.ts"],
        "@e2e-dev/web": ["./packages/web/src/index.ts"], "e2e/agent": ["./packages/e2e/src/agent/public.ts"],
        "e2e/engine": ["./packages/e2e/src/engine/index.ts"], "e2e/runner": ["./packages/e2e/src/runner.ts"],
        "e2e/oauth/chatgpt": ["./packages/e2e/src/oauth/chatgpt.ts"], "e2e/oauth/copilot":
        ["./packages/e2e/src/oauth/copilot.ts"], "e2e/oauth/grok": ["./packages/e2e/src/oauth/grok.ts"],
        "e2e/oauth/opencode-console": ["./packages/e2e/src/oauth/opencode-console.ts"]}},
        "files": ["packages/e2e/tests/integration/web-platform.test.ts"]}

        JSON

        pnpm exec tsc --noEmit -p tsconfig.platform-diagnostic.json 2>&1 | tee evidence/platform-types.log

        rm tsconfig.platform-diagnostic.json

        '
    - name: Execute unchanged full original test file
      run: 'set -euo pipefail

        python3 - <<''PY_PRIVATE''

        import os

        from pathlib import Path

        p=Path(''evidence/native-cleanup.jsonl'').resolve()

        fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600);os.close(fd)

        PY_PRIVATE

        export AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE="$GITHUB_WORKSPACE/evidence/native-cleanup.jsonl"

        cp "$RUNNER_TEMP/ci-native-runtime/manifest.json" evidence/native-runtime.manifest.json

        sha256sum "$E2E_AGENT_BROWSER_EXECUTABLE" > evidence/native-executable.sha256

        unset GH_TOKEN GITHUB_TOKEN

        pnpm --filter e2e exec vitest list tests/integration/web-platform.test.ts
        --no-staticParse --json="$GITHUB_WORKSPACE/evidence/collection.json"

        python3 - <<''PY_COLLECT''

        import json

        from pathlib import Path

        r=json.loads(Path(''evidence/collection.json'').read_text())

        assert isinstance(r,list) and len(r)>0

        assert all(x[''file''].endswith(''/tests/integration/web-platform.test.ts'')
        for x in r)


        PY_COLLECT

        set +e

        pnpm --filter e2e exec vitest run tests/integration/web-platform.test.ts --bail=0
        --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json"
        2>&1 | tee evidence/test.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/test.exit

        python3 - <<''PY_COUNT''

        import json

        from pathlib import Path

        expected=len(json.loads(Path(''evidence/collection.json'').read_text()))

        r=json.loads(Path(''evidence/results.json'').read_text())

        a=[a for t in r[''testResults''] for a in t[''assertionResults'']]

        counts={''expected'':expected,''executed'':sum(x[''status''] in (''passed'',''failed'')
        for x in a),''passed'':sum(x[''status'']==''passed'' for x in a),''failed'':sum(x[''status'']==''failed''
        for x in a),''pending'':sum(x[''status''] not in (''passed'',''failed'') for
        x in a)}

        Path(''evidence/execution-counts.json'').write_text(json.dumps(counts,indent=2)+''\n'')

        assert len(a)==expected and counts[''executed'']==expected and counts[''pending'']==0,counts

        PY_COUNT

        exit "$status"

        '
    - name: Preserve diagnostic completeness boundaries
      if: always()
      run: "python3 - <<'PY_DIAG'\nimport json,hashlib\nfrom pathlib import Path\n\
        p=Path('evidence/native-cleanup.jsonl');rows=[];bad=0\nif p.exists():\n for\
        \ line in p.read_text().splitlines():\n  try: rows.append(json.loads(line))\n\
        \  except (ValueError,TypeError): bad+=1\nout={'exists':p.exists(),'bytes':p.stat().st_size\
        \ if p.exists() else 0,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()\
        \ if p.exists() else None,'records':len(rows),'invalidLines':bad,'captureStarted':sum(x.get('phase')=='CaptureStarted'\
        \ for x in rows),'captureLimitReached':sum(x.get('phase')=='CaptureLimitReached'\
        \ for x in rows),'maxDroppedBefore':max([x.get('droppedBefore',0) for x in\
        \ rows]+[0]),'maxSuppressedBefore':max([x.get('suppressedBefore',0) for x\
        \ in rows]+[0]),'overflow':any(x.get('overflow') is True for x in rows),'absenceDoesNotProveSuccess':True,'acceptedMeansJoinedProducerOutputNotPublicSuccess':True,'pixelsAvailableMeansNativeOutputNotAdapter':True}\n\
        Path('evidence/diagnostic-boundary.json').write_text(json.dumps(out,indent=2)+'\\\
        n')\nPY_DIAG\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: original-platform-sequence-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    env:
      E2E_SCOPE_RETIREMENT_DIAGNOSTIC: '0'
      E2E_INTEROP_BINDING_DIAGNOSTIC: '0'
      E2E_PLATFORM_HANDLER_DIAGNOSTIC: '1'
      E2E_DOWNLOAD_RELEASE_DIAGNOSTIC: '0'
