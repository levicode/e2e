        assert all(x[''file''].endswith(''/tests/integration/web-download-lifecycle.test.ts'') for x in r)


        PY_COLLECT

        set +e

        pnpm --filter e2e exec vitest run tests/integration/web-download-lifecycle.test.ts --bail=0 --reporter=verbose
