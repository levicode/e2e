  full-fast-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - name: Compile supplementary fast-profile test harness (not production acceptance)
      shell: bash
      run: "set -euo pipefail\nmkdir -p evidence\ncd native/cli\ntest \"$(git rev-parse HEAD)\" = \"$NATIVE_SOURCE_SHA\"\
        \ntest \"$(git rev-parse HEAD^{tree})\" = \"$NATIVE_SOURCE_TREE\"\ntest -z \"$(git status --porcelain)\"\
        \nrustup toolchain install 1.99.1 --profile minimal\nrustc +1.99.1 -Vv > \"$GITHUB_WORKSPACE/evidence/rustc-version.txt\"\
        \ncargo +1.99.1 -Vv > \"$GITHUB_WORKSPACE/evidence/cargo-version.txt\"\nunset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER\
        \ RUSTFLAGS CARGO_ENCODED_RUSTFLAGS\nexport CARGO_TARGET_DIR=\"$RUNNER_TEMP/native-regressions-target\"\n\
        cargo +1.99.1 test --locked --profile ci-test-fast --config 'profile.ci-test-fast.inherits=\"ci\"' --config\
        \ profile.ci-test-fast.opt-level=1 --config 'profile.ci-test-fast.lto=\"off\"' --config profile.ci-test-fast.codegen-units=16\
        \ --config profile.ci-test-fast.debug=0 --config profile.ci-test-fast.debug-assertions=false --config profile.ci-test-fast.overflow-checks=false\
        \ --config 'profile.ci-test-fast.panic=\"unwind\"' --config profile.ci-test-fast.incremental=false --config\
        \ profile.ci-test-fast.strip=true --timings --no-default-features --bin agent-browser -j1 --no-run --message-format=json\
        \ > \"$GITHUB_WORKSPACE/evidence/harness.jsonl\" 2> \"$GITHUB_WORKSPACE/evidence/harness-build.log\"\npython3\
        \ - <<'PY_HARNESS'\nimport json, os\nfrom pathlib import Path\nout = Path(os.environ['GITHUB_WORKSPACE'])\
        \ / 'evidence'\npaths = set()\nbuild_finished = []\nfor line in (out / 'harness.jsonl').read_text().splitlines():\n\
        \    record = json.loads(line)\n    if record.get('reason') == 'build-finished':\n        build_finished.append(record.get('success')\
        \ is True)\n    if (record.get('reason') == 'compiler-artifact'\n        and record.get('target', {}).get('name')\
        \ == 'agent-browser'\n        and 'bin' in record.get('target', {}).get('kind', [])\n        and record.get('profile',\
        \ {}).get('test') is True\n        and record.get('features') == []\n        and record.get('executable')):\n\
        \        assert record['profile']['opt_level']=='1' and record['profile']['debug_assertions'] is False and\
        \ record['profile']['overflow_checks'] is False\n        paths.add(record['executable'])\nif build_finished\
        \ != [True]:\n    raise SystemExit('Missing or unsuccessful final compiler build receipt')\nif len(paths)\
        \ != 1:\n    raise SystemExit(f'Expected exactly one test executable, got {len(paths)}')\nharness = paths.pop()\n\
        if not Path(harness).is_file():\n    raise SystemExit('Compiler-selected harness is missing')\n(out / 'harness.path').write_text(harness\
        \ + '\\n')\nPY_HARNESS\nmkdir -p \"$GITHUB_WORKSPACE/native-harness\"\nharness=\"$(cat \"$GITHUB_WORKSPACE/evidence/harness.path\"\
        )\"\ncp \"$harness\" \"$GITHUB_WORKSPACE/native-harness/agent-browser-tests\"\ngit rev-parse HEAD > \"$GITHUB_WORKSPACE/native-harness/native-source.sha\"\
        \ngit rev-parse HEAD^{tree} > \"$GITHUB_WORKSPACE/native-harness/native-source.tree\"\n(cd \"$GITHUB_WORKSPACE/native-harness\"\
        ; sha256sum agent-browser-tests > SHA256SUMS)\n\nprintf '%s\\n' default > \"$GITHUB_WORKSPACE/native-harness/features.txt\"\
        \nprintf '%s\\n' \"$GITHUB_RUN_ID\" > \"$GITHUB_WORKSPACE/native-harness/producer-run.id\"\n\nmkdir -p \"\
        $GITHUB_WORKSPACE/evidence/cargo-timings\"\ncp -a \"$RUNNER_TEMP/native-regressions-target/cargo-timings/.\"\
        \ \"$GITHUB_WORKSPACE/evidence/cargo-timings/\"\n\nprintf \"harness-sha=%s\\n\" \"$(sha256sum \"$GITHUB_WORKSPACE/native-harness/agent-browser-tests\"\
        \ | cut -d' ' -f1)\" >> \"$GITHUB_OUTPUT\"\n"
      id: compile
    - name: Run complete original nonignored default harness without filters
      run: 'set -euo pipefail

        native-harness/agent-browser-tests --list > evidence/all-tests.list

        native-harness/agent-browser-tests --ignored --list > evidence/ignored-tests.list

        python3 - <<''PY_INVENTORY''

        import pathlib,json

        p=pathlib.Path(''evidence'')

        def names(f):return [x[:-6] for x in (p/f).read_text().splitlines() if x.endswith('': test'')]

        a=names(''all-tests.list'');i=names(''ignored-tests.list'');assert a and len(a)==len(set(a)) and len(i)==len(set(i))
        and set(i)<=set(a)

        json.dump({''total'':len(a),''ignored'':len(i),''nonignored'':len(a)-len(i),''features'':[],''standardDefaultFeatureAcceptance'':False},open(p/''inventory.json'',''w''),indent=2)

        PY_INVENTORY

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        set +e

        timeout --signal=TERM --kill-after=5s 1200 native-harness/agent-browser-tests > evidence/full-suite.log
        2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > evidence/full-suite.exit

        python3 - <<''PY_RESULTS''

        import pathlib,json,re

        p=pathlib.Path(''evidence'');s=(p/''full-suite.log'').read_text();i=json.load(open(p/''inventory.json''));m=re.findall(r''test
        result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out'',s)

        result={''exit'':int((p/''full-suite.exit'').read_text()),''inventory'':i,''summaries'':m,''failedTests'':re.findall(r''^test
        (.+) \.\.\. FAILED$'',s,re.M),''notOptimizedProductionAcceptance'':True}

        (p/''result.json'').write_text(json.dumps(result,indent=2)+''\n'');assert len(m)==1,m

        _,passed,failed,ignored,measured,filtered=m[0];assert int(passed)+int(failed)==i[''nonignored''];assert
        int(ignored)==i[''ignored''] and int(measured)==int(filtered)==0;assert int(passed)+int(failed)+int(ignored)==i[''total'']

        assert result[''exit'']==0 and int(failed)==0,result

        PY_RESULTS

        test "$status" -eq 0

        '
      if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: reference-fast-default-evidence-${{ github.run_id }}
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  node-public-types-and-pure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - name: Install and build actual public core before Web source types
      id: public_build
      run: 'set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY

        test -z "$(git status --porcelain)"

        mkdir -p evidence

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        pnpm install --frozen-lockfile

        pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build

        '
    - name: Strict actual Web source and all test typecheck
      id: web_types
      if: ${{ !cancelled() && steps.public_build.outcome == 'success' }}
      run: pnpm --filter @e2e-dev/web exec tsc --noEmit
    - name: Collect and execute seven complete relevant pure files without changing config budgets
      if: ${{ !cancelled() && steps.public_build.outcome == 'success' }}
      run: 'set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY

        pnpm --filter @e2e-dev/web exec vitest list tests/unit/native-reference-bridge.test.ts tests/unit/browser-channel.test.ts
        tests/unit/native-correlation.test.ts tests/unit/native-engine-decode.test.ts tests/unit/native-surface.test.ts
        tests/unit/native-persistent-raw-recovery.test.ts tests/unit/native-reconnect-admission.test.ts --no-staticParse
        --json="$GITHUB_WORKSPACE/evidence/collection.json"

        python3 - <<''PY_SELECT''

        import json,pathlib,collections

        r=json.load(open(''evidence/collection.json''));expected=[''native-reference-bridge.test.ts'', ''browser-channel.test.ts'',
        ''native-correlation.test.ts'', ''native-engine-decode.test.ts'', ''native-surface.test.ts'', ''native-persistent-raw-recovery.test.ts'',
        ''native-reconnect-admission.test.ts'']

        counts=collections.Counter(x[''file''].rsplit(''/'',1)[-1] for x in r)

        assert set(counts)==set(expected) and all(counts[x]>0 for x in expected),counts

        pathlib.Path(''evidence/collected-counts.json'').write_text(json.dumps(dict(counts),indent=2))

        PY_SELECT

        set +e

        pnpm --filter @e2e-dev/web exec vitest run tests/unit/native-reference-bridge.test.ts tests/unit/browser-channel.test.ts
        tests/unit/native-correlation.test.ts tests/unit/native-engine-decode.test.ts tests/unit/native-surface.test.ts
        tests/unit/native-persistent-raw-recovery.test.ts tests/unit/native-reconnect-admission.test.ts --reporter=verbose
        --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json" > evidence/tests.log 2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > evidence/tests.exit

        cat evidence/tests.log

        python3 - <<''PY_COUNT''

        import json,collections,pathlib

        c=json.load(open(''evidence/collection.json''));r=json.load(open(''evidence/results.json''));a=[a for t
        in r[''testResults''] for a in t[''assertionResults'']]

        assert len(a)==len(c) and all(x[''status''] in (''passed'',''failed'') for x in a)

        assert collections.Counter((x[''file''].rsplit(''/'',1)[-1],x[''name'']) for x in c)==collections.Counter((t[''name''].rsplit(''/'',1)[-1],''
        > ''.join(a[''ancestorTitles'']+[a[''title'']])) for t in r[''testResults''] for a in t[''assertionResults''])

        pathlib.Path(''evidence/execution-counts.json'').write_text(json.dumps({''collected'':len(c),''executed'':len(a),''passed'':sum(x[''status'']==''passed''
        for x in a),''failed'':sum(x[''status'']==''failed'' for x in a)},indent=2))

        PY_COUNT

        exit "$status"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: reference-node-pure-evidence-${{ github.run_id }}
        path: evidence/
        if-no-files-found: error
        retention-days: 7
