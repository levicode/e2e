name: agent-browser macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-browser-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: macOS 15 (${{ matrix.arch }})
    # Standard GitHub-hosted runners; no custom paid runner or user Mac required.
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            machine: arm64
            rustHost: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
            rustHost: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      E2E_TELEMETRY_DISABLED: '1'
      CARGO_BUILD_JOBS: '2'
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
      EXPECTED_RUST_HOST: ${{ matrix.rustHost }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Verify native macOS architecture
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          node --input-type=module -e 'import assert from "node:assert/strict"; assert.equal(process.platform, "darwin"); assert.equal(process.arch, process.env.EXPECTED_ARCH); assert.equal(process.version, "v24.19.0");'
          sw_vers
          pnpm --version
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/agent-browser-chromium" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate source lock and checkout refusal cases
        run: node --test packages/agent-browser/tests/native-source.test.ts
      - name: Compute isolated Rust dependency cache identity
        id: rust-cache-key
        run: node -e 'const fs=require("node:fs");const l=JSON.parse(fs.readFileSync("packages/agent-browser/native-source.lock.json","utf8"));fs.appendFileSync(process.env.GITHUB_OUTPUT,`key=rust-${l.rustToolchain}-${l.tree}-${l.upstreamBase}\n`);'
      - name: Restore Rust compilation dependencies only
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: native-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-cache-key.outputs.key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            .validation-tools/native-dependency-cache
      - name: Build and test exact maintained fork commit
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version
          rustc -vV | grep -Fx "host: $EXPECTED_RUST_HOST"
          bash packages/agent-browser/scripts/build-exact-agent-browser.sh
          BINARY="$PWD/.validation-tools/agent-browser-exact/cli/target/ci/agent-browser"
          test -x "$BINARY"
          file "$BINARY"
          echo "E2E_AGENT_BROWSER_EXECUTABLE=$BINARY" >> "$GITHUB_ENV"
      - name: Verify browser-free native protocol bundle
        run: node --test packages/agent-browser/tests/native-contract.integration.ts
      - name: Build the separate unmodified official baseline
        run: bash packages/agent-browser/scripts/build-upstream-agent-browser.sh
      - name: Stage verified compilation dependencies outside source checkouts
        run: |
          bash packages/agent-browser/scripts/cache-native-dependencies.sh save maintained
          bash packages/agent-browser/scripts/cache-native-dependencies.sh save upstream
      - name: Save compilation dependencies before browser verification
        if: ${{ steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            .validation-tools/native-dependency-cache
      - name: Download pinned Chromium for native macOS fixtures
        run: |
          # Playwright is only the pinned browser downloader, never the execution engine.
          pnpm --filter @e2e-dev/web exec playwright-core install --no-shell chromium
          CHROME=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -path '*/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing')
          test -x "$CHROME"
          "$CHROME" --version
          echo "E2E_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Exercise native exact refs and browser editing against real Chromium
        env:
          AGENT_BROWSER_EXECUTABLE_PATH: ${{ env.E2E_CHROMIUM_EXECUTABLE }}
        run: |
          cargo test --profile ci --locked --manifest-path "$PWD/.validation-tools/agent-browser-exact/cli/Cargo.toml" --bin agent-browser native::e2e_tests::e2e_shared_fill_preserves_browser_editing_and_clears_rich_content -- --ignored --exact --test-threads=1
          cargo test --profile ci --locked --manifest-path "$PWD/.validation-tools/agent-browser-exact/cli/Cargo.toml" --bin agent-browser native::e2e_tests::e2e_exact_snapshot_ref_never_rebinds_ordinary_ref_keeps_fallback -- --ignored --exact --test-threads=1
      - run: pnpm --filter e2e build
      - id: adapter-build
        run: pnpm --filter @e2e-dev/agent-browser build
      - run: pnpm --filter @e2e-dev/agent-browser typecheck
      - run: pnpm exec oxlint packages/agent-browser/src packages/agent-browser/tests
      - run: pnpm --filter @e2e-dev/agent-browser test
      - name: Compare ordinary behavior with the separate official build
        run: node --test packages/agent-browser/tests/upstream-baseline.integration.ts
      - name: Native browser-insertion and exact-action acceptance
        if: ${{ !cancelled() && steps.adapter-build.outcome == 'success' }}
        run: node --test packages/agent-browser/tests/actions.integration.ts
      - name: Real default unnamed-glyph snapshot and locator acceptance
        if: ${{ !cancelled() && steps.adapter-build.outcome == 'success' }}
        run: node --test packages/agent-browser/tests/locators.integration.ts
      - name: Real public runner action, report, trace and strict replay
        if: ${{ !cancelled() && steps.adapter-build.outcome == 'success' }}
        run: node --test packages/agent-browser/tests/runner.integration.ts
      - name: Fresh packaged consumer with real Chromium
        id: packaged-consumer
        if: ${{ !cancelled() && steps.adapter-build.outcome == 'success' }}
        run: node packages/agent-browser/scripts/consumer-smoke.ts --browser --artifacts "$RUNNER_TEMP/agent-browser-consumer-artifacts"
      - name: Preserve packaged consumer evidence
        if: ${{ always() && (steps.packaged-consumer.outcome == 'success' || steps.packaged-consumer.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-browser-packaged-consumer-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/agent-browser-consumer-artifacts
          if-no-files-found: error
          retention-days: 7
      - name: Package verified native binary and source metadata
        run: node packages/agent-browser/scripts/native-artifact.ts --output "$RUNNER_TEMP/agent-browser-native-artifact"
      - name: Preserve verified native binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-browser-native-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/agent-browser-native-artifact
          if-no-files-found: error
          retention-days: 7
