name: Retired context public-close measurement (native990317 reuse)
'on':
  push:
    branches:
    - implement/retired-context-measurement-ci
permissions:
  contents: read
concurrency:
  group: retired-context-measurement-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 9903179b3357f862ed703fc9d9e41fa975ccb0f6
  NATIVE_SOURCE_TREE: 3f5f6a8663d19990c523ee5a15383c9d54b379c2
jobs:
  retired-context-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Download exact explicit 404855 runtime
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/download-interrupt-runtime.py
    - name: Verify explicit native990317 and producer bytes
      timeout-minutes: 1
      run: node scripts/ci/verify-interrupt-runtime.ts "$RUNNER_TEMP/interrupt-native-runtime"
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
    - name: Measure retired exact context via public Playwright, not compatibility acceptance
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec tsc --noEmit

        pnpm --filter @e2e-dev/web exec node -e ''const assert=require("node:assert/strict");assert.equal(require("playwright-core/package.json").version,"1.64.1")''

        pnpm --filter @e2e-dev/web exec vitest list --config vitest.interop-retired-context.config.ts --no-staticParse
        --json="$GITHUB_WORKSPACE/evidence/collection.json"

        node --input-type=module - <<''JS''

        import fs from ''node:fs'';import assert from ''node:assert/strict'';const r=JSON.parse(fs.readFileSync(''evidence/collection.json''));assert.equal(r.length,1);assert.ok(r[0].file.endsWith(''/surface-of-native-retired-context.test.ts''));

        JS

        export E2E_INTEROP_EVIDENCE_DIR="$GITHUB_WORKSPACE/evidence/measurement"

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        set +e

        pnpm --filter @e2e-dev/web exec vitest run --config vitest.interop-retired-context.config.ts --reporter=verbose
        --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json" 2>&1 | tee evidence/measurement.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/exit

        node --input-type=module - <<''JS''

        import fs from ''node:fs'';import assert from ''node:assert/strict'';const r=JSON.parse(fs.readFileSync(''evidence/results.json''));assert.equal(r.numTotalTests,1);assert.equal(r.numPassedTests,1);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);const
        e=JSON.parse(fs.readFileSync(''evidence/measurement/retired-context-public-close.json''));assert.equal(e.runtime,''measured'');assert.equal(e.cleanup,''passed'');for(const
        k of [''firstClose'',''secondClose''])assert.ok([''resolved'',''rejected'',''timeout''].includes(e[k].result));assert.equal(e.nativeEnd.exactContextAbsent,true);assert.equal(e.nativeEnd.browserConnected,true);assert.equal(e.nativeEnd.oldPageClosed,true);assert.equal(e.contextCountAfterMeasurements,0);

        JS

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: retired-context-measurement-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
