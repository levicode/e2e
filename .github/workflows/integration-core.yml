name: Current source native setup and deterministic public core
'on':
  push:
    branches: [ci/s25-main-integration-20261101, main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: integration-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source_core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      E2E_TELEMETRY_DISABLED: '1'
      E2E_UPDATE_CHECK_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      - name: Canonical isolated home and actual source identity
        run: |
          set -euo pipefail
          node --input-type=module <<'ROOT'
          import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';
          const root=fs.mkdtempSync(path.join(fs.realpathSync('/tmp'),'ec.'));fs.chmodSync(root,0o700);
          const identity=p=>{const s=fs.lstatSync(p);assert.ok(s.isDirectory()&&!s.isSymbolicLink());assert.equal(fs.realpathSync(p),p);assert.equal(s.uid,process.getuid());assert.equal(s.mode&0o777,0o700);return {dev:s.dev,ino:s.ino,uid:s.uid};};
          const owner=identity(root);for(const name of ['home','tmp','evidence'])fs.mkdirSync(path.join(root,name),{mode:0o700});
          const coreHome=path.join(root,'core-project','home'),xdg=process.env.XDG_RUNTIME_DIR;
          const socketName='e2e-'+ '0'.repeat(36)+'.sock'; // process.ts randomUUID is always 36 ASCII bytes.
          const defaultSocketBytes=Buffer.byteLength(path.join(coreHome,'.agent-browser',socketName));
          const effectiveSocketBytes=Buffer.byteLength(path.join(xdg?path.join(xdg,'agent-browser'):path.join(coreHome,'.agent-browser'),socketName));
          fs.writeFileSync(path.join(root,'evidence','source-root-owner.json'),JSON.stringify(owner)+'\n',{flag:'wx',mode:0o600});
          fs.writeFileSync(path.join(root,'evidence','socket-path-budget.json'),JSON.stringify({defaultSocketBytes,effectiveSocketBytes,limit:103,xdgPresent:xdg!==undefined,xdgNonempty:!!xdg})+'\n',{flag:'wx',mode:0o600});
          const values={SOURCE_ROOT:root,HOME:path.join(root,'home'),TMPDIR:path.join(root,'tmp'),RUSTUP_HOME:process.env.RUSTUP_HOME||path.join(process.env.HOME,'.rustup'),CARGO_HOME:process.env.CARGO_HOME||path.join(process.env.HOME,'.cargo')};
          for(const value of Object.values(values))assert.ok(!/[\r\n]/.test(value));
          fs.appendFileSync(process.env.GITHUB_ENV,Object.entries(values).map(([k,v])=>k+'='+v+'\n').join(''));
          assert.ok(defaultSocketBytes<=103&&effectiveSocketBytes<=103,'Native Unix socket path exceeds its unchanged 103-byte limit');
          ROOT
          root="$(tail -n 5 "$GITHUB_ENV" | sed -n 's/^SOURCE_ROOT=//p')"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > "$root/evidence/source.txt"
          git ls-tree -r HEAD > "$root/evidence/source-tree.txt"
          node --version > "$root/evidence/node.txt"
          pnpm --version > "$root/evidence/pnpm.txt"
      - name: Pure setup safety and unchanged core verifier controls
        run: node --test scripts/setup-source-native.test.mjs scripts/acceptance/preview-core-proof.test.mjs
      - name: Same documented user entry fresh source build and public installation
        id: setup
        run: |
          set -uo pipefail
          s=0
          node scripts/setup-source-native.mjs "$SOURCE_ROOT/build" "$SOURCE_ROOT/user-project" > "$SOURCE_ROOT/evidence/setup.stdout.log" 2> "$SOURCE_ROOT/evidence/setup.stderr.log" || s=$?
          printf '%s\n' "$s" > "$SOURCE_ROOT/evidence/setup.exit"
          cat "$SOURCE_ROOT/evidence/setup.stderr.log" >&2
          exit "$s"
      - name: Original complete typechecks on actual locked compiler
        run: |
          set -euo pipefail
          pnpm exec tsc --version | tee "$SOURCE_ROOT/evidence/typescript.version"
          grep -Fx 'Version 7.0.2' "$SOURCE_ROOT/evidence/typescript.version"
          pnpm --filter e2e run typecheck > "$SOURCE_ROOT/evidence/core-types.log" 2>&1
          pnpm --filter @e2e-dev/web run typecheck > "$SOURCE_ROOT/evidence/web-types.log" 2>&1
          pnpm exec tsc --project scripts > "$SOURCE_ROOT/evidence/script-types.log" 2>&1
      - name: Public CLI core from this invocation fresh source bundle
        id: core
        env:
          E2E_CORE_NATIVE_DIAGNOSTICS: '1'
        run: |
          set -uo pipefail
          unset E2E_AGENT_BROWSER_EXECUTABLE E2E_CHROMIUM_EXECUTABLE NODE_PATH NODE_OPTIONS GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN
          sha="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.SOURCE_ROOT+"/build/trusted-manifest.json")).sha256)')"
          s=0
          node scripts/acceptance/preview-core.mjs "$SOURCE_ROOT/build/bundle" "$sha" "$SOURCE_ROOT/core-project" "$SOURCE_ROOT/core-evidence" > "$SOURCE_ROOT/evidence/core.stdout.log" 2> "$SOURCE_ROOT/evidence/core.stderr.log" || s=$?
          printf '%s\n' "$s" > "$SOURCE_ROOT/evidence/core.exit"
          cat "$SOURCE_ROOT/evidence/core.stderr.log" >&2
          exit "$s"
      - name: Independent PNG repeat refs secrets and actual source proof
        if: ${{ !cancelled() && steps.core.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          sha="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.SOURCE_ROOT+"/build/trusted-manifest.json")).sha256)')"
          node scripts/acceptance/preview-core-proof.mjs "$SOURCE_ROOT/core-evidence" "$sha" > "$SOURCE_ROOT/evidence/proof.stdout.log" 2> "$SOURCE_ROOT/evidence/proof.stderr.log"
          node --input-type=module <<'CHECK'
          import assert from 'node:assert/strict';import fs from 'node:fs';import{execFileSync}from'node:child_process';
          const root=process.env.SOURCE_ROOT,read=p=>JSON.parse(fs.readFileSync(root+'/'+p));const setup=read('build/setup-result.json'),core=read('core-evidence/preview-core-result.json');
          assert.equal(setup.status,'passed');assert.equal(core.status,'passed');assert.equal(core.previewCorePassed,true);assert.deepEqual(core.source,setup.source);assert.deepEqual(core.nativeSource,setup.native);assert.equal(setup.source.commit,process.env.GITHUB_SHA);assert.equal(setup.source.tree,execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim());assert.equal(core.nativeSha256,setup.binarySHA256);assert.equal(core.manifestSha256,setup.manifestSHA256);
          for(const k of ['acceptanceEvidence','fullCandidateAccepted','releaseEligible'])assert.equal(core[k],false);
          CHECK
      - name: Final exact HEAD and pristine checkout
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          node --input-type=module <<'OWNER'
          import assert from 'node:assert/strict';import fs from 'node:fs';import path from 'node:path';
          const root=process.env.SOURCE_ROOT,s=fs.lstatSync(root),owner=JSON.parse(fs.readFileSync(path.join(root,'evidence','source-root-owner.json')));
          assert.ok(s.isDirectory()&&!s.isSymbolicLink());assert.equal(fs.realpathSync(root),root);assert.equal(s.mode&0o777,0o700);assert.equal(s.uid,process.getuid());assert.deepEqual({dev:s.dev,ino:s.ino,uid:s.uid},owner);
          OWNER
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: integration-core-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ env.SOURCE_ROOT }}/evidence
            ${{ env.SOURCE_ROOT }}/build/*.json
            ${{ env.SOURCE_ROOT }}/build/*.log
            ${{ env.SOURCE_ROOT }}/core-evidence
