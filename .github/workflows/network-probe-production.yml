# LOCAL FROZEN PRODUCER ONLY: exact diagnostic source; runtime remains a separate later workflow.
name: 'Temporary HTTP500 network probe: strict and exact dev then ci image'
'on':
  push:
    branches:
    - diagnostic/http500-network-probe-producer-20261025
permissions:
  contents: read
concurrency:
  group: temporary-network-probe-producer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  production:
    name: temporary-network-probe-production
    if: ${{ github.ref == 'refs/heads/diagnostic/http500-network-probe-producer-20261025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      RUST_MIN_STACK: '16777216'
      RUST_BACKTRACE: '1'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
      PHASES: recipe-identity source-before source-patch toolchain format clippy acceptance-tests-check proxy-feature-check default-harness-compile default-harness-inventory
        source-after-pure pure-summary production-build production-capture source-after product-integrity
    outputs:
      validated: ${{ steps.gate.outputs.validated }}
      artifact_id: ${{ steps.binary.outputs.artifact-id }}
      artifact_digest: ${{ steps.binary.outputs.artifact-digest }}
    steps:
    - name: Initialize temporary diagnostic producer; no browser
      id: init
      timeout-minutes: 1
      run: 'set -euo pipefail

        umask 077

        export EVIDENCE_DIR="$RUNNER_TEMP/focused-production-evidence"

        export CARGO_HOME="$RUNNER_TEMP/focused-production-cargo"

        export CARGO_TARGET_DIR="$RUNNER_TEMP/focused-production-target"

        export VALIDATE="$GITHUB_WORKSPACE/recipe/scripts/network-probe/producer.py"

        export PRODUCT_DIR="$RUNNER_TEMP/focused-production-product"

        printf ''EVIDENCE_DIR=%s\nCARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nVALIDATE=%s\nPRODUCT_DIR=%s\n'' "$EVIDENCE_DIR" "$CARGO_HOME" "$CARGO_TARGET_DIR"
        "$VALIDATE" "$PRODUCT_DIR" >> "$GITHUB_ENV"

        test ! -e "$CARGO_TARGET_DIR"

        test ! -e "$PRODUCT_DIR"

        mkdir -m700 "$EVIDENCE_DIR"

        test "$GITHUB_RUN_ATTEMPT" = 1

        for phase in $PHASES; do printf ''not-run\n'' > "$EVIDENCE_DIR/$phase.exit"; done

        printf ''%s\n'' ''Temporary removable diagnostic source. Four strict gates + six exact dev tests, then fresh ci ELF. Not old native41/new fullnative
        acceptance. No browser; existing final acceptance goal unchanged.'' > "$EVIDENCE_DIR/SCOPE.txt"

        uname -a > "$EVIDENCE_DIR/host.txt"

        cat /etc/os-release >> "$EVIDENCE_DIR/host.txt"

        . /etc/os-release

        test "$RUNNER_OS" = Linux

        test "$(uname -m)" = x86_64

        test "$(id -u)" -ne 0

        test "$ID" = ubuntu

        test "$VERSION_ID" = 24.04'
    - name: Check out this immutable producer recipe
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - name: Refuse UNRESOLVED diagnostic source before installation
      id: binding
      timeout-minutes: 1
      run: 'set -euo pipefail

        python3 -B "$VALIDATE" guard

        python3 -B "$VALIDATE" run recipe-identity 30 python3 -B "$VALIDATE" recipe "$GITHUB_WORKSPACE/recipe" "$GITHUB_WORKFLOW_SHA"

        sha256sum recipe/.github/workflows/network-probe-production.yml recipe/scripts/network-probe/producer* recipe/scripts/network-probe/source-change.patch
        > "$EVIDENCE_DIR/recipe.sha256"'
    - name: Check out exact temporary eight-file native delta
      id: source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SHA }}
        path: source
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact parent tree eight-file delta and reversible patch
      id: before
      timeout-minutes: 1
      run: 'set -euo pipefail

        python3 -B "$VALIDATE" run source-before 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" pristine

        python3 -B "$VALIDATE" run source-patch 30 python3 -B "$VALIDATE" apply "$GITHUB_WORKSPACE/source"'
    - name: Cache registry bytes only, never target executables
      id: registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      timeout-minutes: 3
      with:
        path: '${{ env.CARGO_HOME }}/registry

          ${{ env.CARGO_HOME }}/git/db'
        key: focused-registry-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-${{ env.NATIVE_LOCK_SHA256 }}
    - name: Install and verify the existing pinned official Rust toolchain
      id: rust
      timeout-minutes: 11
      run: 'python3 -B "$VALIDATE" run toolchain 600 bash -euc ''

        rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

        rustc -Vv

        cargo -Vv

        test "$(rustc -Vv | sed -n "s/^release: //p")" = "$RUSTUP_TOOLCHAIN"

        test "$(rustc -Vv | sed -n "s/^host: //p")" = x86_64-unknown-linux-gnu

        '' '
    - name: Run all four unchanged strict compile gates
      id: strict
      timeout-minutes: 43
      working-directory: source/cli
      run: 'set -uo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET

        failed=0

        python3 -B "$VALIDATE" run format 120 cargo fmt --all -- --check || failed=1

        python3 -B "$VALIDATE" run clippy 900 cargo clippy --locked --profile dev --no-default-features --all-targets -- -D warnings || failed=1

        python3 -B "$VALIDATE" run acceptance-tests-check 900 cargo check --locked --profile dev --no-default-features --features acceptance-faults --tests
        || failed=1

        python3 -B "$VALIDATE" run proxy-feature-check 600 cargo check --locked --profile dev --no-default-features --features acceptance-faults --test
        client-proxy-fixture || failed=1

        exit "$failed"'
    - name: Compile and bind only default exact dev harness
      id: harness
      timeout-minutes: 28
      working-directory: source/cli
      run: 'set -euo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET

        python3 -B "$VALIDATE" run default-harness-compile 1500 cargo test --locked --profile dev --no-default-features --bin agent-browser --no-run --message-format=json

        python3 -B "$VALIDATE" run default-harness-inventory 90 python3 -B "$VALIDATE" harness "$GITHUB_WORKSPACE/source"'
    - name: Run all six exact dev positive and negative controls
      id: cases
      timeout-minutes: 13
      run: 'set -uo pipefail

        unset AGENT_BROWSER_NETWORK_PROBE_SHA256 AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        failed=0

        for id in probe-1 probe-2 probe-3 probe-4 probe-5 probe-6; do python3 -B "$VALIDATE" case "$id" || failed=1; done

        exit "$failed"'
    - name: Verify unchanged source after pure cases
      id: after_pure
      timeout-minutes: 1
      if: ${{ always() && steps.before.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run source-after-pure 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source"
    - name: Reconcile exact raw six-test ledger before any ci production compile
      id: pure
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run pure-summary 30 python3 -B "$VALIDATE" summary
    - name: Build new temporary feature-free ci ELF only after actual pure success
      id: build
      timeout-minutes: 37
      working-directory: source/cli
      run: 'set -euo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET

        python3 -B "$VALIDATE" run production-build 2100 cargo build --locked --profile ci --no-default-features --message-format=json

        python3 -B "$VALIDATE" run production-capture 60 python3 -B "$VALIDATE" production "$PRODUCT_DIR" production'
      if: ${{ !cancelled() && steps.pure.outcome == 'success' }}
    - name: Verify source remains unchanged even after a build failure
      id: after
      timeout-minutes: 1
      if: ${{ always() && steps.before.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run source-after 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source"
    - name: Verify final temporary image and diagnostic provenance
      id: integrity
      timeout-minutes: 2
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.after.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run product-integrity 60 python3 -B "$VALIDATE" integrity "$PRODUCT_DIR"
    - name: Require every actual diagnostic producer phase
      id: gate
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: 'set -euo pipefail

        python3 -B "$VALIDATE" aggregate $PHASES

        echo ''validated=true'' >> "$GITHUB_OUTPUT"'
    - name: Retain exact producer step outcomes
      id: outcomes
      timeout-minutes: 1
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: printf '%s\n' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"
    - name: Always retain producer diagnostics without signed download headers
      id: diagnostics
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      if: ${{ always() }}
      with:
        name: temporary-network-probe-producer-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ env.EVIDENCE_DIR }}/*.json

          ${{ env.EVIDENCE_DIR }}/*.log

          ${{ env.EVIDENCE_DIR }}/*.exit

          ${{ env.EVIDENCE_DIR }}/*.txt

          ${{ env.EVIDENCE_DIR }}/*.sha256'
        if-no-files-found: error
        retention-days: 7
    - name: Retain removable diagnostic ELF only after producer success
      id: binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
      with:
        name: temporary-network-probe-native-linux-x64-${{ env.NATIVE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.PRODUCT_DIR }}/
        if-no-files-found: error
        retention-days: 7
