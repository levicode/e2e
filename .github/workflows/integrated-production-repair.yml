        export CARGO_TARGET_DIR=\"$RUNNER_TEMP/native-regressions-target\"\ncargo test --locked --profile ci --timings --no-default-features\
        \ --features acceptance-faults --bin agent-browser -j1 --no-run --message-format=json > \"$GITHUB_WORKSPACE/evidence/harness.jsonl\"\
        \ 2> \"$GITHUB_WORKSPACE/evidence/harness-build.log\"\npython3 - <<'PY_HARNESS'\nimport json, os\nfrom pathlib import\
        \ Path\nout = Path(os.environ['GITHUB_WORKSPACE']) / 'evidence'\npaths = set()\nbuild_finished = []\nfor line in (out\
        \ / 'harness.jsonl').read_text().splitlines():\n    record = json.loads(line)\n    if record.get('reason') == 'build-finished':\n\
        \        build_finished.append(record.get('success') is True)\n    if (record.get('reason') == 'compiler-artifact'\n\
        \        and record.get('target', {}).get('name') == 'agent-browser'\n        and 'bin' in record.get('target', {}).get('kind',\
        \ [])\n        and record.get('profile', {}).get('test') is True\n        and record.get('features') == ['acceptance-faults']\n\
        \        and record.get('executable')):\n        paths.add(record['executable'])\nif build_finished != [True]:\n \
        \   raise SystemExit('Missing or unsuccessful final compiler build receipt')\nif len(paths) != 1:\n    raise SystemExit(f'Expected\
        \ exactly one test executable, got {len(paths)}')\nharness = paths.pop()\nif not Path(harness).is_file():\n    raise\
        \ SystemExit('Compiler-selected harness is missing')\n(out / 'harness.path').write_text(harness + '\\n')\nPY_HARNESS\n\
        mkdir -p \"$GITHUB_WORKSPACE/native-harness\"\nharness=\"$(cat \"$GITHUB_WORKSPACE/evidence/harness.path\")\"\ncp\
        \ \"$harness\" \"$GITHUB_WORKSPACE/native-harness/agent-browser-tests\"\ngit rev-parse HEAD > \"$GITHUB_WORKSPACE/native-harness/native-source.sha\"\
        \ngit rev-parse HEAD^{tree} > \"$GITHUB_WORKSPACE/native-harness/native-source.tree\"\n(cd \"$GITHUB_WORKSPACE/native-harness\"\
        ; sha256sum agent-browser-tests > SHA256SUMS)\n\nprintf '%s\\n' acceptance-faults > \"$GITHUB_WORKSPACE/native-harness/features.txt\"\
        \nprintf '%s\\n' \"$GITHUB_RUN_ID\" > \"$GITHUB_WORKSPACE/native-harness/producer-run.id\"\n\nmkdir -p \"$GITHUB_WORKSPACE/evidence/cargo-timings\"\
        \ncp -a \"$RUNNER_TEMP/native-regressions-target/cargo-timings/.\" \"$GITHUB_WORKSPACE/evidence/cargo-timings/\"\n"
