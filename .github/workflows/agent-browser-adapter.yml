name: agent-browser adapter
on:
  push:
    branches: [feat/agent-browser-engine]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-browser-adapter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Fork-portable: no paid runner, credentials, LLM, publish, or deploy access.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      E2E_TELEMETRY_DISABLED: '1'
      E2E_CHROMIUM_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build pinned exact-ref public CLI extension
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          bash packages/agent-browser/scripts/build-exact-agent-browser.sh
          echo "E2E_AGENT_BROWSER_EXECUTABLE=$PWD/.validation-tools/agent-browser-exact/cli/target/ci/agent-browser" >> "$GITHUB_ENV"
      - name: Install pinned browser for fixtures
        run: |
          pnpm --filter @e2e-dev/web exec playwright-core install --with-deps chromium
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -1)
          test -x "$CHROME"
          echo "E2E_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Install artifact video encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - run: pnpm --filter e2e build
      - run: pnpm --filter @e2e-dev/agent-browser build
      - run: pnpm --filter @e2e-dev/agent-browser typecheck
      - run: pnpm exec oxlint packages/agent-browser/src packages/agent-browser/tests
      - run: pnpm --filter @e2e-dev/agent-browser test
      - name: Real Chromium contract and independent acceptance tests
        run: node --test packages/agent-browser/tests/*.integration.ts
