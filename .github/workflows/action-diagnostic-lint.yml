name: Action diagnostic helper lint and complete Web units
'on':
  push:
    branches:
    - implement/action-diagnostic-lint-ci
permissions:
  contents: read
concurrency:
  group: action-diagnostic-lint-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 1176ce1545c49b67979ec5cf4240c7ead28b8f24
  NATIVE_SOURCE_TREE: 6670b61c857f7daf11056e849d56850706f8a09b
jobs:
  adapter-units:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
    - name: Full Web unit and source type checks
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec tsc --noEmit

        pnpm exec oxlint packages/e2e/src/expect/async.ts packages/e2e/src/locator/engine.ts packages/e2e/tests/helpers/action-outcome-diagnostics.ts
        packages/e2e/tests/integration/web-selector-chains.test.ts packages/e2e/tests/unit/action-outcome-diagnostics.test.ts
        packages/e2e/tests/unit/locator-field-assertions.test.ts packages/web/src/native-surface.ts packages/web/src/native/browser-channel.ts
        packages/web/src/native/protocol.ts packages/web/tests/unit/native-finalized-recording-surface.test.ts packages/web/tests/unit/native-selector-errors.test.ts
        packages/web/tests/unit/native-worker-reinit.test.ts

        pnpm --filter @e2e-dev/web exec vitest run tests/unit --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/web-units.json"
        2>&1 | tee evidence/web-units.log

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: diagnostic-lint-adapter-units
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  core-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
    - name: Core complete types and exact diagnostic units
      run: 'set -euo pipefail

        pnpm --filter e2e exec tsc --noEmit 2>&1 | tee evidence/core-typecheck.log

        pnpm --filter e2e exec vitest run tests/unit/action-outcome-diagnostics.test.ts --reporter=verbose --reporter=json
        --outputFile.json="$GITHUB_WORKSPACE/evidence/core-units.json" 2>&1 | tee evidence/core-units.log'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: diagnostic-lint-core-checks
        path: evidence/
        if-no-files-found: error
        retention-days: 7
