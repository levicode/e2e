name: targeted fixed artifact Web and Intel diagnostic (not acceptance)
'on':
  push:
    branches:
    - implement/terminal-receipt-targeted-ci
permissions:
  contents: read
concurrency:
  group: targeted-terminal-${{ github.sha }}
  cancel-in-progress: false
env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_BUILD_JOBS: '2'
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  web-semantic:
    permissions:
      contents: read
      actions: read
    env:
      E2E_APT_CACHE_ROLE: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/e2e
        ref: 26dd30fd149f0b055bdfdbd789cd1c7490591e0b
        path: source
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        package_json_file: source/package.json
    - name: Restore pinned prior native ELF bytes (not a new native test pass)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p evidence
        curl --fail --silent --show-error --location --retry 2 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/levicode/e2e/actions/artifacts/12642743713/zip -o "$RUNNER_TEMP/native-images.zip"
        python3 recipe/scripts/web-functional/restore-pinned-native.py linux "$RUNNER_TEMP/native-images.zip" "$GITHUB_WORKSPACE/images" "$GITHUB_WORKSPACE/evidence"
        rm -- "$RUNNER_TEMP/native-images.zip"
    - name: Seed public apt archives from verified prior run (not test evidence)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        zip="$RUNNER_TEMP/prior-apt-cache.zip"
        curl --fail --silent --show-error --location --retry 2 --max-time 180 \
          -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
          https://api.github.com/repos/levicode/e2e/actions/artifacts/12642071476/zip -o "$zip"
        printf '%s  %s\n' 5fb71d9a4daec5e01eda74a473c7024b0be529b823e42a0c2192174af66579d4 "$zip" | sha256sum -c -
        python3 recipe/scripts/web-functional/seed-apt-cache.py "$zip" "$GITHUB_WORKSPACE/apt-cache" "$GITHUB_WORKSPACE/evidence"
        rm -- "$zip"
    - name: Probe orchestration regressions (not native runtime proof)
      working-directory: source
      run: node --test scripts/acceptance/probe-native.test.ts
    - name: Install existing browser/codec prerequisites and probe exact binaries
      run: bash recipe/scripts/web-functional/run.sh setup
      id: setup
    - name: Full Web original assertions, budget and frozen exclusions
      if: ${{ success() && steps.setup.outcome == 'success' }}
      run: bash recipe/scripts/web-functional/run.sh web
    - name: Independent semantic group (not skipped by Web failure)
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: bash recipe/scripts/web-functional/run.sh semantic
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: targeted-web-semantic-evidence
        path: evidence/
        retention-days: 7
        if-no-files-found: warn
  intel-probe:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      E2E_SOURCE_SHA: 26dd30fd149f0b055bdfdbd789cd1c7490591e0b
      NATIVE_SOURCE_SHA: 70ac7f3fb2a53de79c5fabf43b5009b7e5fefebb
      CARGO_BUILD_JOBS: '1'
      RUSTUP_TOOLCHAIN: 1.99.1
      E2E_TELEMETRY_DISABLED: '1'
      E2E_UPDATE_CHECK_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Reject placeholder pins
      shell: bash
      run: |
        set -euo pipefail
        for sha in "$E2E_SOURCE_SHA" "$NATIVE_SOURCE_SHA"; do
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test "$sha" != 0000000000000000000000000000000000000000
        done
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/e2e
        ref: ${{ env.E2E_SOURCE_SHA }}
        path: source
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native-source
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        architecture: x64
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        package_json_file: source/package.json
    - name: Freeze platform and isolated tool paths
      env:
        EXPECTED_ARCH: x64
      run: |
        set -euo pipefail
        mkdir -p .artifacts/macos-diagnostic "$RUNNER_TEMP/diagnostic-home"
        test "$(node -p 'process.platform')" = darwin
        test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
        test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
        test "$(git -C source rev-parse HEAD)" = "$E2E_SOURCE_SHA"
        test "$(git -C native-source rev-parse HEAD)" = "$NATIVE_SOURCE_SHA"
        test "$(git -C source rev-parse HEAD^{tree})" = a9e6b13236b45daebc19399a417bb72104d555b0
        test "$(git -C native-source rev-parse HEAD^{tree})" = cfee75313ae66059894d86afd66eb275fef30a9c
        test -z "$(git -C source status --porcelain)"
        test -z "$(git -C native-source status --porcelain)"
        sw_vers > .artifacts/macos-diagnostic/macos-version.txt
        uname -a > .artifacts/macos-diagnostic/host.txt
        git rev-parse HEAD HEAD^{tree} > .artifacts/macos-diagnostic/recipe-source.txt
        git -C source rev-parse HEAD HEAD^{tree} > .artifacts/macos-diagnostic/e2e-source.txt
        git -C native-source rev-parse HEAD HEAD^{tree} > .artifacts/macos-diagnostic/native-source.txt
        rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
        test -d "$rustup_home"
        case "$rustup_home" in /*) ;; *) exit 1 ;; esac
        setup_node_bin="$(dirname "$(command -v node)")"
        test "$(node -p 'process.versions.node.split(".")[0]')" = 24
        for tool in rustup cargo rustc pnpm; do dirname "$(command -v "$tool")" >> "$GITHUB_PATH"; done
        echo "$setup_node_bin" >> "$GITHUB_PATH"
        echo "RUSTUP_HOME=$rustup_home" >> "$GITHUB_ENV"
        echo "CARGO_HOME=$RUNNER_TEMP/diagnostic-cargo" >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/diagnostic-target" >> "$GITHUB_ENV"
        echo "HOME=$RUNNER_TEMP/diagnostic-home" >> "$GITHUB_ENV"
    - name: Verify pinned Node after tool path isolation
      run: |
        set -euo pipefail
        command -v node
        node -v
        test "$(node -p 'process.versions.node.split(".")[0]')" = 24
    - name: Build exact public packages
      working-directory: source
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile
        pnpm --filter e2e run build
        pnpm --filter @e2e-dev/web run build
        pnpm --filter e2e run typecheck
        pnpm --filter @e2e-dev/web run typecheck
    - name: Probe orchestration regressions (not native runtime proof)
      working-directory: source
      run: node --test scripts/acceptance/probe-native.test.ts
    - name: Restore exact prior Intel Mach-O for diagnostic probe only
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --retry 2 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/levicode/e2e/actions/artifacts/12642538790/zip -o "$RUNNER_TEMP/intel.zip"
        python3 scripts/web-functional/restore-pinned-native.py intel "$RUNNER_TEMP/intel.zip" "$RUNNER_TEMP/diagnostic-bin" .artifacts/macos-diagnostic
        rm -- "$RUNNER_TEMP/intel.zip"
        test "$(lipo -archs "$RUNNER_TEMP/diagnostic-bin/production")" = x86_64
    - name: Install official Chromium and negotiate production
      env:
        EXPECTED_MACHO_ARCH: x86_64
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/.artifacts/macos-diagnostic"
        # This targeted scope probe does not request video or run the six-check consumer.
        # Video/codec behavior is not covered by this diagnostic archive.
        if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
          ffmpeg -version > "$out/ffmpeg.txt"
        else
          printf '%s\n' 'ffmpeg/ffprobe unavailable; video recording NOT TESTED by this targeted scope probe.' > "$out/ffmpeg.txt"
        fi
        "$RUNNER_TEMP/diagnostic-bin/production" install
        chrome="$(node source/scripts/acceptance/installed-chromium.ts "$HOME/.agent-browser/browsers" "$out/chromium.json")"
        test "$(lipo -archs "$chrome")" = "$EXPECTED_MACHO_ARCH"
        "$chrome" --version > "$out/chromium-version.txt"
        shasum -a 256 "$chrome" > "$out/chromium.sha256"
        echo "E2E_CHROMIUM_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
        node --input-type=module -e "import { REQUIRED_CAPABILITIES } from './source/packages/web/dist/native/capabilities.js'; process.stdout.write(JSON.stringify(REQUIRED_CAPABILITIES))" > "$out/capabilities.json"
        E2E_CHROMIUM_EXECUTABLE="$chrome" node source/scripts/acceptance/probe-native.ts "$RUNNER_TEMP/diagnostic-bin/production" "$out/capabilities.json" "$out/negotiation.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: macos-diagnostic-evidence-x64-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .artifacts/macos-diagnostic/*.txt
          .artifacts/macos-diagnostic/*.json
          .artifacts/macos-diagnostic/*.jsonl
          .artifacts/macos-diagnostic/*.log
          .artifacts/macos-diagnostic/*.sha256
        if-no-files-found: warn
    permissions:
      contents: read
      actions: read
