name: targeted fixed artifact Web trace diagnostic (not acceptance)
'on':
  push:
    branches:
    - implement/terminal-receipt-targeted-ci
permissions:
  contents: read
concurrency:
  group: targeted-terminal-${{ github.sha }}
  cancel-in-progress: false
env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_BUILD_JOBS: '2'
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  web-semantic:
    permissions:
      contents: read
      actions: read
    env:
      E2E_APT_CACHE_ROLE: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/e2e
        ref: 63869dea6f1e05e6e0bc9b28cd8eb6cf7f24f430
        path: source
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        package_json_file: source/package.json
    - name: Restore pinned prior native ELF bytes (not a new native test pass)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p evidence
        curl --fail --silent --show-error --location --retry 2 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/levicode/e2e/actions/artifacts/12642743713/zip -o "$RUNNER_TEMP/native-images.zip"
        python3 recipe/scripts/web-functional/restore-pinned-native.py linux "$RUNNER_TEMP/native-images.zip" "$GITHUB_WORKSPACE/images" "$GITHUB_WORKSPACE/evidence"
        rm -- "$RUNNER_TEMP/native-images.zip"
    - name: Seed public apt archives from verified prior run (not test evidence)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        zip="$RUNNER_TEMP/prior-apt-cache.zip"
        curl --fail --silent --show-error --location --retry 2 --max-time 180 \
          -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
          https://api.github.com/repos/levicode/e2e/actions/artifacts/12642071476/zip -o "$zip"
        printf '%s  %s\n' 5fb71d9a4daec5e01eda74a473c7024b0be529b823e42a0c2192174af66579d4 "$zip" | sha256sum -c -
        python3 recipe/scripts/web-functional/seed-apt-cache.py "$zip" "$GITHUB_WORKSPACE/apt-cache" "$GITHUB_WORKSPACE/evidence"
        rm -- "$zip"
    - name: Probe orchestration regressions (not native runtime proof)
      working-directory: source
      run: node --test scripts/acceptance/probe-native.test.ts
    - name: Install existing browser/codec prerequisites and probe exact binaries
      run: bash recipe/scripts/web-functional/run.sh setup
      id: setup
    - name: Full Web original assertions, budget and frozen exclusions
      if: ${{ success() && steps.setup.outcome == 'success' }}
      run: bash recipe/scripts/web-functional/run.sh web
    - name: Independent semantic group (not skipped by Web failure)
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      run: bash recipe/scripts/web-functional/run.sh semantic
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: targeted-web-semantic-evidence
        path: evidence/
        retention-days: 7
        if-no-files-found: warn
