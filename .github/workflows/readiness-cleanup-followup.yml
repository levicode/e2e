name: Download readiness and cleanup provenance follow-up
'on':
  push:
    branches:
    - implement/readiness-cleanup-followup-ci
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: readiness-cleanup-followup-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: dc85674a636875c5b4c53fb381903fdd8ae2cf3b
  NATIVE_SOURCE_TREE: c3e81deb2c4646ae75625e906cbda398bb0a3bb5
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  adapter-units:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from
        "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
    - name: Full Web unit and source type checks
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec tsc --noEmit

        pnpm --filter e2e exec tsc --noEmit

        pnpm --filter e2e exec vitest run tests/unit/action-outcome-diagnostics.test.ts
        --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/closed-helper.json"

        pnpm exec oxlint packages/e2e/src/expect/async.ts packages/e2e/src/locator/engine.ts
        packages/e2e/tests/helpers/action-outcome-diagnostics.ts packages/e2e/tests/integration/web-selector-chains.test.ts
        packages/e2e/tests/unit/action-outcome-diagnostics.test.ts packages/e2e/tests/unit/locator-field-assertions.test.ts
        packages/web/src/native-surface.ts packages/web/src/native/browser-channel.ts
        packages/web/src/native/protocol.ts packages/web/tests/unit/native-finalized-recording-surface.test.ts
        packages/web/tests/unit/native-selector-errors.test.ts packages/web/tests/unit/native-worker-reinit.test.ts

        pnpm --filter @e2e-dev/web exec vitest list tests/unit --no-staticParse --json="$GITHUB_WORKSPACE/evidence/web-collection.json"

        pnpm --filter @e2e-dev/web exec vitest run tests/unit --reporter=verbose --reporter=json
        --outputFile.json="$GITHUB_WORKSPACE/evidence/web-units.json" 2>&1 | tee evidence/web-units.log

        '
    - name: Record complete unit execution counts
      if: always()
      run: 'python3 - <<''PY_COUNTS''

        import json

        w=json.load(open(''evidence/web-units.json''));h=json.load(open(''evidence/closed-helper.json''))

        c=json.load(open(''evidence/web-collection.json''));assert len(c)==w[''numTotalTests'']
        and len(c)>1535 and w[''numPendingTests'']==0

        assert h[''numTotalTests'']==5 and h[''numPendingTests'']==0

        json.dump({''web'':{k:w[k] for k in [''numTotalTests'',''numPassedTests'',''numFailedTests'',''numPendingTests'']},''helper'':{k:h[k]
        for k in [''numTotalTests'',''numPassedTests'',''numFailedTests'',''numPendingTests'']}},open(''evidence/unit-counts.json'',''w''),indent=2)

        PY_COUNTS

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: readiness-followup-optional-observe-adapter-unit-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  download-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from
        "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Restore reviewed exact producer runtime
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/download-readiness-runtime.py
    - name: Verify exact source, compiler, host and binary
      timeout-minutes: 1
      run: node scripts/ci/verify-readiness-runtime.ts "$RUNNER_TEMP/ci-native-runtime"
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
    - name: Build actual public core and web adapter
      run: pnpm run build
    - name: Install original core fixture Playwright Chromium
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium
      timeout-minutes: 8
    - name: Execute unchanged full original test file
      run: 'set -euo pipefail

        export E2E_DOWNLOAD_RELEASE_DIAGNOSTIC=1

        cp "$RUNNER_TEMP/ci-native-runtime/manifest.json" evidence/native-runtime.manifest.json

        sha256sum "$E2E_AGENT_BROWSER_EXECUTABLE" > evidence/native-executable.sha256

        unset GH_TOKEN GITHUB_TOKEN

        pnpm --filter e2e exec vitest list tests/integration/web-download-lifecycle.test.ts
        --no-staticParse --json="$GITHUB_WORKSPACE/evidence/collection.json"

        python3 - <<''PY_COLLECT''

        import json

        from pathlib import Path

        r=json.loads(Path(''evidence/collection.json'').read_text())

        assert isinstance(r,list) and len(r)==14

        assert all(x[''file''].endswith(''/tests/integration/web-download-lifecycle.test.ts'')
        for x in r)


        PY_COLLECT

        set +e

        pnpm --filter e2e exec vitest run tests/integration/web-download-lifecycle.test.ts
        --bail=0 --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json"
        2>&1 | tee evidence/test.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/test.exit

        python3 - <<''PY_COUNT''

        import json

        from pathlib import Path

        expected=len(json.loads(Path(''evidence/collection.json'').read_text()))

        r=json.loads(Path(''evidence/results.json'').read_text())

        a=[a for t in r[''testResults''] for a in t[''assertionResults'']]

        counts={''expected'':expected,''executed'':sum(x[''status''] in (''passed'',''failed'')
        for x in a),''passed'':sum(x[''status'']==''passed'' for x in a),''failed'':sum(x[''status'']==''failed''
        for x in a),''pending'':sum(x[''status''] not in (''passed'',''failed'') for
        x in a)}

        Path(''evidence/execution-counts.json'').write_text(json.dumps(counts,indent=2)+''\n'')

        assert len(a)==expected and counts[''executed'']==expected and counts[''pending'']==0,counts

        PY_COUNT

        exit "$status"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: readiness-followup-download-lifecycle-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  provider-downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from
        "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Restore reviewed exact producer runtime
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/download-readiness-runtime.py
    - name: Verify exact source, compiler, host and binary
      timeout-minutes: 1
      run: node scripts/ci/verify-readiness-runtime.ts "$RUNNER_TEMP/ci-native-runtime"
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
    - name: Build actual public core and web adapter
      run: pnpm run build
    - name: Install original core fixture Playwright Chromium
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium
      timeout-minutes: 8
    - name: Execute unchanged full original test file
      run: 'set -euo pipefail

        cp "$RUNNER_TEMP/ci-native-runtime/manifest.json" evidence/native-runtime.manifest.json

        sha256sum "$E2E_AGENT_BROWSER_EXECUTABLE" > evidence/native-executable.sha256

        unset GH_TOKEN GITHUB_TOKEN

        pnpm --filter @e2e-dev/web exec vitest list tests/integration/provider-downloads.test.ts
        --no-staticParse --json="$GITHUB_WORKSPACE/evidence/collection.json"

        python3 - <<''PY_COLLECT''

        import json

        from pathlib import Path

        r=json.loads(Path(''evidence/collection.json'').read_text())

        assert isinstance(r,list) and len(r)>0

        assert all(x[''file''].endswith(''/tests/integration/provider-downloads.test.ts'')
        for x in r)

        assert len(r)==2

        PY_COLLECT

        set +e

        pnpm --filter @e2e-dev/web exec vitest run tests/integration/provider-downloads.test.ts
        --bail=0 --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json"
        2>&1 | tee evidence/test.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/test.exit

        python3 - <<''PY_COUNT''

        import json

        from pathlib import Path

        expected=len(json.loads(Path(''evidence/collection.json'').read_text()))

        r=json.loads(Path(''evidence/results.json'').read_text())

        a=[a for t in r[''testResults''] for a in t[''assertionResults'']]

        counts={''expected'':expected,''executed'':sum(x[''status''] in (''passed'',''failed'')
        for x in a),''passed'':sum(x[''status'']==''passed'' for x in a),''failed'':sum(x[''status'']==''failed''
        for x in a),''pending'':sum(x[''status''] not in (''passed'',''failed'') for
        x in a)}

        Path(''evidence/execution-counts.json'').write_text(json.dumps(counts,indent=2)+''\n'')

        assert len(a)==expected and counts[''executed'']==expected and counts[''pending'']==0,counts

        PY_COUNT

        exit "$status"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: readiness-followup-provider-downloads-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
