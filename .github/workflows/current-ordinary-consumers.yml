        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
    - name: Build actual public core and web adapter
      run: pnpm run build
    - name: Install original core fixture Playwright Chromium
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium
      timeout-minutes: 8
    - name: Unchanged public reference consumers on the same native runtime
      run: 'set -euo pipefail

        python3 - <<''PY_PRIVATE''

        import os

        from pathlib import Path

        p=Path(''evidence/native-cleanup.jsonl'').resolve()

        fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600);os.close(fd)

