name: Current ordinary remaining consumer acceptance
'on':
  push:
    branches:
    - ci/current-ordinary-consumers
permissions:
  contents: read
  actions: read
concurrency:
  group: current-ordinary-consumers-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: ef81a637abb7bd63aa877f1790949d0a2a5d9e71
  NATIVE_SOURCE_TREE: 3822bc7dcc16bcfdfc6c6d3f81296edc832b1ea4
  NEXT_TELEMETRY_DISABLED: '1'
  ORDINARY_ARTIFACT_ID: '12829745464'
jobs:
  original-core-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain)"

        mkdir -p evidence

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from
        "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - name: Reject held upper-layer fixture migration
      run: 'set -euo pipefail

        printf ''%s  %s\n'' ''d085ea56f7bcc05c52b11766ace80e3c8c5c9fa468a33950a763fd617fc79eb4''
        ''packages/e2e/tests/helpers/fake-loop-model.ts'' | sha256sum --check

        printf ''%s  %s\n'' ''62050ddd13c46035c4414e5fa51e3ffe18171b2ceaf4db244413d8a819cbfbb0''
        ''packages/e2e/tests/helpers/trace-cache.ts'' | sha256sum --check

        printf ''%s  %s\n'' ''c2f5d7b461254fb7fd0d2e3fb2007fcd658d511f472773af66eeba51c85716bb''
        ''packages/e2e/tests/integration/agent-act-pixel-tools.test.ts'' | sha256sum
        --check

        printf ''%s  %s\n'' ''270c94821fb3977503f41a261ba7ac429b5fa6231e2dd1f7a1fd2f41a5b65b13''
        ''packages/e2e/tests/integration/agent-act-verbs.test.ts'' | sha256sum --check

        printf ''%s  %s\n'' ''717b663c338ddffb1419f38fc921d295aea379469a47ca7c4e2ae9e0cda31f8b''
        ''packages/e2e/tests/integration/agent-act.test.ts'' | sha256sum --check

        printf ''%s  %s\n'' ''da327cb285108b2f9207db4a8310a463be59ffe391f5271d2d971cc5465dca3a''
        ''packages/e2e/tests/integration/agent-ai-trace.test.ts'' | sha256sum --check

        printf ''%s  %s\n'' ''a410f60a6cba9325280f4e6eedd9b85b3ce65e2378778fb4dcc5fa45206168fe''
        ''packages/e2e/tests/integration/agent-policy.test.ts'' | sha256sum --check

        printf ''%s  %s\n'' ''433230f1d60c0f51c764ab4a52c1203cf0bdc5f534e437c9044680ac50641c48''
        ''packages/e2e/tests/integration/agent-trace-cache.test.ts'' | sha256sum --check

        printf ''%s  %s\n'' ''40d8f9f8ec197119f56d8bf548e692dd7fa575afeee2f336e5234cf60558b51e''
        ''packages/e2e/tests/integration/agent.test.ts'' | sha256sum --check

        printf ''%s  %s\n'' ''bc8d4b38f6aa9e7e5f9c28be37610558c2015abee1a39aa6771b00a1aa09e3df''
        ''packages/e2e/tests/integration/mcp-server.test.ts'' | sha256sum --check

