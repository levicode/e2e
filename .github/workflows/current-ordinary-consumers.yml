    - run: pnpm install --frozen-lockfile
    - name: Restore immutable ordinary artifact 12829745464 with metadata and ZIP
        verification
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        python3 scripts/ci/download-browser-recovery-runtime.py

        '
      timeout-minutes: 4
    - name: Verify actual producer source compiler host and immutable binary
      timeout-minutes: 1
      run: 'set -euo pipefail

        node scripts/ci/verify-browser-recovery-runtime.ts "$RUNNER_TEMP/ci-native-runtime"

        '
