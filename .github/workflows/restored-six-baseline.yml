name: restored six exact disposable-browser baseline (not full acceptance)
'on':
  push:
    branches:
    - implement/restored-six-baseline-ci
permissions:
  contents: read
concurrency:
  group: restored-six-${{ github.sha }}
  cancel-in-progress: false
env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_BUILD_JOBS: '2'
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  restored-case:
    permissions:
      contents: read
      actions: read
    env:
      E2E_APT_CACHE_ROLE: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/e2e
        ref: e75e4f347c286ce3764dc70cfb8c2059a32b2490
        path: source
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        package_json_file: source/package.json
    - name: Restore pinned prior native ELF bytes (not a new native test pass)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p evidence
        curl --fail --silent --show-error --location --retry 2 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/levicode/e2e/actions/artifacts/12648838514/zip -o "$RUNNER_TEMP/native-images.zip"
        python3 recipe/scripts/web-functional/restore-pinned-native.py linux "$RUNNER_TEMP/native-images.zip" "$GITHUB_WORKSPACE/images" "$GITHUB_WORKSPACE/evidence"
        rm -- "$RUNNER_TEMP/native-images.zip"
    - name: Seed public apt archives from verified prior run (not test evidence)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        zip="$RUNNER_TEMP/prior-apt-cache.zip"
        curl --fail --silent --show-error --location --retry 2 --max-time 180 \
          -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
          https://api.github.com/repos/levicode/e2e/actions/artifacts/12642071476/zip -o "$zip"
        printf '%s  %s\n' 5fb71d9a4daec5e01eda74a473c7024b0be529b823e42a0c2192174af66579d4 "$zip" | sha256sum -c -
        python3 recipe/scripts/web-functional/seed-apt-cache.py "$zip" "$GITHUB_WORKSPACE/apt-cache" "$GITHUB_WORKSPACE/evidence"
        rm -- "$zip"
    - name: Probe orchestration regressions (not native runtime proof)
      working-directory: source
      run: node --test scripts/acceptance/probe-native.test.ts
    - name: Install existing browser/codec prerequisites and probe exact binaries
      run: bash recipe/scripts/web-functional/run.sh setup
      id: setup
    - name: One exact restored case with owned disposable browser and original budgets
      if: ${{ success() && steps.setup.outcome == 'success' }}
      run: bash recipe/scripts/web-functional/run.sh restored-case
      env:
        E2E_CASE_ID: ${{ matrix.id }}
        E2E_CASE_TEST_FILE: ${{ matrix.file }}
        E2E_CASE_TITLE: ${{ matrix.title }}
        E2E_CASE_PATTERN: ${{ matrix.pattern }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: restored-${{ matrix.id }}-evidence
        path: evidence/
        retention-days: 7
        if-no-files-found: warn
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
        - id: beforeunload-open
          file: tests/integration/cdp-recovery.test.ts
          title: leaves the host untouched until first open and allows a pre-open dialog handler
          pattern: leaves\ the\ host\ untouched\ until\ first\ open\ and\ allows\ a\ pre\-open\ dialog\ handler$
        - id: beforeunload-video
          file: tests/integration/cdp-recovery.test.ts
          title: leaves the host untouched until first video and allows a pre-open dialog handler
          pattern: leaves\ the\ host\ untouched\ until\ first\ video\ and\ allows\ a\ pre\-open\ dialog\ handler$
        - id: beforeunload-provider
          file: tests/integration/cdp-recovery.test.ts
          title: activates the borrowed first page through the registered dialog handler before provider recording
          pattern: activates\ the\ borrowed\ first\ page\ through\ the\ registered\ dialog\ handler\ before\ provider\ recording$
        - id: beforeunload-dismiss-open
          file: tests/integration/cdp-recovery.test.ts
          title: dismisses an unhandled activated beforeunload on first open instead of silently accepting it
          pattern: dismisses\ an\ unhandled\ activated\ beforeunload\ on\ first\ open\ instead\ of\ silently\ accepting\ it$
        - id: beforeunload-dismiss-video
          file: tests/integration/cdp-recovery.test.ts
          title: dismisses an unhandled activated beforeunload on first video instead of silently accepting it
          pattern: dismisses\ an\ unhandled\ activated\ beforeunload\ on\ first\ video\ instead\ of\ silently\ accepting\ it$
        - id: service-worker
          file: tests/integration/protected-app.test.ts
          title: blocks service workers under headers, since routing never sees a worker's requests
          pattern: blocks\ service\ workers\ under\ headers,\ since\ routing\ never\ sees\ a\ worker's\ requests$
