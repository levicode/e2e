name: Pseudo capture exact-case closed diagnostic
'on':
  push:
    branches:
    - implement/pseudo-case-first-failure-ci
permissions:
  contents: read
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 1176ce1545c49b67979ec5cf4240c7ead28b8f24
  NATIVE_SOURCE_TREE: 6670b61c857f7daf11056e849d56850706f8a09b
jobs:
  pseudo-capture-feature:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''


        # Same production and unchanged original consumer test trees as producer run.

        test "$(git rev-parse HEAD:packages/e2e/src)" = 8e25c421b716f2e33f5a466383805f496e1391a0

        test "$(git rev-parse HEAD:packages/web/src)" = 90431462e19984e26e2ca481c808af9d9cc89218

        test "$(git rev-parse HEAD:packages/e2e/tests/integration)" = caf773cc5b7e1158dbeb10c287b6a2b765c0ff09

        test "$(git rev-parse HEAD:packages/web/tests/integration)" = ac6962ee0c3edd6bec5c011a471c456a931da075

        '
    - run: pnpm install --frozen-lockfile
    - name: Download bounded exact cross-run producer artifact
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/download-interrupt-runtime.py
    - name: Verify explicit producer and native bytes
      timeout-minutes: 1
      run: node scripts/ci/verify-interrupt-runtime.ts "$RUNNER_TEMP/interrupt-native-runtime"
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
    - name: Prepare ffmpeg only if absent
      timeout-minutes: 5
      run: "set -euo pipefail\ndate -u +%FT%TZ | tee evidence/encoder-install.started\nif ! command -v ffmpeg >/dev/null\
        \ || ! command -v ffprobe >/dev/null; then\n sudo apt-get update 2>&1 | tee evidence/encoder-apt-update.log\n\
        \ sudo apt-get install -y ffmpeg 2>&1 | tee evidence/encoder-apt-install.log\nfi\nffmpeg -version > evidence/ffmpeg-version.txt\n\
        ffprobe -version > evidence/ffprobe-version.txt\ndate -u +%FT%TZ | tee evidence/encoder-install.finished"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: '12721252606'
        path: native-harness
        merge-multiple: true
        repository: levicode/e2e
        run-id: '40475173425'
        github-token: ${{ github.token }}
    - name: Verify exact cross-run harness source and native Chrome
      env:
        EXPECTED_HARNESS_SHA: 2ed9e7b8523d64722bedc97947226bf69fb988c472887fda73207ed2b21e4596
      run: 'set -euo pipefail

        test "$(git -C native rev-parse HEAD)" = "$NATIVE_SOURCE_SHA"

        test "$(git -C native rev-parse HEAD^{tree})" = "$NATIVE_SOURCE_TREE"

        test "$(cat native-harness/native-source.sha)" = "$NATIVE_SOURCE_SHA"

        test "$(cat native-harness/native-source.tree)" = "$NATIVE_SOURCE_TREE"

        test "$(cat native-harness/producer-run.id)" = 40475173425

        test "$(cat native-harness/features.txt)" = acceptance-faults

        printf ''%s  %s\n'' "$EXPECTED_HARNESS_SHA" native-harness/agent-browser-tests | sha256sum --check

        (cd native-harness; sha256sum --check SHA256SUMS)

        chmod +x native-harness/agent-browser-tests

        node scripts/acceptance/installed-chromium.ts "$HOME/.agent-browser/browsers" evidence/chromium-executable.json

        cp native-harness/native-source.* native-harness/features.txt native-harness/producer-run.id evidence/

        cp "$RUNNER_TEMP/interrupt-native-runtime/manifest.json" evidence/production-runtime.manifest.json

        '
    - name: Pseudo capture real Chromium six-scenario test in feature mode
      run: python3 scripts/ci/run-pseudo-capture.py native-harness/agent-browser-tests evidence/chromium-executable.json
        evidence/pseudo-capture
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: pseudo-capture-feature-closed-first-failure-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
