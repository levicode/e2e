        export E2E_CHROMIUM_EXECUTABLE="$(python3 -c ''import json;print(json.load(open("evidence/focused-chrome.json"))["chrome"])'')"

        node --input-type=module -e "import { REQUIRED_CAPABILITIES } from ''./packages/web/dist/native/capabilities.js'';
        process.stdout.write(JSON.stringify(REQUIRED_CAPABILITIES))" > .artifacts/native-candidate/required-capabilities.json

        node scripts/acceptance/probe-native.ts "$E2E_AGENT_BROWSER_EXECUTABLE" .artifacts/native-candidate/required-capabilities.json
        .artifacts/native-candidate/negotiation.json

        '
    - name: Record verified artifact provenance only (not native acceptance)
      run: 'set -euo pipefail

        node --input-type=module - <<''JS''

        import fs from ''node:fs'';

        import assert from ''node:assert/strict'';

        import {createHash} from ''node:crypto'';

        const m=JSON.parse(fs.readFileSync(''evidence/native-runtime.manifest.json''));

        const pins={nativeSource:{commit:process.env.NATIVE_SOURCE_SHA,tree:process.env.NATIVE_SOURCE_TREE},binarySha256:m.binarySha256,manifestSha256:createHash(''sha256'').update(fs.readFileSync(''evidence/native-runtime.manifest.json'')).digest(''hex'')};

        assert.deepEqual(m.nativeSource,pins.nativeSource);

        assert.equal(m.binarySha256,pins.binarySha256);

        assert.equal(createHash(''sha256'').update(fs.readFileSync(process.env.E2E_AGENT_BROWSER_EXECUTABLE)).digest(''hex''),m.binarySha256);

        assert.deepEqual(m.compilation.features,[]);

        assert.equal(m.platform,process.platform);assert.equal(m.architecture,process.arch);

        fs.writeFileSync(''.artifacts/native-candidate/producer.json'',JSON.stringify({schemaVersion:1,kind:''verified-ordinary-artifact-provenance-only'',source:m.nativeSource,binary:{sha256:m.binarySha256},producer:{platform:m.platform,architecture:m.architecture,repository:m.repository,runId:m.runId,runAttempt:m.runAttempt},artifact:{id:process.env.ORDINARY_ARTIFACT_ID,manifestSha256:pins.manifestSha256},acceptanceEvidence:false,releaseEligible:false,note:''Artifact
        identity only; full native acceptance is evaluated separately. No baseline
        or browser contract approval is claimed.''},null,2));

        JS

        '
      env:
        ORDINARY_ARTIFACT_ID: ${{ needs.native-runtime.outputs.artifact-id }}
