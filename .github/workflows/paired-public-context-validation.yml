    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
    - name: Build actual public core and web adapter
      run: pnpm run build
    - name: Install original core fixture Playwright Chromium
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium
      timeout-minutes: 8
    - name: Unchanged public reference consumers on the same native runtime
      run: 'set -euo pipefail

        python3 - <<''PY_PRIVATE''

        import os

        from pathlib import Path

        p=Path(''evidence/native-cleanup.jsonl'').resolve()

        fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600);os.close(fd)

        PY_PRIVATE

        export AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE="$GITHUB_WORKSPACE/evidence/native-cleanup.jsonl"

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        cp "$RUNNER_TEMP/ci-native-runtime/manifest.json" evidence/native-runtime.manifest.json

        set +e

        pnpm --filter e2e exec vitest run tests/integration/agent-act-pixel-tools.test.ts
        tests/integration/agent-act-verbs.test.ts tests/integration/agent-act.test.ts
        tests/integration/agent-ai-trace.test.ts tests/integration/agent-policy.test.ts
        tests/integration/agent-trace-cache.test.ts tests/integration/agent.test.ts
        tests/integration/mcp-server.test.ts tests/integration/mcp-test-lines.test.ts
        tests/integration/plain-string-secrets.test.ts tests/integration/canonical-reference-roundtrip.test.ts
        --bail=0 --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/core-consumers.json"
        2>&1 | tee evidence/core-consumers.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/core-consumers.exit

        python3 - <<''PY_COUNTS''

        import json

        from pathlib import Path

        p=json.loads(Path(''evidence/core-consumers.json'').read_text())

        a=[a for t in p[''testResults''] for a in t[''assertionResults'']]

        counts={''total'':len(a),''passed'':sum(x[''status'']==''passed'' for x in
        a),''failed'':sum(x[''status'']==''failed'' for x in a),''pending'':sum(x[''status'']
        not in (''passed'',''failed'') for x in a)}

        Path(''evidence/core-consumers-counts.json'').write_text(json.dumps(counts,indent=2)+''\n'')

        assert counts[''total'']==125 and counts[''pending'']==0 and counts[''passed'']+counts[''failed'']==125,counts

        PY_COUNTS

        exit "$status"

        '
    - name: Preserve diagnostic completeness boundaries
      if: always()
      run: "python3 - <<'PY_DIAG'\nimport json,hashlib\nfrom pathlib import Path\n\
        p=Path('evidence/native-cleanup.jsonl');rows=[];bad=0\nif p.exists():\n for\
        \ line in p.read_text().splitlines():\n  try: rows.append(json.loads(line))\n\
        \  except (ValueError,TypeError): bad+=1\nout={'exists':p.exists(),'bytes':p.stat().st_size\
