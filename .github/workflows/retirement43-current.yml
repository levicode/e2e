name: Exact current native retirement controls

on:
  push:
    branches: [validation/retirement43-current-20261025]

permissions:
  contents: read

concurrency:
  group: retirement43-current-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-native:
    if: github.repository == 'levicode/e2e' && github.event_name == 'push' && github.ref == 'refs/heads/validation/retirement43-current-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_MIN_STACK: '16777216'
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_BUILD_JOBS: '2'
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout validation scripts separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: recipe
          persist-credentials: false
      - name: Checkout exact native source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: levicode/agent-browser
          ref: 7932b596b654dfbb3731679321e613e37944c4c2
          path: native-source
          persist-credentials: false
      - name: Checkout exact adapter source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: levicode/e2e
          ref: 38b4c9fc00872ea8272c53faa5260f090d55a865
          path: e2e-source
          persist-credentials: false
      - name: Verify both source pins and trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C native-source rev-parse HEAD)" = 7932b596b654dfbb3731679321e613e37944c4c2
          test "$(git -C native-source rev-parse HEAD^{tree})" = 23d4de87258f4635e92abdc5b554d278f5a20f8a
          test "$(git -C e2e-source rev-parse HEAD)" = 38b4c9fc00872ea8272c53faa5260f090d55a865
          test "$(git -C e2e-source rev-parse HEAD^{tree})" = 7ba7d2a46399dc5fb50a73f7d052163a48953d31
          test -z "$(git -C native-source status --porcelain)"
          test -z "$(git -C e2e-source status --porcelain)"
      - name: Setup Node for scripted DOM controls
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustc --version --verbose
          node --version
      - name: Compile current ci profile and run 34 exact native tests plus 8 pure controls
        shell: bash
        run: |
          set -euo pipefail
          python3 recipe/scripts/acceptance/validate-retirement-native.py \
            --native-root "$GITHUB_WORKSPACE/native-source" \
            --output "$GITHUB_WORKSPACE/validation-output" \
            --target-dir "$RUNNER_TEMP/retirement-native-target"
      - name: Preserve command logs and source-bound test receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retirement-native-current
          path: validation-output/
          if-no-files-found: warn
          retention-days: 7
