name: fixed public Web functional diagnostic (not acceptance)
on:
  push:
    branches: [implement/web-functional-diagnostic-ci]
permissions:
  contents: read
concurrency:
  group: web-functional-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_BUILD_JOBS: '2'
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: levicode/agent-browser
          ref: 188e2f68fc12d5dc3c71f682da83da2b05b28e92
          path: native
          persist-credentials: false
      - name: Build exact production and separate fault ELF (no tests or gate waiver)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images evidence
          cd native/cli
          test "$(git rev-parse HEAD)" = 188e2f68fc12d5dc3c71f682da83da2b05b28e92
          test "$(git rev-parse HEAD^{tree})" = 4b4d04252c6f6988c4977f71cfc498d2fd4ec913
          test -z "$(git status --porcelain)"
          rustup toolchain install 1.99.1 --profile minimal
          unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          export CARGO_TARGET_DIR="$RUNNER_TEMP/web-functional-target"
          rustc -Vv > "$GITHUB_WORKSPACE/evidence/rustc.txt"
          cargo build --locked --profile ci --no-default-features 2>&1 | tee "$GITHUB_WORKSPACE/evidence/production-build.log"
          cp "$CARGO_TARGET_DIR/ci/agent-browser" "$GITHUB_WORKSPACE/images/production"
          cargo build --locked --profile ci --no-default-features --features acceptance-faults 2>&1 | tee "$GITHUB_WORKSPACE/evidence/fault-build.log"
          cp "$CARGO_TARGET_DIR/ci/agent-browser" "$GITHUB_WORKSPACE/images/acceptance-faults"
          cd "$GITHUB_WORKSPACE/images"
          sha256sum production acceptance-faults > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fixed-native-images
          path: images/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: functional-build-evidence
          path: evidence/
          if-no-files-found: warn
  callbacks:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: recipe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: levicode/e2e
          ref: 124df445a5d7db105914174408c267090fdfae50
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        with:
          package_json_file: source/package.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fixed-native-images
          path: images
      - name: Install existing browser/codec prerequisites and probe exact binaries
        run: bash recipe/scripts/web-functional/run.sh setup
      - name: Existing functional group (original exit status)
        run: bash recipe/scripts/web-functional/run.sh callbacks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: functional-callbacks-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
  functional:
    needs: [build, callbacks]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [web, differential, semantic, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: recipe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: levicode/e2e
          ref: 124df445a5d7db105914174408c267090fdfae50
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        with:
          package_json_file: source/package.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fixed-native-images
          path: images
      - name: Install existing browser/codec prerequisites and probe exact binaries
        run: bash recipe/scripts/web-functional/run.sh setup
      - name: Existing functional group (original exit status)
        run: bash recipe/scripts/web-functional/run.sh ${{ matrix.group }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: functional-${{ matrix.group }}-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
