# FROZEN PRODUCER ONLY: prior genuine P06 focused8 proof bound; no runtime or release acceptance.
name: P06 recovery production only (no runtime or release acceptance)
'on':
  push:
    branches:
    - validation/p06-recovery-production-20261025
permissions:
  contents: read
concurrency:
  group: focused-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  production:
    name: focused-native-production-artifact
    if: ${{ github.ref == 'refs/heads/validation/p06-recovery-production-20261025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      RUST_MIN_STACK: '16777216'
      RUST_BACKTRACE: '1'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
      PHASES: recipe-identity binding proof-fetch proof-download proof-verify source-before toolchain production-build production-capture
        source-after product-integrity
    outputs:
      validated: ${{ steps.gate.outputs.validated }}
      artifact_id: ${{ steps.binary.outputs.artifact-id }}
      artifact_digest: ${{ steps.binary.outputs.artifact-digest }}
    steps:
    - name: Initialize explicit not-run receipts; no browser or runtime jobs
      id: init
      timeout-minutes: 1
      run: |-
        set -euo pipefail
        umask 077
        export EVIDENCE_DIR="$RUNNER_TEMP/focused-production-evidence"
        export CARGO_HOME="$RUNNER_TEMP/focused-production-cargo"
        export CARGO_TARGET_DIR="$RUNNER_TEMP/focused-production-target"
        export VALIDATE="$GITHUB_WORKSPACE/recipe/scripts/focused-production/producer.py"
        export PRODUCT_DIR="$RUNNER_TEMP/focused-production-product"
        printf 'EVIDENCE_DIR=%s\nCARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nVALIDATE=%s\nPRODUCT_DIR=%s\n' "$EVIDENCE_DIR" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$VALIDATE" "$PRODUCT_DIR" >> "$GITHUB_ENV"
        test ! -e "$CARGO_TARGET_DIR"
        test ! -e "$PRODUCT_DIR"
        mkdir -m700 "$EVIDENCE_DIR"
        for phase in $PHASES; do printf 'not-run\n' > "$EVIDENCE_DIR/$phase.exit"; done
        printf '%s\n' 'Producer only: fresh feature-free ci ELF for later original P06 only. Prior actual8 focused dev fixtures are not full native or optimized test acceptance. Full333 is outside this job; the existing final acceptance goal is unchanged.' > "$EVIDENCE_DIR/SCOPE.txt"
        uname -a > "$EVIDENCE_DIR/host.txt"
        cat /etc/os-release >> "$EVIDENCE_DIR/host.txt"
        . /etc/os-release
        test "$RUNNER_OS" = Linux
        test "$(uname -m)" = x86_64
        test "$(id -u)" -ne 0
        test "$ID" = ubuntu
        test "$VERSION_ID" = 24.04
    - name: Check out this immutable producer recipe
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - name: Refuse unfrozen source or focused prerequisite before any native work
      id: binding
      timeout-minutes: 1
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" run recipe-identity 30 python3 -B "$VALIDATE" identity recipe "$GITHUB_WORKFLOW_SHA" - - -
        python3 -B "$VALIDATE" run binding 30 python3 -B "$VALIDATE" guard
        sha256sum recipe/.github/workflows/native-focused-production.yml recipe/scripts/focused-production/*.py recipe/scripts/focused-production/pins.json > "$EVIDENCE_DIR/recipe.sha256"
    - name: Check out the exact already-successful focused fixture recipe for its original parser
      id: prior_recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        repository: levicode/e2e
        ref: ${{ env.PROOF_RECIPE_SHA }}
        path: proof-recipe
        persist-credentials: false
    - name: Fetch only the fixed completed focused proof and immutable source metadata
      id: proof_fetch
      timeout-minutes: 6
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" run proof-fetch 300 bash -euc '
        api=https://api.github.com/repos/levicode/e2e
        fetch() { curl --fail --silent --show-error --max-time 45 --max-filesize 67108864 --proto "=https" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1" -o "$2"; }
        fetch "$api/actions/runs/$PROOF_RUN_ID" "$EVIDENCE_DIR/native-focused-run.json"
        fetch "$api/actions/runs/$PROOF_RUN_ID/attempts/$PROOF_RUN_ATTEMPT/jobs?per_page=100" "$EVIDENCE_DIR/native-focused-jobs.json"
        fetch "$api/actions/artifacts/$PROOF_ARTIFACT_ID" "$EVIDENCE_DIR/native-focused-artifact.json"
        fetch "$api/git/commits/$PROOF_RECIPE_SHA" "$EVIDENCE_DIR/native-focused-recipe.json"
        fetch "$api/git/commits/$E2E_SHA" "$EVIDENCE_DIR/e2e-source-commit.json"
        code=$(curl --silent --show-error --max-time 45 --proto "=https" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -D "$EVIDENCE_DIR/native-focused-download.headers" -o /dev/null -w "%{http_code}" "$api/actions/artifacts/$PROOF_ARTIFACT_ID/zip")
        test "$code" = 302
        '
    - name: Fetch the exact original ZIP in its own bounded admitted phase
      id: proof_download
      timeout-minutes: 4
      run: |-
        set -euo pipefail
        cat > "$RUNNER_TEMP/focused-proof-download.sh" <<'DOWNLOAD'
        set -euo pipefail
        # No GitHub authorization is forwarded to the official artifact-storage redirect.
        url=$(python3 - "$EVIDENCE_DIR/native-focused-download.headers" <<'CHECK'
        import sys, urllib.parse
        headers=open(sys.argv[1]).read().splitlines()
        values=[line.split(':',1)[1].strip() for line in headers if line.lower().startswith('location:')]
        assert len(values)==1
        url=urllib.parse.urlsplit(values[0]);assert url.scheme=='https' and not url.username and not url.password
        print(values[0])
        CHECK
        )
        curl --fail --silent --show-error --max-time 120 --max-filesize 67108864 --proto '=https' "$url" -o "$EVIDENCE_DIR/native-focused.zip"
        rm "$EVIDENCE_DIR/native-focused-download.headers"
        DOWNLOAD
        # The bounded helper records only this script path, never the signed URL value.
        python3 -B "$VALIDATE" run proof-download 180 bash "$RUNNER_TEMP/focused-proof-download.sh"
    - name: Recheck exact existing raw ledgers, phases, source binding and all focused cases
      id: proof_verify
      timeout-minutes: 3
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" run proof-verify 120 python3 -B recipe/scripts/focused-production/admit-native-focused.py "$GITHUB_WORKSPACE/proof-recipe"
    - name: Check out final native source only after genuine focused success
      id: source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SHA }}
        path: source
        persist-credentials: false
    - name: Verify exact source tree and lock before compile
      id: before
      timeout-minutes: 1
      run: python3 -B "$VALIDATE" run source-before 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" "$NATIVE_SHA" "$NATIVE_TREE"
        cli/Cargo.lock "$NATIVE_LOCK_SHA256" before
    - name: Cache registry bytes only, never target executables
      id: registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      timeout-minutes: 3
      with:
        path: |-
          ${{ env.CARGO_HOME }}/registry
          ${{ env.CARGO_HOME }}/git/db
        key: focused-registry-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-${{ env.NATIVE_LOCK_SHA256 }}
    - name: Install and verify the existing pinned official Rust toolchain
      id: rust
      timeout-minutes: 11
      run: "python3 -B \"$VALIDATE\" run toolchain 600 bash -euc '\nrustup toolchain install \"$RUSTUP_TOOLCHAIN\" --profile minimal\
        \ --component rustfmt --component clippy\nrustc -Vv\ncargo -Vv\ntest \"$(rustc -Vv | sed -n \"s/^release: //p\")\" = \"$RUSTUP_TOOLCHAIN\"\
        \ntest \"$(rustc -Vv | sed -n \"s/^host: //p\")\" = x86_64-unknown-linux-gnu\n' "
    - name: Build only the new feature-free standard ci ELF
      id: build
      timeout-minutes: 37
      working-directory: source/cli
      run: |-
        set -euo pipefail
        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET
        python3 -B "$VALIDATE" run production-build 2100 cargo build --locked --profile ci --no-default-features --message-format=json
        python3 -B "$VALIDATE" run production-capture 60 python3 -B "$VALIDATE" production "$PRODUCT_DIR" production
    - name: Verify source remains unchanged even after a build failure
      id: after
      timeout-minutes: 1
      if: ${{ always() && steps.before.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run source-after 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" "$NATIVE_SHA" "$NATIVE_TREE"
        cli/Cargo.lock "$NATIVE_LOCK_SHA256" after
    - name: Verify the captured image and focused-only provenance
      id: integrity
      timeout-minutes: 2
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.after.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run product-integrity 60 python3 -B "$VALIDATE" integrity "$PRODUCT_DIR"
    - name: Require every actual producer phase, never skip-as-pass
      id: gate
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" aggregate $PHASES
        echo 'validated=true' >> "$GITHUB_OUTPUT"
    - name: Retain exact producer step outcomes
      id: outcomes
      timeout-minutes: 1
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: printf '%s\n' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"
    - name: Always retain producer diagnostics without signed download headers
      id: diagnostics
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      if: ${{ always() }}
      with:
        name: focused-production-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          ${{ env.EVIDENCE_DIR }}/*.json
          ${{ env.EVIDENCE_DIR }}/*.log
          ${{ env.EVIDENCE_DIR }}/*.exit
          ${{ env.EVIDENCE_DIR }}/*.txt
          ${{ env.EVIDENCE_DIR }}/*.sha256
        if-no-files-found: error
        retention-days: 7
    - name: Retain genuine unpromoted focused image only after producer success
      id: binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
      with:
        name: unpromoted-focused-native-linux-x64-${{ env.NATIVE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.PRODUCT_DIR }}/
        if-no-files-found: error
        retention-days: 7
