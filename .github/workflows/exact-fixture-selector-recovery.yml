name: Exact fixture and selector mechanical repair
'on':
  push:
    branches:
    - implement/exact-fixture-selector-mechanical-ci
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: exact-fixture-selector-recovery-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: c1519696276de2fbb3e734cc3c643f4faf236fbe
  NATIVE_SOURCE_TREE: 9270785a243be13e81db8c52723109035dff02b1
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  adapter-units:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from
        "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
    - name: Full Web unit and source type checks
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec tsc --noEmit

        pnpm exec oxlint packages/e2e/src/expect/async.ts packages/e2e/src/locator/engine.ts
        packages/e2e/tests/helpers/action-outcome-diagnostics.ts packages/e2e/tests/integration/web-selector-chains.test.ts
        packages/e2e/tests/unit/action-outcome-diagnostics.test.ts packages/e2e/tests/unit/locator-field-assertions.test.ts
        packages/web/src/native-surface.ts packages/web/src/native/browser-channel.ts
        packages/web/src/native/protocol.ts packages/web/tests/unit/native-finalized-recording-surface.test.ts
        packages/web/tests/unit/native-selector-errors.test.ts packages/web/tests/unit/native-worker-reinit.test.ts

        pnpm --filter @e2e-dev/web exec vitest run tests/unit --reporter=verbose --reporter=json
        --outputFile.json="$GITHUB_WORKSPACE/evidence/web-units.json" 2>&1 | tee evidence/web-units.log

        '
    - name: Check full Web execution count
      if: always()
      run: 'python3 - <<''PY_COUNT''

        import json

        r=json.load(open(''evidence/web-units.json''))

        assert r[''numTotalTests'']==1516,r[''numTotalTests'']

        assert r[''numPendingTests'']==0,r[''numPendingTests'']

        print(json.dumps({k:r[k] for k in [''numTotalTests'',''numPassedTests'',''numFailedTests'',''numPendingTests'']}))

        PY_COUNT

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: mechanical-recovery-optional-observe-adapter-unit-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  native174-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - name: Capture exact recovery source
      run: 'mkdir -p evidence

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree'
    - name: Verify exact producer artifact metadata
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python3 - <<''PY_META''

        import json,urllib.request,os

        u=''https://api.github.com/repos/levicode/e2e/actions/artifacts/12731007653''

        r=urllib.request.Request(u,headers={''Authorization'':''Bearer ''+os.environ[''GH_TOKEN''],''Accept'':''application/vnd.github+json''})

        with urllib.request.urlopen(r,timeout=30) as f:a=json.load(f)

        assert a[''id'']==12731007653 and a[''name'']==''paired-optional-feature-harness''
        and not a[''expired'']

        assert a[''digest'']==''sha256:90995e5040985289af5faaa304d2a7cb2905e41a7fbe454a574e61a0e1b96d0c''

        assert a[''size_in_bytes'']==35606386

        assert a[''workflow_run''][''id'']==40495366472 and a[''workflow_run''][''head_sha'']==''c24ba7fa26461ca09d114b486a428f45a413df8c''

        open(''evidence/reused-artifact.json'',''w'').write(json.dumps(a,indent=2)+''\n'')

        PY_META

        '
    - name: Download exact prior compiled harness
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: '12731007653'
        run-id: '40495366472'
        github-token: ${{ github.token }}
        path: native-harness
        merge-multiple: true
      timeout-minutes: 3
    - name: Verify binary and run all 174 exact tests
      run: 'set -euo pipefail

        test "$(git -C native rev-parse HEAD)" = "$NATIVE_SOURCE_SHA"

        test "$(git -C native rev-parse HEAD^{tree})" = "$NATIVE_SOURCE_TREE"

        test -z "$(git -C native status --porcelain)"

        test -f native/cli/Cargo.toml

        python3 - <<''PY_VERIFY''

        import pathlib,hashlib,os

        p=pathlib.Path(''native-harness'')

        assert {x.name for x in p.iterdir()}=={''agent-browser-tests'',''native-source.sha'',''native-source.tree'',''features.txt'',''producer-run.id'',''SHA256SUMS''}

        assert all(x.is_file() and not x.is_symlink() for x in p.iterdir())

        assert (p/''native-source.sha'').read_text().strip()==os.environ[''NATIVE_SOURCE_SHA'']

        assert (p/''native-source.tree'').read_text().strip()==os.environ[''NATIVE_SOURCE_TREE'']

        assert (p/''features.txt'').read_text().strip()==''acceptance-faults''

        assert (p/''producer-run.id'').read_text().strip()==''40495366472''

        assert hashlib.sha256((p/''agent-browser-tests'').read_bytes()).hexdigest()==''b8bf1b4aae5384844c5b78c263a13b0c8a7d2a5bac109bdd2a148f2e811b0c9d''

        PY_VERIFY

        (cd native-harness; sha256sum --check SHA256SUMS)

        chmod +x native-harness/agent-browser-tests

        cp native-harness/{native-source.sha,native-source.tree,features.txt,producer-run.id,SHA256SUMS}
        evidence/

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        python3 scripts/ci/run-optional-observe-tests.py native-harness/agent-browser-tests
        scripts/ci/optional-observe-inventory.json evidence/native-focused

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: mechanical-recovery-native174-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
