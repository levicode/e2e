name: Full native CI-profile regression and original compile boundaries
permissions:
  contents: read
  actions: read
concurrency:
  group: native-full-regression-popup-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 6150faa8f813e396eff0ae736311d0e7da626593
  NATIVE_SOURCE_TREE: ee5044a3e050b406e2598c4b655dbe2d98aba5f9
  NEXT_TELEMETRY_DISABLED: '1'
  GIT_NO_LAZY_FETCH: '1'
  RUSTUP_TOOLCHAIN: 1.99.1
'on':
  push:
    branches:
    - ci/native-full-regression-s8-20261030
jobs:
  original-four-compile-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      REGRESSION_EVIDENCE: .artifacts/native-candidate
      REGRESSION_NATIVE: .artifacts/native-source
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Export fresh target and Cargo paths from runner shell
      shell: bash
      run: 'set -euo pipefail

        printf ''CARGO_TARGET_DIR=%s/native-full-popup-boundaries-target\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''CARGO_HOME=%s/native-full-popup-boundaries-cargo\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - run: python3 .github/native-full-regression/ci.py prepare --gate boundaries
      name: Reserve fresh target/cache and record producer identity
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: .artifacts/native-source
        persist-credentials: false
    - run: python3 .github/native-full-regression/ci.py source --gate boundaries
      name: Validate exact native source, lock and file bytes
    - name: Install and record exact Rust 1.99.1 toolchain
      id: toolchain
      shell: bash
      run: 'set -euo pipefail

        out="$GITHUB_WORKSPACE/$REGRESSION_EVIDENCE"

        set +e

        rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy > "$out/toolchain-install.log"
        2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$out/toolchain-install.exit"

        cat "$out/toolchain-install.log"

        test "$status" -eq 0

        rustc +1.99.1 -Vv > "$out/rustc-version.txt" 2>&1

        cargo +1.99.1 -Vv > "$out/cargo-version.txt" 2>&1

        python3 - <<''PY_PATHS''

        import json,os,pathlib,subprocess

        names=[''rustc'',''cargo'']+[''rustfmt'',''clippy-driver'']

        paths={name:subprocess.check_output([''rustup'',''which'',''--toolchain'',''1.99.1'',name],text=True).strip()
        for name in names}

        (pathlib.Path(os.environ[''GITHUB_WORKSPACE''])/os.environ[''REGRESSION_EVIDENCE'']/''toolchain-paths.json'').write_text(json.dumps(paths,indent=2)+''\n'')

        PY_PATHS

        python3 .github/native-full-regression/ci.py toolchain --gate boundaries

        '
    - name: Check all native compilation boundaries before browser execution
      id: native-lint
      working-directory: .artifacts/native-source/cli
      env:
        EXPECTED_NATIVE_SHA: ${{ env.NATIVE_SOURCE_SHA }}
      run: "set -euo pipefail\nunset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS\n\
        test \"$(git rev-parse HEAD)\" = \"$EXPECTED_NATIVE_SHA\"\ntest -z \"$(git status --porcelain)\"\n\
        out=\"$GITHUB_WORKSPACE/.artifacts/native-candidate\"\nmkdir -p \"$out\"\nprintf '%s\\n' \"$EXPECTED_NATIVE_SHA\"\
        \ > \"$out/native-compile-source.txt\"\nfailed=0\ncheck_boundary() {\n  local name=\"$1\" status=0\n\
        \  shift\n  printf '%q ' \"$@\" >> \"$out/compiler-argv.txt\"\n  printf '\\n' >> \"$out/compiler-argv.txt\"\
        \n  if \"$@\" > \"$out/$name.log\" 2>&1; then\n    status=0\n  else\n    status=$?\n    failed=1\n\
        \  fi\n  printf '%s\\n' \"$status\" > \"$out/$name.exit\"\n  cat \"$out/$name.log\"\n}\ncheck_boundary\
        \ native-format-check cargo fmt -- --check\ncheck_boundary native-default-clippy cargo clippy --locked\
        \ --profile ci --no-default-features --all-targets -- -D warnings\ncheck_boundary native-feature-check\
        \ cargo check --locked --profile ci --no-default-features --features acceptance-faults --tests\ncheck_boundary\
        \ native-proxy-check cargo check --locked --profile ci --no-default-features --features acceptance-faults\
        \ --test client-proxy-fixture\ntest \"$failed\" -eq 0\n"
    - run: python3 .github/native-full-regression/ci.py audit --gate boundaries
      name: Collect independent custody and explicit missing/loss evidence after every outcome
      id: custody
      if: ${{ always() }}
    - run: python3 .github/native-full-regression/ci.py accept --gate boundaries
      name: Accept only complete successful exact-source evidence
      id: accept
    - name: Preserve raw evidence including all failures and missing-capture reports
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: full-native-popup-boundaries-${{ github.run_id }}
        path: .artifacts/native-candidate/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  full-ci-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '1'
      REGRESSION_EVIDENCE: evidence
      REGRESSION_NATIVE: native
    steps:
    - *id001
    - name: Export fresh target and Cargo paths from runner shell
      shell: bash
      run: 'set -euo pipefail

        printf ''CARGO_TARGET_DIR=%s/native-full-popup-default-target\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''CARGO_HOME=%s/native-full-popup-default-cargo\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - run: python3 .github/native-full-regression/ci.py prepare --gate default
      name: Reserve fresh target/cache and record producer identity
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - run: python3 .github/native-full-regression/ci.py source --gate default
      name: Validate exact native source, lock and file bytes
    - name: Install and record exact Rust 1.99.1 toolchain
      id: toolchain
      shell: bash
      run: 'set -euo pipefail

        out="$GITHUB_WORKSPACE/$REGRESSION_EVIDENCE"

        set +e

        rustup toolchain install 1.99.1 --profile minimal > "$out/toolchain-install.log" 2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$out/toolchain-install.exit"

        cat "$out/toolchain-install.log"

        test "$status" -eq 0

        rustc +1.99.1 -Vv > "$out/rustc-version.txt" 2>&1

        cargo +1.99.1 -Vv > "$out/cargo-version.txt" 2>&1

        python3 - <<''PY_PATHS''

        import json,os,pathlib,subprocess

        names=[''rustc'',''cargo'']

        paths={name:subprocess.check_output([''rustup'',''which'',''--toolchain'',''1.99.1'',name],text=True).strip()
        for name in names}

        (pathlib.Path(os.environ[''GITHUB_WORKSPACE''])/os.environ[''REGRESSION_EVIDENCE'']/''toolchain-paths.json'').write_text(json.dumps(paths,indent=2)+''\n'')

        PY_PATHS

        python3 .github/native-full-regression/ci.py toolchain --gate default

        '
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - name: Compile fresh exact ci-profile full test harness
      id: compile
      shell: bash
      run: 'set -euo pipefail

        out="$GITHUB_WORKSPACE/$REGRESSION_EVIDENCE"

        cd native/cli

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS

        argv=(cargo +1.99.1 test --locked --profile ci --timings --no-default-features --bin agent-browser
        -j1 --no-run --message-format=json)

        printf ''%q '' "${argv[@]}" > "$out/compiler-argv.txt"

        printf ''\n'' >> "$out/compiler-argv.txt"

        set +e

        "${argv[@]}" > "$out/harness.jsonl" 2> "$out/harness-build.log"

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$out/harness-build.exit"

        cat "$out/harness-build.log"

        exit "$status"

        '
    - run: python3 .github/native-full-regression/ci.py binary --gate default
      name: Select only compiler-proven fresh exact-profile executable
      id: binary
    - name: Retain exact binary provenance and Cargo timings
      run: 'set -euo pipefail

        harness="$(cat evidence/harness.path)"

        mkdir native-harness

        cp "$harness" native-harness/agent-browser-tests

        printf ''%s\n'' "$NATIVE_SOURCE_SHA" > native-harness/native-source.sha

        printf ''%s\n'' "$NATIVE_SOURCE_TREE" > native-harness/native-source.tree

        printf ''%s\n'' default > native-harness/features.txt

        printf ''%s\n'' "$GITHUB_RUN_ID" > native-harness/producer-run.id

        (cd native-harness; sha256sum agent-browser-tests > SHA256SUMS)

        mkdir evidence/cargo-timings

        cp -a "$CARGO_TARGET_DIR/cargo-timings/." evidence/cargo-timings/

        cp native-harness/SHA256SUMS evidence/copied-harness.SHA256SUMS

        '
    - name: Collect all tests and exact ignored set without filters
      id: collect
      run: 'set -euo pipefail

        set +e

        native-harness/agent-browser-tests --list > evidence/all-tests.list 2> evidence/all-tests.stderr.log

        all_status=$?

        printf ''%s\n'' "$all_status" > evidence/all-tests.exit

        native-harness/agent-browser-tests --ignored --list > evidence/ignored-tests.list 2> evidence/ignored-tests.stderr.log

        ignored_status=$?

        printf ''%s\n'' "$ignored_status" > evidence/ignored-tests.exit

        set -e

        test "$all_status" -eq 0

        test "$ignored_status" -eq 0

        '
    - run: python3 .github/native-full-regression/ci.py inventory --gate default
      name: Require exact source-derived collection and reviewed ignored names
      id: inventory
    - name: Require original 43 and new 20 controls in the complete nonignored inventory
      id: required-controls
      shell: bash
      run: python3 .github/native-full-regression/ci.py required-controls --gate default
    - name: Run complete nonignored harness without filters
      id: full
      run: 'set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        set +e

        timeout --signal=TERM --kill-after=5s 1200 native-harness/agent-browser-tests > evidence/full-suite.log
        2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > evidence/full-suite.exit

        cat evidence/full-suite.log

        exit "$status"

        '
    - run: python3 .github/native-full-regression/ci.py results --gate default
      name: Validate every result, no missing, duplicate, filtered or new ignored tests
      id: results
      if: ${{ !cancelled() && steps.inventory.outcome == 'success' && steps.full.outcome != 'skipped' }}
    - run: python3 .github/native-full-regression/ci.py audit --gate default
      name: Collect independent custody and explicit missing/loss evidence after every outcome
      id: custody
      if: ${{ always() }}
    - run: python3 .github/native-full-regression/ci.py accept --gate default
      name: Accept only complete successful exact-source evidence
      id: accept
    - name: Preserve raw evidence including all failures and missing-capture reports
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: full-native-popup-default-${{ github.run_id }}
        path: evidence/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  full-ci-fault:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '1'
      REGRESSION_EVIDENCE: evidence
      REGRESSION_NATIVE: native
    steps:
    - *id001
    - name: Export fresh target and Cargo paths from runner shell
      shell: bash
      run: 'set -euo pipefail

        printf ''CARGO_TARGET_DIR=%s/native-full-popup-fault-target\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        printf ''CARGO_HOME=%s/native-full-popup-fault-cargo\n'' "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - run: python3 .github/native-full-regression/ci.py prepare --gate fault
      name: Reserve fresh target/cache and record producer identity
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - run: python3 .github/native-full-regression/ci.py source --gate fault
      name: Validate exact native source, lock and file bytes
    - name: Install and record exact Rust 1.99.1 toolchain
      id: toolchain
      shell: bash
      run: 'set -euo pipefail

        out="$GITHUB_WORKSPACE/$REGRESSION_EVIDENCE"

        set +e

        rustup toolchain install 1.99.1 --profile minimal > "$out/toolchain-install.log" 2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$out/toolchain-install.exit"

        cat "$out/toolchain-install.log"

        test "$status" -eq 0

        rustc +1.99.1 -Vv > "$out/rustc-version.txt" 2>&1

        cargo +1.99.1 -Vv > "$out/cargo-version.txt" 2>&1

        python3 - <<''PY_PATHS''

        import json,os,pathlib,subprocess

        names=[''rustc'',''cargo'']

        paths={name:subprocess.check_output([''rustup'',''which'',''--toolchain'',''1.99.1'',name],text=True).strip()
        for name in names}

        (pathlib.Path(os.environ[''GITHUB_WORKSPACE''])/os.environ[''REGRESSION_EVIDENCE'']/''toolchain-paths.json'').write_text(json.dumps(paths,indent=2)+''\n'')

        PY_PATHS

        python3 .github/native-full-regression/ci.py toolchain --gate fault

        '
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - name: Install exact package manager for pure projection controls
      id: projection-pnpm
      uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
        run_install: false
    - name: Install frozen workspace dependencies and record pure tool versions
      id: projection-install
      shell: bash
      run: 'set -euo pipefail

        out="$GITHUB_WORKSPACE/evidence/attribute-projection"

        mkdir "$out"

        python3 - "$out" <<''PY_INSTALL''

        import json,pathlib,sys

        out=pathlib.Path(sys.argv[1])

        (out/''install-command.json'').write_text(json.dumps([''pnpm'',''install'',''--frozen-lockfile''])+''\n'')

        PY_INSTALL

        set +e

        pnpm install --frozen-lockfile > "$out/install.log" 2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$out/install.exit"

        cat "$out/install.log"

        test "$status" -eq 0

        node --version > "$out/node-version.txt"

        pnpm --version > "$out/pnpm-version.txt"

        pnpm --filter e2e exec vitest --version > "$out/vitest-version.txt"

        python3 - "$out" <<''PY_VERSION''

        import json,pathlib,sys

        out=pathlib.Path(sys.argv[1])

        versions={k:(out/(k+''-version.txt'')).read_text().strip() for k in [''node'',''pnpm'',''vitest'']}

        (out/''versions.json'').write_text(json.dumps(versions,indent=2)+''\n'')

        PY_VERSION

        '
    - name: Run only the 23 pure attribute projection controls with locked dependencies
      id: projection-pure
      shell: bash
      run: 'set -euo pipefail

        out="$GITHUB_WORKSPACE/evidence/attribute-projection"

        python3 - "$out" <<''PY_COMMAND''

        import json,pathlib,sys

        out=pathlib.Path(sys.argv[1])

        argv=[''pnpm'',''--filter'',''e2e'',''exec'',''vitest'',''run'',''tests/unit/attribute-field-assertions.test.ts'',''--project'',''unit'',''--reporter=json'',''--outputFile=''+str(out/''raw-result.json'')]

        (out/''command.json'').write_text(json.dumps(argv)+''\n'')

        PY_COMMAND

        set +e

        pnpm --filter e2e exec vitest run tests/unit/attribute-field-assertions.test.ts --project unit --reporter=json
        --outputFile="$out/raw-result.json" > "$out/raw.log" 2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$out/run.exit"

        cat "$out/raw.log"

        exit "$status"

        '
    - name: Validate exact 23 named pure results without browser claims
      id: projection-results
      shell: bash
      run: python3 .github/native-full-regression/ci.py pure-results --gate fault
      if: ${{ !cancelled() && steps.projection-pure.outcome != 'skipped' }}
    - name: Run only the separate 40 cross-package class pure controls
      id: class-pure
      shell: bash
      if: ${{ !cancelled() && steps.projection-install.outcome == 'success' }}
      run: 'set -euo pipefail

        out="$GITHUB_WORKSPACE/evidence/class-projection"

        mkdir "$out"

        test "$(cat "$GITHUB_WORKSPACE/evidence/attribute-projection/install.exit")" = 0

        node --version > "$out/node-version.txt"

        pnpm --version > "$out/pnpm-version.txt"

        pnpm --filter e2e exec vitest --version > "$out/vitest-version.txt"

        python3 - "$out" <<''PY_CLASS_COMMAND''

        import json,pathlib,sys

        out=pathlib.Path(sys.argv[1])

        argv=[''pnpm'',''--filter'',''e2e'',''exec'',''vitest'',''run'',''--config'',''../../.github/native-full-regression/class-pure.config.ts'',''--reporter=json'',''--outputFile=''+str(out/''raw-result.json'')]

        (out/''command.json'').write_text(json.dumps(argv)+''\n'')

        versions={k:(out/(k+''-version.txt'')).read_text().strip() for k in [''node'',''pnpm'',''vitest'']}

        (out/''versions.json'').write_text(json.dumps(versions,indent=2)+''\n'')

        PY_CLASS_COMMAND

        set +e

        pnpm --filter e2e exec vitest run --config ../../.github/native-full-regression/class-pure.config.ts
        --reporter=json --outputFile="$out/raw-result.json" > "$out/raw.log" 2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$out/run.exit"

        cat "$out/raw.log"

        exit "$status"

        '
    - name: Validate separate class 40 exact names and raw evidence
      id: class-results
      shell: bash
      if: ${{ !cancelled() && steps.class-pure.outcome != 'skipped' }}
      run: python3 .github/native-full-regression/ci.py class-results --gate fault
    - name: Exact source JavaScript nine bounded negative and positive controls
      run: node scripts/ci/check-selector-taxonomy.cjs native/cli/src/native/client_observation/selector_query.js
    - name: Compile fresh exact ci-profile full test harness
      id: compile
      shell: bash
      run: 'set -euo pipefail

        out="$GITHUB_WORKSPACE/$REGRESSION_EVIDENCE"

        cd native/cli

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS

        argv=(cargo +1.99.1 test --locked --profile ci --timings --no-default-features --features acceptance-faults
        --bin agent-browser -j1 --no-run --message-format=json)

        printf ''%q '' "${argv[@]}" > "$out/compiler-argv.txt"

        printf ''\n'' >> "$out/compiler-argv.txt"

        set +e

        "${argv[@]}" > "$out/harness.jsonl" 2> "$out/harness-build.log"

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$out/harness-build.exit"

        cat "$out/harness-build.log"

        exit "$status"

        '
    - run: python3 .github/native-full-regression/ci.py binary --gate fault
      name: Select only compiler-proven fresh exact-profile executable
      id: binary
    - name: Retain exact binary provenance and Cargo timings
      run: 'set -euo pipefail

        harness="$(cat evidence/harness.path)"

        mkdir native-harness

        cp "$harness" native-harness/agent-browser-tests

        printf ''%s\n'' "$NATIVE_SOURCE_SHA" > native-harness/native-source.sha

        printf ''%s\n'' "$NATIVE_SOURCE_TREE" > native-harness/native-source.tree

        printf ''%s\n'' acceptance-faults > native-harness/features.txt

        printf ''%s\n'' "$GITHUB_RUN_ID" > native-harness/producer-run.id

        (cd native-harness; sha256sum agent-browser-tests > SHA256SUMS)

        mkdir evidence/cargo-timings

        cp -a "$CARGO_TARGET_DIR/cargo-timings/." evidence/cargo-timings/

        cp native-harness/SHA256SUMS evidence/copied-harness.SHA256SUMS

        '
    - name: Collect all tests and exact ignored set without filters
      id: collect
      run: 'set -euo pipefail

        set +e

        native-harness/agent-browser-tests --list > evidence/all-tests.list 2> evidence/all-tests.stderr.log

        all_status=$?

        printf ''%s\n'' "$all_status" > evidence/all-tests.exit

        native-harness/agent-browser-tests --ignored --list > evidence/ignored-tests.list 2> evidence/ignored-tests.stderr.log

        ignored_status=$?

        printf ''%s\n'' "$ignored_status" > evidence/ignored-tests.exit

        set -e

        test "$all_status" -eq 0

        test "$ignored_status" -eq 0

        '
    - run: python3 .github/native-full-regression/ci.py inventory --gate fault
      name: Require exact source-derived collection and reviewed ignored names
      id: inventory
    - name: Require original 43 and new 20 controls in the complete nonignored inventory
      id: required-controls
      shell: bash
      run: python3 .github/native-full-regression/ci.py required-controls --gate fault
    - name: Run complete nonignored harness without filters
      id: full
      run: 'set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        set +e

        timeout --signal=TERM --kill-after=5s 1200 native-harness/agent-browser-tests > evidence/full-suite.log
        2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > evidence/full-suite.exit

        cat evidence/full-suite.log

        exit "$status"

        '
    - run: python3 .github/native-full-regression/ci.py results --gate fault
      name: Validate every result, no missing, duplicate, filtered or new ignored tests
      id: results
      if: ${{ !cancelled() && steps.inventory.outcome == 'success' && steps.full.outcome != 'skipped' }}
    - name: Rerun new 20 exact controls on the already compiled fault harness (not extra coverage)
      id: new-native-exact
      shell: bash
      run: 'set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        harness="$(cat evidence/harness.path)"

        set +e

        python3 scripts/ci/run-optional-observe-tests.py "$harness" evidence/new-native-exact-inventory.json
        evidence/new-native-exact > evidence/new-native-exact.log 2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > evidence/new-native-exact.exit

        cat evidence/new-native-exact.log

        exit "$status"

        '
      if: ${{ !cancelled() && steps.binary.outcome == 'success' && steps.required-controls.outcome == 'success'
        }}
    - name: Validate new exact raw logs against compiler provenance and full inventory
      id: new-native-exact-results
      shell: bash
      run: python3 .github/native-full-regression/ci.py exact-results --gate fault
