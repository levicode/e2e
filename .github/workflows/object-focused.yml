name: OBJECT screenshot focused diagnosis
on:
  push:
    branches: [diagnostic/object-hidden]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-browser-adapter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Fork-portable: no paid runner, credentials, LLM, publish, or deploy access.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      E2E_TELEMETRY_DISABLED: '1'
      E2E_CHROMIUM_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Fast platform-local unit feedback precedes expensive native compilation.
      - run: pnpm --filter e2e build
      - run: pnpm --filter @e2e-dev/web build
      - run: pnpm --filter @e2e-dev/mobile build
      - run: pnpm --filter e2e typecheck
      - run: pnpm --filter e2e test:unit
      - id: adapter-build
        run: pnpm --filter @e2e-dev/agent-browser build
      - run: pnpm --filter @e2e-dev/agent-browser typecheck
      - run: pnpm exec oxlint packages/agent-browser/src packages/agent-browser/tests packages/e2e/src packages/e2e/tests
      - run: pnpm --filter @e2e-dev/agent-browser test
      - name: Validate source lock and checkout refusal cases
        run: node --test packages/agent-browser/tests/native-source.test.ts
      - name: Install pinned browser for fixtures
        run: |
          pnpm --filter @e2e-dev/web exec playwright-core install --with-deps chromium
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -1)
          test -x "$CHROME"
          echo "E2E_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
      - name: Real screenshot regressions without rebuilding unchanged native code
        run: node --test --test-name-pattern '^HTML OBJECT' packages/agent-browser/tests/state-pixels.integration.ts
