# Opt-in candidate validation only: no release, npm publication or cross-platform evidence reuse.
# Dedicated opt-in push supports first use before default-branch workflow registration.
name: native macOS installed candidate (not full acceptance or release)
on:
  push:
    branches: [ci/s22-repair-macos-installed-20261031]
  workflow_dispatch:
    inputs:
      native_sha:
        description: Exact reviewed public 40-character integrated commit in levicode/agent-browser
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: native-macos-candidate-${{ github.ref }}-${{ inputs.native_sha }}
  cancel-in-progress: false
jobs:
  installed-candidate:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            rust_host: aarch64-apple-darwin
            macho_arch: arm64
          - runner: macos-15-intel
            arch: x64
            rust_host: x86_64-apple-darwin
            macho_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '1'
      RUSTUP_TOOLCHAIN: stable
      E2E_TELEMETRY_DISABLED: '1'
      E2E_UPDATE_CHECK_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      - name: Freeze exact source and native architecture
        id: source
        env:
          INPUT_NATIVE_SHA: ${{ inputs.native_sha }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/native-candidate "$RUNNER_TEMP/native-candidate-home" "$RUNNER_TEMP/native-candidate-bin"
          sw_vers > .artifacts/native-candidate/macos-version.txt
          uname -a > .artifacts/native-candidate/macos-host.txt
          date -u > .artifacts/native-candidate/started-at-utc.txt
          sysctl hw.memsize hw.logicalcpu > .artifacts/native-candidate/macos-resources.txt
          df -h "$RUNNER_TEMP" > .artifacts/native-candidate/runner-disk.txt
          node -p 'JSON.stringify({platform:process.platform,architecture:process.arch,version:process.version})' > .artifacts/native-candidate/node-host.json
          test "$RUNNER_OS" = macOS
          test "$(node -p 'process.platform')" = darwin
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
          translated="$(sysctl -in sysctl.proc_translated 2>/dev/null || true)"
          test "$translated" != 1
          if test "$EXPECTED_ARCH" = arm64; then test "$(uname -m)" = arm64; else test "$(uname -m)" = x86_64; fi
          node scripts/acceptance/candidate-revision.ts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > .artifacts/native-candidate/e2e-source.txt
          shasum -a 256 .github/workflows/native-macos-candidate.yml > .artifacts/native-candidate/workflow-sha256.txt
          # Keep the runner's installed rustup toolchains and absolute proxy paths across HOME isolation.
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          test -d "$rustup_home"
          case "$rustup_home" in /*) ;; *) exit 1 ;; esac
          for tool in rustup cargo rustc pnpm; do
            executable="$(command -v "$tool")"
            test -x "$executable"
            dirname "$executable" >> "$GITHUB_PATH"
            printf '%s=%s\n' "$tool" "$executable"
          done > .artifacts/native-candidate/runner-tool-paths.txt
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/native-candidate-target" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/native-candidate-cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$rustup_home" >> "$GITHUB_ENV"
          echo "HOME=$RUNNER_TEMP/native-candidate-home" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/native-candidate-playwright" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: levicode/agent-browser
          ref: ${{ steps.source.outputs.sha }}
          path: .artifacts/native-source
          persist-credentials: false
      - name: Build actual public packages
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Test fail-closed Mac candidate orchestration on this host
        run: node --test scripts/acceptance/candidate-macos.test.ts scripts/acceptance/installed-chromium.test.ts
      - name: Require the native host toolchain after HOME isolation
        env:
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          test "$(rustc -Vv | sed -n 's/^host: //p')" = "$EXPECTED_RUST_HOST"
          rustc -Vv > .artifacts/native-candidate/native-rustc-version.txt
          cargo -Vv > .artifacts/native-candidate/native-cargo-version.txt
          pnpm --version > .artifacts/native-candidate/pnpm-version.txt
          printf 'HOME=%s\nCARGO_HOME=%s\nRUSTUP_HOME=%s\n' "$HOME" "$CARGO_HOME" "$RUSTUP_HOME" > .artifacts/native-candidate/isolated-tool-homes.txt
      - name: Verify bundled-only native installation and launcher selection
        working-directory: .artifacts/native-source
        run: |
          set -euo pipefail
          canonical_tmp="$(node -p 'require("node:fs").realpathSync(require("node:os").tmpdir())')"
          # Prove the default and canonical namespaces are the same owned physical directory.
          node - "$canonical_tmp" "$GITHUB_WORKSPACE/.artifacts/native-candidate/tempdir-alias.json" <<'TEMPDIR_ALIAS_PROOF'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const original = require('node:os').tmpdir();
          const canonical = process.argv[2];
          assert.equal(fs.realpathSync(original), canonical, 'canonical temp directory must resolve the original default');
          const identity = p => { const s = fs.statSync(p, { bigint: true }); return { dev: String(s.dev), ino: String(s.ino), uid: String(s.uid), directory: s.isDirectory() }; };
          assert.deepEqual(identity(original), identity(canonical));
          assert.equal(identity(original).directory, true);
          const probe = fs.mkdtempSync(path.join(original, 'native-temp-alias-proof-'));
          try {
            const aliasFile = path.join(probe, 'owned-probe');
            const canonicalFile = path.join(canonical, path.basename(probe), 'owned-probe');
            fs.writeFileSync(aliasFile, 'same-physical-owned-file', { flag: 'wx', mode: 0o600 });
            assert.equal(fs.readFileSync(canonicalFile, 'utf8'), 'same-physical-owned-file');
            assert.deepEqual(identity(aliasFile), identity(canonicalFile));
            const proof = { schemaVersion: 1, original, canonical, directoryIdentity: identity(original), ownedProbeIdentity: identity(aliasFile), samePhysicalDirectory: true, samePhysicalOwnedFile: true, nativeSourceModified: false };
            fs.writeFileSync(process.argv[3], JSON.stringify(proof, null, 2) + '\n', { flag: 'wx' });
          } finally { fs.rmSync(probe, { recursive: true, force: true }); }
          TEMPDIR_ALIAS_PROOF
          TMPDIR="$canonical_tmp" node --test test/launcher.test.mjs test/postinstall.test.mjs
      - name: Check all compilation boundaries independently
        working-directory: .artifacts/native-source/cli
        env:
          EXPECTED_NATIVE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          test "$(git rev-parse HEAD)" = "$EXPECTED_NATIVE_SHA"
          test -z "$(git status --porcelain)"
          out="$GITHUB_WORKSPACE/.artifacts/native-candidate"
          git rev-parse HEAD HEAD^{tree} > "$out/native-compile-source.txt"
          failed=0
          check_boundary() {
            local name="$1" status=0
            shift
            if "$@" > "$out/$name.log" 2>&1; then status=0; else status=$?; failed=1; fi
            printf '%s\n' "$status" > "$out/$name.exit"
            cat "$out/$name.log"
          }
          check_boundary native-format-check cargo fmt -- --check
          check_boundary native-default-clippy cargo clippy --locked --profile ci --no-default-features --all-targets -- -D warnings
          check_boundary native-feature-check cargo check --locked --profile ci --no-default-features --features acceptance-faults --tests
          check_boundary native-proxy-check cargo check --locked --profile ci --no-default-features --features acceptance-faults --test client-proxy-fixture
          test "$failed" -eq 0
      - name: Build clean production runtime and exact harnesses
        working-directory: .artifacts/native-source/cli
        env:
          EXPECTED_MACHO_ARCH: ${{ matrix.macho_arch }}
          EXPECTED_NATIVE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          test "$(git rev-parse HEAD)" = "$EXPECTED_NATIVE_SHA"
          test -z "$(git status --porcelain)"
          out="$GITHUB_WORKSPACE/.artifacts/native-candidate"
          cargo build --locked --profile ci --no-default-features --message-format=json > "$out/production-compiler.jsonl" 2> "$out/production-build.stderr.log"
          # Select the exact successful production artifact before compiling any test harness.
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { copyFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const rows = readFileSync(join(process.env.GITHUB_WORKSPACE, '.artifacts/native-candidate/production-compiler.jsonl'), 'utf8').trim().split('\n').map(line => JSON.parse(line));
          const completed = rows.filter(row => row.reason === 'build-finished');
          assert.equal(completed.length, 1); assert.equal(completed[0].success, true);
          const binaries = rows.filter(row => row.reason === 'compiler-artifact' && row.target?.name === 'agent-browser' && row.profile?.test === false);
          assert.equal(binaries.length, 1);
          const binary = binaries[0];
          assert.deepEqual(binary.features, []); assert.deepEqual(binary.target.kind, ['bin']);
          assert.equal(binary.manifest_path, join(process.cwd(), 'Cargo.toml')); assert.equal(binary.target.src_path, join(process.cwd(), 'src/main.rs'));
          assert.equal(binary.executable, join(process.env.CARGO_TARGET_DIR, 'ci/agent-browser'));
          copyFileSync(binary.executable, join(process.env.RUNNER_TEMP, 'native-candidate-bin/production'));
          NODE
          cargo test --locked --profile ci --no-default-features --no-run --message-format=json > "$out/compiler.jsonl" 2> "$out/default-test-build.stderr.log"
          file "$RUNNER_TEMP/native-candidate-bin/production" > "$GITHUB_WORKSPACE/.artifacts/native-candidate/production-file.txt"
          test "$(lipo -archs "$RUNNER_TEMP/native-candidate-bin/production")" = "$EXPECTED_MACHO_ARCH"
          shasum -a 256 "$RUNNER_TEMP/native-candidate-bin/production" > "$GITHUB_WORKSPACE/.artifacts/native-candidate/production-sha256.txt"
          cmp "$CARGO_TARGET_DIR/ci/agent-browser" "$RUNNER_TEMP/native-candidate-bin/production"
      - name: Install and identify the exact official Chromium and recording codecs
        env:
          EXPECTED_MACHO_ARCH: ${{ matrix.macho_arch }}
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
          ffmpeg -version > .artifacts/native-candidate/ffmpeg-version.txt
          ffprobe -version > .artifacts/native-candidate/ffprobe-version.txt
          "$RUNNER_TEMP/native-candidate-bin/production" install
          chrome="$(node scripts/acceptance/installed-chromium.ts "$HOME/.agent-browser/browsers" .artifacts/native-candidate/chromium-executable.json)"
          file "$chrome" > .artifacts/native-candidate/chromium-file.txt
          test "$(lipo -archs "$chrome")" = "$EXPECTED_MACHO_ARCH"
          "$chrome" --version > .artifacts/native-candidate/chromium-version.txt
          echo "E2E_CHROMIUM_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
      - name: Negotiate all required production capabilities
        run: |
          node --input-type=module -e "import { REQUIRED_CAPABILITIES } from './packages/web/dist/native/capabilities.js'; process.stdout.write(JSON.stringify(REQUIRED_CAPABILITIES))" > .artifacts/native-candidate/required-capabilities.json
          node scripts/acceptance/probe-native.ts "$RUNNER_TEMP/native-candidate-bin/production" .artifacts/native-candidate/required-capabilities.json .artifacts/native-candidate/negotiation.json
      - name: Run native baseline and hosted producer contracts independently
        env:
          EXPECTED_NATIVE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          failed=0
          node scripts/acceptance/candidate-native.ts baseline .artifacts/native-source "$CARGO_TARGET_DIR" .artifacts/native-candidate/compiler.jsonl .artifacts/native-candidate "$EXPECTED_NATIVE_SHA" || failed=1
          node scripts/acceptance/candidate-native.ts browser .artifacts/native-source "$CARGO_TARGET_DIR" .artifacts/native-candidate/compiler.jsonl .artifacts/native-candidate "$EXPECTED_NATIVE_SHA" || failed=1
          test "$failed" -eq 0
      - name: Seal platform-matched native producer
        env:
          EXPECTED_NATIVE_SHA: ${{ steps.source.outputs.sha }}
          CANDIDATE_WORKFLOW_FILE: .github/workflows/native-macos-candidate.yml
        run: node scripts/acceptance/candidate-producer.ts .artifacts/native-source "$RUNNER_TEMP/native-candidate-bin/production" .artifacts/native-candidate "$EXPECTED_NATIVE_SHA"
      - name: Assemble an unpublished same-architecture candidate bundle
        id: bundle
        run: |
          set -euo pipefail
          node scripts/acceptance/package-bundle.ts "$RUNNER_TEMP/native-candidate-bin/production" .artifacts/native-candidate/producer.json .artifacts/native-candidate/negotiation.json "$RUNNER_TEMP/native-candidate-bundle"
          digest="$(node --input-type=module -e "import {readFileSync} from 'node:fs';import{createHash}from'node:crypto';console.log(createHash('sha256').update(readFileSync(process.argv[1])).digest('hex'))" "$RUNNER_TEMP/native-candidate-bundle/manifest.json")"
          printf '%s\n' "$digest" > .artifacts/native-candidate/trusted-manifest-sha256.txt
          echo "manifest_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify real installed consumer without runtime overrides
        id: installed
        run: node scripts/acceptance/candidate-installed.ts "$RUNNER_TEMP/native-candidate-bundle" "${{ steps.bundle.outputs.manifest_sha256 }}" "$RUNNER_TEMP/native-candidate-consumer" .artifacts/native-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: macos-installed-evidence-darwin-${{ matrix.arch }}-${{ github.sha }}-${{ steps.source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/native-candidate/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        with:
          name: macos-installed-candidate-darwin-${{ matrix.arch }}-${{ github.sha }}-${{ steps.source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-candidate-bundle/
          if-no-files-found: error
          retention-days: 7
