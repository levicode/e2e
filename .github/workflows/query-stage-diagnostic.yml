        ) 2>&1 | tee "evidence/dependencies.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/dependencies.exit"

        exit "$s"

        '
    - name: Download exact same-run ordinary artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.native-runtime.outputs.artifact-id }}
        path: ${{ runner.temp }}/ci-native-runtime
        merge-multiple: true
      id: restore
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
    - name: Verify exact same-run source host compiler executable
      id: verify_runtime
      env:
        EXPECTED_MANIFEST_SHA256: ${{ needs.native-runtime.outputs.manifest-sha256
          }}
        PRODUCER_ATTEMPT: ${{ needs.native-runtime.outputs.run-attempt }}
      run: 'set -euo pipefail

        node scripts/ci/native-runtime.ts verify "$RUNNER_TEMP/ci-native-runtime"
        "$EXPECTED_MANIFEST_SHA256" "$PRODUCER_ATTEMPT"


        cp "$RUNNER_TEMP/ci-native-runtime/manifest.json" evidence/native-runtime.manifest.json

        '
      if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
    - name: native-browser-codecs
      id: native_browser_codecs
      run: "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY\
        \ OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\n\"$E2E_AGENT_BROWSER_EXECUTABLE\"\
        \ install --with-deps\nif ! command -v ffmpeg >/dev/null || ! command -v ffprobe\
        \ >/dev/null; then\n sudo apt-get update\n sudo apt-get install -y ffmpeg\n\
        fi\nffmpeg -version\nffprobe -version\n) 2>&1 | tee \"evidence/native-browser-codecs.log\"\
        \ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/native-browser-codecs.exit\"\
        \nexit \"$s\"\n"
      if: ${{ !cancelled() && steps.verify_runtime.outcome == 'success' }}
    - name: complete-build
      id: complete_build
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm run build

        ) 2>&1 | tee "evidence/complete-build.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/complete-build.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
    - name: public-browser-install
      id: public_browser_install
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        node packages/web/dist/bin.js install chromium --with-deps

        ) 2>&1 | tee "evidence/public-browser-install.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/public-browser-install.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.complete_build.outcome == 'success' && steps.native_browser_codecs.outcome
        == 'success' }}
    - name: Verify actual shared Chrome 156.0.8078.73 and expose only diagnostic path
      id: chrome_identity
      run: 'set -euo pipefail

        python3 scripts/ci/check-focused-chrome.py

        python3 - <<''PY_CHROME''

        import json,pathlib,os

        m=json.load(open(''evidence/focused-chrome.json''))

        assert m[''version'']==''Google Chrome for Testing 156.0.8078.73'',m

        assert m[''sha256'']==''8ea0ecbfc1ac0dc0e957de722babf9b72f8e86cb8643308ff17a491d59bdaa80'',m

        p=pathlib.Path(m[''chrome'']);assert p.is_absolute() and p.is_file() and ''\n''
        not in str(p)

        with open(os.environ[''GITHUB_ENV''],''a'') as f:f.write(''E2E_CHAIN_CHROME_EXECUTABLE=''+str(p)+''\n'')

        PY_CHROME

        '
