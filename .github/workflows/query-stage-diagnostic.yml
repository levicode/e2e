        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: query-stage-login-query-evidence
        path: 'evidence/

          apps/testbed/.e2e/report.json

          apps/testbed/.e2e/results/'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    needs:
    - native-runtime
