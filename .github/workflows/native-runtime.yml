name: build source-pinned native runtime for ordinary CI

# Bootstrap only. Full candidate and installed-no-override acceptance stay separate.
on:
  workflow_call:
    outputs:
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      run-attempt:
        value: ${{ jobs.build.outputs.run-attempt }}
      manifest-sha256:
        value: ${{ jobs.build.outputs.manifest-sha256 }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.build.outputs.manifest-sha256 }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - id: pin
        run: node scripts/ci/native-runtime.ts pin
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: levicode/agent-browser
          ref: ${{ steps.pin.outputs.sha }}
          path: .artifacts/ci-native-source
          persist-credentials: false
      - name: Install native build toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build and seal the exact clean production runtime
        id: build
        env:
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/ci/native-runtime.ts build .artifacts/ci-native-source "$RUNNER_TEMP/ci-native-target" "$RUNNER_TEMP/ci-native-artifact"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: ci-native-runtime-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-native-artifact/
          if-no-files-found: error
          retention-days: 7
