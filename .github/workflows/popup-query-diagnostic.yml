        PY_CHROME

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 8073432a23771e413b819698d716f083cc50607d
        path: baseline
        persist-credentials: false
    - name: Verify clean baseline before any baseline generated files
      run: 'set -euo pipefail

        test -z "$(git -C baseline status --porcelain)"

        git -C baseline rev-parse HEAD > evidence/baseline.sha

        git -C baseline rev-parse HEAD^{tree} > evidence/baseline.tree

        '
    - name: Build exact original source
      working-directory: baseline
      run: 'set -euo pipefail

        pnpm install --frozen-lockfile

