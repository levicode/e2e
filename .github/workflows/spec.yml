name: spec

# The ruleset requires `spec gate` alone, so a job added here gates merges
# once it is listed in the gate's `needs`.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# The repository's own runs are not usage: the CLI sends no telemetry from CI here.
env:
  E2E_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-runtime:
    uses: ./.github/workflows/native-runtime.yml

  check:
    needs: native-runtime
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch and the merge base, for the testbed's --changed-since.
          fetch-depth: 0
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Dead code (fallow)
        run: pnpm check:dead-code
      - name: Typecheck packages
        run: pnpm typecheck
      - name: Error code reference
        run: pnpm docs:check-errors
      - name: Peer ranges on the runner
        run: pnpm check:peer-ranges
      - name: Changeset bumps on 0.x packages
        run: pnpm check:changeset-bumps
      - name: No install scripts in published dependency trees
        run: pnpm check:install-scripts
      - name: Plugin package matches its sources
        run: pnpm plugins:check
      - name: MCP Registry entry matches the runner
        run: pnpm mcp-server:check
      # The registry rejects an invalid entry only at publish, from a release
      # tag that can no longer change.
      - uses: ./.github/actions/mcp-publisher
      - name: MCP Registry accepts the entry
        run: '"$RUNNER_TEMP/mcp-publisher" validate packages/e2e/server.json'
      - name: Agent skill scripts
        run: |
          pnpm exec tsc -p .dev/skills/babysit/scripts
          node --test .dev/skills/babysit/scripts/pr-status.test.ts
      - name: Set up source-pinned native runtime
        uses: ./.github/actions/native-runtime
        with:
          artifact-id: ${{ needs.native-runtime.outputs.artifact-id }}
          manifest-sha256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
          run-attempt: ${{ needs.native-runtime.outputs.run-attempt }}
      - name: Install browsers
        run: node packages/web/dist/bin.js install chromium --with-deps
      # On a pull request, Jev leaves out the tests the change can't affect;
      # the merge queue and main pass no --changed-since and run every test.
      # Without the key (a fork's pull request), every test runs.
      - name: Testbed
        run: pnpm --filter @e2e-dev/testbed test ${{ github.event_name == 'pull_request' && format('--changed-since origin/{0}', github.base_ref) || '' }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

  test:
    needs: native-runtime
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The newest release of each line, and the floors in engines.node.
        node: [22, 24, 26, 22.22.3, 24.8.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # A major alone resolves to the runner's cached release, which can
          # sit below the patch floor in engines.node (22.22.3).
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up source-pinned native runtime
        uses: ./.github/actions/native-runtime
        with:
          artifact-id: ${{ needs.native-runtime.outputs.artifact-id }}
          manifest-sha256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
          run-attempt: ${{ needs.native-runtime.outputs.run-attempt }}
      - name: Install browsers
        run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
      - name: Bind installed Chromium and isolated synthetic fixture evidence
        run: |
          set -euo pipefail
          pnpm --filter @e2e-dev/web exec node --input-type=module <<'FIXTURES'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { chromium } from 'playwright-core';
          const installed = chromium.executablePath();
          assert.ok(path.isAbsolute(installed));
          const executable = fs.realpathSync(installed);
          assert.ok(fs.lstatSync(executable).isFile());
          fs.accessSync(executable, fs.constants.X_OK);
          const temp = fs.realpathSync(process.env.RUNNER_TEMP);
          const root = fs.mkdtempSync(path.join(temp, 'spec-fixtures-'));
          fs.chmodSync(root, 0o700);
          const owned = directory => {
            const info = fs.lstatSync(directory);
            assert.ok(info.isDirectory() && !info.isSymbolicLink());
            assert.equal(fs.realpathSync(directory), directory);
            assert.equal(info.uid, process.getuid());
            assert.equal(info.mode & 0o777, 0o700);
          };
          owned(root);
          for (const name of ['chains', 'interop']) {
            const directory = path.join(root, name);
            fs.mkdirSync(directory, { mode: 0o700 });
            owned(directory);
          }
          const values = {
            E2E_SPEC_EVIDENCE_DIR: root,
            E2E_CHAIN_CHROME_EXECUTABLE: executable,
            E2E_POPUP_SWIPE_CHROME_EXECUTABLE: executable,
            E2E_CHAIN_EVIDENCE_DIR: path.join(root, 'chains'),
            E2E_INTEROP_EVIDENCE_DIR: path.join(root, 'interop'),
            E2E_INTEROP_FILE_SCOPED_EVIDENCE: '1',
          };
          for (const value of Object.values(values)) assert.ok(!/[\r\n]/.test(value));
          fs.writeFileSync(path.join(root, 'binding.json'), JSON.stringify({
            sourceCommit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT, node: process.version,
            installed, executable,
            chromeVersion: execFileSync(executable, ['--version'], { encoding: 'utf8' }).trim(),
            chromeSha256: createHash('sha256').update(fs.readFileSync(executable)).digest('hex'),
          }, null, 2), { flag: 'wx', mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(''));
          FIXTURES
      - name: Unit and integration tests
        run: pnpm test
      - name: Retain synthetic fixture evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spec-fixtures-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ env.E2E_SPEC_EVIDENCE_DIR || format('{0}/spec-fixtures-not-created', runner.temp) }}
            packages/e2e/.e2e/popup-init-order-borrowed
            packages/e2e/.e2e/popup-swipe-borrowed-pair

  # A new user's first install of the packed packages, which pnpm 11 and
  # later fail on any dependency build script (scripts/install-smoke.ts).
  install:
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pnpm: [11, 12]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Fresh install with pnpm ${{ matrix.pnpm }}
        run: node scripts/install-smoke.ts ${{ matrix.pnpm }}

  # The one check the ruleset requires from this workflow. A skipped job
  # passes (the change cannot reach it); a failed or cancelled one fails it.
  gate:
    name: spec gate
    needs: [native-runtime, check, test, install]
    if: ${{ always() }}
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Require every job to pass or skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) \(.value.result)"] | join(", ")' <<< "$RESULTS")"
          [ -z "$failed" ] || { echo "::error::$failed"; exit 1; }
