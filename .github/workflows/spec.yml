name: spec

# The ruleset requires `spec gate` alone, so a job added here gates merges
# once it is listed in the gate's `needs`.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  # Re-run the exact head for the per-slot stability evidence a ticket may
  # ask for without pushing a commit or using rerun.
  workflow_dispatch:

# The repository's own runs are not usage: the CLI sends no telemetry from CI here.
env:
  E2E_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

concurrency:
  # Independent dispatch runs collect per-slot evidence in parallel; a pull
  # request run stays cancellable.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-runtime:
    uses: ./.github/workflows/native-runtime.yml
    with:
      fault-fixtures: true

  check:
    needs: native-runtime
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch and the merge base, for the testbed's --changed-since.
          fetch-depth: 0
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Dead code (fallow)
        run: pnpm check:dead-code
      - name: Typecheck packages
        run: pnpm typecheck
      - name: UAT verification app tests
        run: pnpm --filter @e2e-dev/uat-verification test
      - name: Error code reference
        run: pnpm docs:check-errors
      - name: Peer ranges on the runner
        run: pnpm check:peer-ranges
      - name: Changeset bumps on 0.x packages
        run: pnpm check:changeset-bumps
      - name: No install scripts in published dependency trees
        run: pnpm check:install-scripts
      - name: Plugin package matches its sources
        run: pnpm plugins:check
      - name: MCP Registry entry matches the runner
        run: pnpm mcp-server:check
      # The registry rejects an invalid entry only at publish, from a release
      # tag that can no longer change. The publisher tarball is an external
      # download: it retries with backoff, and when the CDN stays unavailable
      # the check only loses the live-registry opinion, not the product gate.
      # `mcp-server:check` above still gates the entry's name and version, and
      # mcp-registry.yml validates it again at publish time.
      - uses: ./.github/actions/mcp-publisher
        id: mcp_publisher
        with:
          required: false
      - name: MCP Registry accepts the entry
        if: ${{ steps.mcp_publisher.outputs.available == 'true' }}
        run: '"$RUNNER_TEMP/mcp-publisher" validate packages/e2e/server.json'
      - name: MCP Registry publisher unavailable
        if: ${{ steps.mcp_publisher.outputs.available != 'true' }}
        run: echo "::warning::The pinned MCP Registry publisher could not be downloaded; the entry was not checked against the live registry. pnpm mcp-server:check still gates its name and version, and mcp-registry.yml validates it again at publish time."
      - name: Agent skill and CI script tests
        run: |
          pnpm exec tsc -p .dev/skills/babysit/scripts
          node --test .dev/skills/babysit/scripts/pr-status.test.ts
          node --test scripts/ci/spec-slot-summary.test.mjs
          node --test scripts/ci/flake-retry.test.mjs
          node --test scripts/ci/bind-popup-evidence.test.mjs
          node --test scripts/setup-source-native.test.mjs
      - name: Set up source-pinned native runtime
        uses: ./.github/actions/native-runtime
        with:
          artifact-id: ${{ needs.native-runtime.outputs.artifact-id }}
          manifest-sha256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
          run-attempt: ${{ needs.native-runtime.outputs.run-attempt }}
      - name: Install browsers
        run: node packages/web/dist/bin.js install chromium --with-deps
      # On a pull request, Jev leaves out the tests the change can't affect;
      # the merge queue and main pass no --changed-since and run every test.
      # Without the key (a fork's pull request), every test runs.
      - name: Testbed
        run: pnpm --filter @e2e-dev/testbed test ${{ github.event_name == 'pull_request' && format('--changed-since origin/{0}', github.base_ref) || '' }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}

  test:
    needs: native-runtime
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    # The bounded known-flake retry reruns a slot's failed files after its
    # first attempt; the timeout covers both.
    timeout-minutes: 45
    permissions:
      contents: read
      # Read the previous run's slot job and its failure annotations at the
      # same head, which is what turns a second consecutive listed failure
      # deterministic. Check-run annotations need checks: read.
      actions: read
      checks: read
    strategy:
      fail-fast: false
      matrix:
        # The newest release of each line, and the floors in engines.node.
        node: [22, 24, 26, 22.22.3, 24.8.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # A major alone resolves to the runner's cached release, which can
          # sit below the patch floor in engines.node (22.22.3).
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up source-pinned native runtime
        uses: ./.github/actions/native-runtime
        with:
          artifact-id: ${{ needs.native-runtime.outputs.artifact-id }}
          manifest-sha256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
          run-attempt: ${{ needs.native-runtime.outputs.run-attempt }}
      - name: Install browsers
        run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
      - name: Download the separate source-pinned fault fixture artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.native-runtime.outputs.fault-artifact-id }}
          path: ${{ runner.temp }}/ci-native-fault-runtime
          merge-multiple: true
      - name: Bind installed Chromium and isolated synthetic fixture evidence
        run: |
          set -euo pipefail
          pnpm --filter @e2e-dev/web exec node --input-type=module <<'FIXTURES'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { chromium } from 'playwright-core';
          const installed = chromium.executablePath();
          assert.ok(path.isAbsolute(installed));
          const executable = fs.realpathSync(installed);
          assert.ok(fs.lstatSync(executable).isFile());
          fs.accessSync(executable, fs.constants.X_OK);
          const temp = fs.realpathSync(process.env.RUNNER_TEMP);
          const root = fs.mkdtempSync(path.join(temp, 'spec-fixtures-'));
          fs.chmodSync(root, 0o700);
          const owned = directory => {
            const info = fs.lstatSync(directory);
            assert.ok(info.isDirectory() && !info.isSymbolicLink());
            assert.equal(fs.realpathSync(directory), directory);
            assert.equal(info.uid, process.getuid());
            assert.equal(info.mode & 0o777, 0o700);
          };
          owned(root);
          for (const name of ['chains', 'interop']) {
            const directory = path.join(root, name);
            fs.mkdirSync(directory, { mode: 0o700 });
            owned(directory);
          }
          let cleanupCapture;
          let onActionCapture;
          try {
            const directory = fs.mkdtempSync(path.join(temp, 'spec-case-cleanup-'));
            fs.chmodSync(directory, 0o700);
            owned(directory);
            const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE);
            const hash = file => createHash('sha256').update(fs.readFileSync(path.join(workspace, file))).digest('hex');
            fs.writeFileSync(path.join(directory, 'binding.json'), JSON.stringify({
              schemaVersion: 1, sourceCommit: process.env.GITHUB_SHA,
              sourceTree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
              run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, nodeVersion: process.version,
              nativeCommit: JSON.parse(fs.readFileSync(path.join(workspace, '.github/native-candidate.json'), 'utf8')).commit,
              nativeSha256: createHash('sha256').update(fs.readFileSync(fs.realpathSync(process.env.E2E_AGENT_BROWSER_EXECUTABLE))).digest('hex'),
              collectorSha256: hash('scripts/ci/collect-spec-hung-cleanup.py'),
              validatorSha256: hash('scripts/ci/check-engine-secrets-native-custody.py'),
              schemaSha256: hash('scripts/ci/native-closed-trace-schema.json'),
              testSha256: hash('packages/web/tests/integration/cdp-recovery.test.ts'),
              helperSha256: hash('packages/web/tests/helpers/case-cleanup-capture.ts'),
            }), { flag: 'wx', mode: 0o600 });
            cleanupCapture = directory;
          } catch { console.error('SPEC_HUNG_CLEANUP_CAPTURE_UNAVAILABLE'); }
          try {
            const directory = fs.mkdtempSync(path.join(temp, 'spec-on-action-'));
            fs.chmodSync(directory, 0o700); owned(directory);
            const workspace = fs.realpathSync(process.env.GITHUB_WORKSPACE);
            const hash = file => createHash('sha256').update(fs.readFileSync(path.join(workspace, file))).digest('hex');
            const sources = {
              collectorSha256: 'scripts/ci/collect-spec-on-action.py',
              sharedCollectorSha256: 'scripts/ci/collect-spec-hung-cleanup.py',
              validatorSha256: 'scripts/ci/check-engine-secrets-native-custody.py',
              schemaSha256: 'scripts/ci/native-closed-trace-schema.json',
              testSha256: 'packages/e2e/tests/integration/agent-act-on-action.test.ts',
              helperSha256: 'packages/e2e/tests/helpers/on-action-capture.ts',
            };
            fs.writeFileSync(path.join(directory, 'binding.json'), JSON.stringify({
              schemaVersion: 1, sourceCommit: process.env.GITHUB_SHA,
              sourceTree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
              run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, nodeVersion: process.version,
              nativeCommit: JSON.parse(fs.readFileSync(path.join(workspace, '.github/native-candidate.json'), 'utf8')).commit,
              nativeSha256: createHash('sha256').update(fs.readFileSync(fs.realpathSync(process.env.E2E_AGENT_BROWSER_EXECUTABLE))).digest('hex'),
              ...Object.fromEntries(Object.entries(sources).map(([key, file]) => [key, hash(file)])),
            }), { flag: 'wx', mode: 0o600 });
            onActionCapture = directory;
          } catch { console.error('SPEC_ON_ACTION_CAPTURE_UNAVAILABLE'); }
          const chromeVersion = execFileSync(executable, ['--version'], { encoding: 'utf8' }).trim();
          const chromeSha256 = createHash('sha256').update(fs.readFileSync(executable)).digest('hex');
          const values = {
            E2E_SPEC_EVIDENCE_DIR: root,
            ...(onActionCapture === undefined ? {} : { E2E_ON_ACTION_CAPTURE_DIR: onActionCapture }),
            E2E_CHAIN_CHROME_EXECUTABLE: executable,
            E2E_POPUP_SWIPE_CHROME_EXECUTABLE: executable,
            E2E_SPEC_CHROME_VERSION: chromeVersion,
            E2E_SPEC_CHROME_SHA256: chromeSha256,
            E2E_CHAIN_EVIDENCE_DIR: path.join(root, 'chains'),
            E2E_INTEROP_EVIDENCE_DIR: path.join(root, 'interop'),
            E2E_INTEROP_FILE_SCOPED_EVIDENCE: '1',
            E2E_POPUP_DOCUMENT_DIAGNOSTIC: '1',
            ...(cleanupCapture === undefined ? {} : { E2E_CASE_CLEANUP_DIAGNOSTIC_DIR: cleanupCapture }),
          };
          for (const value of Object.values(values)) assert.ok(!/[\r\n]/.test(value));
          fs.writeFileSync(path.join(root, 'binding.json'), JSON.stringify({
            sourceCommit: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT, node: process.version,
            installed, executable, chromeVersion, chromeSha256,
            popupDocumentHelperSha256: createHash('sha256').update(fs.readFileSync(path.join(fs.realpathSync(process.env.GITHUB_WORKSPACE), 'packages/e2e/tests/helpers/popup-document-evidence.ts'))).digest('hex'),
            popupDocumentTestSha256: createHash('sha256').update(fs.readFileSync(path.join(fs.realpathSync(process.env.GITHUB_WORKSPACE), 'packages/e2e/tests/integration/web-popup-init-order.test.ts'))).digest('hex'),
            popupDocumentFixtureSha256: createHash('sha256').update(fs.readFileSync(path.join(fs.realpathSync(process.env.GITHUB_WORKSPACE), 'packages/e2e/tests/fixtures/popup-init-order/cases.txt'))).digest('hex'),
          }, null, 2), { flag: 'wx', mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(values).map(([key, value]) => `${key}=${value}\n`).join(''));
          FIXTURES
      # The native diagnostics sink opens an existing regular file and stays
      # inert without one, so an empty directory captured no settlement at all.
      # The retry writes its own pair: the first pass can fill the slot's file
      # to the sink's budget, and a rerun's receipt must not contend with it.
      - name: Prepare bounded native settlement capture
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.e2e/native-capture"
          for name in cleanup query cleanup-retry query-retry; do
            : > "$GITHUB_WORKSPACE/.e2e/native-capture/$name.jsonl"
          done
      - name: Unit and integration tests
        id: tests
        # The bounded retry below may rerun this slot's failed files once; the
        # verdict step owns the job result, so this red mark stays visible.
        continue-on-error: true
        env:
          E2E_UNSERVED_MODEL_CAPTURE: '1'
          E2E_LIFECYCLE_OPEN_CANCEL_CAPTURE: '1'
          E2E_ENGINE_SECRET_SUITE_CAPTURE: '1'
          # A wait whose deadline falls between two polls ends with a
          # one-millisecond native query. Its closed receipt names the exact
          # settlement: local cancel, native code, effects and scope state.
          E2E_SHORT_READ_DIAGNOSTIC: '1'
          # Bounded settlement capture for the two unlisted write-side
          # signatures on this pin: scalars and the failing stage only, no
          # page content. The native recorder caps each process's records.
          AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE: ${{ github.workspace }}/.e2e/native-capture/cleanup.jsonl
          AGENT_BROWSER_QUERY_DIAGNOSTIC_FILE: ${{ github.workspace }}/.e2e/native-capture/query.jsonl
          NODE_SELECTOR: ${{ matrix.node }}
          PRODUCTION_MANIFEST_SHA256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
          PRODUCTION_RUN_ATTEMPT: ${{ needs.native-runtime.outputs.run-attempt }}
          FAULT_MANIFEST_SHA256: ${{ needs.native-runtime.outputs.fault-manifest-sha256 }}
          FAULT_RUN_ATTEMPT: ${{ needs.native-runtime.outputs.fault-run-attempt }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/spec-test-${{ matrix.node }}.log"
          set +e
          (
            set -euo pipefail
            pnpm --filter e2e run build
            pnpm --filter @e2e-dev/web run build
            export E2E_PLATFORM_HANDLER_DIAGNOSTIC=1
            export E2E_CAPTURE_SOURCE_COMMIT="$(git rev-parse HEAD)"
            export E2E_CAPTURE_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
            test "$E2E_CAPTURE_SOURCE_COMMIT" = "$GITHUB_SHA"
            # A failure inside the e2e package must not hide the web package's
            # native acceptance tests (P07 among them): keep the aggregate exit
            # status while running them when the chained test script stopped early.
            node scripts/ci/spec-fixture-runtime.ts "$RUNNER_TEMP/ci-native-runtime" "$PRODUCTION_MANIFEST_SHA256" "$PRODUCTION_RUN_ATTEMPT" "$RUNNER_TEMP/ci-native-fault-runtime" "$FAULT_MANIFEST_SHA256" "$FAULT_RUN_ATTEMPT" "$E2E_SPEC_EVIDENCE_DIR/runtime" -- sh -c 'pnpm test; status=$?; if [ "$status" -ne 0 ]; then pnpm --filter @e2e-dev/web run test || status=$?; fi; exit "$status"'
          ) 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > "$RUNNER_TEMP/spec-test-${{ matrix.node }}.exit"
          exit "$status"
      # One small JSON per slot so the gate can name the slot and the failed
      # tests instead of only the job. This step never changes the verdict.
      - name: Per-slot test summary
        if: ${{ always() }}
        # Diagnostic only: the test step above owns the verdict.
        continue-on-error: true
        run: |
          node scripts/ci/spec-slot-summary.mjs collect \
            --slot "${{ matrix.node }}" \
            --log "$RUNNER_TEMP/spec-test-${{ matrix.node }}.log" \
            --exit-file "$RUNNER_TEMP/spec-test-${{ matrix.node }}.exit" \
            --job-status "${{ steps.tests.outcome }}" \
            --node-version "$(node --version)" \
            --output "$RUNNER_TEMP/spec-slot-${{ matrix.node }}.json"
      # One bounded retry for a listed signature only (docs/flake-policy.mdx,
      # scripts/ci/known-flakes.json). A failure outside the list, or a second
      # consecutive listed failure in this slot at this head, is not retried.
      - name: Bounded known-flake retry
        if: ${{ steps.tests.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_UNSERVED_MODEL_CAPTURE: '1'
          E2E_LIFECYCLE_OPEN_CANCEL_CAPTURE: '1'
          E2E_ENGINE_SECRET_SUITE_CAPTURE: '1'
          E2E_PLATFORM_HANDLER_DIAGNOSTIC: '1'
          E2E_SHORT_READ_DIAGNOSTIC: '1'
          # Bounded settlement capture for the two unlisted write-side
          # signatures on this pin: scalars and the failing stage only, no
          # page content. The native recorder caps each process's records.
          AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE: ${{ github.workspace }}/.e2e/native-capture/cleanup-retry.jsonl
          AGENT_BROWSER_QUERY_DIAGNOSTIC_FILE: ${{ github.workspace }}/.e2e/native-capture/query-retry.jsonl
          NODE_SELECTOR: ${{ matrix.node }}
          PRODUCTION_MANIFEST_SHA256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
          PRODUCTION_RUN_ATTEMPT: ${{ needs.native-runtime.outputs.run-attempt }}
          FAULT_MANIFEST_SHA256: ${{ needs.native-runtime.outputs.fault-manifest-sha256 }}
          FAULT_RUN_ATTEMPT: ${{ needs.native-runtime.outputs.fault-run-attempt }}
        run: |
          set -euo pipefail
          echo "::notice::Known-flake policy: docs/flake-policy.mdx; the list is scripts/ci/known-flakes.json"
          export PRODUCTION_RUNTIME_DIR="$RUNNER_TEMP/ci-native-runtime"
          export FAULT_RUNTIME_DIR="$RUNNER_TEMP/ci-native-fault-runtime"
          export RETRY_EVIDENCE_DIR="$E2E_SPEC_EVIDENCE_DIR/runtime-retry"
          export E2E_CAPTURE_SOURCE_COMMIT="$GITHUB_SHA"
          export E2E_CAPTURE_SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          node scripts/ci/flake-retry.mjs retry \
            --slot "${{ matrix.node }}" \
            --summary "$RUNNER_TEMP/spec-slot-${{ matrix.node }}.json" \
            --log "$RUNNER_TEMP/spec-test-${{ matrix.node }}.log" \
            --whitelist scripts/ci/known-flakes.json \
            --output "$RUNNER_TEMP/spec-retry-${{ matrix.node }}.json" \
            --retry-log "$RUNNER_TEMP/spec-retry-${{ matrix.node }}.log" \
            --repo "$GITHUB_REPOSITORY" \
            --run "$GITHUB_RUN_ID"
      # The slot's verdict is its summary status after the retry, not the red
      # mark of the first attempt. A retry that passed makes the slot success;
      # anything else fails the job, and the gate fails with it.
      - name: Require the slot verdict
        if: ${{ always() }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/spec-slot-${{ matrix.node }}.json"
          status="$(node -e 'try { process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).status) } catch { process.stdout.write("missing") }' "$file")"
          if [ "$status" != "success" ]; then
            echo "::error::spec slot ${{ matrix.node }} ended $status; see the per-slot summary and the known-flake retry audit"
            exit 1
          fi
      - name: Retain the per-slot test summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spec-slot-${{ matrix.node }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/spec-slot-${{ matrix.node }}.json
            ${{ runner.temp }}/spec-retry-${{ matrix.node }}.json
            ${{ runner.temp }}/spec-retry-${{ matrix.node }}.log
      # Bind the opt-in popup evidence to this exact run, attempt, matrix slot
      # and installed Chromium. The evidence bytes are untouched; the digest
      # and identity live beside them in binding.json.
      - name: Bind popup evidence to this run, attempt, slot and Chromium
        if: ${{ always() }}
        run: |
          node scripts/ci/bind-popup-evidence.mjs \
            --slot "${{ matrix.node }}" \
            --node "$(node --version)" \
            --chrome-version "$E2E_SPEC_CHROME_VERSION" \
            --chrome-sha256 "$E2E_SPEC_CHROME_SHA256" \
            --source-commit "$GITHUB_SHA" \
            --source-tree "$(git rev-parse HEAD^{tree})" \
            --run "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain validated HUNG cleanup metadata
        if: ${{ always() }}
        continue-on-error: true
        run: python3 scripts/ci/collect-spec-hung-cleanup.py
      - name: Retain closed delayed onAction producer metadata
        if: ${{ always() }}
        continue-on-error: true
        run: python3 scripts/ci/collect-spec-on-action.py
      - name: Retain synthetic fixture evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spec-fixtures-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ env.E2E_SPEC_EVIDENCE_DIR || format('{0}/spec-fixtures-not-created', runner.temp) }}
            .e2e/native-capture
            packages/e2e/.e2e/popup-init-order-borrowed
            packages/e2e/.e2e/popup-init-order/runner/popup-document-evidence.json
            packages/e2e/.e2e/popup-init-order/runner/binding.json
            packages/e2e/.e2e/popup-swipe-borrowed-pair

  # A new user's first install of the packed packages, which pnpm 11 and
  # later fail on any dependency build script (scripts/install-smoke.ts).
  install:
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pnpm: [11, 12]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Fresh install with pnpm ${{ matrix.pnpm }}
        run: node scripts/install-smoke.ts ${{ matrix.pnpm }}

  # The reference consumer matrix from #142/#145 on the same source-pinned
  # native runtime the rest of spec uses: the eleven files the 125-test
  # consumer set names, plus the thirteen scenario tests (navigation,
  # reconnect, viewport, drag, batch) that closed the matrix's remaining
  # cells. It is listed in `gate`'s `needs`, so a red matrix blocks a merge
  # exactly as a red `test` does. Adding a test to one of these files updates
  # the counts below; a count mismatch fails before any browser starts.
  consumers:
    needs: native-runtime
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up source-pinned native runtime
        uses: ./.github/actions/native-runtime
        with:
          artifact-id: ${{ needs.native-runtime.outputs.artifact-id }}
          manifest-sha256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
          run-attempt: ${{ needs.native-runtime.outputs.run-attempt }}
      - name: Build the runner and the web engine
        run: |
          pnpm --filter e2e run build
          pnpm --filter @e2e-dev/web run build
      - name: Run the reference consumer matrix with exact counts
        run: |
          set -euo pipefail
          mkdir -p evidence
          files=(
            tests/integration/agent-act-pixel-tools.test.ts
            tests/integration/agent-act-verbs.test.ts
            tests/integration/agent-act.test.ts
            tests/integration/agent-ai-trace.test.ts
            tests/integration/agent-policy.test.ts
            tests/integration/agent-trace-cache.test.ts
            tests/integration/agent.test.ts
            tests/integration/mcp-server.test.ts
            tests/integration/mcp-test-lines.test.ts
            tests/integration/plain-string-secrets.test.ts
            tests/integration/canonical-reference-roundtrip.test.ts
            tests/integration/reference-reconnect-scenarios.test.ts
            tests/integration/reference-browser-scenarios.test.ts
          )
          pnpm --filter e2e exec vitest list "${files[@]}" --no-staticParse --json="$GITHUB_WORKSPACE/evidence/collection.json"
          python3 - <<'PY_EXPECTED'
          import collections, json, pathlib

          expected = {
              'agent-act-pixel-tools.test.ts': 17,
              'agent-act-verbs.test.ts': 15,
              'agent-act.test.ts': 21,
              'agent-ai-trace.test.ts': 3,
              'agent-policy.test.ts': 12,
              'agent-trace-cache.test.ts': 18,
              'agent.test.ts': 19,
              'mcp-server.test.ts': 12,
              'mcp-test-lines.test.ts': 1,
              'plain-string-secrets.test.ts': 5,
              'canonical-reference-roundtrip.test.ts': 2,
              'reference-reconnect-scenarios.test.ts': 4,
              'reference-browser-scenarios.test.ts': 9,
          }
          rows = json.loads(pathlib.Path('evidence/collection.json').read_text())
          counts = collections.Counter(row['file'].rsplit('/', 1)[-1] for row in rows)
          assert dict(counts) == expected, counts
          assert sum(counts.values()) == 138, counts
          pathlib.Path('evidence/collection-counts.json').write_text(json.dumps(dict(counts), indent=2) + '\n')
          PY_EXPECTED
          set +e
          pnpm --filter e2e exec vitest run "${files[@]}" --bail=0 --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json" 2>&1 | tee evidence/matrix.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > evidence/matrix.exit
          python3 - <<'PY_RESULTS'
          import collections, json, pathlib

          collection = json.loads(pathlib.Path('evidence/collection.json').read_text())
          results = json.loads(pathlib.Path('evidence/results.json').read_text())
          executed = [row for suite in results['testResults'] for row in suite['assertionResults']]
          assert len(executed) == len(collection), (len(executed), len(collection))
          assert all(row['status'] in ('passed', 'failed') for row in executed), 'a test was skipped or left pending'
          collected = collections.Counter(
              (row['file'].rsplit('/', 1)[-1], row['name']) for row in collection
          )
          ran = collections.Counter(
              (suite['name'].rsplit('/', 1)[-1], ' > '.join(row['ancestorTitles'] + [row['title']]))
              for suite in results['testResults'] for row in suite['assertionResults']
          )
          assert collected == ran, 'the executed set differs from the collected set'
          receipt = {
              'collected': len(collection),
              'executed': len(executed),
              'passed': sum(row['status'] == 'passed' for row in executed),
              'failed': sum(row['status'] == 'failed' for row in executed),
          }
          pathlib.Path('evidence/execution-counts.json').write_text(json.dumps(receipt, indent=2) + '\n')
          assert receipt['failed'] == 0 and receipt['passed'] == receipt['collected'], receipt
          PY_RESULTS
          exit "$status"
      - name: Retain the matrix receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: reference-consumers-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7

  # The one check the ruleset requires from this workflow. A skipped job
  # passes (the change cannot reach it); a failed or cancelled one fails it.
  gate:
    name: spec gate
    needs: [native-runtime, check, test, install, consumers, native-targeted, popup-joint]
    if: ${{ always() }}
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      # Read the per-slot test jobs, their setup logs, and the failure
      # annotations that name the exact test. This only reads this run; it
      # grants no write.
      actions: read
      checks: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The verdict stays the job results below. These summaries only explain a
      # red test job with its matrix slot and the tests that failed there.
      - name: Download per-slot test summaries
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: spec-slot-*
          path: ${{ runner.temp }}/spec-slots
          merge-multiple: false
      - name: Read failure annotations
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/spec-slot-summary.mjs annotations --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/spec-annotations.json"
      # docs/flake-policy.mdx: a failure with no test executed is infrastructure
      # only when the first failed step and its log match a registered entry.
      # No test, no classification: it stays red and is a defect to fix.
      - name: Classify failed job kinds
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/spec-slot-summary.mjs inspect --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --whitelist scripts/ci/known-flakes.json --summaries "$RUNNER_TEMP/spec-slots" --output "$RUNNER_TEMP/spec-job-kinds.json"
      - name: Report failed slots and tests
        if: ${{ always() }}
        continue-on-error: true
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/spec-slot-summary.mjs report --dir "$RUNNER_TEMP/spec-slots" --annotations "$RUNNER_TEMP/spec-annotations.json" --kinds "$RUNNER_TEMP/spec-job-kinds.json" --needs "$RESULTS"
      - name: Require every job to pass or skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) \(.value.result)"] | join(", ")' <<< "$RESULTS")"
          [ -z "$failed" ] || { echo "::error::$failed"; exit 1; }

  popup-joint:
    if: ${{ github.head_ref == 'ci/s25-main-integration-20261101' || github.ref == 'refs/heads/ci/s25-main-integration-20261101' }}
    needs: native-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.9
      - name: Closed source binding and fresh private root
        id: pin
        run: |
          set -euo pipefail
          python3 - <<'BIND'
          import json, os, pathlib, tempfile
          binding=json.loads(pathlib.Path('scripts/ci/popup-joint-binding.json').read_text())
          pin=json.loads(pathlib.Path('.github/native-candidate.json').read_text())
          assert binding['native'] is not None, 'Unbound actual native'
          assert binding['native']['commit']==pin['commit']
          root=pathlib.Path(tempfile.mkdtemp(prefix='pj-',dir=os.path.realpath('/tmp')))
          root.chmod(0o700)
          for name in ['evidence','home','tmp']: (root/name).mkdir(mode=0o700)
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('JOINT_ROOT='+str(root)+'\nHOME='+str(root/'home')+'\nTMPDIR='+str(root/'tmp')+'\nRUSTUP_HOME='+os.environ.get('RUSTUP_HOME',os.path.join(os.environ['HOME'],'.rustup'))+'\nCARGO_HOME='+os.environ.get('CARGO_HOME',os.path.join(os.environ['HOME'],'.cargo'))+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('sha='+binding['native']['commit']+'\n')
          BIND
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: levicode/agent-browser
          ref: ${{ steps.pin.outputs.sha }}
          path: .artifacts/popup-joint-native
          persist-credentials: false
      - name: Fault hook exact Rust controls before browser
        timeout-minutes: 75
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          python3 scripts/ci/native-targeted-tests.py "$GITHUB_WORKSPACE/.artifacts/popup-joint-native" "$JOINT_ROOT/fault-controls" popup-joint-fault-controls.json
      - name: Original official dependencies and fresh JS builds
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter e2e run build
          pnpm --filter @e2e-dev/web run build
          python3 scripts/ci/test_popup_passive_joint_relay.py
          python3 scripts/ci/popup-joint-evidence.test.py
          node --test scripts/ci/popup-joint-runtime.test.ts
      - name: Official pinned websocket dependency in an owned copied interpreter
        run: |
          set -euo pipefail
          python3 -m venv --copies "$JOINT_ROOT/venv"
          "$JOINT_ROOT/venv/bin/python3" -m pip install --require-hashes --no-deps --only-binary=:all: -r scripts/ci/popup-joint-requirements.txt
          "$JOINT_ROOT/venv/bin/python3" - <<'PYTHON'
          import hashlib, json, os, pathlib, platform, sys, websockets
          root=pathlib.Path(os.environ['JOINT_ROOT']);exe=pathlib.Path(sys.executable)
          assert platform.python_version()=='3.12.9' and platform.machine()=='x86_64' and sys.platform=='linux'
          assert not exe.is_symlink() and exe.resolve()==exe and exe.is_relative_to(root/'venv')
          module=pathlib.Path(websockets.__file__).resolve();assert module.is_relative_to(root/'venv') and websockets.__version__=='15.0.1'
          (root/'python.json').write_text(json.dumps({'version':platform.python_version(),'websockets':websockets.__version__,'module':str(module),'pythonSHA256':hashlib.sha256(exe.read_bytes()).hexdigest(),'wheelSHA256':'64dee438fed052b52e4f98f76c5790513235efaa1ef7f3f2192c392cd7c91b65'}))
          PYTHON
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.native-runtime.outputs.artifact-id }}
          path: ${{ runner.temp }}/popup-joint-production
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.native-runtime.outputs.fault-artifact-id }}
          path: ${{ runner.temp }}/popup-joint-fault
      - name: Verify roles, install Chromium with production, probe, then one managed joint case
        timeout-minutes: 18
        run: |
          set -euo pipefail
          node scripts/ci/popup-joint-runtime.ts "$RUNNER_TEMP/popup-joint-production" '${{ needs.native-runtime.outputs.manifest-sha256 }}' '${{ needs.native-runtime.outputs.run-attempt }}' "$RUNNER_TEMP/popup-joint-fault" '${{ needs.native-runtime.outputs.fault-manifest-sha256 }}' '${{ needs.native-runtime.outputs.fault-run-attempt }}' "$JOINT_ROOT"
      - name: Retain only closed diagnostic metadata and original Rust controls
        if: always() && steps.pin.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: popup-joint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.JOINT_ROOT }}/evidence/
            ${{ env.JOINT_ROOT }}/fault-controls/evidence/
          if-no-files-found: error
          retention-days: 7

  native-targeted:
    if: ${{ github.head_ref == 'ci/s25-main-integration-20261101' || github.ref == 'refs/heads/ci/s25-main-integration-20261101' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Pure contract checks and reviewed actual native pin
        id: pin
        working-directory: tooling
        run: |
          set -euo pipefail
          python3 scripts/ci/native-targeted-tests.test.py
          python3 - <<'BIND'
          import json, os, re
          from pathlib import Path
          plan=json.loads(Path('scripts/ci/native-targeted-plan.json').read_text())
          pin=json.loads(Path('.github/native-candidate.json').read_text())
          native=plan['native']
          assert native is not None, 'Unbound actual native'
          assert re.fullmatch('[a-f0-9]{40}', native['commit'])
          assert native['commit']==pin['commit'], 'Targeted/source build pin mismatch'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+native['commit']+'\n')
          BIND
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: levicode/agent-browser
          ref: ${{ steps.pin.outputs.sha }}
          path: native-targeted-source
          persist-credentials: false
      - name: Install original stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Compile default harness and run each exact regression once
        timeout-minutes: 75
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -euo pipefail
          s=0
          python3 tooling/scripts/ci/native-targeted-tests.py "$GITHUB_WORKSPACE/native-targeted-source" "$RUNNER_TEMP/native-targeted" || s=$?
          exit "$s"
      - name: Preserve original targeted evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-targeted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-targeted/evidence/
          if-no-files-found: error
          retention-days: 7
