name: build source-pinned test-only fault runtime
permissions:
  contents: read
env:
  REVIEWED_NATIVE_SHA: a3c319199c01895ef1036b5ec7b805cff2b41618
  REVIEWED_RUST_TOOLCHAIN: 1.99.1
jobs:
  build:
    runs-on: ${{ github.repository == 'tester-army/e2e' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.build.outputs.manifest-sha256 }}
      run-attempt: ${{ steps.build.outputs.run-attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Validate 17 pure fault artifact rejection controls before building
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/fault-test-evidence"

        set +e

        node --test --test-reporter=tap scripts/ci/native-fault-runtime.test.ts > "$RUNNER_TEMP/fault-test-evidence/tests.tap"
        2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > "$RUNNER_TEMP/fault-test-evidence/tests.exit"

        python3 - <<''PY_COUNTS''

        import os,pathlib,re,json

        p=pathlib.Path(os.environ[''RUNNER_TEMP''])/''fault-test-evidence'';s=(p/''tests.tap'').read_text()

        counts={k:[int(n) for n in re.findall(r''^# ''+k+r'' (\d+)$'',s,re.M)] for k in [''tests'',''pass'',''fail'',''cancelled'',''skipped'',''todo'']}

        (p/''counts.json'').write_text(json.dumps(counts,indent=2));assert counts=={''tests'':[17],''pass'':[17],''fail'':[0],''cancelled'':[0],''skipped'':[0],''todo'':[0]},counts

        PY_COUNTS

        cat "$RUNNER_TEMP/fault-test-evidence/tests.tap"

        test "$status" -eq 0

        '
    - name: Require reviewed native source before any build
      run: '[[ "$REVIEWED_RUST_TOOLCHAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

        [[ "$REVIEWED_NATIVE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$REVIEWED_NATIVE_SHA" != 0000000000000000000000000000000000000000

        '
    - id: pin
      run: node scripts/ci/native-runtime.ts pin
    - name: Require pin equals reviewed final native commit
      run: test "${{ steps.pin.outputs.sha }}" = "a3c319199c01895ef1036b5ec7b805cff2b41618"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ steps.pin.outputs.sha }}
        path: .artifacts/ci-native-source
        persist-credentials: false
    - name: Require exact reviewed native checkout tree
      run: 'set -euo pipefail

        test "$(git -C .artifacts/ci-native-source rev-parse HEAD)" = "a3c319199c01895ef1036b5ec7b805cff2b41618"

        test "$(git -C .artifacts/ci-native-source rev-parse HEAD^{tree})" = "24e447e640731f6830f8b47ad5b7a92f34cdf4bf"'
    - name: Install native build toolchain
      run: rustup toolchain install "$REVIEWED_RUST_TOOLCHAIN" --profile minimal
    - name: Build and seal the exact clean test-only fault runtime
      id: build
      env:
        RUSTUP_TOOLCHAIN: ${{ env.REVIEWED_RUST_TOOLCHAIN }}
      run: node scripts/ci/native-fault-runtime.ts build .artifacts/ci-native-source "$RUNNER_TEMP/ci-native-target"
        "$RUNNER_TEMP/ci-native-artifact" "$REVIEWED_NATIVE_SHA"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: upload
      with:
        name: ci-native-fault-runtime-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-native-artifact/
        if-no-files-found: error
        retention-days: 7
    - name: Preserve raw failed-build diagnostics separately
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-native-fault-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-native-artifact/
        if-no-files-found: warn
        retention-days: 7
    - name: Preserve independent pure control evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ci-native-fault-pure-controls-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/fault-test-evidence/
        if-no-files-found: error
        retention-days: 7
'on':
  workflow_dispatch: null
  push:
    branches:
    - ci/s22-repair-fault-runtime-20261031
