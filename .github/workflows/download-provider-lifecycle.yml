        printf ''%s\n'' "$status" > evidence/test.exit

        node --input-type=module - <<''JS''

        import fs from ''node:fs'';import assert from ''node:assert/strict'';

        const r=JSON.parse(fs.readFileSync(''evidence/results.json'',''utf8''));const rows=r.testResults.flatMap(x=>x.assertionResults);

        assert.equal(rows.length,2);assert.equal(r.numPendingTests,0);assert.equal(r.numPassedTests,2);assert.equal(r.numFailedTests,0);

        JS

        exit "$status"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: provider-cleanup-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
