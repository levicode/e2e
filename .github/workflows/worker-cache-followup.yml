name: Worker receipt ownership and cancelled cache (focused reuse)
'on':
  push:
    branches:
    - implement/worker-cache-followup-ci
permissions:
  contents: read
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 496037c4b4b0bb75d3d13186603a7c9e5eaa576d
  NATIVE_SOURCE_TREE: 368c71da0de2ae94f9677a62f0d38fcbad18c576
jobs:
  provider-downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/recipe-source.sha

        git rev-parse HEAD^{tree} > evidence/recipe-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 3016c737e1596bc55e0a4a6f1c5db9fee1d3c0b5
        path: source
        persist-credentials: false
    - name: Exact unchanged product and consumer source
      run: 'set -euo pipefail

        test "$(git -C source rev-parse HEAD)" = 3016c737e1596bc55e0a4a6f1c5db9fee1d3c0b5

        test "$(git -C source rev-parse HEAD^{tree})" = 9b1c5168dc39bc66ffd43c555e90a21c5451aa1a

        test -z "$(git -C source status --porcelain)"

        git -C source rev-parse HEAD > evidence/e2e-source.sha

        git -C source rev-parse HEAD^{tree} > evidence/e2e-source.tree

        ln -s "$GITHUB_WORKSPACE/evidence" source/evidence

        '
    - run: pnpm install --frozen-lockfile
      working-directory: source
    - name: Download bounded exact cross-run producer artifact
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/download-interrupt-runtime.py
    - name: Verify explicit producer and native bytes
      timeout-minutes: 1
      run: node scripts/ci/verify-interrupt-runtime.ts "$RUNNER_TEMP/interrupt-native-runtime"
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
    - name: Build actual public core and web adapter
      run: pnpm run build
      working-directory: source
    - name: Install original core fixture Playwright Chromium
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium
      timeout-minutes: 8
      working-directory: source
    - name: Execute unchanged full original test file
      run: 'set -euo pipefail

        cp "$RUNNER_TEMP/interrupt-native-runtime/manifest.json" evidence/native-runtime.manifest.json

        sha256sum "$E2E_AGENT_BROWSER_EXECUTABLE" > evidence/native-executable.sha256

        unset GH_TOKEN GITHUB_TOKEN

        pnpm --filter @e2e-dev/web exec vitest list tests/integration/provider-downloads.test.ts --no-staticParse
        --json="$GITHUB_WORKSPACE/evidence/collection.json"

        python3 - <<''PY_COLLECT''

        import json

        from pathlib import Path

        r=json.loads(Path(''evidence/collection.json'').read_text())

        assert isinstance(r,list) and len(r)==2

        assert all(x[''file''].endswith(''/tests/integration/provider-downloads.test.ts'') for x in r)


        PY_COLLECT

        python3 - <<''PY_CREATE''

        import os

        from pathlib import Path

        p=Path(''evidence/native-cleanup.jsonl'').resolve()

        fd=os.open(p,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)

        os.close(fd)

        PY_CREATE

        export AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE="$GITHUB_WORKSPACE/evidence/native-cleanup.jsonl"

        set +e

        pnpm --filter @e2e-dev/web exec vitest run tests/integration/provider-downloads.test.ts --bail=0 --reporter=verbose
        --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json" 2>&1 | tee evidence/test.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/test.exit

        python3 - <<''PY_COUNT''

        import json

        from pathlib import Path

        expected=len(json.loads(Path(''evidence/collection.json'').read_text()))

        r=json.loads(Path(''evidence/results.json'').read_text())

        a=[a for t in r[''testResults''] for a in t[''assertionResults'']]

        counts={''expected'':expected,''executed'':sum(x[''status''] in (''passed'',''failed'') for x in a),''passed'':sum(x[''status'']==''passed''
        for x in a),''failed'':sum(x[''status'']==''failed'' for x in a),''pending'':sum(x[''status''] not in (''passed'',''failed'')
        for x in a)}

        Path(''evidence/execution-counts.json'').write_text(json.dumps(counts,indent=2)+''\n'')

        assert len(a)==expected and counts[''executed'']==expected and counts[''pending'']==0,counts

        PY_COUNT

        exit "$status"

        '
      working-directory: source
    - name: Preserve diagnostic completeness boundaries
      if: always()
      run: "python3 - <<'PY_DIAG'\nimport json,hashlib\nfrom pathlib import Path\np=Path('evidence/native-cleanup.jsonl');rows=[];bad=0\n\
        if p.exists():\n for line in p.read_text().splitlines():\n  try: rows.append(json.loads(line))\n  except\
        \ (ValueError,TypeError): bad+=1\nout={'exists':p.exists(),'bytes':p.stat().st_size if p.exists() else 0,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()\
        \ if p.exists() else None,'records':len(rows),'invalidLines':bad,'captureStarted':sum(x.get('phase')=='CaptureStarted'\
        \ for x in rows),'captureLimitReached':sum(x.get('phase')=='CaptureLimitReached' for x in rows),'maxDroppedBefore':max([x.get('droppedBefore',0)\
        \ for x in rows]+[0]),'maxSuppressedBefore':max([x.get('suppressedBefore',0) for x in rows]+[0]),'overflow':any(x.get('overflow')\
        \ is True for x in rows),'absenceDoesNotProveSuccess':True,'acceptedMeansJoinedProducerOutputNotPublicSuccess':True,'pixelsAvailableMeansNativeOutputNotAdapter':True}\n\
        Path('evidence/diagnostic-boundary.json').write_text(json.dumps(out,indent=2)+'\\n')\nPY_DIAG\n"
      working-directory: source
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: worker-cache-provider-downloads-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
