      run: 'set -euo pipefail

        python3 scripts/ci/check-focused-chrome.py

        python3 - <<''PY_CHROME''

        import json,pathlib,os

        m=json.load(open(''evidence/focused-chrome.json''))

        assert m[''version'']==''Google Chrome for Testing 156.0.8078.73'',m

        assert m[''sha256'']==''8ea0ecbfc1ac0dc0e957de722babf9b72f8e86cb8643308ff17a491d59bdaa80'',m

        p=pathlib.Path(m[''chrome'']);assert p.is_absolute() and p.is_file() and ''\n''
        not in str(p)

        with open(os.environ[''GITHUB_ENV''],''a'') as f:f.write(''E2E_CHAIN_CHROME_EXECUTABLE=''+str(p)+''\n'')

        PY_CHROME

        '
    - name: Exact wrapper and public fixture typecheck
      working-directory: .
      run: 'set -euo pipefail

        cat > tsconfig.chain-diagnostic.json <<''JSON_TYPES''

        {"extends": "./tsconfig.base.json", "compilerOptions": {"lib": ["ES2023",
        "DOM", "DOM.Iterable"], "noEmit": true, "paths": {"e2e": ["./packages/e2e/src/index.ts"],
        "e2e/engine": ["./packages/e2e/src/engine/index.ts"], "@e2e-dev/web": ["./packages/web/src/index.ts"]}},
        "files": ["packages/e2e/tests/integration/web-selector-chains.test.ts"]}

        JSON_TYPES

        pnpm exec tsc -p tsconfig.chain-diagnostic.json

        pnpm exec oxlint --deny-warnings packages/e2e/tests/integration/web-selector-chains.test.ts

        rm tsconfig.chain-diagnostic.json

        sha256sum packages/e2e/tests/integration/web-selector-chains.test.ts > "$GITHUB_WORKSPACE/evidence/fixture.sha256"

        pnpm --filter @e2e-dev/web exec node -e "if(require(''playwright-core/package.json'').version!==''1.64.1'')process.exit(1)"

        '
    - name: Execute unchanged bounded diagnostic and preserve original exit
      working-directory: .
      run: 'set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        export E2E_CHAIN_EVIDENCE_DIR="$GITHUB_WORKSPACE/evidence/inner"

        mkdir -p "$E2E_CHAIN_EVIDENCE_DIR"

        pnpm --filter e2e exec vitest list tests/integration/web-selector-chains.test.ts
        --no-staticParse --json="$GITHUB_WORKSPACE/evidence/collection.json"

        python3 - <<''PY_LIST''

        import json,os

        r=json.load(open(os.environ[''GITHUB_WORKSPACE'']+''/evidence/collection.json''));assert
        len(r)==1 and r[0][''file''].endswith(''/web-selector-chains.test.ts''),r

        PY_LIST

        set +e

        pnpm --filter e2e exec vitest run tests/integration/web-selector-chains.test.ts
        --project integration --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json"
        2>&1 | tee "$GITHUB_WORKSPACE/evidence/tests.log"

        s=${PIPESTATUS[0]}

        printf ''%s\n'' "$s" > "$GITHUB_WORKSPACE/evidence/tests.exit"

        set -e

        python3 - <<''PY_COUNT''

        import json,os,pathlib

        p=pathlib.Path(os.environ[''GITHUB_WORKSPACE''])/''evidence'';r=json.load(open(p/''results.json''));a=[a
        for t in r[''testResults''] for a in t[''assertionResults'']]

        assert len(a)==r[''numTotalTests'']==1 and r[''numPendingTests'']==0,r

        (p/''counts.json'').write_text(json.dumps({k:r[k] for k in [''numTotalTests'',''numPassedTests'',''numFailedTests'',''numPendingTests'']},indent=2))

        PY_COUNT

        exit "$s"

        '
    - name: Summarize retained inner evidence separately from original test exit
      if: ${{ always() }}
      env:
        DIAGNOSTIC_KIND: shadow
      run: 'python3 - <<''PY_INNER''

        import json,pathlib,os

        root=pathlib.Path(''evidence'');kind=os.environ[''DIAGNOSTIC_KIND''];p=root/''inner''/kind

        summary={''kind'':kind,''originalExit'':(root/''tests.exit'').read_text().strip()
        if (root/''tests.exit'').exists() else None,''retainedFiles'':[str(f) for
        f in p.rglob(''*'') if f.is_file()]}

        report=p/''outcome-report.json''

        summary[''reportRetained'']=report.is_file()

        summary[''observationFileRetained'']=(p/''observations.jsonl'').is_file()

        (root/''evidence-custody.json'').write_text(json.dumps(summary,indent=2))

        assert summary[''reportRetained''] and summary[''observationFileRetained''],summary

        PY_INNER

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: selector-taxonomy-shadow-current-evidence
        path: evidence/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    needs:
    - native-runtime
