# FROZEN GREEN recipe: actual RED parent to reviewed fix; no production build or browser.
name: 'Response entry: nine exact GREEN dev validations'
'on':
  push:
    branches:
    - validation/response-entry-green-20261025
permissions:
  contents: read
concurrency:
  group: response-entry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  response-entry:
    name: response-entry-green-dev-evidence
    if: ${{ github.ref == 'refs/heads/validation/response-entry-green-20261025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      RUST_MIN_STACK: '16777216'
      RUST_BACKTRACE: '1'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
      PHASES: recipe-identity source-before source-patch toolchain format clippy acceptance-tests-check proxy-feature-check default-harness-compile
        default-harness-inventory source-after-pure pure-summary
    steps:
    - name: Initialize nine-case dev evidence; no production build or browser
      id: init
      timeout-minutes: 1
      run: |-
        set -euo pipefail
        umask 077
        export EVIDENCE_DIR="$RUNNER_TEMP/response-entry-evidence"
        export CARGO_HOME="$RUNNER_TEMP/response-entry-cargo"
        export CARGO_TARGET_DIR="$RUNNER_TEMP/response-entry-target"
        export VALIDATE="$GITHUB_WORKSPACE/recipe/scripts/response-entry/validate.py"
        printf 'EVIDENCE_DIR=%s\nCARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nVALIDATE=%s\n' "$EVIDENCE_DIR" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$VALIDATE" >> "$GITHUB_ENV"
        test ! -e "$CARGO_TARGET_DIR"
        mkdir -m700 "$EVIDENCE_DIR"
        test "$GITHUB_RUN_ATTEMPT" = 1
        for phase in $PHASES; do printf 'not-run\n' > "$EVIDENCE_DIR/$phase.exit"; done
        printf '%s\n' 'Nine default dev response/watermark fixtures. Required actual ledger: nine passed, zero failed, zero ignored, every exit zero. No expected-RED allowance. Native production source changed, but no production executable is built. Not native full-suite acceptance or browser evidence.' > "$EVIDENCE_DIR/SCOPE.txt"

        uname -a > "$EVIDENCE_DIR/host.txt"
        cat /etc/os-release >> "$EVIDENCE_DIR/host.txt"
        . /etc/os-release
        test "$RUNNER_OS" = Linux
        test "$(uname -m)" = x86_64
        test "$(id -u)" -ne 0
        test "$ID" = ubuntu
        test "$VERSION_ID" = 24.04
    - name: Check out this immutable nine-case GREEN recipe
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - name: Verify exact frozen response source binding
      id: binding
      timeout-minutes: 1
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" guard
        python3 -B "$VALIDATE" run recipe-identity 30 python3 -B "$VALIDATE" recipe "$GITHUB_WORKSPACE/recipe" "$GITHUB_WORKFLOW_SHA"
        sha256sum recipe/.github/workflows/response-entry.yml recipe/scripts/response-entry/validate.py recipe/scripts/response-entry/pins.json recipe/scripts/response-entry/source-change.patch > "$EVIDENCE_DIR/recipe.sha256"
    - name: Check out exact response ingress fix and its controls
      id: source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SHA }}
        path: source
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact RED parent, 5-file fix delta and reversible patch
      id: before
      timeout-minutes: 1
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" run source-before 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" pristine
        python3 -B "$VALIDATE" run source-patch 30 python3 -B "$VALIDATE" apply "$GITHUB_WORKSPACE/source"
    - name: Cache registry bytes only, never target executables
      id: registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      timeout-minutes: 3
      with:
        path: |-
          ${{ env.CARGO_HOME }}/registry
          ${{ env.CARGO_HOME }}/git/db
        key: focused-registry-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-${{ env.NATIVE_LOCK_SHA256 }}
    - name: Install and verify the existing pinned official Rust toolchain
      id: rust
      timeout-minutes: 11
      run: "python3 -B \"$VALIDATE\" run toolchain 600 bash -euc '\nrustup toolchain install \"$RUSTUP_TOOLCHAIN\" --profile minimal --component\
        \ rustfmt --component clippy\nrustc -Vv\ncargo -Vv\ntest \"$(rustc -Vv | sed -n \"s/^release: //p\")\" = \"$RUSTUP_TOOLCHAIN\"\ntest \"\
        $(rustc -Vv | sed -n \"s/^host: //p\")\" = x86_64-unknown-linux-gnu\n' "
    - name: Run all four unchanged strict compile gates
      id: strict
      timeout-minutes: 43
      working-directory: source/cli
      run: |-
        set -uo pipefail
        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET
        failed=0
        python3 -B "$VALIDATE" run format 120 cargo fmt --all -- --check || failed=1
        python3 -B "$VALIDATE" run clippy 900 cargo clippy --locked --profile dev --no-default-features --all-targets -- -D warnings || failed=1
        python3 -B "$VALIDATE" run acceptance-tests-check 900 cargo check --locked --profile dev --no-default-features --features acceptance-faults --tests || failed=1
        python3 -B "$VALIDATE" run proxy-feature-check 600 cargo check --locked --profile dev --no-default-features --features acceptance-faults --test client-proxy-fixture || failed=1
        exit "$failed"
    - name: Compile and bind only default exact dev harness
      id: harness
      timeout-minutes: 28
      working-directory: source/cli
      run: |-
        set -euo pipefail
        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET
        python3 -B "$VALIDATE" run default-harness-compile 1500 cargo test --locked --profile dev --no-default-features --bin agent-browser --no-run --message-format=json
        python3 -B "$VALIDATE" run default-harness-inventory 90 python3 -B "$VALIDATE" harness "$GITHUB_WORKSPACE/source"
    - name: Require nine real exact PASS results, stopping at the first failure
      id: cases
      timeout-minutes: 19
      run: |
        set -euo pipefail
        unset AGENT_BROWSER_NETWORK_PROBE_SHA256 AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE
        python3 -B "$VALIDATE" case response-1
        python3 -B "$VALIDATE" case response-2
        python3 -B "$VALIDATE" case response-3
        python3 -B "$VALIDATE" case response-4
        python3 -B "$VALIDATE" case response-5
        python3 -B "$VALIDATE" case response-6
        python3 -B "$VALIDATE" case response-7
        python3 -B "$VALIDATE" case response-8
        python3 -B "$VALIDATE" case response-9
    - name: Verify unchanged source after pure cases
      id: after_pure
      timeout-minutes: 1
      if: ${{ always() && steps.before.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run source-after-pure 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source"
    - name: Reconcile nine raw exact PASS records; never accept RED
      id: pure
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run pure-summary 30 python3 -B "$VALIDATE" summary
    - name: Require every strict gate and all nine exact passes
      id: gate
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: |
        set -euo pipefail
        python3 -B "$VALIDATE" aggregate $PHASES
    - name: Retain exact step outcomes
      id: outcomes
      timeout-minutes: 1
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: printf '%s\n' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"
    - name: Always retain raw nine-case evidence and actual exits
      id: diagnostics
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      if: ${{ always() }}
      with:
        name: response-entry-green-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          ${{ env.EVIDENCE_DIR }}/*.json
          ${{ env.EVIDENCE_DIR }}/*.log
          ${{ env.EVIDENCE_DIR }}/*.exit
          ${{ env.EVIDENCE_DIR }}/*.txt
          ${{ env.EVIDENCE_DIR }}/*.sha256
        if-no-files-found: error
        retention-days: 7
