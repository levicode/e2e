# LOCAL FROZEN RECIPE: reviewed temporary native timing source; one original P04 invocation.
name: 'P04 timing: strict exact dev then diagnostic ci ELF and original relay case'
'on':
  push:
    branches:
    - diagnostic/p04-capture-timing-20261025
permissions:
  contents: read
concurrency:
  group: p04-timing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  production:
    name: temporary-P04-timing
    if: ${{ github.ref == 'refs/heads/diagnostic/p04-capture-timing-20261025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      RUST_MIN_STACK: '16777216'
      RUST_BACKTRACE: '1'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
      PHASES: recipe-identity source-before source-patch toolchain format clippy acceptance-tests-check proxy-feature-check default-harness-compile
        default-harness-inventory faults-harness-compile faults-harness-inventory collector-controls source-after-pure pure-summary production-build
        production-capture source-after product-integrity
      CASE_ID: P04
      RECIPE_SHA: ${{ github.workflow_sha }}
      RUNTIME_PHASES: local-product sources dependencies browser-install runtime-images runtime diagnostic final-identities
    steps:
    - name: Initialize temporary diagnostic producer; browser follows producer gates
      id: init
      timeout-minutes: 1
      run: |-
        set -euo pipefail
        umask 077
        export EVIDENCE_DIR="$RUNNER_TEMP/focused-production-evidence"
        export CARGO_HOME="$RUNNER_TEMP/focused-production-cargo"
        export CARGO_TARGET_DIR="$RUNNER_TEMP/focused-production-target"
        export VALIDATE="$GITHUB_WORKSPACE/recipe/scripts/p04-timing/producer.py"
        export PRODUCT_DIR="$RUNNER_TEMP/focused-production-product"
        printf 'EVIDENCE_DIR=%s\nCARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nVALIDATE=%s\nPRODUCT_DIR=%s\n' "$EVIDENCE_DIR" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$VALIDATE" "$PRODUCT_DIR" >> "$GITHUB_ENV"
        test ! -e "$CARGO_TARGET_DIR"
        test ! -e "$PRODUCT_DIR"
        mkdir -m700 "$EVIDENCE_DIR"
        test "$GITHUB_RUN_ATTEMPT" = 1
        export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/p04-timing-playwright"
        printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

        for phase in $PHASES $RUNTIME_PHASES; do printf 'not-run\n' > "$EVIDENCE_DIR/$phase.exit"; done
        printf '%s\n' 'Temporary removable diagnostic source. Four strict gates + reviewed exact dev tests, then fresh ci ELF. Not old native41/new fullnative acceptance. Original P04 only after pure and build success; existing final acceptance goal unchanged.' > "$EVIDENCE_DIR/SCOPE.txt"
        uname -a > "$EVIDENCE_DIR/host.txt"
        cat /etc/os-release >> "$EVIDENCE_DIR/host.txt"
        . /etc/os-release
        test "$RUNNER_OS" = Linux
        test "$(uname -m)" = x86_64
        test "$(id -u)" -ne 0
        test "$ID" = ubuntu
        test "$VERSION_ID" = 24.04
    - name: Check out this immutable producer recipe
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - name: Refuse UNRESOLVED diagnostic source before installation
      id: binding
      timeout-minutes: 1
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" guard
        python3 -B "$VALIDATE" run recipe-identity 30 python3 -B "$VALIDATE" recipe "$GITHUB_WORKSPACE/recipe" "$GITHUB_WORKFLOW_SHA"
        sha256sum recipe/.github/workflows/p04-timing.yml recipe/scripts/p04-timing/producer* recipe/scripts/p04-timing/source-change.patch > "$EVIDENCE_DIR/recipe.sha256"
    - name: Check out exact temporary six-file native delta
      id: source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/agent-browser
        ref: 4a382062ae3a0f1255b05f9769f2a213cd9dda27
        path: source
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact parent tree six-file delta and reversible patch
      id: before
      timeout-minutes: 1
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" run source-before 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" pristine
        python3 -B "$VALIDATE" run source-patch 30 python3 -B "$VALIDATE" apply "$GITHUB_WORKSPACE/source"
    - name: Select pinned official Node
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      timeout-minutes: 2
      with:
        node-version: 24.19.0
        architecture: x64
    - name: Check out exact unchanged original P04 Web baseline
      id: e2e
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/e2e
        ref: 5adcc69574da30c539b585d92a793bca87fae2bc
        fetch-depth: 1
        path: e2e-source
        persist-credentials: false
    - name: Cache registry bytes only, never target executables
      id: registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      timeout-minutes: 3
      with:
        path: |-
          ${{ env.CARGO_HOME }}/registry
          ${{ env.CARGO_HOME }}/git/db
        key: focused-registry-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-${{ env.NATIVE_LOCK_SHA256 }}
    - name: Install and verify the existing pinned official Rust toolchain
      id: rust
      timeout-minutes: 11
      run: "python3 -B \"$VALIDATE\" run toolchain 600 bash -euc '\nrustup toolchain install \"$RUSTUP_TOOLCHAIN\" --profile minimal --component\
        \ rustfmt --component clippy\nrustc -Vv\ncargo -Vv\ntest \"$(rustc -Vv | sed -n \"s/^release: //p\")\" = \"$RUSTUP_TOOLCHAIN\"\ntest \"\
        $(rustc -Vv | sed -n \"s/^host: //p\")\" = x86_64-unknown-linux-gnu\n' "
    - name: Run all four unchanged strict compile gates
      id: strict
      timeout-minutes: 43
      working-directory: source/cli
      run: |-
        set -uo pipefail
        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET
        failed=0
        python3 -B "$VALIDATE" run format 120 cargo fmt --all -- --check || failed=1
        python3 -B "$VALIDATE" run clippy 900 cargo clippy --locked --profile dev --no-default-features --all-targets -- -D warnings || failed=1
        python3 -B "$VALIDATE" run acceptance-tests-check 900 cargo check --locked --profile dev --no-default-features --features acceptance-faults --tests || failed=1
        python3 -B "$VALIDATE" run proxy-feature-check 600 cargo check --locked --profile dev --no-default-features --features acceptance-faults --test client-proxy-fixture || failed=1
        exit "$failed"
    - name: Compile and bind only default exact dev harness
      id: harness
      timeout-minutes: 28
      working-directory: source/cli
      run: |-
        set -euo pipefail
        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET
        python3 -B "$VALIDATE" run default-harness-compile 1500 cargo test --locked --profile dev --no-default-features --bin agent-browser --no-run --message-format=json
        python3 -B "$VALIDATE" run default-harness-inventory 90 python3 -B "$VALIDATE" harness "$GITHUB_WORKSPACE/source" default
    - name: Compile and bind only acceptance-faults exact dev harness
      id: faults_harness
      timeout-minutes: 28
      working-directory: source/cli
      run: |-
        set -euo pipefail
        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET
        python3 -B "$VALIDATE" run faults-harness-compile 1500 cargo test --locked --profile dev --no-default-features --features acceptance-faults --bin agent-browser --no-run --message-format=json
        python3 -B "$VALIDATE" run faults-harness-inventory 90 python3 -B "$VALIDATE" harness "$GITHUB_WORKSPACE/source" faults
    - name: Run frozen exact timing controls only; stop at first unexpected failure
      id: cases
      timeout-minutes: 13
      run: |-
        set -euo pipefail
        unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE
        while IFS= read -r id; do python3 -B "$VALIDATE" case "$id"; done < <(python3 -B -c 'import json,os;from pathlib import Path;p=json.loads((Path(os.environ["VALIDATE"]).parent/"producer-pins.json").read_text());print("\n".join(c["id"] for c in p["cases"]))')
    - name: Run recipe-local collector schema positive and negative controls
      id: collector_controls
      timeout-minutes: 1
      run: python3 -B "$VALIDATE" run collector-controls 30 env P04_E2E_SOURCE="$GITHUB_WORKSPACE/e2e-source" node recipe/scripts/p04-timing/collector-timing.test.mjs
    - name: Verify unchanged source after pure cases
      id: after_pure
      timeout-minutes: 1
      if: ${{ always() && steps.before.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run source-after-pure 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source"
    - name: Reconcile every exact raw ledger before any ci production compile
      id: pure
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run pure-summary 30 python3 -B "$VALIDATE" summary
    - name: Build new temporary feature-free ci ELF only after actual pure success
      id: build
      timeout-minutes: 37
      working-directory: source/cli
      run: |-
        set -euo pipefail
        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET
        python3 -B "$VALIDATE" run production-build 2100 cargo build --locked --profile ci --no-default-features --message-format=json
        python3 -B "$VALIDATE" run production-capture 60 python3 -B "$VALIDATE" production "$PRODUCT_DIR" production
      if: ${{ !cancelled() && steps.pure.outcome == 'success' }}
    - name: Verify source remains unchanged even after a build failure
      id: after
      timeout-minutes: 1
      if: ${{ always() && steps.before.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run source-after 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source"
    - name: Verify final temporary image and diagnostic provenance
      id: integrity
      timeout-minutes: 2
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.after.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run product-integrity 60 python3 -B "$VALIDATE" integrity "$PRODUCT_DIR"
    - name: Require every actual same-run diagnostic producer phase
      id: producer_gate
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" aggregate $PHASES
    - name: Bind actual local receipt and fresh ELF without external artifact placeholders
      id: local_product
      timeout-minutes: 2
      if: ${{ !cancelled() && steps.producer_gate.outcome == 'success' }}
      run: |-
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/local-product.exit"' EXIT
        node recipe/scripts/p04-timing/identity.mjs admit > "$EVIDENCE_DIR/local-product.log" 2>&1
    - name: Verify clean sources original fixtures and exact lock bytes
      id: sources
      timeout-minutes: 1
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/sources.exit"' EXIT
        node recipe/scripts/p04-timing/identity.mjs sources > "$EVIDENCE_DIR/sources.log" 2>&1
      if: ${{ !cancelled() && steps.local_product.outcome == 'success' }}
    - name: Select pinned pnpm without running dependency scripts
      id: pnpm
      uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      timeout-minutes: 2
      with:
        version: 12.3.4
        run_install: false
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Install frozen graph and build actual core and Web only
      id: dependencies
      timeout-minutes: 12
      working-directory: e2e-source
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/dependencies.exit"' EXIT
        exec > >(tee "$EVIDENCE_DIR/dependencies.log") 2>&1
        test "$(node --version)" = v24.19.0
        test "$(pnpm --version)" = 12.3.4
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm --filter e2e run build
        pnpm --filter @e2e-dev/web run build
        node ../recipe/scripts/p04-timing/identity.mjs dist
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Install original official complete Playwright Chromium distribution
      id: browser_install
      timeout-minutes: 10
      working-directory: e2e-source
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/browser-install.exit"' EXIT
        test ! -e "$PLAYWRIGHT_BROWSERS_PATH"
        install_root=$(mktemp -d /tmp/ep-XXXXXX)
        mkdir -m700 "$install_root/home" "$install_root/tmp" "$install_root/cache"
        env -i PATH="$(dirname "$(command -v node)"):/usr/bin:/bin" HOME="$install_root/home" TMPDIR="$install_root/tmp" XDG_CACHE_HOME="$install_root/cache" CI=1 LANG=C.UTF-8 \
          PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
          "$(command -v node)" packages/web/node_modules/playwright-core/cli.js install chromium > "$EVIDENCE_DIR/browser-install.log" 2>&1
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Verify required executables full Chrome exact image and native linkage
      id: images
      timeout-minutes: 3
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/runtime-images.exit"' EXIT
        missing=0
        for tool in node pnpm git unzip python3 timeout which readlink ldd fc-match; do
          if executable=$(command -v "$tool"); then printf '%s\t%s\n' "$tool" "$executable"; else printf 'MISSING\t%s\n' "$tool"; missing=1; fi
        done > "$EVIDENCE_DIR/required-executables.txt"
        for executable in /usr/bin/python3 /usr/bin/timeout /usr/bin/which /usr/bin/readlink; do
          if [[ ! -x "$executable" ]]; then printf 'MISSING\t%s\n' "$executable" >> "$EVIDENCE_DIR/required-executables.txt"; missing=1; fi
        done
        test "$missing" = 0
        font_file=$(fc-match -f '%{file}\n' sans | head -n1)
        test -n "$font_file"
        test -r "$font_file"
        printf '%s\n' "$font_file" > "$EVIDENCE_DIR/font-fallback.txt"
        node recipe/scripts/p04-timing/identity.mjs images
        node --input-type=module - <<'JS' > "$EVIDENCE_DIR/runtime-linkage-inputs.tsv"
        import {readFileSync} from 'node:fs';
        const images=JSON.parse(readFileSync(process.env.EVIDENCE_DIR+'/images-before.json'));
        for(const name of ['production','full']) console.log(name+'\t'+images[name].executable);
        JS
        linkage_failed=0
        while IFS=$'\t' read -r name executable; do
          set +e
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 ldd "$executable" > "$EVIDENCE_DIR/$name.ldd.txt" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/$name.ldd.exit"
          if [[ "$status" != 0 ]] || grep -Fq 'not found' "$EVIDENCE_DIR/$name.ldd.txt"; then linkage_failed=1; fi
        done < "$EVIDENCE_DIR/runtime-linkage-inputs.tsv"
        test "$linkage_failed" = 0
        printf '%s\n' 'Selected cases never start video and empty-recording cleanup returns immediately. System ffmpeg/ffprobe/codecs are not runtime inputs. Original Playwright install may download bundled FFmpeg/headless shell; neither is selected.' > "$EVIDENCE_DIR/codec-scope.txt"
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Run exactly this original case with its original budgets and cleanup
      id: runtime
      timeout-minutes: 11
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/runtime.exit"' EXIT
        test "$CASE_ID" = P04
        bash recipe/scripts/p04-timing/p04.sh
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Preserve raw timing on success or failure; missing evidence remains unknown
      id: diagnostic
      timeout-minutes: 1
      if: ${{ always() && steps.runtime.outcome != 'skipped' }}
      run: |-
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/diagnostic.exit"' EXIT
        node recipe/scripts/p04-timing/capture.mjs collect > "$EVIDENCE_DIR/diagnostic.log" 2>&1
    - name: Recheck source dist and image bytes after success or failure
      id: final_identities
      timeout-minutes: 3
      if: ${{ always() && steps.sources.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.images.outcome == 'success' }}
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/final-identities.exit"' EXIT
        node recipe/scripts/p04-timing/identity.mjs final > "$EVIDENCE_DIR/final-identities.log" 2>&1
    - name: Keep P04 acceptance and timing completeness separate but require both
      id: runtime_gate
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: node recipe/scripts/p04-timing/identity.mjs gate
    - name: Retain exact producer step outcomes
      id: outcomes
      timeout-minutes: 1
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: printf '%s\n' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"
    - name: Always retain producer diagnostics without signed download headers
      id: diagnostics
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      if: ${{ always() }}
      with:
        name: temporary-P04-timing-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE_DIR }}/
        if-no-files-found: error
        retention-days: 7
    - name: Retain removable diagnostic ELF only after producer success
      id: binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      if: ${{ !cancelled() && steps.producer_gate.outcome == 'success' }}
      with:
        name: temporary-p04-timing-native-${{ env.NATIVE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.PRODUCT_DIR }}/
        if-no-files-found: error
        retention-days: 7
