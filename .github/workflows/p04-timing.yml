# D rate comparison: independent zero/original runners, one invocation each, no repeated N.
name: P04 D-only rate comparison on verified existing ELF
'on':
  push:
    branches:
    - diagnostic/p04-direct-rate-compare-20261025
permissions:
  contents: read
concurrency:
  group: p04-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  comparison:
    name: P04 D rate ${{ matrix.rate }}
    if: ${{ github.ref == 'refs/heads/diagnostic/p04-direct-rate-compare-20261025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        rate:
        - zero
        - original
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      CASE_ID: P04
      COMPARISON_CELL: D
      P04_CAPTURE_RATE_MODE: ${{ matrix.rate }}
      RECIPE_SHA: ${{ github.workflow_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      RUNTIME_PHASES: local-product sources dependencies browser-install runtime-images runtime diagnostic final-identities
    steps:
    - name: Initialize one pre-registered N or D cell, no retry
      id: init
      timeout-minutes: 1
      run: 'set -euo pipefail

        umask 077

        test "$GITHUB_RUN_ATTEMPT" = 1

        test "$COMPARISON_CELL" = D

        export EVIDENCE_DIR="$RUNNER_TEMP/p04-comparison-evidence"

        export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/p04-comparison-playwright"

        printf ''EVIDENCE_DIR=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\n'' "$EVIDENCE_DIR" "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

        mkdir -m700 "$EVIDENCE_DIR"

        for phase in $RUNTIME_PHASES; do printf ''not-run\n'' > "$EVIDENCE_DIR/$phase.exit"; done

        printf ''%s\n'' ''D-only rate comparison: zero versus original, each once on independent runners. Earlier runs preserved; N is not repeated. D only last optional trace uses new
        oracle session, no native mask equivalence or original case pass. Prior failed run40175557827 remains failed; only its verified
        ci ELF is reused. No Rust build, retries, warmup, focus/visibility mutation or success-budget extension. Owned synthetic Chrome
        teardown retains original SIGKILL; observer itself sends no signals. Full native/333/release acceptance not claimed.'' > "$EVIDENCE_DIR/SCOPE.txt"

        uname -a > "$EVIDENCE_DIR/host.txt"

        cat /etc/os-release >> "$EVIDENCE_DIR/host.txt"

        . /etc/os-release

        test "$RUNNER_OS" = Linux

        test "$(uname -m)" = x86_64

        test "$(id -u)" -ne 0

        test "$ID" = ubuntu

        test "$VERSION_ID" = 24.04'
    - name: Check out this immutable producer recipe
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - name: Select pinned official Node
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      timeout-minutes: 2
      with:
        node-version: 24.19.0
        architecture: x64
    - name: Check out pinned native source for byte identity only, never compile
      id: source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/agent-browser
        ref: cb7acd41b596a65366a2d9f1cdbc312f088368be
        path: source
        persist-credentials: false
        fetch-depth: 2
    - name: Check out exact unchanged original P04 Web baseline
      id: e2e
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/e2e
        ref: 5adcc69574da30c539b585d92a793bca87fae2bc
        fetch-depth: 1
        path: e2e-source
        persist-credentials: false
    - id: local_product
      name: Verify and download exact historical diagnostic ELF, not a new producer
      timeout-minutes: 6
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/local-product.exit"'' EXIT

        node recipe/scripts/p04-timing/identity.mjs admit > "$EVIDENCE_DIR/local-product.log" 2>&1'
    - name: Verify clean sources original fixtures and exact lock bytes
      id: sources
      timeout-minutes: 1
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/sources.exit"'' EXIT

        node recipe/scripts/p04-timing/identity.mjs overlay

        node recipe/scripts/p04-timing/identity.mjs sources > "$EVIDENCE_DIR/sources.log" 2>&1

        '
      if: ${{ !cancelled() && steps.local_product.outcome == 'success' }}
    - name: Select pinned pnpm without running dependency scripts
      id: pnpm
      uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      timeout-minutes: 2
      with:
        version: 12.3.4
        run_install: false
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Install frozen graph and build actual core and Web only
      id: dependencies
      timeout-minutes: 12
      working-directory: e2e-source
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/dependencies.exit"'' EXIT

        exec > >(tee "$EVIDENCE_DIR/dependencies.log") 2>&1

        test "$(node --version)" = v24.19.0

        test "$(pnpm --version)" = 12.3.4

        pnpm install --frozen-lockfile --ignore-scripts

        pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build

        node ../recipe/scripts/p04-timing/identity.mjs dist

        '
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Install original official complete Playwright Chromium distribution
      id: browser_install
      timeout-minutes: 10
      working-directory: e2e-source
      run: "set -euo pipefail\ntrap 'printf \"%s\\n\" \"$?\" > \"$EVIDENCE_DIR/browser-install.exit\"' EXIT\ntest ! -e \"$PLAYWRIGHT_BROWSERS_PATH\"\
        \ninstall_root=$(mktemp -d /tmp/ep-XXXXXX)\nmkdir -m700 \"$install_root/home\" \"$install_root/tmp\" \"$install_root/cache\"\
        \nenv -i PATH=\"$(dirname \"$(command -v node)\"):/usr/bin:/bin\" HOME=\"$install_root/home\" TMPDIR=\"$install_root/tmp\" XDG_CACHE_HOME=\"\
        $install_root/cache\" CI=1 LANG=C.UTF-8 \\\n  PLAYWRIGHT_BROWSERS_PATH=\"$PLAYWRIGHT_BROWSERS_PATH\" \\\n  \"$(command -v node)\"\
        \ packages/web/node_modules/playwright-core/cli.js install chromium > \"$EVIDENCE_DIR/browser-install.log\" 2>&1\n"
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Verify required executables full Chrome exact image and native linkage
      id: images
      timeout-minutes: 3
      run: "set -euo pipefail\ntrap 'printf \"%s\\n\" \"$?\" > \"$EVIDENCE_DIR/runtime-images.exit\"' EXIT\nmissing=0\nfor tool in node\
        \ pnpm git unzip python3 timeout which readlink ldd fc-match; do\n  if executable=$(command -v \"$tool\"); then printf '%s\\\
        t%s\\n' \"$tool\" \"$executable\"; else printf 'MISSING\\t%s\\n' \"$tool\"; missing=1; fi\ndone > \"$EVIDENCE_DIR/required-executables.txt\"\
        \nfor executable in /usr/bin/python3 /usr/bin/timeout /usr/bin/which /usr/bin/readlink; do\n  if [[ ! -x \"$executable\" ]];\
        \ then printf 'MISSING\\t%s\\n' \"$executable\" >> \"$EVIDENCE_DIR/required-executables.txt\"; missing=1; fi\ndone\ntest \"\
        $missing\" = 0\nfont_file=$(fc-match -f '%{file}\\n' sans | head -n1)\ntest -n \"$font_file\"\ntest -r \"$font_file\"\nprintf\
        \ '%s\\n' \"$font_file\" > \"$EVIDENCE_DIR/font-fallback.txt\"\nnode recipe/scripts/p04-timing/identity.mjs images\nnode --input-type=module\
        \ - <<'JS' > \"$EVIDENCE_DIR/runtime-linkage-inputs.tsv\"\nimport {readFileSync} from 'node:fs';\nconst images=JSON.parse(readFileSync(process.env.EVIDENCE_DIR+'/images-before.json'));\n\
        for(const name of ['production','full']) console.log(name+'\\t'+images[name].executable);\nJS\nlinkage_failed=0\nwhile IFS=$'\\\
        t' read -r name executable; do\n  set +e\n  env -i PATH=/usr/bin:/bin LANG=C.UTF-8 ldd \"$executable\" > \"$EVIDENCE_DIR/$name.ldd.txt\"\
        \ 2>&1\n  status=$?\n  set -e\n  printf '%s\\n' \"$status\" > \"$EVIDENCE_DIR/$name.ldd.exit\"\n  if [[ \"$status\" != 0 ]]\
        \ || grep -Fq 'not found' \"$EVIDENCE_DIR/$name.ldd.txt\"; then linkage_failed=1; fi\ndone < \"$EVIDENCE_DIR/runtime-linkage-inputs.tsv\"\
        \ntest \"$linkage_failed\" = 0\nprintf '%s\\n' 'Selected cases never start video and empty-recording cleanup returns immediately.\
        \ System ffmpeg/ffprobe/codecs are not runtime inputs. Original Playwright install may download bundled FFmpeg/headless shell;\
        \ neither is selected.' > \"$EVIDENCE_DIR/codec-scope.txt\"\n"
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Run exactly one fixed cell with original budgets, no retry
      id: runtime
      timeout-minutes: 11
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/runtime.exit"'' EXIT

        test "$CASE_ID" = P04

        bash recipe/scripts/p04-timing/p04.sh

        '
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Preserve raw timing on success or failure; missing evidence remains unknown
      id: diagnostic
      timeout-minutes: 1
      if: ${{ always() && steps.runtime.outcome != 'skipped' }}
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/diagnostic.exit"'' EXIT

        node recipe/scripts/p04-timing/capture.mjs collect > "$EVIDENCE_DIR/diagnostic.log" 2>&1'
    - name: Recheck source dist and image bytes after success or failure
      id: final_identities
      timeout-minutes: 3
      if: ${{ always() && steps.sources.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.images.outcome == 'success'
        }}
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/final-identities.exit"'' EXIT

        node recipe/scripts/p04-timing/identity.mjs final > "$EVIDENCE_DIR/final-identities.log" 2>&1

        '
    - name: Keep original N acceptance and D-only diagnosis separate, reject unknown
      id: runtime_gate
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: node recipe/scripts/p04-timing/identity.mjs gate
    - name: Retain exact consumer step outcomes
      id: outcomes
      timeout-minutes: 1
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: printf '%s\n' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"
    - name: Retain each independent cell evidence even on failure
      id: diagnostics
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      if: ${{ always() }}
      with:
        name: p04-rate-${{ matrix.rate }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE_DIR }}/
        if-no-files-found: error
        retention-days: 7
