        '
      if: ${{ !cancelled() && steps.complete_build.outcome == 'success' && steps.playwright_browser_install.outcome
        == 'success' }}
    - name: package-github
      id: package_github
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm --filter @e2e-dev/github run test --reporter=verbose --reporter=json
        --outputFile.json="$GITHUB_WORKSPACE/evidence/github.json"

        ) 2>&1 | tee "evidence/package-github.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/package-github.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.complete_build.outcome == 'success' && steps.playwright_browser_install.outcome
        == 'success' }}
    - name: package-kernel
      id: package_kernel
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm --filter @e2e-dev/kernel run test --reporter=verbose --reporter=json
        --outputFile.json="$GITHUB_WORKSPACE/evidence/kernel.json"

        ) 2>&1 | tee "evidence/package-kernel.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/package-kernel.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.complete_build.outcome == 'success' && steps.playwright_browser_install.outcome
        == 'success' }}
    - name: package-lightpanda
      id: package_lightpanda
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm --filter @e2e-dev/lightpanda run test --reporter=verbose --reporter=json
        --outputFile.json="$GITHUB_WORKSPACE/evidence/lightpanda.json"

        ) 2>&1 | tee "evidence/package-lightpanda.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/package-lightpanda.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.complete_build.outcome == 'success' && steps.playwright_browser_install.outcome
        == 'success' }}
    - name: package-eas
      id: package_eas
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm --filter @e2e-dev/eas run test --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/eas.json"

        ) 2>&1 | tee "evidence/package-eas.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/package-eas.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.complete_build.outcome == 'success' && steps.playwright_browser_install.outcome
        == 'success' }}
    - name: package-smol
      id: package_smol
