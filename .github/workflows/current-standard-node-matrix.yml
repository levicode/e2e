{
  "name": "S20 original independent standard checks",
  "on": {
    "push": {
      "branches": [
        "ci/s22-repair-independent-standard-20261031"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "s22-repair-independent-standard-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "env": {
    "E2E_TELEMETRY_DISABLED": "1",
    "E2E_UPDATE_CHECK_DISABLED": "1",
    "NEXT_TELEMETRY_DISABLED": "1"
  },
  "jobs": {
    "check": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Require clean source before evidence and record exact identity",
          "run": "set -euo pipefail\ntest -z \"$(git status --porcelain)\"\ntest \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\nmkdir -p evidence\ngit rev-parse HEAD > evidence/e2e-source.sha\ngit rev-parse HEAD^{tree} > evidence/e2e-source.tree\ngit ls-tree -r HEAD > evidence/source-tree-listing.txt\ngit ls-tree -r HEAD | grep -vF $'\\t.github/workflows/full-standard-node-matrix.yml' | grep -vF $'\\t.github/workflows/s5-focused-original-core.yml' | grep -vF $'\\tscripts/ci/full-standard-runtime-pins.json' > evidence/source-inventory.txt\nsha256sum evidence/source-tree-listing.txt evidence/source-inventory.txt > evidence/source-evidence.sha256\nsha256sum pnpm-lock.yaml .github/native-candidate.json scripts/ci/full-standard-runtime-pins.json > evidence/source-pins.sha256\n"
        },
        {
          "uses": "pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1"
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": 26,
            "check-latest": true,
            "cache": "pnpm"
          }
        },
        {
          "name": "Record actual Node and package-manager versions",
          "run": "node --version > evidence/node.version\npnpm --version > evidence/pnpm.version\nnpm --version > evidence/npm.version\n"
        },
        {
          "name": "dependencies",
          "id": "dependencies",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm install --frozen-lockfile\n) 2>&1 | tee \"evidence/dependencies.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/dependencies.exit\"\nexit \"$s\"\n"
        },
        {
          "name": "Restore reviewed S20 ordinary producer with unchanged source-bound verifier",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "RUNTIME_KIND": "ordinary"
          },
          "run": "set -euo pipefail\nmkdir -p evidence/tools\nbash -euo pipefail scripts/ci/full-standard-helpers-1.sh\nsha256sum scripts/ci/full-standard-helpers-1.sh scripts/ci/native-runtime.ts evidence/tools/download-runtime.py evidence/tools/verify-runtimes.ts > evidence/runtime-verifier-source.sha256\npython3 evidence/tools/download-runtime.py\n",
          "id": "restore",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "verify-runtime",
          "id": "verify_runtime",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\nnode evidence/tools/verify-runtimes.ts\n) 2>&1 | tee \"evidence/verify-runtime.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/verify-runtime.exit\"\n# Preserve the exact generated verifier as evidence, not as repository source.\nmv evidence/tools/verify-runtimes.ts evidence/tools/verify-runtimes.ts.txt || exit \"$?\"\nsha256sum evidence/tools/verify-runtimes.ts.txt > evidence/runtime-verifier-archived.sha256 || exit \"$?\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.restore.outcome == 'success' }}",
          "env": {
            "NEED_FAULT": "0"
          }
        },
        {
          "name": "native-browser-codecs",
          "id": "native_browser_codecs",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\n\"$E2E_AGENT_BROWSER_EXECUTABLE\" install --with-deps\nif ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then\n sudo apt-get update\n sudo apt-get install -y ffmpeg\nfi\nffmpeg -version\nffprobe -version\n) 2>&1 | tee \"evidence/native-browser-codecs.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/native-browser-codecs.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.verify_runtime.outcome == 'success' }}"
        },
        {
          "name": "complete-build",
          "id": "complete_build",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm run build\n) 2>&1 | tee \"evidence/complete-build.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/complete-build.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "lint",
          "id": "lint",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm lint\n) 2>&1 | tee \"evidence/lint.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/lint.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "dead-code",
          "id": "dead_code",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm check:dead-code\n) 2>&1 | tee \"evidence/dead-code.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/dead-code.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "typecheck",
          "id": "typecheck",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm typecheck\n) 2>&1 | tee \"evidence/typecheck.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/typecheck.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "error-code-reference",
          "id": "error_code_reference",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm docs:check-errors\n) 2>&1 | tee \"evidence/error-code-reference.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/error-code-reference.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "peer-ranges",
          "id": "peer_ranges",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm check:peer-ranges\n) 2>&1 | tee \"evidence/peer-ranges.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/peer-ranges.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "changeset-bumps",
          "id": "changeset_bumps",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm check:changeset-bumps\n) 2>&1 | tee \"evidence/changeset-bumps.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/changeset-bumps.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "no-install-scripts",
          "id": "no_install_scripts",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm check:install-scripts\n) 2>&1 | tee \"evidence/no-install-scripts.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/no-install-scripts.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "plugin-sources",
          "id": "plugin_sources",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm plugins:check\n) 2>&1 | tee \"evidence/plugin-sources.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/plugin-sources.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "mcp-registry-source",
          "id": "mcp_registry_source",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm mcp-server:check\n) 2>&1 | tee \"evidence/mcp-registry-source.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/mcp-registry-source.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "babysit-types",
          "id": "babysit_types",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm exec tsc -p .dev/skills/babysit/scripts\n) 2>&1 | tee \"evidence/babysit-types.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/babysit-types.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "babysit-tests",
          "id": "babysit_tests",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\nnode --test .dev/skills/babysit/scripts/pr-status.test.ts\n) 2>&1 | tee \"evidence/babysit-tests.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/babysit-tests.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "uses": "./.github/actions/mcp-publisher",
          "id": "publisher_tool",
          "if": "${{ !cancelled() && steps.dependencies.outcome == 'success' }}"
        },
        {
          "name": "publisher-validate",
          "id": "publisher_validate",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\n\"$RUNNER_TEMP/mcp-publisher\" validate packages/e2e/server.json\n) 2>&1 | tee \"evidence/publisher-validate.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/publisher-validate.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.publisher_tool.outcome == 'success' }}"
        },
        {
          "name": "public-browser-install",
          "id": "public_browser_install",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\nnode packages/web/dist/bin.js install chromium --with-deps\n) 2>&1 | tee \"evidence/public-browser-install.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/public-browser-install.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.complete_build.outcome == 'success' && steps.native_browser_codecs.outcome == 'success' }}"
        },
        {
          "name": "testbed-full-no-model-key",
          "id": "testbed_full_no_model_key",
          "run": "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\npnpm --filter @e2e-dev/testbed test\n) 2>&1 | tee \"evidence/testbed-full-no-model-key.log\"\ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/testbed-full-no-model-key.exit\"\nexit \"$s\"\n",
          "if": "${{ !cancelled() && steps.complete_build.outcome == 'success' && steps.public_browser_install.outcome == 'success' }}"
        },
        {
          "name": "Require every independent command outcome; no skipped execution passes",
          "if": "${{ always() }}",
          "env": {
            "COMMAND_STEPS": "${{ toJSON(steps) }}"
          },
          "run": "python3 - <<'PY_RESULT'\nimport json,os,pathlib\np=pathlib.Path('evidence');p.mkdir(exist_ok=True)\ns=json.loads(os.environ['COMMAND_STEPS']);out={k:v.get('outcome') for k,v in s.items()};(p/'steps.json').write_text(json.dumps(out,indent=2)+'\\n')\nfailed={k:v for k,v in out.items() if v!='success'}\nassert not failed,failed\nPY_RESULT\n"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "${{ always() }}",
          "with": {
            "name": "standard-node26-check-evidence",
            "path": "evidence/",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ],
      "env": {
        "NODE_SELECTOR": "26",
        "NEED_FAULT": "0"
      }
    },
    "install": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "pnpm": [
            11,
            12
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
