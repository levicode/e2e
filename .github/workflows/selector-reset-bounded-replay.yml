        2>&1 | tee "$GITHUB_WORKSPACE/evidence/tests.log"

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > "$GITHUB_WORKSPACE/evidence/tests.exit"

        python3 - <<''PY_COUNT''

        import json,pathlib,os

        p=pathlib.Path(os.environ[''GITHUB_WORKSPACE''])/''evidence'';r=json.load(open(p/''results.json''));a=[x
        for t in r[''testResults''] for x in t[''assertionResults'']];c={k:r[k] for
        k in [''numTotalTests'',''numPassedTests'',''numFailedTests'',''numPendingTests'']};c[''innerPassAssertionsExpected'']={''publicLight'':7,''visibleUnion'':4};c[''innerEvidence'']=''unchanged
        wrappers assert exact titles, statuses and no run errors'';c[''side'']=os.environ[''E2E_SELECTOR_PAIR_LABEL''];(p/''counts.json'').write_text(json.dumps(c,indent=2));assert
        len(a)==r[''numTotalTests'']==2 and r[''numPendingTests'']==0

        PY_COUNT

        exit "$status"

        '
      if: ${{ success() && steps.selector_types.outcome == 'success' }}
    - name: Run source-exact pure selector and rendered interpreter oracles separately
        from public gates
      if: ${{ always() && steps.selector_types.outcome == 'success' }}
      run: "set -euo pipefail\ntest \"$(git -C selector-native rev-parse HEAD)\" =\
        \ \"$NATIVE_SOURCE_SHA\"\ntest \"$(git -C selector-native rev-parse HEAD^{tree})\"\
        \ = \"$NATIVE_SOURCE_TREE\"\ntest -z \"$(git -C selector-native status --porcelain)\"\
        \npnpm --filter @e2e-dev/web exec node -p \"require('node:path').dirname(require.resolve('playwright-core/package.json'))\"\
        \ > \"$GITHUB_WORKSPACE/evidence/pw-core.path\"\nexport PLAYWRIGHT_CORE_DIR=\"\
        $(cat \"$GITHUB_WORKSPACE/evidence/pw-core.path\")\"\nexport CHROME_PATH=\"\
        $(cat \"$GITHUB_WORKSPACE/evidence/borrowed-chrome.path\")\"\npython3 - <<'PY_JS'\n\
        import os,pathlib,subprocess,json\nroot=pathlib.Path(os.environ['GITHUB_WORKSPACE']);native=root/'selector-native';out=root/'evidence/selector-direct';out.mkdir(parents=True,exist_ok=True)\n\
        assert json.load(open(pathlib.Path(os.environ['PLAYWRIGHT_CORE_DIR'])/'package.json'))['version']=='1.64.1'\n\
        fixtures=['visible-chain','union-root','attribute-selectors','query-matcher','visibility','author-metadata','fresh-fields','locator-projection','public-content-name','visible-chain-browser','capture-nth-oracle'];rows=[]\n\
        source=native/'cli/src/native/client_observation.rs'\nfor name in fixtures:\n\
        \ command=['node',str(native/('cli/tests/fixtures/native-observation-'+name+'.cjs')),str(source)]\n\
        \ if name=='fresh-fields':command.append(str(native/'cli/src/native/client_observation/fresh_query.rs'))\n\
        \ p=subprocess.run(command,cwd=native,capture_output=True,text=True);(out/(name+'.log')).write_text(p.stdout+p.stderr);rows.append({'fixture':name,'exit':p.returncode,'kind':'direct-interpreter-or-pinned-oracle-not-public-transport'})\n\
        (out/'results.json').write_text(json.dumps({'native':os.environ['NATIVE_SOURCE_SHA'],'tree':os.environ['NATIVE_SOURCE_TREE'],'results':rows,'publicTransportAcceptance':False},indent=2));assert\
        \ all(x['exit']==0 for x in rows),rows\nPY_JS\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
