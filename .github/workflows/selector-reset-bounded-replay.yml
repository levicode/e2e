name: Bounded selector paired verification and reset diagnosis
'on':
  push:
    branches:
    - ci/selector-reset-bounded-replay
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: selector-reset-bounded-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 1b0d6fe15fbca4e916edadfa12e529365c48435d
  NATIVE_SOURCE_TREE: 0bc8ba70ba1c8e26ac2717f8194c403d109d964c
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  interop-reset-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from
        "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Restore immutable ordinary artifact 12801534331 with metadata and ZIP
        hash verification
      timeout-minutes: 4
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p evidence

        python3 scripts/ci/download-browser-recovery-runtime.py

        '
    - name: Verify exact prior source compiler host and binary
      id: verify
      run: 'set -euo pipefail

        node scripts/ci/verify-browser-recovery-runtime.ts "$RUNNER_TEMP/ci-native-runtime"

        '
      timeout-minutes: 1
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
      id: chrome
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
      id: build
    - name: Install and verify the exact original borrowed-host Playwright Chromium
      timeout-minutes: 8
      id: borrowed_chrome
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec playwright-core install chromium

        pnpm --filter @e2e-dev/web exec node --input-type=module - <<''JS_CHROME''

        import { chromium } from ''playwright-core'';

        import { readFileSync, writeFileSync } from ''node:fs'';

        import { createHash } from ''node:crypto'';

        import { execFileSync } from ''node:child_process'';

        import assert from ''node:assert/strict'';

        import { createRequire } from ''node:module'';

        const require=createRequire(import.meta.url);assert.equal(require(''playwright-core/package.json'').version,''1.64.1'');

        const executable=chromium.executablePath();assert(!/[\r\n]/.test(executable));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.json'',JSON.stringify({executable,version:execFileSync(executable,[''--version''],{encoding:''utf8''}).trim(),sha256:createHash(''sha256'').update(readFileSync(executable)).digest(''hex''),playwright:''1.64.1''},null,2));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.path'',executable);

        JS_CHROME

        chrome="$(cat evidence/borrowed-chrome.path)"

        ldd "$chrome" > evidence/borrowed-chrome-ldd.txt

        ! grep -q ''not found'' evidence/borrowed-chrome-ldd.txt

        profile="$(mktemp -d "$RUNNER_TEMP/g2-borrowed-preflight.XXXXXX")"

        trap ''rm -rf -- "$profile"'' EXIT

        timeout --kill-after=2s 20 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage
        --user-data-dir="$profile" --dump-dom about:blank > evidence/borrowed-chrome-preflight.html
        2> evidence/borrowed-chrome-preflight.log

        '
    - name: Typecheck exact interop source (full units run independently)
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec tsc --noEmit -p tsconfig.interop-check.json

        '
    - name: Enable per-process bounded native trace without changing binary
      run: 'set -euo pipefail

        # Install only after the verified binary has installed Chrome, before original
        tests.

        test -x "$E2E_AGENT_BROWSER_EXECUTABLE"

        mkdir -p "$GITHUB_WORKSPACE/evidence/native-trace"

        printf ''%s\n'' "$E2E_AGENT_BROWSER_EXECUTABLE" > evidence/native-trace/original-executable.path

        sha256sum "$E2E_AGENT_BROWSER_EXECUTABLE" > evidence/native-trace/original-executable.sha256

        cp scripts/ci/native-trace-wrapper.sh "$RUNNER_TEMP/native-trace-wrapper.sh"

        chmod +x "$RUNNER_TEMP/native-trace-wrapper.sh"

        printf ''E2E_DIAGNOSTIC_NATIVE_EXECUTABLE=%s\n'' "$E2E_AGENT_BROWSER_EXECUTABLE"
        >> "$GITHUB_ENV"

        printf ''E2E_DIAGNOSTIC_DIR=%s\n'' "$GITHUB_WORKSPACE/evidence/native-trace"
        >> "$GITHUB_ENV"

        printf ''E2E_AGENT_BROWSER_EXECUTABLE=%s\n'' "$RUNNER_TEMP/native-trace-wrapper.sh"
        >> "$GITHUB_ENV"

        '
      id: trace_setup
    - name: Execute exact 2 real interop-reset-restore cases
      if: ${{ success() && steps.trace_setup.outcome == 'success' }}
      run: 'set -euo pipefail

        mkdir -p evidence

        pnpm --filter @e2e-dev/web exec vitest list --config vitest.interop-replacement.config.ts
        --no-staticParse --json="$GITHUB_WORKSPACE/evidence/collection.json"

        python3 - <<''PY_COLLECT''

        import json

        r=json.load(open(''evidence/collection.json''));assert len(r)==2,len(r)

        PY_COLLECT

        export E2E_INTEROP_EVIDENCE_DIR="$GITHUB_WORKSPACE/evidence/receipts"

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        set +e

        pnpm --filter @e2e-dev/web exec vitest run --config vitest.interop-replacement.config.ts
        --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json"
        2>&1 | tee evidence/tests.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/tests.exit

        python3 - <<''PY_RESULTS''

        import json,pathlib

        r=json.load(open(''evidence/results.json''));a=[x for t in r[''testResults'']
        for x in t[''assertionResults'']];counts={k:r[k] for k in [''numTotalTests'',''numPassedTests'',''numFailedTests'',''numPendingTests'']};json.dump(counts,open(''evidence/counts.json'',''w''),indent=2)

        assert len(a)==r[''numTotalTests'']==2 and r[''numPendingTests'']==0

        receipts=[json.load(open(p)) for p in pathlib.Path(''evidence/receipts'').glob(''*.json'')];assert
        len(receipts)==2,len(receipts)

        assert r[''numPassedTests'']==2 and r[''numFailedTests'']==0

        assert all(x[''runtime'']==''passed'' and x[''cleanup'']==''passed'' for x
        in receipts)

        PY_RESULTS

        test "$status" -eq 0

        '
    - name: Validate separate per-process ordinary and critical trace boundaries
      if: always()
      run: 'set +e

        python3 scripts/ci/check-native-firstcause-traces-lossaware.py 2

        a=$?

        python3 scripts/ci/check-critical-query-traces.py 2

        b=$?

        test "$a" -eq 0 && test "$b" -eq 0

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: same-source-reset-original-two-diagnostic
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    env:
      E2E_SCOPE_RETIREMENT_DIAGNOSTIC: '1'
      E2E_INTEROP_BINDING_DIAGNOSTIC: '1'
      E2E_PLATFORM_HANDLER_DIAGNOSTIC: '1'
      E2E_DOWNLOAD_RELEASE_DIAGNOSTIC: '0'
  public-selectors-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/e2e
        ref: 42671f84d322c4b1afb2ec64809f18a151c39ab5
        path: baseline
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Record exact product identity
      run: 'set -euo pipefail

        mkdir -p evidence

        git -C baseline rev-parse HEAD > evidence/product-checkout.sha

        git -C baseline rev-parse HEAD^{tree} > evidence/product-checkout.tree

        sha256sum baseline/packages/e2e/tests/fixtures/public-light.e2e.ts baseline/packages/e2e/tests/fixtures/public-visible-union.e2e.ts
        baseline/packages/e2e/tests/integration/web-selector-public-light.test.ts
        baseline/packages/e2e/tests/integration/web-selector-visible-union.test.ts
        > evidence/probe-files.sha256

        printf "%s\n" baseline > evidence/pair-label

        test -z "$(git -C baseline status --porcelain)"

        test "$(git -C baseline rev-parse HEAD)" = "42671f84d322c4b1afb2ec64809f18a151c39ab5"

        test "$(git -C baseline rev-parse HEAD^{tree})" = "77a6c1915f6acbed8dc268d63ed38f1be2073a16"

        printf "PLAYWRIGHT_BROWSERS_PATH=%s/selector-pw-host\n" "$RUNNER_TEMP" >>
        "$GITHUB_ENV"

        '
    - run: pnpm install --frozen-lockfile
      working-directory: baseline
    - name: Restore immutable ordinary artifact 12801534331 with metadata and ZIP
        hash verification
      timeout-minutes: 4
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p evidence

        python3 scripts/ci/download-browser-recovery-runtime.py

        '
    - name: Verify exact prior source compiler host and binary
      id: verify
      run: 'set -euo pipefail

        node scripts/ci/verify-browser-recovery-runtime.ts "$RUNNER_TEMP/ci-native-runtime"

        '
      timeout-minutes: 1
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
      id: chrome
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
      id: build
      working-directory: baseline
    - name: Install and verify the exact original borrowed-host Playwright Chromium
      timeout-minutes: 8
      id: borrowed_chrome
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec playwright-core install chromium

        pnpm --filter @e2e-dev/web exec node --input-type=module - <<''JS_CHROME''

        import { chromium } from ''playwright-core'';

        import { readFileSync, writeFileSync } from ''node:fs'';

        import { createHash } from ''node:crypto'';

        import { execFileSync } from ''node:child_process'';

        import assert from ''node:assert/strict'';

        import { createRequire } from ''node:module'';

        const require=createRequire(import.meta.url);assert.equal(require(''playwright-core/package.json'').version,''1.64.1'');

        const executable=chromium.executablePath();assert(!/[\r\n]/.test(executable));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.json'',JSON.stringify({executable,version:execFileSync(executable,[''--version''],{encoding:''utf8''}).trim(),sha256:createHash(''sha256'').update(readFileSync(executable)).digest(''hex''),playwright:''1.64.1''},null,2));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.path'',executable);

        JS_CHROME

        chrome="$(cat "$GITHUB_WORKSPACE/evidence/borrowed-chrome.path")"

        ldd "$chrome" > "$GITHUB_WORKSPACE/evidence/borrowed-chrome-ldd.txt"

        ! grep -q ''not found'' "$GITHUB_WORKSPACE/evidence/borrowed-chrome-ldd.txt"

        profile="$(mktemp -d "$RUNNER_TEMP/g2-borrowed-preflight.XXXXXX")"

        trap ''rm -rf -- "$profile"'' EXIT

        timeout --kill-after=2s 20 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage
        --user-data-dir="$profile" --dump-dom about:blank > "$GITHUB_WORKSPACE/evidence/borrowed-chrome-preflight.html"
        2> "$GITHUB_WORKSPACE/evidence/borrowed-chrome-preflight.log"

        '
      working-directory: baseline
    - name: Typecheck identical public selector fixtures and wrappers
      run: 'set -euo pipefail

        cat > tsconfig.selector-gate.json <<''JSON''

        {"extends": "./tsconfig.base.json", "compilerOptions": {"lib": ["ES2023",
        "DOM", "DOM.Iterable"], "noEmit": true, "paths": {"e2e": ["./packages/e2e/src/index.ts"],
        "e2e/engine": ["./packages/e2e/src/engine/index.ts"], "@e2e-dev/web": ["./packages/web/src/index.ts"]}},
        "files": ["packages/e2e/tests/fixtures/public-light.e2e.ts", "packages/e2e/tests/fixtures/public-visible-union.e2e.ts",
        "packages/e2e/tests/integration/web-selector-public-light.test.ts", "packages/e2e/tests/integration/web-selector-visible-union.test.ts"]}

        JSON

        pnpm exec tsc --noEmit -p tsconfig.selector-gate.json

        rm tsconfig.selector-gate.json

        '
      working-directory: baseline
      id: selector_types
    - name: Execute identical public selector gates; retain original exit and exact
        outer assertions
      run: 'set -euo pipefail

        unset E2E_AGENT_BROWSER_EXECUTABLE AGENT_BROWSER_EXECUTABLE

        pnpm --filter e2e exec vitest list tests/integration/web-selector-public-light.test.ts
        tests/integration/web-selector-visible-union.test.ts --no-staticParse --json="$GITHUB_WORKSPACE/evidence/collection.json"

        python3 - <<''PY_LIST''

        import json,os

        rows=json.load(open(os.environ[''GITHUB_WORKSPACE'']+''/evidence/collection.json''));assert
        len(rows)==2

        assert {r[''file''].split(''/'')[-1] for r in rows}=={''web-selector-public-light.test.ts'',''web-selector-visible-union.test.ts''}

        PY_LIST

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        set +e

        pnpm --filter e2e exec vitest run tests/integration/web-selector-public-light.test.ts
        tests/integration/web-selector-visible-union.test.ts --project integration
        --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json"
        2>&1 | tee "$GITHUB_WORKSPACE/evidence/tests.log"

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > "$GITHUB_WORKSPACE/evidence/tests.exit"

        python3 - <<''PY_COUNT''

        import json,pathlib,os

        p=pathlib.Path(os.environ[''GITHUB_WORKSPACE''])/''evidence'';r=json.load(open(p/''results.json''));a=[x
        for t in r[''testResults''] for x in t[''assertionResults'']];c={k:r[k] for
        k in [''numTotalTests'',''numPassedTests'',''numFailedTests'',''numPendingTests'']};c[''innerPassAssertionsExpected'']={''publicLight'':7,''visibleUnion'':4};c[''innerEvidence'']=''unchanged
        wrappers assert exact titles, statuses and no run errors'';c[''side'']=os.environ[''E2E_SELECTOR_PAIR_LABEL''];(p/''counts.json'').write_text(json.dumps(c,indent=2));assert
        len(a)==r[''numTotalTests'']==2 and r[''numPendingTests'']==0

        PY_COUNT

        exit "$status"

        '
      working-directory: baseline
      if: ${{ success() && steps.selector_types.outcome == 'success' }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: public-selectors-baseline-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    env:
      E2E_SCOPE_RETIREMENT_DIAGNOSTIC: '0'
      E2E_INTEROP_BINDING_DIAGNOSTIC: '0'
      E2E_PLATFORM_HANDLER_DIAGNOSTIC: '0'
      E2E_DOWNLOAD_RELEASE_DIAGNOSTIC: '0'
      E2E_SELECTOR_PAIR_LABEL: baseline
