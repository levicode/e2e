name: Supplementary macOS 26 ARM native reference regression
on:
  push:
    branches: [diagnostic/native-refs-arm26]
permissions:
  contents: read
  actions: read
concurrency:
  group: native-refs-arm26-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            artifact: 12266899938
            producer: '39424881512'
            digest: 565826a5ab28c07cca3f23d18ba41d467696a05fc0ab8dc3e1afb464d2a0bcd5
    defaults:
      run:
        shell: bash
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 0c8cd90367d2dee7ec87c2eede2e0f71a25ea8ed
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter e2e build && pnpm --filter @e2e-dev/web build && pnpm --filter @e2e-dev/mobile build && pnpm --filter @e2e-dev/agent-browser build
      - run: pnpm --filter e2e typecheck && pnpm --filter @e2e-dev/agent-browser typecheck
      - run: pnpm exec oxlint packages/e2e/src packages/e2e/tests packages/agent-browser/src packages/agent-browser/tests
      - run: pnpm --filter e2e test:unit && pnpm --filter @e2e-dev/agent-browser test
      - name: Download immutable verified native artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact }}
          ARTIFACT_DIGEST: ${{ matrix.digest }}
        run: |
          mkdir -p .validation-tools/focused-native
          curl --fail --location --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/levicode/e2e/actions/artifacts/$ARTIFACT_ID/zip" -o .validation-tools/native.zip
          node -e 'const fs=require("node:fs"),c=require("node:crypto"),a=require("node:assert/strict");a.equal(c.createHash("sha256").update(fs.readFileSync(".validation-tools/native.zip")).digest("hex"),process.env.ARTIFACT_DIGEST)'
          unzip -q .validation-tools/native.zip -d .validation-tools/focused-native
      - name: Verify producer provenance without rewriting source stamps
        env:
          PRODUCER_RUN: ${{ matrix.producer }}
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,tarfile
          directory=pathlib.Path('.validation-tools/focused-native').resolve()
          lock=pathlib.Path('packages/agent-browser/native-source.lock.json').read_bytes()
          m=json.loads((directory/'manifest.json').read_bytes())
          assert m['schemaVersion']==2
          assert m['nativeSource']==json.loads(lock)
          assert m['sourceLockSha256']==hashlib.sha256(lock).hexdigest()
          assert m['e2eSource']=={'repository':'https://github.com/levicode/e2e','commit':'e7535cfcd736d158ec04c608b41cb3fd7faa789d','tree':'44f74c2fcc42cb403f596a27ce53c13e6b69c354'}
          assert m['workflowRun']==os.environ['PRODUCER_RUN']
          assert m['workflowAttempt']=='1'
          assert m['rustVersion'].startswith('rustc 1.99.1 ')
          assert m['nodeVersion']=='v24.19.0'
          a=m['archive'];assert a['name']==pathlib.Path(a['name']).name
          data=(directory/a['name']).read_bytes()
          assert len(data)==a['bytes'] and hashlib.sha256(data).hexdigest()==a['sha256']
          with tarfile.open(directory/a['name'],'r:gz') as tar:
            members=tar.getmembers();assert sorted(m.name for m in members)==['LICENSE','NOTICE','agent-browser']
            assert all(m.isfile() and m.name==pathlib.Path(m.name).name for m in members)
            member=tar.getmember('agent-browser');assert member.mode==0o755
            binary=tar.extractfile(member).read()
          b=m['binary'];assert b['name']=='agent-browser' and b['mode']=='0755'
          assert len(binary)==b['bytes'] and hashlib.sha256(binary).hexdigest()==b['sha256']
          destination=directory/'agent-browser';destination.write_bytes(binary);destination.chmod(0o755)
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write(f'E2E_AGENT_BROWSER_EXECUTABLE={destination}\n')
          PYTHON
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'; import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('.validation-tools/focused-native/manifest.json'));
          assert.equal(m.platform,process.platform);assert.equal(m.architecture,process.arch);
          NODE
      - name: Verify native version and capability contract
        run: node --test packages/agent-browser/tests/native-contract.integration.ts
      - name: Install pinned Chromium
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/focused-chromium"
          pnpm --filter @e2e-dev/web exec playwright-core install --with-deps chromium
          CHROME=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f \( -path '*/chrome-linux*/chrome' -o -path '*/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing' \))
          test -x "$CHROME"
          echo "E2E_CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Linux ]]; then echo 'E2E_CHROMIUM_NO_SANDBOX=1' >> "$GITHUB_ENV"; fi
      - name: Run focused HTML OBJECT and native model reference regressions
        run: node --test --test-name-pattern "^HTML OBJECT" packages/agent-browser/tests/state-pixels.integration.ts packages/agent-browser/tests/model-boundary.integration.ts
      - name: Core cross-engine integration regressions on macOS 26 ARM
        run: pnpm --filter e2e exec vitest run --project integration
