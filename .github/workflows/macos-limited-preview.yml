        s=$?

        printf ''%s\n'' "$s" > .artifacts/macos-limited-preview/core-proof.exit

        cat .artifacts/macos-limited-preview/core-proof.stderr.log >&2

        exit "$s"

        '
    - name: Require original installed11 and independent core; keep full gate failed
