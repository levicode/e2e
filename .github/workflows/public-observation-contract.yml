name: focused actual public observation contracts on verified current native
'on':
  push:
    branches:
    - implement/public-observation-contract-ci
permissions:
  contents: read
concurrency:
  group: public-observation-${{ github.sha }}
  cancel-in-progress: false
env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_BUILD_JOBS: '2'
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  public-contracts:
    permissions:
      contents: read
      actions: read
    env:
      E2E_APT_CACHE_ROLE: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/e2e
        ref: 4be49596fe85762b0d7947bbfd50d91b611a00f7
        path: source
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        package_json_file: source/package.json
    - name: Restore exact current native bytes; no new compile or imported pass
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p evidence

        curl --fail --silent --show-error --location --retry 2 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H ''Accept:
        application/vnd.github+json'' https://api.github.com/repos/levicode/e2e/actions/artifacts/12668260008/zip -o "$RUNNER_TEMP/native-images.zip"

        python3 recipe/scripts/web-functional/restore-names-native.py images "$RUNNER_TEMP/native-images.zip" "$GITHUB_WORKSPACE/images"
        "$GITHUB_WORKSPACE/evidence"

        rm -- "$RUNNER_TEMP/native-images.zip"

        '
    - name: Seed public apt archives from verified prior run (not test evidence)
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nzip=\"$RUNNER_TEMP/prior-apt-cache.zip\"\ncurl --fail --silent --show-error --location --retry\
        \ 2 --max-time 180 \\\n  -H \"Authorization: Bearer $GH_TOKEN\" -H 'Accept: application/vnd.github+json' \\\n  https://api.github.com/repos/levicode/e2e/actions/artifacts/12642071476/zip\
        \ -o \"$zip\"\nprintf '%s  %s\\n' 5fb71d9a4daec5e01eda74a473c7024b0be529b823e42a0c2192174af66579d4 \"$zip\" | sha256sum\
        \ -c -\npython3 recipe/scripts/web-functional/seed-apt-cache.py \"$zip\" \"$GITHUB_WORKSPACE/apt-cache\" \"$GITHUB_WORKSPACE/evidence\"\
        \nrm -- \"$zip\"\n"
    - name: Probe orchestration regressions (not native runtime proof)
      working-directory: source
      run: node --test scripts/acceptance/probe-native.test.ts
    - name: Install existing browser/codec prerequisites and probe exact binaries
      run: bash recipe/scripts/web-functional/run.sh setup
      id: setup
    - name: Record actual Playwright CDP host identity separately from native Chrome
      working-directory: source/packages/web
      run: 'set -euo pipefail

        host=$(node --input-type=module -e "import {chromium} from ''playwright-core''; console.log(chromium.executablePath())")

        printf ''%s\n'' "$host" > "$GITHUB_WORKSPACE/evidence/cdp-host.path"

        "$host" --version > "$GITHUB_WORKSPACE/evidence/cdp-host.version"

        sha256sum "$host" > "$GITHUB_WORKSPACE/evidence/cdp-host.sha256"

        '
    - name: Run selected original public contracts once (not full acceptance)
      if: ${{ success() && steps.setup.outcome == 'success' }}
      run: bash recipe/scripts/web-functional/run-public-names.sh "${{ matrix.group }}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: public-${{ matrix.group }}-evidence
        path: evidence/
        retention-days: 7
        if-no-files-found: warn
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group:
        - names-eight
        - budget-four
        - first-two
