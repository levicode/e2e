        sha256sum ./packages/e2e/tests/fixtures/public-raw-css.e2e.ts ./packages/e2e/tests/integration/web-selector-raw-css.test.ts
        > evidence/probe-files.sha256

        printf ''%s\n'' candidate > evidence/pair-label

