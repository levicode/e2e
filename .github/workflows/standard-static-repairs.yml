name: Reviewed static docs types and lint repairs
'on':
  push:
    branches:
    - ci/standard-static-repairs
permissions:
  contents: read
  actions: read
concurrency:
  group: standard-static-repairs-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  NATIVE_SOURCE_SHA: ef81a637abb7bd63aa877f1790949d0a2a5d9e71
  NATIVE_SOURCE_TREE: 3822bc7dcc16bcfdfc6c6d3f81296edc832b1ea4
jobs:
  static-repairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Require clean source before evidence and record exact identity
      run: 'set -euo pipefail

        test -z "$(git status --porcelain)"

        mkdir -p evidence

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        sha256sum pnpm-lock.yaml .github/native-candidate.json > evidence/source-pins.sha256

        '
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 26
        check-latest: true
        cache: pnpm
    - name: Record actual Node and package-manager versions
      run: 'node --version > evidence/node.version

        pnpm --version > evidence/pnpm.version

        npm --version > evidence/npm.version

        '
    - name: dependencies
      id: dependencies
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm install --frozen-lockfile

        ) 2>&1 | tee "evidence/dependencies.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/dependencies.exit"

        exit "$s"

        '
    - name: complete-build
      id: complete_build
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm run build

        ) 2>&1 | tee "evidence/complete-build.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/complete-build.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
    - name: Assert locked oxlint version before lint
      run: 'set -euo pipefail

        pnpm exec oxlint --version | tee evidence/oxlint.version

        grep -Eq "(^| )1\.89\.0$" evidence/oxlint.version

        '
    - name: lint
      id: lint
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm lint

        ) 2>&1 | tee "evidence/lint.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/lint.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
    - name: dead-code
      id: dead_code
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm check:dead-code

        ) 2>&1 | tee "evidence/dead-code.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/dead-code.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
    - name: typecheck
      id: typecheck
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm typecheck

        ) 2>&1 | tee "evidence/typecheck.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/typecheck.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
    - name: plugin-sources
      id: plugin_sources
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm plugins:check

        ) 2>&1 | tee "evidence/plugin-sources.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/plugin-sources.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
    - name: root-docs-check
      id: root_docs_check
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm docs:check

        ) 2>&1 | tee "evidence/root-docs-check.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/root-docs-check.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
    - name: Require every independent command outcome; no skipped execution passes
      if: ${{ always() }}
      env:
        COMMAND_STEPS: ${{ toJSON(steps) }}
      run: 'python3 - <<''PY_RESULT''

        import json,os,pathlib

        p=pathlib.Path(''evidence'');p.mkdir(exist_ok=True)

        s=json.loads(os.environ[''COMMAND_STEPS'']);out={k:v.get(''outcome'') for
        k,v in s.items()};(p/''steps.json'').write_text(json.dumps(out,indent=2)+''\n'')

        failed={k:v for k,v in out.items() if v!=''success''}

        assert not failed,failed

        PY_RESULT

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: reviewed-static-repairs-evidence
        path: evidence/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
