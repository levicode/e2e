# FROZEN: actual terminal GREEN nine-case proof, then fresh ci ELF and one original RESPONSE case.
name: Response original full-text/JSON on fresh feature-free ci ELF
'on':
  push:
    branches:
    - validation/response-production-runtime-20261025
permissions:
  contents: read
concurrency:
  group: response-production-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  production:
    name: focused-response-production-runtime
    if: ${{ github.ref == 'refs/heads/validation/response-production-runtime-20261025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 175
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      RUST_MIN_STACK: '16777216'
      RUST_BACKTRACE: '1'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
      PHASES: recipe-identity binding proof-fetch proof-download proof-verify source-before toolchain production-build production-capture source-after
        product-integrity
      CASE_ID: RESPONSE
      RECIPE_SHA: ${{ github.workflow_sha }}
      RUNTIME_PHASES: local-product sources dependencies browser-install runtime-images runtime final-identities
    steps:
    - name: Initialize prior-proof production and single-response runtime evidence
      id: init
      timeout-minutes: 1
      run: |-
        set -euo pipefail
        umask 077
        export EVIDENCE_DIR="$RUNNER_TEMP/focused-production-evidence"
        export CARGO_HOME="$RUNNER_TEMP/focused-production-cargo"
        export CARGO_TARGET_DIR="$RUNNER_TEMP/focused-production-target"
        export VALIDATE="$GITHUB_WORKSPACE/recipe/scripts/response-runtime/producer.py"
        export PRODUCT_DIR="$RUNNER_TEMP/focused-production-product"
        printf 'EVIDENCE_DIR=%s\nCARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nVALIDATE=%s\nPRODUCT_DIR=%s\n' "$EVIDENCE_DIR" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$VALIDATE" "$PRODUCT_DIR" >> "$GITHUB_ENV"
        test ! -e "$CARGO_TARGET_DIR"
        test ! -e "$PRODUCT_DIR"
        mkdir -m700 "$EVIDENCE_DIR"
        test "$GITHUB_RUN_ATTEMPT" = 1
        export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/response-playwright"
        printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
        for phase in $PHASES $RUNTIME_PHASES; do printf 'not-run\n' > "$EVIDENCE_DIR/$phase.exit"; done
        printf '%s\n' 'Fresh feature-free ci ELF then exactly one original RESPONSE full-text/JSON case; only after the fixed prior GREEN proof verifies. Prior actual9 focused dev fixtures are not full native or optimized test acceptance. Full333 is outside this job; the existing final acceptance goal is unchanged. Original no-sandbox flags apply only to owned cloud loopback synthetic fixtures, not user sessions or user data. Loopback fixture scope does not claim blocked browser background egress.' > "$EVIDENCE_DIR/SCOPE.txt"
        uname -a > "$EVIDENCE_DIR/host.txt"
        cat /etc/os-release >> "$EVIDENCE_DIR/host.txt"
        . /etc/os-release
        test "$RUNNER_OS" = Linux
        test "$(uname -m)" = x86_64
        test "$(id -u)" -ne 0
        test "$ID" = ubuntu
        test "$VERSION_ID" = 24.04
    - name: Check out this immutable producer recipe
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - name: Refuse unfrozen source or focused prerequisite before any native work
      id: binding
      timeout-minutes: 1
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" run recipe-identity 30 python3 -B "$VALIDATE" identity recipe "$GITHUB_WORKFLOW_SHA" - - -
        python3 -B "$VALIDATE" run binding 30 python3 -B "$VALIDATE" guard
        sha256sum recipe/.github/workflows/response-production-runtime.yml recipe/scripts/response-runtime/*.py recipe/scripts/response-runtime/pins.json > "$EVIDENCE_DIR/recipe.sha256"
    - name: Check out the exact already-successful focused fixture recipe for its original parser
      id: prior_recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        repository: levicode/e2e
        ref: ${{ env.PROOF_RECIPE_SHA }}
        path: proof-recipe
        persist-credentials: false
    - name: Fetch only the fixed completed focused proof and immutable source metadata
      id: proof_fetch
      timeout-minutes: 6
      env:
        GH_TOKEN: ${{ github.token }}
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" run proof-fetch 300 bash -euc '
        api=https://api.github.com/repos/levicode/e2e
        fetch() { curl --fail --silent --show-error --max-time 45 --max-filesize 67108864 --proto "=https" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1" -o "$2"; }
        fetch "$api/actions/runs/$PROOF_RUN_ID" "$EVIDENCE_DIR/native-focused-run.json"
        fetch "$api/actions/runs/$PROOF_RUN_ID/attempts/$PROOF_RUN_ATTEMPT/jobs?per_page=100" "$EVIDENCE_DIR/native-focused-jobs.json"
        fetch "$api/actions/artifacts/$PROOF_ARTIFACT_ID" "$EVIDENCE_DIR/native-focused-artifact.json"
        fetch "$api/git/commits/$PROOF_RECIPE_SHA" "$EVIDENCE_DIR/native-focused-recipe.json"
        fetch "$api/git/commits/$E2E_SHA" "$EVIDENCE_DIR/e2e-source-commit.json"
        code=$(curl --silent --show-error --max-time 45 --proto "=https" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -D "$RUNNER_TEMP/native-focused-download.headers" -o /dev/null -w "%{http_code}" "$api/actions/artifacts/$PROOF_ARTIFACT_ID/zip")
        test "$code" = 302
        '
    - name: Fetch the exact original ZIP in its own bounded admitted phase
      id: proof_download
      timeout-minutes: 4
      run: |-
        set -euo pipefail
        cat > "$RUNNER_TEMP/focused-proof-download.sh" <<'DOWNLOAD'
        set -euo pipefail
        # No GitHub authorization is forwarded to the official artifact-storage redirect.
        url=$(python3 - "$RUNNER_TEMP/native-focused-download.headers" <<'CHECK'
        import sys, urllib.parse
        headers=open(sys.argv[1]).read().splitlines()
        values=[line.split(':',1)[1].strip() for line in headers if line.lower().startswith('location:')]
        assert len(values)==1
        url=urllib.parse.urlsplit(values[0]);assert url.scheme=='https' and not url.username and not url.password
        print(values[0])
        CHECK
        )
        curl --fail --silent --show-error --max-time 120 --max-filesize 67108864 --proto '=https' "$url" -o "$EVIDENCE_DIR/native-focused.zip"
        rm "$RUNNER_TEMP/native-focused-download.headers"
        DOWNLOAD
        # The bounded helper records only this script path, never the signed URL value.
        python3 -B "$VALIDATE" run proof-download 180 bash "$RUNNER_TEMP/focused-proof-download.sh"
    - name: Recheck exact existing raw ledgers, phases, source binding and all focused cases
      id: proof_verify
      timeout-minutes: 3
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" run proof-verify 120 python3 -B recipe/scripts/response-runtime/admit-native-focused.py "$GITHUB_WORKSPACE/proof-recipe"
    - name: Check out final native source only after genuine focused success
      id: source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SHA }}
        path: source
        persist-credentials: false
    - name: Verify exact source tree and lock before compile
      id: before
      timeout-minutes: 1
      run: python3 -B "$VALIDATE" run source-before 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" "$NATIVE_SHA" "$NATIVE_TREE" cli/Cargo.lock
        "$NATIVE_LOCK_SHA256" before
    - name: Cache registry bytes only, never target executables
      id: registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      timeout-minutes: 3
      with:
        path: |-
          ${{ env.CARGO_HOME }}/registry
          ${{ env.CARGO_HOME }}/git/db
        key: focused-registry-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-${{ env.NATIVE_LOCK_SHA256 }}
    - name: Install and verify the existing pinned official Rust toolchain
      id: rust
      timeout-minutes: 11
      run: "python3 -B \"$VALIDATE\" run toolchain 600 bash -euc '\nrustup toolchain install \"$RUSTUP_TOOLCHAIN\" --profile minimal --component\
        \ rustfmt --component clippy\nrustc -Vv\ncargo -Vv\ntest \"$(rustc -Vv | sed -n \"s/^release: //p\")\" = \"$RUSTUP_TOOLCHAIN\"\ntest \"\
        $(rustc -Vv | sed -n \"s/^host: //p\")\" = x86_64-unknown-linux-gnu\n' "
    - name: Build only the new feature-free standard ci ELF
      id: build
      timeout-minutes: 37
      working-directory: source/cli
      run: |-
        set -euo pipefail
        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET
        python3 -B "$VALIDATE" run production-build 2100 cargo build --locked --profile ci --no-default-features --message-format=json
        python3 -B "$VALIDATE" run production-capture 60 python3 -B "$VALIDATE" production "$PRODUCT_DIR" production
    - name: Verify source remains unchanged even after a build failure
      id: after
      timeout-minutes: 1
      if: ${{ always() && steps.before.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run source-after 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" "$NATIVE_SHA" "$NATIVE_TREE" cli/Cargo.lock
        "$NATIVE_LOCK_SHA256" after
    - name: Verify the captured image and focused-only provenance
      id: integrity
      timeout-minutes: 2
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.after.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run product-integrity 60 python3 -B "$VALIDATE" integrity "$PRODUCT_DIR"
    - name: Require every actual producer phase, never skip-as-pass
      id: producer_gate
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: |-
        set -euo pipefail
        python3 -B "$VALIDATE" aggregate $PHASES
    - name: Select pinned official Node
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      timeout-minutes: 2
      with:
        node-version: 24.19.0
        architecture: x64
      if: ${{ !cancelled() && steps.producer_gate.outcome == 'success' }}
    - name: Check out exact unchanged original RESPONSE Web baseline
      id: e2e
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/e2e
        ref: 5adcc69574da30c539b585d92a793bca87fae2bc
        fetch-depth: 1
        path: e2e-source
        persist-credentials: false
      if: ${{ !cancelled() && steps.producer_gate.outcome == 'success' }}
    - name: Bind actual local receipt and fresh ELF without external artifact placeholders
      id: local_product
      timeout-minutes: 2
      if: ${{ !cancelled() && steps.producer_gate.outcome == 'success' }}
      run: |-
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/local-product.exit"' EXIT
        node recipe/scripts/response-runtime/identity.mjs admit > "$EVIDENCE_DIR/local-product.log" 2>&1
    - name: Verify clean sources original fixtures and exact lock bytes
      id: sources
      timeout-minutes: 1
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/sources.exit"' EXIT
        node recipe/scripts/response-runtime/identity.mjs sources > "$EVIDENCE_DIR/sources.log" 2>&1
      if: ${{ !cancelled() && steps.local_product.outcome == 'success' }}
    - name: Select pinned pnpm without running dependency scripts
      id: pnpm
      uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      timeout-minutes: 2
      with:
        version: 12.3.4
        run_install: false
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Install frozen graph and build actual core and Web only
      id: dependencies
      timeout-minutes: 12
      working-directory: e2e-source
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/dependencies.exit"' EXIT
        exec > >(tee "$EVIDENCE_DIR/dependencies.log") 2>&1
        test "$(node --version)" = v24.19.0
        test "$(pnpm --version)" = 12.3.4
        pnpm install --frozen-lockfile --ignore-scripts
        pnpm --filter e2e run build
        pnpm --filter @e2e-dev/web run build
        node ../recipe/scripts/response-runtime/identity.mjs dist
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Install original official complete Playwright Chromium distribution
      id: browser_install
      timeout-minutes: 10
      working-directory: e2e-source
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/browser-install.exit"' EXIT
        test ! -e "$PLAYWRIGHT_BROWSERS_PATH"
        install_root=$(mktemp -d /tmp/ep-XXXXXX)
        mkdir -m700 "$install_root/home" "$install_root/tmp" "$install_root/cache"
        env -i PATH="$(dirname "$(command -v node)"):/usr/bin:/bin" HOME="$install_root/home" TMPDIR="$install_root/tmp" XDG_CACHE_HOME="$install_root/cache" CI=1 LANG=C.UTF-8 \
          PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
          "$(command -v node)" packages/web/node_modules/playwright-core/cli.js install chromium > "$EVIDENCE_DIR/browser-install.log" 2>&1
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Verify required executables full Chrome exact image and native linkage
      id: images
      timeout-minutes: 3
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/runtime-images.exit"' EXIT
        missing=0
        for tool in node pnpm git unzip python3 timeout which readlink ldd fc-match; do
          if executable=$(command -v "$tool"); then printf '%s\t%s\n' "$tool" "$executable"; else printf 'MISSING\t%s\n' "$tool"; missing=1; fi
        done > "$EVIDENCE_DIR/required-executables.txt"
        for executable in /usr/bin/python3 /usr/bin/timeout /usr/bin/which /usr/bin/readlink; do
          if [[ ! -x "$executable" ]]; then printf 'MISSING\t%s\n' "$executable" >> "$EVIDENCE_DIR/required-executables.txt"; missing=1; fi
        done
        test "$missing" = 0
        font_file=$(fc-match -f '%{file}\n' sans | head -n1)
        test -n "$font_file"
        test -r "$font_file"
        printf '%s\n' "$font_file" > "$EVIDENCE_DIR/font-fallback.txt"
        node recipe/scripts/response-runtime/identity.mjs images
        node --input-type=module - <<'JS' > "$EVIDENCE_DIR/runtime-linkage-inputs.tsv"
        import {readFileSync} from 'node:fs';
        const images=JSON.parse(readFileSync(process.env.EVIDENCE_DIR+'/images-before.json'));
        for(const name of ['production','full']) console.log(name+'\t'+images[name].executable);
        JS
        linkage_failed=0
        while IFS=$'\t' read -r name executable; do
          set +e
          env -i PATH=/usr/bin:/bin LANG=C.UTF-8 ldd "$executable" > "$EVIDENCE_DIR/$name.ldd.txt" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "$EVIDENCE_DIR/$name.ldd.exit"
          if [[ "$status" != 0 ]] || grep -Fq 'not found' "$EVIDENCE_DIR/$name.ldd.txt"; then linkage_failed=1; fi
        done < "$EVIDENCE_DIR/runtime-linkage-inputs.tsv"
        test "$linkage_failed" = 0
        printf '%s\n' 'Selected cases never start video and empty-recording cleanup returns immediately. System ffmpeg/ffprobe/codecs are not runtime inputs. Original Playwright install may download bundled FFmpeg/headless shell; neither is selected.' > "$EVIDENCE_DIR/codec-scope.txt"
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Run exactly this original case with its original budgets and cleanup
      id: runtime
      timeout-minutes: 31
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/runtime.exit"' EXIT
        test "$CASE_ID" = RESPONSE
        bash recipe/scripts/response-runtime/response.sh
      if: ${{ success() && steps.local_product.outcome == 'success' }}
    - name: Recheck source dist and image bytes after success or failure
      id: final_identities
      timeout-minutes: 3
      if: ${{ always() && steps.sources.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.images.outcome == 'success' }}
      run: |
        set -euo pipefail
        trap 'printf "%s\n" "$?" > "$EVIDENCE_DIR/final-identities.exit"' EXIT
        node recipe/scripts/response-runtime/identity.mjs final > "$EVIDENCE_DIR/final-identities.log" 2>&1
    - name: Require each response source/image/runtime/cleanup phase
      id: runtime_gate
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: node recipe/scripts/response-runtime/identity.mjs gate
    - name: Retain exact producer step outcomes
      id: outcomes
      timeout-minutes: 1
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: printf '%s\n' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"
    - name: Always retain producer diagnostics without signed download headers
      id: diagnostics
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      if: ${{ always() }}
      with:
        name: response-production-runtime-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE_DIR }}/
        if-no-files-found: error
        retention-days: 7
    - name: Retain genuine unpromoted focused image only after producer success
      id: binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      if: ${{ !cancelled() && steps.producer_gate.outcome == 'success' }}
      with:
        name: unpromoted-focused-native-linux-x64-${{ env.NATIVE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.PRODUCT_DIR }}/
        if-no-files-found: error
        retention-days: 7
