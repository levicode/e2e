  optional-mask-fixed-fifty:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: '12739179422'
        path: native-harness
        merge-multiple: true
        run-id: '40515709946'
        github-token: ${{ github.token }}
    - name: Verify repaired harness and create evidence directory before fixed stress
      env:
        EXPECTED_HARNESS_SHA: 7b4f61e02e770c33f30b694e070632bd1519f1e30213c4a23f542797d6c1278a
      run: 'set -euo pipefail

        mkdir -p evidence

        test "$(git -C native rev-parse HEAD)" = "$NATIVE_SOURCE_SHA"

        test "$(git -C native rev-parse HEAD^{tree})" = "$NATIVE_SOURCE_TREE"

        test "$(cat native-harness/native-source.sha)" = "$NATIVE_SOURCE_SHA"

        test "$(cat native-harness/native-source.tree)" = "$NATIVE_SOURCE_TREE"

        test "$(cat native-harness/producer-run.id)" = "40515709946"

        test "$(cat native-harness/features.txt)" = acceptance-faults

        printf ''%s  %s\n'' "$EXPECTED_HARNESS_SHA" native-harness/agent-browser-tests
        | sha256sum --check

        (cd native-harness; sha256sum --check SHA256SUMS)

        chmod +x native-harness/agent-browser-tests

        cp native-harness/native-source.* native-harness/features.txt native-harness/producer-run.id
        evidence/

        '
    - name: Fixed fifty iterations per original optional mask deadline case
      run: 'set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        timeout --signal=TERM --kill-after=5s 730 python3 scripts/ci/optional-mask-fixed-stress.py
        native-harness/agent-browser-tests evidence/timing scripts/ci/optional-mask-fixed-stress-selectors.json

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: unified-optional-mask-fixed-fifty-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
