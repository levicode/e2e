name: isolated trace and video cleanup diagnostics (not acceptance)
'on':
  push:
    branches:
    - implement/trace-video-isolated-ci
permissions:
  contents: read
concurrency:
  group: isolated-trace-video-${{ github.sha }}
  cancel-in-progress: false
env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_BUILD_JOBS: '2'
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: f4fa3c62d29208b7679fedbf0e3787f2923506a7
        path: native
        persist-credentials: false
    - name: Build exact production and separate fault ELF (no tests or gate waiver)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p images evidence
        cd native/cli
        test "$(git rev-parse HEAD)" = f4fa3c62d29208b7679fedbf0e3787f2923506a7
        test "$(git rev-parse HEAD^{tree})" = 5c6d85dfe52b5c1a7cf3dcc0a795116f7fd78c5d
        test -z "$(git status --porcelain)"
        rustup toolchain install 1.99.1 --profile minimal
        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
        export CARGO_TARGET_DIR="$RUNNER_TEMP/web-functional-target"
        rustc -Vv > "$GITHUB_WORKSPACE/evidence/rustc.txt"
        cargo build --locked --profile ci --no-default-features 2>&1 | tee "$GITHUB_WORKSPACE/evidence/production-build.log"
        cp "$CARGO_TARGET_DIR/ci/agent-browser" "$GITHUB_WORKSPACE/images/production"
        cargo build --locked --profile ci --no-default-features --features acceptance-faults 2>&1 | tee "$GITHUB_WORKSPACE/evidence/fault-build.log"
        cp "$CARGO_TARGET_DIR/ci/agent-browser" "$GITHUB_WORKSPACE/images/acceptance-faults"
        cd "$GITHUB_WORKSPACE/images"
        sha256sum production acceptance-faults > SHA256SUMS
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fixed-native-images
        path: images/
        if-no-files-found: error
        retention-days: 3
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: functional-build-evidence
        path: evidence/
        if-no-files-found: warn
  native-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: f4fa3c62d29208b7679fedbf0e3787f2923506a7
        path: native
        persist-credentials: false
    - name: Compile exact native test harness (no browser auto-discovery)
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p evidence
        cd native/cli
        test "$(git rev-parse HEAD)" = f4fa3c62d29208b7679fedbf0e3787f2923506a7
        test "$(git rev-parse HEAD^{tree})" = 5c6d85dfe52b5c1a7cf3dcc0a795116f7fd78c5d
        test -z "$(git status --porcelain)"
        rustup toolchain install 1.99.1 --profile minimal
        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
        export CARGO_TARGET_DIR="$RUNNER_TEMP/native-regressions-target"
        cargo test --locked --profile ci --no-default-features --bin agent-browser -j1 --no-run --message-format=json > "$GITHUB_WORKSPACE/evidence/harness.jsonl" 2> "$GITHUB_WORKSPACE/evidence/harness-build.log"
        python3 - <<'PY_HARNESS'
        import json, os
        from pathlib import Path
        out = Path(os.environ['GITHUB_WORKSPACE']) / 'evidence'
        paths = set()
        build_finished = []
        for line in (out / 'harness.jsonl').read_text().splitlines():
            record = json.loads(line)
            if record.get('reason') == 'build-finished':
                build_finished.append(record.get('success') is True)
            if (record.get('reason') == 'compiler-artifact'
                and record.get('target', {}).get('name') == 'agent-browser'
                and 'bin' in record.get('target', {}).get('kind', [])
                and record.get('profile', {}).get('test') is True
                and record.get('features') == []
                and record.get('executable')):
                paths.add(record['executable'])
        if build_finished != [True]:
            raise SystemExit('Missing or unsuccessful final compiler build receipt')
        if len(paths) != 1:
            raise SystemExit(f'Expected exactly one test executable, got {len(paths)}')
        harness = paths.pop()
        if not Path(harness).is_file():
            raise SystemExit('Compiler-selected harness is missing')
        (out / 'harness.path').write_text(harness + '\n')
        PY_HARNESS
        mkdir -p "$GITHUB_WORKSPACE/native-harness"
        harness="$(cat "$GITHUB_WORKSPACE/evidence/harness.path")"
        cp "$harness" "$GITHUB_WORKSPACE/native-harness/agent-browser-tests"
        git rev-parse HEAD > "$GITHUB_WORKSPACE/native-harness/native-source.sha"
        git rev-parse HEAD^{tree} > "$GITHUB_WORKSPACE/native-harness/native-source.tree"
        (cd "$GITHUB_WORKSPACE/native-harness"; sha256sum agent-browser-tests > SHA256SUMS)
    - name: Save compiler-selected harness (not a test-pass receipt)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: fixed-native-regression-harness
        path: native-harness/
        if-no-files-found: error
        retention-days: 1
    - name: Run only the reviewed exact no-browser regression tests
      shell: bash
      env:
        RUST_MIN_STACK: '16777216'
      run: |
        set -euo pipefail
        harness="$(cat evidence/harness.path)"
        sha256sum "$harness" > evidence/harness.sha256
        failed=0
        index=0
        for name in 'native::client_browser::state_lifecycle_tests::restart_transport_tests::point_debt_tests::fixed_read_remote_eof_gets_bounded_recovery_without_replaying_input' 'native::client_tasks::fixed_read_eof_tests::fixed_read_eof_cleanup_failure_never_gains_recovery' 'native::client_browser::state_lifecycle_tests::restart_transport_tests::point_debt_tests::p06_framed_input_eof_explicit_reconnect_must_recover_session_without_replay' 'native::client_browser::state_lifecycle_tests::restart_transport_tests::point_debt_tests::p06_framed_input_eof_recovery_rejects_wrong_context_without_replay' 'native::client_browser::state_lifecycle_tests::restart_transport_tests::point_debt_tests::p06_framed_callback_input_eof_never_offers_root_recovery' 'native::client_browser::state_lifecycle_tests::restart_transport_tests::point_debt_tests::p06_framed_input_eof_recovery_rejects_wrong_scope_before_candidate_io' 'native::client_browser::state_lifecycle_tests::restart_transport_tests::point_debt_tests::p06_framed_input_eof_cancelled_recovery_cannot_be_reissued' 'native::client_operation_state::tests::late_finish_cannot_erase_fixed_unknown_before_expiry_monitor_runs' 'native::client_operation_state::tests::completed_producer_is_not_retroactively_expired_by_duplicate_finish' 'native::client_browser::borrowed_cleanup_tests::managed_borrowed_scope_end_preserves_host_and_settles_exact_sessions' 'native::client_browser::borrowed_cleanup_tests::managed_borrowed_child_scope_end_is_child_first_without_host_destruction' 'native::client_browser::borrowed_cleanup_tests::managed_borrowed_cleanup_error_acks_remain_hard_failures' 'native::client_browser::borrowed_cleanup_tests::managed_borrowed_missing_detach_ack_retains_debt_and_cannot_reuse' 'native::client_debt::tests::terminal_read_only_certificate_rejects_forged_envelopes_and_retains_debt' 'native::client_targets::tests::terminal_eof_seal_never_clears_real_target_poison_or_grants_admission' 'native::client_operation_state::tests::terminal_commit_rechecks_journal_keys_and_target_poison' 'native::client_settlement_trace::terminal_cleanup_tests::terminal_cleanup_checkpoints_have_closed_payloads' 'native::client_observation_dispatch::tests::semantic_trace_retains_first_inventory_failure_without_enabling_capture'; do
          index=$((index + 1))
          "$harness" --exact "$name" --list > "evidence/test-$index.inventory"
          grep -Fx "$name: test" "evidence/test-$index.inventory"
          # Raw metadata, not a cleanup or acceptance receipt. One exclusive file per test process.
          python3 -c 'import os,sys; fd=os.open(sys.argv[1],os.O_CREAT|os.O_EXCL|os.O_WRONLY,0o600); os.close(fd)' "$GITHUB_WORKSPACE/evidence/test-$index.cleanup.jsonl"
          printf '%s\n' '{"schemaVersion":1,"status":"prepared","validation":"raw-not-validated","releaseEligible":false}' > "evidence/test-$index.cleanup.status.json"
          set +e
          AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE="$GITHUB_WORKSPACE/evidence/test-$index.cleanup.jsonl" "$harness" --exact "$name" --test-threads=1 --nocapture > "evidence/test-$index.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > "evidence/test-$index.exit"
          if [ "$status" -ne 0 ]; then failed=1; fi
        done
        exit "$failed"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: functional-native-regressions-evidence
        path: evidence/
        if-no-files-found: warn
        retention-days: 7
  isolated:
    permissions:
      contents: read
      actions: read
    env:
      E2E_APT_CACHE_ROLE: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/e2e
        ref: 1d9d58299d58aa663af3349e376b7420ce8a2574
        path: source
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        package_json_file: source/package.json
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: fixed-native-images
        path: images
    - name: Seed public apt archives from verified prior run (not test evidence)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        zip="$RUNNER_TEMP/prior-apt-cache.zip"
        curl --fail --silent --show-error --location --retry 2 --max-time 180 \
          -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
          https://api.github.com/repos/levicode/e2e/actions/artifacts/12642071476/zip -o "$zip"
        printf '%s  %s\n' 5fb71d9a4daec5e01eda74a473c7024b0be529b823e42a0c2192174af66579d4 "$zip" | sha256sum -c -
        python3 recipe/scripts/web-functional/seed-apt-cache.py "$zip" "$GITHUB_WORKSPACE/apt-cache" "$GITHUB_WORKSPACE/evidence"
        rm -- "$zip"
    - name: Probe orchestration regressions (not native runtime proof)
      working-directory: source
      run: node --test scripts/acceptance/probe-native.test.ts
    - name: Install existing browser/codec prerequisites and probe exact binaries
      run: bash recipe/scripts/web-functional/run.sh setup
      id: setup
    - name: One exact case with independent cleanup capture (original assertions and budgets)
      run: bash recipe/scripts/web-functional/run.sh "${{ matrix.case }}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: isolated-${{ matrix.case }}-evidence
        path: evidence/
        retention-days: 7
        if-no-files-found: warn
    needs: build
    strategy:
      fail-fast: false
      matrix:
        case:
        - p01-isolated
        - video-isolated
