name: Native fresh Playwright binding (finite validation)
'on':
  push:
    branches:
    - implement/native-fresh-binding-ci
permissions:
  contents: read
concurrency:
  group: native-fresh-binding-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 9903179b3357f862ed703fc9d9e41fa975ccb0f6
  NATIVE_SOURCE_TREE: 3f5f6a8663d19990c523ee5a15383c9d54b379c2
jobs:
  native-runtime:
    uses: ./.github/workflows/native-runtime.yml
  native-interop-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - name: Compile acceptance-faults exact test harness only
      shell: bash
      run: "set -euo pipefail\nmkdir -p evidence\ncd native/cli\ntest \"$(git rev-parse HEAD)\" = \"$NATIVE_SOURCE_SHA\"\
        \ntest \"$(git rev-parse HEAD^{tree})\" = \"$NATIVE_SOURCE_TREE\"\ntest -z \"$(git status --porcelain)\"\
        \nrustup toolchain install 1.99.1 --profile minimal\nrustc +1.99.1 -Vv > \"$GITHUB_WORKSPACE/evidence/rustc-version.txt\"\
        \ncargo +1.99.1 -Vv > \"$GITHUB_WORKSPACE/evidence/cargo-version.txt\"\nunset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER\
        \ RUSTFLAGS CARGO_ENCODED_RUSTFLAGS\nexport CARGO_TARGET_DIR=\"$RUNNER_TEMP/native-regressions-target\"\n\
        cargo +1.99.1 test --locked --profile ci --timings --no-default-features --features acceptance-faults --bin\
        \ agent-browser -j1 --no-run --message-format=json > \"$GITHUB_WORKSPACE/evidence/harness.jsonl\" 2> \"\
        $GITHUB_WORKSPACE/evidence/harness-build.log\"\npython3 - <<'PY_HARNESS'\nimport json, os\nfrom pathlib\
        \ import Path\nout = Path(os.environ['GITHUB_WORKSPACE']) / 'evidence'\npaths = set()\nbuild_finished =\
        \ []\nfor line in (out / 'harness.jsonl').read_text().splitlines():\n    record = json.loads(line)\n   \
        \ if record.get('reason') == 'build-finished':\n        build_finished.append(record.get('success') is True)\n\
        \    if (record.get('reason') == 'compiler-artifact'\n        and record.get('target', {}).get('name') ==\
        \ 'agent-browser'\n        and 'bin' in record.get('target', {}).get('kind', [])\n        and record.get('profile',\
        \ {}).get('test') is True\n        and record.get('features') == ['acceptance-faults']\n        and record.get('executable')):\n\
        \        paths.add(record['executable'])\nif build_finished != [True]:\n    raise SystemExit('Missing or\
        \ unsuccessful final compiler build receipt')\nif len(paths) != 1:\n    raise SystemExit(f'Expected exactly\
        \ one test executable, got {len(paths)}')\nharness = paths.pop()\nif not Path(harness).is_file():\n    raise\
        \ SystemExit('Compiler-selected harness is missing')\n(out / 'harness.path').write_text(harness + '\\n')\n\
        PY_HARNESS\nmkdir -p \"$GITHUB_WORKSPACE/native-harness\"\nharness=\"$(cat \"$GITHUB_WORKSPACE/evidence/harness.path\"\
        )\"\ncp \"$harness\" \"$GITHUB_WORKSPACE/native-harness/agent-browser-tests\"\ngit rev-parse HEAD > \"$GITHUB_WORKSPACE/native-harness/native-source.sha\"\
        \ngit rev-parse HEAD^{tree} > \"$GITHUB_WORKSPACE/native-harness/native-source.tree\"\n(cd \"$GITHUB_WORKSPACE/native-harness\"\
        ; sha256sum agent-browser-tests > SHA256SUMS)\n\nprintf '%s\\n' acceptance-faults > \"$GITHUB_WORKSPACE/native-harness/features.txt\"\
        \nprintf '%s\\n' \"$GITHUB_RUN_ID\" > \"$GITHUB_WORKSPACE/native-harness/producer-run.id\"\n\nmkdir -p \"\
        $GITHUB_WORKSPACE/evidence/cargo-timings\"\ncp -a \"$RUNNER_TEMP/native-regressions-target/cargo-timings/.\"\
        \ \"$GITHUB_WORKSPACE/evidence/cargo-timings/\"\n\nprintf \"harness-sha=%s\\n\" \"$(sha256sum \"$GITHUB_WORKSPACE/native-harness/agent-browser-tests\"\
        \ | cut -d' ' -f1)\" >> \"$GITHUB_OUTPUT\"\n"
      id: compile
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: harness_artifact
      with:
        name: paired-optional-feature-harness
        path: native-harness/
        if-no-files-found: error
        retention-days: 7
    - name: Run exact 21 interop and preparation cases
      run: python3 scripts/ci/run-interop-native-tests.py "$(cat evidence/harness.path)" scripts/ci/interop-native-inventory.json
        evidence/native-interop
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: fresh-binding-native-21-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    outputs:
      compiled: ${{ steps.compile.outcome }}
      harness-sha: ${{ steps.compile.outputs.harness-sha }}
      artifact-id: ${{ steps.harness_artifact.outputs.artifact-id }}
  fresh-browser:
    needs: native-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Download exact same-run native artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 3
      with:
        artifact-ids: ${{ needs.native-runtime.outputs.artifact-id }}
        path: ${{ runner.temp }}/ci-native-runtime
        merge-multiple: true
    - name: Verify exact source, compiler, host and binary
      timeout-minutes: 1
      env:
        EXPECTED_MANIFEST_SHA256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
        PRODUCER_ATTEMPT: ${{ needs.native-runtime.outputs.run-attempt }}
      run: node scripts/ci/native-runtime.ts verify "$RUNNER_TEMP/ci-native-runtime" "$EXPECTED_MANIFEST_SHA256"
        "$PRODUCER_ATTEMPT"
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
    - name: Validate actual fresh binding, not reuse or full compatibility
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec tsc --noEmit

        pnpm --filter @e2e-dev/web exec node -e ''const assert=require("node:assert/strict");assert.equal(require("playwright-core/package.json").version,"1.64.1")''

        pnpm --filter @e2e-dev/web exec vitest run --config vitest.interop-unit.config.ts --reporter=verbose --reporter=json
        --outputFile.json="$GITHUB_WORKSPACE/evidence/interop-units.json" 2>&1 | tee evidence/interop-units.log

        node --input-type=module - <<''JS''

        import fs from ''node:fs'';import assert from ''node:assert/strict'';const r=JSON.parse(fs.readFileSync(''evidence/interop-units.json''));assert.equal(r.numTotalTests,14);assert.equal(r.numPassedTests,14);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);

        JS

        pnpm --filter @e2e-dev/web exec vitest list --config vitest.interop-fresh.config.ts --no-staticParse --json="$GITHUB_WORKSPACE/evidence/fresh-collection.json"

        node --input-type=module - <<''JS''

        import fs from ''node:fs'';import assert from ''node:assert/strict'';const r=JSON.parse(fs.readFileSync(''evidence/fresh-collection.json''));assert.equal(r.length,1);assert.ok(r[0].file.endsWith(''/surface-of-native-fresh.test.ts''));

        JS

        export E2E_INTEROP_EVIDENCE_DIR="$GITHUB_WORKSPACE/evidence/fresh"

        unset GH_TOKEN GITHUB_TOKEN

        set +e

        pnpm --filter @e2e-dev/web exec vitest run --config vitest.interop-fresh.config.ts --reporter=verbose --reporter=json
        --outputFile.json="$GITHUB_WORKSPACE/evidence/fresh-results.json" 2>&1 | tee evidence/fresh.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/fresh.exit

        node --input-type=module - <<''JS''

        import fs from ''node:fs'';import assert from ''node:assert/strict'';const r=JSON.parse(fs.readFileSync(''evidence/fresh-results.json''));assert.equal(r.numTotalTests,1);assert.equal(r.numPassedTests,1);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);const
        e=JSON.parse(fs.readFileSync(''evidence/fresh/fresh-surface.json''));assert.equal(e.runtime,''passed'');assert.equal(e.cleanup,''passed'');assert.equal(e.serverClosed,true);for(const
        k of [''browserCount'',''pageCount'',''contextCount''])assert.equal(e[k],1);

        JS

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: fresh-binding-real-browser-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
