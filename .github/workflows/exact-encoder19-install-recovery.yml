name: Exact encoder19 installation recovery
'on':
  push:
    branches:
    - implement/exact-encoder19-install-recovery-ci
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: exact-encoder19-install-recovery-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: dc85674a636875c5b4c53fb381903fdd8ae2cf3b
  NATIVE_SOURCE_TREE: c3e81deb2c4646ae75625e906cbda398bb0a3bb5
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  encoder19-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - name: Validate installed encoder with actual encode and decode
      timeout-minutes: 7
      run: "set -euo pipefail\nmkdir -p evidence\ndate -u +%FT%TZ > evidence/encoder-install.started\n\
        cat /etc/os-release > evidence/encoder-host.txt\nprobe() {\n command -v ffmpeg\
        \ >/dev/null && command -v ffprobe >/dev/null || return 1\n timeout 20 ffmpeg\
        \ -v error -f lavfi -i color=c=black:s=64x64:d=0.2 -c:v libvpx -y \"$RUNNER_TEMP/encoder-preflight.webm\"\
        \ || return 1\n timeout 10 ffprobe -v error -show_entries stream=codec_name,width,height\
        \ -of json \"$RUNNER_TEMP/encoder-preflight.webm\" > evidence/encoder-preflight.json\
        \ || return 1\n timeout 20 ffmpeg -v error -i \"$RUNNER_TEMP/encoder-preflight.webm\"\
        \ -frames:v 1 -f null - || return 1\n}\nif ! probe > evidence/encoder-first-probe.log\
        \ 2>&1; then\n timeout 120 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20\
        \ -o Acquire::https::Timeout=20 update 2>&1 | tee evidence/encoder-apt-update.log\n\
        \ timeout 30 apt-get --simulate install ffmpeg > evidence/encoder-default-plan.log\n\
        \ timeout 30 apt-get --simulate --no-install-recommends install ffmpeg > evidence/encoder-minimal-plan.log\n\
        \ python3 - <<'PY_PLANS'\nimport pathlib,json\np=pathlib.Path('evidence')\n\
        def names(f):return sorted({x.split()[1] for x in (p/f).read_text().splitlines()\
        \ if x.startswith('Inst ')})\na=names('encoder-default-plan.log');b=names('encoder-minimal-plan.log');assert\
        \ set(b)<=set(a)\njson.dump({'defaultCount':len(a),'noRecommendsCount':len(b),'retained':b,'removedRecommendedOnly':sorted(set(a)-set(b))},open(p/'encoder-package-plan.json','w'),indent=2)\n\
        PY_PLANS\n timeout 180 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20\
        \ -o Acquire::https::Timeout=20 --no-install-recommends install -y ffmpeg\
        \ 2>&1 | tee evidence/encoder-apt-install.log\n probe > evidence/encoder-final-probe.log\
        \ 2>&1\nfi\nffmpeg -version > evidence/ffmpeg-version.txt\nffprobe -version\
        \ > evidence/ffprobe-version.txt\nsha256sum \"$(readlink -f \"$(command -v\
        \ ffmpeg)\")\" \"$(readlink -f \"$(command -v ffprobe)\")\" > evidence/encoder-binaries.sha256\n\
        date -u +%FT%TZ > evidence/encoder-install.finished\ndpkg-query -W -f='${Package}\
        \ ${Version}\\n' > evidence/installed-packages.txt\n"
    - name: Verify exact previous producer metadata
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python3 - <<''PY_META''

        import json,urllib.request,os

        u=''https://api.github.com/repos/levicode/e2e/actions/artifacts/12733259888''

        r=urllib.request.Request(u,headers={''Authorization'':''Bearer ''+os.environ[''GH_TOKEN''],''Accept'':''application/vnd.github+json''})

        with urllib.request.urlopen(r,timeout=30) as f:a=json.load(f)

        assert a[''id'']==12733259888 and a[''name'']==''paired-optional-feature-harness''
        and not a[''expired'']

        assert a[''digest'']==''sha256:baf9f47cccc44d63ff4657a2c182010b6d43fca0b63af40f5e6879ef7268018f''

        assert a[''size_in_bytes'']==35608738

        assert a[''workflow_run''][''id'']==40501733044 and a[''workflow_run''][''head_sha'']==''a7f0a133a82438d7fad42f21dc833157abe75418''

        open(''evidence/reused-artifact.json'',''w'').write(json.dumps(a,indent=2)+''\n'')

        PY_META

        '
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: '12733259888'
        path: native-harness
        merge-multiple: true
        run-id: '40501733044'
        github-token: ${{ github.token }}
      timeout-minutes: 3
    - name: Verify immutable previous source and feature harness
      run: 'set -euo pipefail

        test "$(git -C native rev-parse HEAD)" = "$NATIVE_SOURCE_SHA"

        test "$(git -C native rev-parse HEAD^{tree})" = "$NATIVE_SOURCE_TREE"

        set -euo pipefail

        python3 - <<''PY_VERIFY''

        import pathlib,hashlib,os

        p=pathlib.Path(''native-harness'')

        assert {x.name for x in p.iterdir()}=={''agent-browser-tests'',''native-source.sha'',''native-source.tree'',''features.txt'',''producer-run.id'',''SHA256SUMS''}

        assert all(x.is_file() and not x.is_symlink() for x in p.iterdir())

        assert (p/''native-source.sha'').read_text().strip()==os.environ[''NATIVE_SOURCE_SHA'']

        assert (p/''native-source.tree'').read_text().strip()==os.environ[''NATIVE_SOURCE_TREE'']

        assert (p/''features.txt'').read_text().strip()==''acceptance-faults''

        assert (p/''producer-run.id'').read_text().strip()==''40501733044''

        assert hashlib.sha256((p/''agent-browser-tests'').read_bytes()).hexdigest()==''f820c013ee6eb4ad87a3345d00415a110c496eca6b133008b3d73f41beb15604''

        PY_VERIFY

        (cd native-harness; sha256sum --check SHA256SUMS)

        chmod +x native-harness/agent-browser-tests

        cp native-harness/{native-source.sha,native-source.tree,features.txt,producer-run.id,SHA256SUMS}
        evidence/

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        '
    - name: Run exactly 19 real encoder contracts, not Chrome evidence
      run: python3 scripts/ci/run-encoder-contracts.py native-harness/agent-browser-tests
        evidence/encoder19 scripts/ci/encoder-contracts-inventory.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: encoder19-install-recovery-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
