name: Exact native contracts and feature diagnostics using verified existing binaries
'on':
  push:
    branches:
    - implement/source-pin-reuse-contracts-ci
permissions:
  contents: read
concurrency:
  group: source-pin-reuse-contracts-${{ github.ref }}
  cancel-in-progress: false
env:
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_BUILD_JOBS: '2'
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  native-producers:
    permissions:
      contents: read
      actions: read
    env:
      E2E_APT_CACHE_ROLE: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/e2e
        ref: eed3e6a0adb746ab7f30f2c4fabf91971cf649ac
        path: source
        persist-credentials: false
    - name: Assert source SHA, tree and ordinary CI native pin before setup
      run: 'python3 - <<''PY_PINS''

        import json,pathlib,subprocess

        p=json.loads(pathlib.Path(''recipe/scripts/web-functional/source-reuse-pins.json'').read_text())

        def git(arg):return subprocess.check_output([''git'',''-C'',''source'',''rev-parse'',arg],text=True).strip()

        assert git(''HEAD'')==p[''e2eSource''] and git(''HEAD^{tree}'')==p[''e2eTree'']

        c=json.loads(pathlib.Path(''source/.github/native-candidate.json'').read_text())

        assert c[''commit'']==p[''nativeSource'']

        PY_PINS'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        package_json_file: source/package.json
    - name: Verify and download exact prior-run images artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 recipe/scripts/web-functional/reuse-source-artifacts.py images
    - name: Verify prior-run source identity and image hashes (not new build evidence)
      run: 'set -euo pipefail

        mkdir -p evidence

        (cd images; sha256sum -c SHA256SUMS)

        test "$(cat images/native-source.sha)" = 9b742b5dcf785d1e05be582080e3a89696245ee3

        test "$(cat images/native-source.tree)" = c36e1b9bc438c6245c6861781e2502ab143d00b8

        test "$(cat images/producer-run.id)" = 40418477337

        cp images/{SHA256SUMS,native-source.sha,native-source.tree,producer-run.id} evidence/

        chmod +x images/production images/acceptance-faults

        '
    - name: Seed public apt archives from verified prior run (not test evidence)
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nzip=\"$RUNNER_TEMP/prior-apt-cache.zip\"\nprintf 'Authorization: Bearer %s\\n' \"$GH_TOKEN\"\
        \ | curl --fail --silent --show-error --location --retry 2 --max-time 180 \\\n  -H @- -H 'Accept: application/vnd.github+json'\
        \ \\\n  https://api.github.com/repos/levicode/e2e/actions/artifacts/12642071476/zip -o \"$zip\"\nprintf '%s  %s\\\
        n' 5fb71d9a4daec5e01eda74a473c7024b0be529b823e42a0c2192174af66579d4 \"$zip\" | sha256sum -c -\npython3 recipe/scripts/web-functional/seed-apt-cache.py\
        \ \"$zip\" \"$GITHUB_WORKSPACE/apt-cache\" \"$GITHUB_WORKSPACE/evidence\"\nrm -- \"$zip\"\n"
    - name: Probe orchestration regressions (not native runtime proof)
      working-directory: source
      run: node --test scripts/acceptance/probe-native.test.ts
    - name: Install existing browser/codec prerequisites and probe exact binaries
      run: bash recipe/scripts/web-functional/run.sh setup
      id: setup
    - name: Record actual Playwright CDP host identity separately from native Chrome
      working-directory: source/packages/web
      run: 'set -euo pipefail

        host=$(node --input-type=module -e "import {chromium} from ''playwright-core''; console.log(chromium.executablePath())")

        printf ''%s\n'' "$host" > "$GITHUB_WORKSPACE/evidence/cdp-host.path"

        "$host" --version > "$GITHUB_WORKSPACE/evidence/cdp-host.version"

        sha256sum "$host" > "$GITHUB_WORKSPACE/evidence/cdp-host.sha256"

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: 9b742b5dcf785d1e05be582080e3a89696245ee3
        path: native
        persist-credentials: false
    - name: Verify and download exact prior-run default artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 recipe/scripts/web-functional/reuse-source-artifacts.py default
    - name: Restore exact compiler paths/source/assets and select unit harness
      run: python3 recipe/scripts/web-functional/restore-reused-default.py
    - name: Run unchanged all44 plus separate13 fake-CDP real-encoder contracts
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/run-native-contracts.py\" <<'PY_CONTRACTS'\n\"\"\"Exact44 existing contracts\
        \ plus 13 separate encoder contracts; no blanket execution.\"\"\"\nimport hashlib,json,os,pathlib,re,shutil,subprocess,sys,time\n\
        harness=pathlib.Path(sys.argv[1]).resolve(); meta=json.loads(pathlib.Path(sys.argv[2]).read_text());out=pathlib.Path(sys.argv[3]).resolve();out.mkdir(parents=True,exist_ok=True)\n\
        inventory=json.loads(pathlib.Path(sys.argv[4]).read_text());required=[x['name'] for x in inventory['names']];additional=inventory['additionalContracts'];browser_names=required+additional;encoder_contracts=inventory['encoderContracts'];encoder_names=[x['name']\
        \ for x in encoder_contracts];names=browser_names+encoder_names\nassert len(required)==37 and len(browser_names)==len(set(browser_names))==44\n\
        assert len(encoder_names)==len(set(encoder_names))==13 and len(names)==len(set(names))==57\nencoder_requirements={x['name']:set(x['requires'])\
        \ for x in encoder_contracts};assert all(x['browserIdentityRequired'] is False for x in encoder_contracts)\nencoder_only=set(inventory['encoderOnly']);assert\
        \ len(encoder_only)==1\nrecording_two='native::client_browser::recording_attempt_tests::chromium_two_attempt_recording_late_old_completion_cannot_mutate_new_artifact'\n\
        # These fixtures own fresh processes. Unexpected ambient attachment is a setup failure.\nfor key in ['AGENT_BROWSER_CDP','AGENT_BROWSER_AUTO_CONNECT','AGENT_BROWSER_PROVIDER','AGENT_BROWSER_PROFILE']:\n\
        \ if os.environ.get(key):raise SystemExit('Unexpected ambient browser attachment/profile: '+key)\nchrome=pathlib.Path(meta['executablePath']).resolve();digest=hashlib.sha256(chrome.read_bytes()).hexdigest();assert\
        \ digest==meta['sha256'];version=subprocess.check_output([str(chrome),'--version'],text=True).strip();assert '156.'\
        \ in version\nencoder_paths={k:pathlib.Path(shutil.which(k)).resolve() for k in ['ffmpeg','ffprobe']}; encoder_hashes={k:hashlib.sha256(v.read_bytes()).hexdigest()\
        \ for k,v in encoder_paths.items()}; versions={k:{'path':str(encoder_paths[k]),'sha256':encoder_hashes[k],'version':subprocess.check_output([k,'-version'],text=True).splitlines()[0]}\
        \ for k in encoder_paths};(out/'encoder-tools.json').write_text(json.dumps(versions,indent=2)+'\\n')\nlisting=subprocess.run([str(harness),'--ignored','--list'],capture_output=True,text=True,timeout=30);(out/'native-ignored-inventory.log').write_text(listing.stdout+listing.stderr);assert\
        \ listing.returncode==0\nfound=[x[:-6] for x in listing.stdout.splitlines() if x.endswith(': test')];assert len(found)==len(set(found))\n\
        unknown=[x for x in found if x.startswith('native::client_') and x not in names+inventory['diagnostics']];failures=['unclassified:\
