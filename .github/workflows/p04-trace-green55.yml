name: 'P04 unified cleanup plus retirement43: 55 exact GREEN regressions'
'on':
  push:
    branches:
    - validation/p04-trace-green55-20261025
permissions:
  contents: read
concurrency:
  group: p04-trace-green55-${{ github.ref }}
  cancel-in-progress: false
jobs:
  p04-trace:
    name: p04-trace-green55-targeted-regressions
    if: ${{ github.ref == 'refs/heads/validation/p04-trace-green55-20261025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      RUST_MIN_STACK: '16777216'
      RUST_BACKTRACE: '1'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
      PHASES: recipe-identity source-before source-patch toolchain format clippy acceptance-tests-check proxy-feature-check default-harness-compile
        default-harness-inventory faults-harness-compile faults-harness-inventory source-after-pure pure-summary
    steps:
    - name: Initialize 55-case feature-bound evidence; no production or browser
      id: init
      timeout-minutes: 1
      run: 'set -euo pipefail

        umask 077

        export EVIDENCE_DIR="$RUNNER_TEMP/p04-trace-green55-evidence"

        export CARGO_HOME="$RUNNER_TEMP/p04-trace-green55-cargo"

        export CARGO_TARGET_DIR="$RUNNER_TEMP/p04-trace-green55-target"

        export VALIDATE="$GITHUB_WORKSPACE/recipe/scripts/p04-trace-green55/validate.py"

        printf ''EVIDENCE_DIR=%s\nCARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nVALIDATE=%s\n'' "$EVIDENCE_DIR" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$VALIDATE"
        >> "$GITHUB_ENV"

        test ! -e "$CARGO_TARGET_DIR"

        mkdir -m700 "$EVIDENCE_DIR"

        test "$GITHUB_RUN_ATTEMPT" = 1

        for phase in $PHASES; do printf ''not-run\n'' > "$EVIDENCE_DIR/$phase.exit"; done

        printf ''%s\n'' ''Production-fix source; 51 default and 4 acceptance-faults exact tests all require real PASS. No production ELF, browser
        or release proof.'' > "$EVIDENCE_DIR/SCOPE.txt"


        uname -a > "$EVIDENCE_DIR/host.txt"

        cat /etc/os-release >> "$EVIDENCE_DIR/host.txt"

        . /etc/os-release

        test "$RUNNER_OS" = Linux

        test "$(uname -m)" = x86_64

        test "$(id -u)" -ne 0

        test "$ID" = ubuntu

        test "$VERSION_ID" = 24.04'
    - name: Check out this immutable 55-case recipe
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - name: Verify exact frozen response source binding
      id: binding
      timeout-minutes: 1
      run: 'set -euo pipefail

        python3 -B "$VALIDATE" guard

        python3 -B "$VALIDATE" run recipe-identity 30 python3 -B "$VALIDATE" recipe "$GITHUB_WORKSPACE/recipe" "$GITHUB_WORKFLOW_SHA"

        sha256sum recipe/.github/workflows/p04-trace-green55.yml recipe/scripts/p04-trace-green55/validate.py recipe/scripts/p04-trace-green55/pins.json
        recipe/scripts/p04-trace-green55/source-change.patch > "$EVIDENCE_DIR/recipe.sha256"'
    - name: Check out exact 11-file production-fix native source
      id: source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SHA }}
        path: source
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact parent, 11-file delta and reversible patch
      id: before
      timeout-minutes: 1
      run: 'set -euo pipefail

        python3 -B "$VALIDATE" run source-before 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" pristine

        python3 -B "$VALIDATE" run source-patch 30 python3 -B "$VALIDATE" apply "$GITHUB_WORKSPACE/source"'
    - name: Cache registry bytes only, never target executables
      id: registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      timeout-minutes: 3
      with:
        path: '${{ env.CARGO_HOME }}/registry

          ${{ env.CARGO_HOME }}/git/db'
        key: focused-registry-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-${{ env.NATIVE_LOCK_SHA256 }}
    - name: Install and verify the existing pinned official Rust toolchain
      id: rust
      timeout-minutes: 11
      run: 'python3 -B "$VALIDATE" run toolchain 600 bash -euc ''

        rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

        rustc -Vv

        cargo -Vv

        test "$(rustc -Vv | sed -n "s/^release: //p")" = "$RUSTUP_TOOLCHAIN"

        test "$(rustc -Vv | sed -n "s/^host: //p")" = x86_64-unknown-linux-gnu

        '' '
    - name: Run all four unchanged strict compile gates
      id: strict
      timeout-minutes: 43
      working-directory: source/cli
      run: 'set -uo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET

        failed=0

        python3 -B "$VALIDATE" run format 120 cargo fmt --all -- --check || failed=1

        python3 -B "$VALIDATE" run clippy 900 cargo clippy --locked --profile dev --no-default-features --all-targets -- -D warnings || failed=1

        python3 -B "$VALIDATE" run acceptance-tests-check 900 cargo check --locked --profile dev --no-default-features --features acceptance-faults
        --tests || failed=1

        python3 -B "$VALIDATE" run proxy-feature-check 600 cargo check --locked --profile dev --no-default-features --features acceptance-faults
        --test client-proxy-fixture || failed=1

        exit "$failed"'
    - name: Compile and bind separate default and acceptance-faults dev harnesses
      id: harness
      timeout-minutes: 28
      working-directory: source/cli
      run: 'set -euo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET

        python3 -B "$VALIDATE" run default-harness-compile 1500 cargo test --locked --profile dev --no-default-features --bin agent-browser --no-run
        --message-format=json

        python3 -B "$VALIDATE" run default-harness-inventory 90 python3 -B "$VALIDATE" harness "$GITHUB_WORKSPACE/source" default

        python3 -B "$VALIDATE" run faults-harness-compile 1500 cargo test --locked --profile dev --no-default-features --features acceptance-faults
        --bin agent-browser --no-run --message-format=json

        python3 -B "$VALIDATE" run faults-harness-inventory 90 python3 -B "$VALIDATE" harness "$GITHUB_WORKSPACE/source" faults

        '
    - name: Require schema and both immediate controls then all 55 exact PASS
      id: cases
      timeout-minutes: 13
      run: 'set -euo pipefail

        unset AGENT_BROWSER_NETWORK_PROBE_SHA256 AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case case-01

        python3 -B "$VALIDATE" case case-02

        python3 -B "$VALIDATE" case case-03

        python3 -B "$VALIDATE" case case-04

        python3 -B "$VALIDATE" case case-05

        python3 -B "$VALIDATE" case case-06

        python3 -B "$VALIDATE" case case-07

        python3 -B "$VALIDATE" case case-08

        python3 -B "$VALIDATE" case case-09

        python3 -B "$VALIDATE" case case-10

        python3 -B "$VALIDATE" case case-11

        python3 -B "$VALIDATE" case case-12

        python3 -B "$VALIDATE" case case-13

        python3 -B "$VALIDATE" case case-14

        python3 -B "$VALIDATE" case case-15

        python3 -B "$VALIDATE" case case-16

        python3 -B "$VALIDATE" case case-17

        python3 -B "$VALIDATE" case case-18

        python3 -B "$VALIDATE" case case-19

        python3 -B "$VALIDATE" case case-20

        python3 -B "$VALIDATE" case case-21

        python3 -B "$VALIDATE" case case-22

        python3 -B "$VALIDATE" case case-23

        python3 -B "$VALIDATE" case case-24

        python3 -B "$VALIDATE" case case-25

        python3 -B "$VALIDATE" case case-26

        python3 -B "$VALIDATE" case case-27

        python3 -B "$VALIDATE" case case-28

        python3 -B "$VALIDATE" case case-29

        python3 -B "$VALIDATE" case case-30

        python3 -B "$VALIDATE" case case-31

        python3 -B "$VALIDATE" case case-32

        python3 -B "$VALIDATE" case case-33

        python3 -B "$VALIDATE" case case-34

        python3 -B "$VALIDATE" case case-35

        python3 -B "$VALIDATE" case case-36

        python3 -B "$VALIDATE" case case-37

        python3 -B "$VALIDATE" case case-38

        python3 -B "$VALIDATE" case case-39

        python3 -B "$VALIDATE" case case-40

        python3 -B "$VALIDATE" case case-41

        python3 -B "$VALIDATE" case case-42

        python3 -B "$VALIDATE" case case-43

        python3 -B "$VALIDATE" case case-44

        python3 -B "$VALIDATE" case case-45

        python3 -B "$VALIDATE" case case-46

        python3 -B "$VALIDATE" case case-47

        python3 -B "$VALIDATE" case case-48

        python3 -B "$VALIDATE" case case-49

        python3 -B "$VALIDATE" case case-50

        python3 -B "$VALIDATE" case case-51

        python3 -B "$VALIDATE" case case-52

        python3 -B "$VALIDATE" case case-53

        python3 -B "$VALIDATE" case case-54

        python3 -B "$VALIDATE" case case-55

        '
    - name: Verify unchanged source after pure cases
      id: after_pure
      timeout-minutes: 1
      if: ${{ always() && steps.before.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run source-after-pure 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source"
    - name: Reconcile all 55 actual PASS, not browser acceptance
      id: pure
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run pure-summary 30 python3 -B "$VALIDATE" summary
    - name: Require all strict gates and 55 actual PASS
      id: gate
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: 'set -euo pipefail

        python3 -B "$VALIDATE" aggregate $PHASES

        '
    - name: Retain exact step outcomes
      id: outcomes
      timeout-minutes: 1
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: printf '%s\n' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"
    - name: Always retain raw evidence and genuine exits
      id: diagnostics
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      if: ${{ always() }}
      with:
        name: p04-trace-green55-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ env.EVIDENCE_DIR }}/*.json

          ${{ env.EVIDENCE_DIR }}/*.log

          ${{ env.EVIDENCE_DIR }}/*.exit

          ${{ env.EVIDENCE_DIR }}/*.txt

          ${{ env.EVIDENCE_DIR }}/*.sha256'
        if-no-files-found: error
        retention-days: 7
