      run: "set -euo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY\
        \ ANTHROPIC_API_KEY\npnpm exec tsc --noEmit\npython3 - <<'PY_TESTBED'\nimport json,os,pathlib,subprocess,shutil\n\
        out=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'evidence';results=[]\nfor label,file,grep,count in [('pointer','tests/pointer.e2e.ts',None,6),('node-drag','tests/board.e2e.ts','dragging\
        \ the card marks it done',1)]:\n dest=out/label;dest.mkdir(parents=True,exist_ok=True);args=[file]+(['--grep',grep]\
        \ if grep else [])\n listed=subprocess.run(['node','node_modules/e2e/dist/cli/bin.js','list',*args,'--reporter','json'],capture_output=True,text=True)\n\
        \ (dest/'selection.json').write_text(listed.stdout);(dest/'selection.stderr').write_text(listed.stderr)\n\
        \ pairs=json.loads(listed.stdout)['pairs'];assert listed.returncode==0 and len(pairs)==count and all(x['disposition']=='run'\
        \ for x in pairs),pairs\n with open(dest/'tests.log','w') as log:run=subprocess.run(['node','node_modules/e2e/dist/cli/bin.js','run',*args],stdout=log,stderr=subprocess.STDOUT)\n\
        \ (dest/'tests.exit').write_text(str(run.returncode)+'\\n')\n custody=None;executed=None\n try:\n  source=pathlib.Path('.e2e');shutil.copytree(source,dest/'runner',dirs_exist_ok=True)\n\
        \  report=json.load(open(source/'report.json'))['run'];executed=[x for x in report['results'] if x.get('attempts')]\n\
        \  assert len(executed)==count, len(executed)\n except Exception as error:custody=type(error).__name__+':\
        \ '+str(error)\n results.append({'selection':label,'expected':count,'testExit':run.returncode,'executed':None\
        \ if executed is None else len(executed),'collectionError':custody})\n (out/'testbed-result.json').write_text(json.dumps(results,indent=2))\n\
        print(json.dumps(results,indent=2));raise SystemExit(0 if len(results)==2 and all(r['testExit']==0 and r['executed']==r['expected']\
        \ and r['collectionError'] is None for r in results) else 1)\nPY_TESTBED\n"
    - name: Validate actual paired native capture sets and preserve loss limits
      if: ${{ always() }}
      run: 'set -euo pipefail

        n="$(find evidence/native-trace -maxdepth 1 -name ''native-*.jsonl'' -type f | wc -l)"

        test "$n" -ge 1

        python3 scripts/ci/check-critical-query-traces.py "$n"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: swipe-drop-original-testbed-pointer-evidence
        path: 'evidence/

          apps/testbed/.e2e/report.json

          apps/testbed/.e2e/results/'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    needs:
    - native-runtime
  interop-replacement-retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Download exact same-run ordinary artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.native-runtime.outputs.artifact-id }}
        path: ${{ runner.temp }}/ci-native-runtime
        merge-multiple: true
    - name: Verify exact same-run source host compiler executable
      id: verify
      env:
        EXPECTED_MANIFEST_SHA256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
        PRODUCER_ATTEMPT: ${{ needs.native-runtime.outputs.run-attempt }}
      run: 'set -euo pipefail

        node scripts/ci/native-runtime.ts verify "$RUNNER_TEMP/ci-native-runtime" "$EXPECTED_MANIFEST_SHA256" "$PRODUCER_ATTEMPT"


        cp "$RUNNER_TEMP/ci-native-runtime/manifest.json" evidence/native-runtime.manifest.json

        '
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
      id: chrome
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
      id: build
    - name: Strict typecheck and original 102 native client pure controls with URL diagnostics
      if: ${{ always() && steps.build.outcome == 'success' }}
      run: 'set -euo pipefail

        python3 - <<''PY_CONFIG''

        import json,pathlib

        p=pathlib.Path(''packages/web'')

        (p/''tsconfig.url-diagnostic.json'').write_text(json.dumps({''extends'':''../../tsconfig.base.json'',''compilerOptions'':{''noEmit'':True,''lib'':[''ES2023'',''DOM'',''DOM.Iterable'']},''files'':[''src/native/client.ts'',''tests/unit/native-client.test.ts'']}))

        (p/''vitest.url-diagnostic.config.mts'').write_text("import { defineConfig } from ''vitest/config''; export
        default defineConfig({test:{include:[''tests/unit/native-client.test.ts''],testTimeout:30000,hookTimeout:30000,pool:''forks'',maxWorkers:1,minWorkers:1}});\n")

        PY_CONFIG

        set +e

        pnpm --filter @e2e-dev/web exec tsc --noEmit -p tsconfig.url-diagnostic.json > evidence/url-diagnostic-types.log
        2>&1

        type_status=$?

        pnpm --filter @e2e-dev/web exec vitest run --config vitest.url-diagnostic.config.mts --reporter=verbose
        --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/url-diagnostic-unit.json" > evidence/url-diagnostic-unit.log
        2>&1

        unit_status=$?

        set -e

        printf ''%s\n'' "$type_status" > evidence/url-diagnostic-types.exit

        printf ''%s\n'' "$unit_status" > evidence/url-diagnostic-unit.exit

        python3 - <<''PY_CHECK''

        import json,pathlib

        p=pathlib.Path(''evidence'');x=json.load(open(p/''url-diagnostic-unit.json''));assert x[''numTotalTests'']==102
        and x[''numPassedTests'']==102 and x[''numFailedTests'']==0 and x[''numPendingTests'']==0,x

        PY_CHECK

        test "$type_status" -eq 0

        test "$unit_status" -eq 0

        '
    - name: Install and verify the exact original borrowed-host Playwright Chromium
      timeout-minutes: 8
      id: borrowed_chrome
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec playwright-core install chromium

        pnpm --filter @e2e-dev/web exec node --input-type=module - <<''JS_CHROME''

        import { chromium } from ''playwright-core'';

        import { readFileSync, writeFileSync } from ''node:fs'';

        import { createHash } from ''node:crypto'';

        import { execFileSync } from ''node:child_process'';

        import assert from ''node:assert/strict'';

        import { createRequire } from ''node:module'';

        const require=createRequire(import.meta.url);assert.equal(require(''playwright-core/package.json'').version,''1.64.1'');

        const executable=chromium.executablePath();assert(!/[\r\n]/.test(executable));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.json'',JSON.stringify({executable,version:execFileSync(executable,[''--version''],{encoding:''utf8''}).trim(),sha256:createHash(''sha256'').update(readFileSync(executable)).digest(''hex''),playwright:''1.64.1''},null,2));

        writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/borrowed-chrome.path'',executable);

        JS_CHROME

        chrome="$(cat evidence/borrowed-chrome.path)"

        ldd "$chrome" > evidence/borrowed-chrome-ldd.txt

        ! grep -q ''not found'' evidence/borrowed-chrome-ldd.txt

        profile="$(mktemp -d "$RUNNER_TEMP/g2-borrowed-preflight.XXXXXX")"

        trap ''rm -rf -- "$profile"'' EXIT

        timeout --kill-after=2s 20 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --user-data-dir="$profile"
        --dump-dom about:blank > evidence/borrowed-chrome-preflight.html 2> evidence/borrowed-chrome-preflight.log

        '
    - name: Typecheck exact interop source (full units run independently)
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec tsc --noEmit -p tsconfig.interop-check.json

        '
    - name: Execute exact 6 real interop-replacement-retirement cases
      if: ${{ always() && steps.verify.outcome == 'success' && steps.chrome.outcome == 'success' && steps.build.outcome
        == 'success' }}
      run: 'set -euo pipefail

        mkdir -p evidence

        pnpm --filter @e2e-dev/web exec vitest list --config vitest.interop-replacement-retirement.config.ts --no-staticParse
        --json="$GITHUB_WORKSPACE/evidence/collection.json"

        python3 - <<''PY_COLLECT''

        import json

        r=json.load(open(''evidence/collection.json''));assert len(r)==6,len(r)

        PY_COLLECT

        export E2E_INTEROP_EVIDENCE_DIR="$GITHUB_WORKSPACE/evidence/receipts"

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        set +e

        pnpm --filter @e2e-dev/web exec vitest run --config vitest.interop-replacement-retirement.config.ts --reporter=verbose
        --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/results.json" 2>&1 | tee evidence/tests.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/tests.exit

        python3 - <<''PY_RESULTS''

        import json,pathlib

        r=json.load(open(''evidence/results.json''));a=[x for t in r[''testResults''] for x in t[''assertionResults'']];counts={k:r[k]
        for k in [''numTotalTests'',''numPassedTests'',''numFailedTests'',''numPendingTests'']};json.dump(counts,open(''evidence/counts.json'',''w''),indent=2)

        assert len(a)==r[''numTotalTests'']==6 and r[''numPendingTests'']==0

        receipts=[json.load(open(p)) for p in pathlib.Path(''evidence/receipts'').glob(''*.json'')];assert len(receipts)==6,len(receipts)

        assert r[''numPassedTests'']==6 and r[''numFailedTests'']==0

        assert all(x[''runtime'']==''passed'' and x[''cleanup'']==''passed'' for x in receipts)

        PY_RESULTS

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: swipe-drop-original-cancel-cleanup-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    env:
      E2E_SCOPE_RETIREMENT_DIAGNOSTIC: '1'
      E2E_INTEROP_BINDING_DIAGNOSTIC: '1'
      E2E_PLATFORM_HANDLER_DIAGNOSTIC: '1'
      E2E_DOWNLOAD_RELEASE_DIAGNOSTIC: '0'
    needs:
    - native-runtime
