name: Point swipe typed receipt r4 acceptance
permissions:
  contents: read
  actions: read
concurrency:
  group: point-swipe-drop-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 3af92d07c28061b15333996f1051f2eda67c8869
  NATIVE_SOURCE_TREE: 171c51fb8f69e13de22df66c59483f05f17bd415
  NEXT_TELEMETRY_DISABLED: '1'
'on':
  push:
    branches:
    - ci/point-swipe-receipt-r4
jobs:
  preflight-both-mode-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - name: Check default and acceptance-faults tests without executing any harness
      run: "set +e\nset -uo pipefail\nmkdir -p evidence\ncd native/cli\ntest \"$(git rev-parse HEAD)\" = \"$NATIVE_SOURCE_SHA\"\
        \ || exit 1\ntest \"$(git rev-parse HEAD^{tree})\" = \"$NATIVE_SOURCE_TREE\" || exit 1\ntest -z \"$(git\
        \ status --porcelain)\" || exit 1\nrustup toolchain install 1.99.1 --profile minimal || exit 1\nrustc +1.99.1\
        \ -Vv > \"$GITHUB_WORKSPACE/evidence/rustc-version.txt\"\ncargo +1.99.1 -Vv > \"$GITHUB_WORKSPACE/evidence/cargo-version.txt\"\
        \nsha256sum Cargo.lock > \"$GITHUB_WORKSPACE/evidence/cargo-lock.sha256\"\nunset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER\
        \ RUSTFLAGS CARGO_ENCODED_RUSTFLAGS\nexport CARGO_TARGET_DIR=\"$RUNNER_TEMP/native36-check-target\"\nfailed=0\n\
        for kind in default acceptance-faults; do\n  args=()\n  if test \"$kind\" = acceptance-faults; then args+=(--features\
        \ acceptance-faults); fi\n  cargo +1.99.1 check --locked --profile ci --tests --bin agent-browser -j1 \"\
        ${args[@]}\" --message-format=json > \"$GITHUB_WORKSPACE/evidence/$kind.jsonl\" 2> \"$GITHUB_WORKSPACE/evidence/$kind.log\"\
        \n  status=$?\n  printf '%s\\n' \"$status\" > \"$GITHUB_WORKSPACE/evidence/$kind.exit\"\n  if test \"$status\"\
        \ -ne 0; then failed=1; fi\ndone\npython3 - <<'PY_RECEIPT'\nimport json,os,pathlib\np=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'evidence';rows=[]\n\
        for kind in ['default','acceptance-faults']:\n records=[json.loads(x) for x in (p/(kind+'.jsonl')).read_text().splitlines()]\n\
        \ errors=[r['message']['rendered'] for r in records if r.get('reason')=='compiler-message' and r.get('message',{}).get('level')=='error']\n\
        \ rows.append({'kind':kind,'exit':int((p/(kind+'.exit')).read_text()),'buildFinished':[r.get('success')\
        \ for r in records if r.get('reason')=='build-finished'],'errors':errors})\n(p/'result.json').write_text(json.dumps({'nativeSource':{'commit':os.environ['NATIVE_SOURCE_SHA'],'tree':os.environ['NATIVE_SOURCE_TREE']},'kind':'cargo-check-tests-only','reviewPending':False,'testExecution':False,'runtimeAcceptance':False,'results':rows},indent=2))\n\
        assert all(r['exit']==0 and r['buildFinished']==[True] for r in rows),rows\nPY_RECEIPT\nreceipt=$?\ntest\
        \ \"$failed\" -eq 0 && test \"$receipt\" -eq 0\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: swipe-drop-preflight-both-mode-typecheck-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  native-runtime:
    uses: ./.github/workflows/native-runtime.yml
    needs:
    - preflight-both-mode-typecheck
  supplementary-fast-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - name: Exact source JavaScript nine bounded negative and positive controls
      run: node scripts/ci/check-selector-taxonomy.cjs native/cli/src/native/client_observation/selector_query.js
    - name: Compile supplementary fast-profile test harness (not production acceptance)
      shell: bash
      run: "set -euo pipefail\nmkdir -p evidence\ncd native/cli\ntest \"$(git rev-parse HEAD)\" = \"$NATIVE_SOURCE_SHA\"\
        \ntest \"$(git rev-parse HEAD^{tree})\" = \"$NATIVE_SOURCE_TREE\"\ntest -z \"$(git status --porcelain)\"\
        \nrustup toolchain install 1.99.1 --profile minimal\nrustc +1.99.1 -Vv > \"$GITHUB_WORKSPACE/evidence/rustc-version.txt\"\
        \ncargo +1.99.1 -Vv > \"$GITHUB_WORKSPACE/evidence/cargo-version.txt\"\nunset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER\
        \ RUSTFLAGS CARGO_ENCODED_RUSTFLAGS\nexport CARGO_TARGET_DIR=\"$RUNNER_TEMP/native-regressions-target\"\n\
        cargo +1.99.1 test --locked --profile ci-test-fast --config 'profile.ci-test-fast.inherits=\"ci\"' --config\
        \ profile.ci-test-fast.opt-level=1 --config 'profile.ci-test-fast.lto=\"off\"' --config profile.ci-test-fast.codegen-units=16\
        \ --config profile.ci-test-fast.debug=0 --config profile.ci-test-fast.debug-assertions=false --config profile.ci-test-fast.overflow-checks=false\
        \ --config 'profile.ci-test-fast.panic=\"unwind\"' --config profile.ci-test-fast.incremental=false --config\
        \ profile.ci-test-fast.strip=true --timings --no-default-features --features acceptance-faults --bin agent-browser\
        \ -j1 --no-run --message-format=json > \"$GITHUB_WORKSPACE/evidence/harness.jsonl\" 2> \"$GITHUB_WORKSPACE/evidence/harness-build.log\"\
        \npython3 - <<'PY_HARNESS'\nimport json, os\nfrom pathlib import Path\nout = Path(os.environ['GITHUB_WORKSPACE'])\
        \ / 'evidence'\npaths = set()\nbuild_finished = []\nfor line in (out / 'harness.jsonl').read_text().splitlines():\n\
        \    record = json.loads(line)\n    if record.get('reason') == 'build-finished':\n        build_finished.append(record.get('success')\
        \ is True)\n    if (record.get('reason') == 'compiler-artifact'\n        and record.get('target', {}).get('name')\
        \ == 'agent-browser'\n        and 'bin' in record.get('target', {}).get('kind', [])\n        and record.get('profile',\
        \ {}).get('test') is True\n        and record.get('features') == ['acceptance-faults']\n        and record.get('executable')):\n\
        \        assert record['profile']['opt_level']=='1' and record['profile']['debug_assertions'] is False and\
        \ record['profile']['overflow_checks'] is False\n        paths.add(record['executable'])\nif build_finished\
        \ != [True]:\n    raise SystemExit('Missing or unsuccessful final compiler build receipt')\nif len(paths)\
        \ != 1:\n    raise SystemExit(f'Expected exactly one test executable, got {len(paths)}')\nharness = paths.pop()\n\
        if not Path(harness).is_file():\n    raise SystemExit('Compiler-selected harness is missing')\n(out / 'harness.path').write_text(harness\
        \ + '\\n')\nPY_HARNESS\nmkdir -p \"$GITHUB_WORKSPACE/native-harness\"\nharness=\"$(cat \"$GITHUB_WORKSPACE/evidence/harness.path\"\
        )\"\ncp \"$harness\" \"$GITHUB_WORKSPACE/native-harness/agent-browser-tests\"\ngit rev-parse HEAD > \"$GITHUB_WORKSPACE/native-harness/native-source.sha\"\
        \ngit rev-parse HEAD^{tree} > \"$GITHUB_WORKSPACE/native-harness/native-source.tree\"\n(cd \"$GITHUB_WORKSPACE/native-harness\"\
        ; sha256sum agent-browser-tests > SHA256SUMS)\n\nprintf '%s\\n' acceptance-faults > \"$GITHUB_WORKSPACE/native-harness/features.txt\"\
        \nprintf '%s\\n' \"$GITHUB_RUN_ID\" > \"$GITHUB_WORKSPACE/native-harness/producer-run.id\"\n\nmkdir -p \"\
        $GITHUB_WORKSPACE/evidence/cargo-timings\"\ncp -a \"$RUNNER_TEMP/native-regressions-target/cargo-timings/.\"\
        \ \"$GITHUB_WORKSPACE/evidence/cargo-timings/\"\n\nprintf \"harness-sha=%s\\n\" \"$(sha256sum \"$GITHUB_WORKSPACE/native-harness/agent-browser-tests\"\
        \ | cut -d' ' -f1)\" >> \"$GITHUB_OUTPUT\"\n"
      id: compile
    - name: Run exact optional observation producer inventory
      run: python3 scripts/ci/run-optional-observe-tests.py "$(cat evidence/harness.path)" scripts/ci/optional-observe-inventory.json
        evidence/native-focused
    - name: Run owner-stop containment isolated reopen and worker error exact controls
      if: ${{ always() && steps.compile.outcome == 'success' }}
      run: python3 scripts/ci/run-owner-stop-exact.py
    - name: Run six typed admission controls plus unchanged original swipe exact
      if: ${{ always() && steps.compile.outcome == 'success' }}
      run: python3 scripts/ci/run-typed-admission-exact.py candidate
    - name: Run complete original nonignored feature harness without filters
      run: 'set -euo pipefail

        native-harness/agent-browser-tests --list > evidence/all-tests.list

        native-harness/agent-browser-tests --ignored --list > evidence/ignored-tests.list

        python3 - <<''PY_INVENTORY''

        import pathlib,json

        p=pathlib.Path(''evidence'')

        def names(f):return [x[:-6] for x in (p/f).read_text().splitlines() if x.endswith('': test'')]

        a=names(''all-tests.list'');i=names(''ignored-tests.list'');assert a and len(a)==len(set(a)) and len(i)==len(set(i))
        and set(i)<=set(a)

        json.dump({''total'':len(a),''ignored'':len(i),''nonignored'':len(a)-len(i),''features'':[''acceptance-faults''],''standardDefaultFeatureAcceptance'':False},open(p/''inventory.json'',''w''),indent=2)

        PY_INVENTORY

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN

        set +e

        timeout --signal=TERM --kill-after=5s 1200 native-harness/agent-browser-tests > evidence/full-suite.log
        2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > evidence/full-suite.exit

        python3 - <<''PY_RESULTS''

        import pathlib,json,re

        p=pathlib.Path(''evidence'');s=(p/''full-suite.log'').read_text();i=json.load(open(p/''inventory.json''));m=re.findall(r''test
        result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out'',s)

        result={''exit'':int((p/''full-suite.exit'').read_text()),''inventory'':i,''summaries'':m,''failedTests'':re.findall(r''^test
        (.+) \.\.\. FAILED$'',s,re.M),''notDefaultFeatureAcceptance'':True}

        (p/''result.json'').write_text(json.dumps(result,indent=2)+''\n'');assert len(m)==1,m

        _,passed,failed,ignored,measured,filtered=m[0];assert int(passed)+int(failed)==i[''nonignored''];assert
        int(ignored)==i[''ignored''] and int(measured)==int(filtered)==0;assert int(passed)+int(failed)+int(ignored)==i[''total'']

        assert result[''exit'']==0 and int(failed)==0,result

        PY_RESULTS

        test "$status" -eq 0

        '
      if: ${{ always() && steps.compile.outcome == 'success' }}
    - name: Run exact two selector syntax parser and expression controls
      if: ${{ always() && steps.compile.outcome == 'success' }}
      run: python3 scripts/ci/run-selector-taxonomy-exact.py
    - name: Run three exact paused popup initialization wire controls
      if: ${{ always() && steps.compile.outcome == 'success' }}
      run: "python3 - <<'PY_POPUP_WIRE'\nimport json,pathlib,subprocess,re,hashlib,os,sys\nside='candidate'\nout=pathlib.Path('evidence/popup-init-wire');out.mkdir(parents=True,exist_ok=True)\n\
        h=pathlib.Path('evidence/harness.path').read_text().strip();listed=subprocess.check_output([h,'--list','--format','terse'],text=True)\n\
        suffixes=['immediate_init_requires_exact_paused_attachment_receipt', 'immediate_init_is_explicit_and_installed_once_per_session',\
        \ 'popup_runtime_ack_precedes_every_script_and_failure_never_resumes']\nresults=[]\nfor suffix in suffixes:\n\
        \ names=[l[:-6] for l in listed.splitlines() if l.endswith('::'+suffix+': test')];assert len(names)==1\n\
        \ try:\n  r=subprocess.run([h,'--exact',names[0],'--nocapture','--test-threads=1'],capture_output=True,text=True,timeout=120);text=r.stdout+r.stderr;code=r.returncode\n\
        \ except subprocess.TimeoutExpired as error:\n  text=(error.stdout or b'').decode() if isinstance(error.stdout,bytes)\
        \ else (error.stdout or '');text+='\\nOUTER_TIMEOUT\\n';code=124\n (out/(suffix+'.log')).write_text(text);counts=re.findall(r'test\
        \ result: (?:ok|FAILED)\\. (\\d+) passed; (\\d+) failed; (\\d+) ignored;',text);valid=len(counts)==1 and\
        \ sum(map(int,counts[0][:2]))==1 and counts[0][2]=='0';results.append({'name':names[0],'exit':code,'counts':counts,'exactOneNoSkip':valid,'expectedCancellationMismatchObserved':side=='baseline'\
        \ and valid and code!=0 and 'left: Err(BrowserFailure)' in text and 'right: Err(Cancelled)' in text});print(text)\n\
        q={'source':os.environ['NATIVE_SOURCE_SHA'],'tree':os.environ['NATIVE_SOURCE_TREE'],'side':side,'results':results,'harnessSha256':hashlib.sha256(pathlib.Path(h).read_bytes()).hexdigest(),'doesNotEstablishHistoricalSwipeRootCause':True};(out/'result.json').write_text(json.dumps(q,indent=2));print(json.dumps(q));raise\
        \ SystemExit(0 if len(results)==len(suffixes) and all(x['exit']==0 and x['exactOneNoSkip'] for x in results)\
        \ else 1)\n\nPY_POPUP_WIRE\n"
    - name: Run new 22 exact drop controls and original 18 pointer node-drag cleanup regressions
      if: ${{ always() && steps.compile.outcome == 'success' }}
      run: "python3 - <<'PY_SWIPE_EXACT'\nimport json,pathlib,subprocess,re,hashlib,os,sys\nside='candidate'\nout=pathlib.Path('evidence/swipe-drop-exact');out.mkdir(parents=True,exist_ok=True)\n\
        h=pathlib.Path('evidence/harness.path').read_text().strip();listed=subprocess.check_output([h,'--list','--format','terse'],text=True)\n\
        suffixes=['exact_drag_foreign_payload_cannot_charge_or_mint_receipt', 'exact_drag_oversize_retains_receipt_but_never_returns_data',\
        \ 'exact_drag_duplicate_overflow_retains_receipt_and_fails_closed', 'exact_drag_closed_without_event_never_mints_receipt',\
        \ 'exact_drag_invalid_envelope_never_mints_cleanup_authority', 'exact_drag_route_outlives_helper_through_retained_receiver',\
        \ 'exact_drag_final_seal_rejects_duplicate_after_first_receive', 'exact_drag_cleanup_seal_accepts_only_one_healthy_owned_payload',\
        \ 'direct_point_html5_early_and_late_interception_wait_for_exact_drop_ack', 'direct_point_html5_rejected_drop_is_failure_and_cleans_own_drag_once',\
        \ 'direct_point_existing_object_capacity_rejects_before_press_and_cleans_every_observer', 'direct_point_enable_error_ack_before_held_move_preserves_primary_and_cleans',\
        \ 'direct_point_held_move_error_ack_without_drag_receipt_preserves_unknown', 'direct_point_held_move_error_ack_with_own_receipt_cleans_without_replay',\
        \ 'snapshot_includes_same_process_and_oopif_but_not_popup', 'snapshot_changes_for_added_removed_parent_and_loader_frames',\
        \ 'incomplete_or_unready_ownership_is_not_empty_success', 'unrelated_application_epoch_conservatively_rejects_equal_selected_bindings',\
        \ 'frame_cap_is_bounded_before_remote_resources', 'sibling_realms_need_not_receive_the_mouse_move', 'degenerate_move_remains_pointer_only_but_missing_inventory_is_not_false',\
        \ 'malformed_probe_result_does_not_become_no_drag', 'direct_point_original_tap_at_10_20', 'direct_point_original_double_tap_at_10_20',\
        \ 'direct_point_original_secondary_tap_at_10_20', 'direct_point_original_long_press_at_10_20_holds_700_ms',\
        \ 'direct_point_original_fractional_tap_and_swipe_round_to_css_pixels', 'direct_point_original_swipe_to_110_20_uses_midpoint',\
        \ 'direct_point_original_swipe_to_70_20_paces_three_moves_over_48_ms', 'direct_point_original_swipe_to_70_20_cancel_after_first_move_releases_once',\
        \ 'direct_point_uses_only_exact_input_and_late_ack_never_resumes_double_tap', 'live_drag_destination_revalidates_after_press_without_replay',\
        \ 'managed_drag_cleanup_keeps_one_release_and_its_original_late_ack', 'live_drag_destination_can_follow_unique_replacement_after_press',\
        \ 'node_drag_repeats_destination_move_before_its_only_release', 'observed_drag_destination_keeps_exact_identity_after_press',\
        \ 'pointer_drag_keeps_exact_points_without_destination_resolution', 'action_success_cannot_hide_cleanup_integrity_and_primary_error_survives',\
        \ 'shared_pointer_secondary_double_click_and_cleanup_preserve_state', 'pointer_state_survives_move_down_drag_wheel_up']\n\
        results=[]\nfor suffix in suffixes:\n names=[l[:-6] for l in listed.splitlines() if l.endswith('::'+suffix+':\
        \ test')];assert len(names)==1\n try:\n  r=subprocess.run([h,'--exact',names[0],'--nocapture','--test-threads=1'],capture_output=True,text=True,timeout=120);text=r.stdout+r.stderr;code=r.returncode\n\
        \ except subprocess.TimeoutExpired as error:\n  text=(error.stdout or b'').decode() if isinstance(error.stdout,bytes)\
        \ else (error.stdout or '');text+='\\nOUTER_TIMEOUT\\n';code=124\n (out/(suffix+'.log')).write_text(text);counts=re.findall(r'test\
        \ result: (?:ok|FAILED)\\. (\\d+) passed; (\\d+) failed; (\\d+) ignored;',text);valid=len(counts)==1 and\
        \ sum(map(int,counts[0][:2]))==1 and counts[0][2]=='0';results.append({'name':names[0],'exit':code,'counts':counts,'exactOneNoSkip':valid,'expectedCancellationMismatchObserved':side=='baseline'\
        \ and valid and code!=0 and 'left: Err(BrowserFailure)' in text and 'right: Err(Cancelled)' in text});print(text)\n\
        q={'source':os.environ['NATIVE_SOURCE_SHA'],'tree':os.environ['NATIVE_SOURCE_TREE'],'side':side,'results':results,'harnessSha256':hashlib.sha256(pathlib.Path(h).read_bytes()).hexdigest(),'doesNotEstablishHistoricalSwipeRootCause':True};(out/'result.json').write_text(json.dumps(q,indent=2));print(json.dumps(q));raise\
        \ SystemExit(0 if len(results)==len(suffixes) and all(x['exit']==0 and x['exactOneNoSkip'] for x in results)\
        \ else 1)\n\nPY_SWIPE_EXACT\n"
    - name: Run nine exact typed receipt rejection and cleanup controls
      if: ${{ always() && steps.compile.outcome == 'success' }}
      run: "python3 - <<'PY_SWIPE_EXACT'\nimport json,pathlib,subprocess,re,hashlib,os,sys\nside='candidate'\nout=pathlib.Path('evidence/swipe-receipt-exact');out.mkdir(parents=True,exist_ok=True)\n\
        h=pathlib.Path('evidence/harness.path').read_text().strip();listed=subprocess.check_output([h,'--list','--format','terse'],text=True)\n\
        suffixes=['native::cdp::client::tests::point_drag_setup_preserves_only_typed_local_capacity_and_exact_cancellation',\
        \ 'native::client_debt::tests::validated_rejected_input_reply_is_terminal_failure_not_release_proof', 'native::client_debt::tests::validated_error_reply_requires_exact_reader_envelope_not_unknown_or_success',\
        \ 'native::client_debt::tests::point_drag_cleanup_proof_retires_only_its_exact_rejections_without_success_ack',\
        \ 'native::client_debt::tests::point_drag_cleanup_proof_rejects_mixed_unknown_cleanup_and_wrong_scope_without_partial_retirement',\
        \ 'native::client_actions::tests::direct_point_clicks::direct_point_cancelled_submitted_finish_without_value_is_not_replayed',\
        \ 'native::client_actions::tests::direct_point_clicks::direct_point_cancelled_cleanup_finish_timeout_preserves_unknown',\
        \ 'native::client_actions::tests::direct_point_clicks::direct_point_cancelled_cleanup_negative_in_destroyed_realm_is_not_proof',\
        \ 'native::client_actions::tests::direct_point_clicks::direct_point_cancelled_cleanup_late_own_event_is_cancelled_once']\n\
        results=[]\nfor suffix in suffixes:\n names=[l[:-6] for l in listed.splitlines() if l==suffix+': test'];assert\
        \ len(names)==1\n try:\n  r=subprocess.run([h,'--exact',names[0],'--nocapture','--test-threads=1'],capture_output=True,text=True,timeout=120);text=r.stdout+r.stderr;code=r.returncode\n\
        \ except subprocess.TimeoutExpired as error:\n  text=(error.stdout or b'').decode() if isinstance(error.stdout,bytes)\
        \ else (error.stdout or '');text+='\\nOUTER_TIMEOUT\\n';code=124\n (out/(suffix.rsplit('::',1)[-1]+'.log')).write_text(text);counts=re.findall(r'test\
        \ result: (?:ok|FAILED)\\. (\\d+) passed; (\\d+) failed; (\\d+) ignored;',text);valid=len(counts)==1 and\
        \ sum(map(int,counts[0][:2]))==1 and counts[0][2]=='0';results.append({'name':names[0],'exit':code,'counts':counts,'exactOneNoSkip':valid,'expectedCancellationMismatchObserved':side=='baseline'\
        \ and valid and code!=0 and 'left: Err(BrowserFailure)' in text and 'right: Err(Cancelled)' in text});print(text)\n\
        q={'source':os.environ['NATIVE_SOURCE_SHA'],'tree':os.environ['NATIVE_SOURCE_TREE'],'side':side,'results':results,'harnessSha256':hashlib.sha256(pathlib.Path(h).read_bytes()).hexdigest(),'doesNotEstablishHistoricalSwipeRootCause':True};(out/'result.json').write_text(json.dumps(q,indent=2));print(json.dumps(q));raise\
        \ SystemExit(0 if len(results)==len(suffixes) and all(x['exit']==0 and x['exactOneNoSkip'] for x in results)\
        \ else 1)\n\nPY_SWIPE_EXACT\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: swipe-drop-supplementary-fast-faults-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    needs:
    - preflight-both-mode-typecheck
  popup-owned:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Require clean source before evidence and record exact identity
      run: 'set -euo pipefail

        test -z "$(git status --porcelain)"

        mkdir -p evidence

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        sha256sum pnpm-lock.yaml .github/native-candidate.json > evidence/source-pins.sha256

        '
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
