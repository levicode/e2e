name: Core diagnostic type compatibility follow-up (no native rebuild)
'on':
  push:
    branches:
    - implement/core-diagnostic-types-ci
permissions:
  contents: read
concurrency:
  group: core-diagnostic-types-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 8083c6ec629122abf61a5e848a5a67f8be9efc62
  NATIVE_SOURCE_TREE: ad5cd8ce308a85365442f00d50de245082e75c3f
jobs:
  core-types-and-units:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from
        "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
      id: build
    - name: Complete core source typecheck
      run: 'set -euo pipefail

        pnpm --filter e2e exec tsc --noEmit 2>&1 | tee evidence/core-typecheck.log'
    - name: Complete core unit discovery after successful builds
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: 'set -euo pipefail

        pnpm --filter e2e exec vitest run tests/unit --reporter=verbose --reporter=json
        --outputFile.json="$GITHUB_WORKSPACE/evidence/core-units.json" 2>&1 | tee
        evidence/core-units.log'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: core-diagnostic-types-followup-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
