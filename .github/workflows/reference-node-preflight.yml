name: reviewed reference Node-only preflight
'on':
  push:
    branches:
    - ci/reference-node-preflight
permissions:
  contents: read
jobs:
  node-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: ${{ matrix.node }}
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - name: Install and build actual public core before Web source types
      id: public_build
      run: 'set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY

        test -z "$(git status --porcelain)"

        mkdir -p evidence

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        pnpm install --frozen-lockfile

        pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build

        node --version > evidence/node-version.txt

        pnpm --version > evidence/pnpm-version.txt

        '
    - name: Core full source/test types
      if: ${{ !cancelled() && steps.public_build.outcome == 'success' }}
      run: 'set -euo pipefail

        pnpm --filter e2e exec tsc --noEmit 2>&1 | tee evidence/core-full-types.log

        '
    - name: Web full source/test types
      if: ${{ !cancelled() && steps.public_build.outcome == 'success' }}
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec tsc --noEmit 2>&1 | tee evidence/web-full-types.log

        '
    - name: Locked repository lint
      if: ${{ !cancelled() && steps.public_build.outcome == 'success' }}
      run: 'set -euo pipefail

        pnpm run lint 2>&1 | tee evidence/locked-repository-lint.log

        '
    - name: Collect and execute web-pure complete files, unchanged original test budgets
      if: ${{ !cancelled() && steps.public_build.outcome == 'success' }}
      run: 'mkdir -p evidence/web-pure

        set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY

        pnpm --filter @e2e-dev/web exec vitest list tests/unit/native-reference-bridge.test.ts tests/unit/browser-channel.test.ts tests/unit/native-correlation.test.ts
        tests/unit/native-engine-decode.test.ts tests/unit/native-surface.test.ts tests/unit/native-persistent-raw-recovery.test.ts
        tests/unit/native-reconnect-admission.test.ts tests/unit/native-reference-capability.test.ts tests/unit/interop-evidence.test.ts
        tests/unit/native-engine-channel.test.ts tests/unit/download-waiter.test.ts tests/unit/native-browser-fixture.test.ts tests/unit/native-evaluate-boundaries.test.ts
        --no-staticParse --json="$GITHUB_WORKSPACE/evidence/web-pure/collection.json"

        python3 - <<''PY_SELECT''

        import json,pathlib,collections

        r=json.load(open(''evidence/web-pure/collection.json''));expected=[''native-reference-bridge.test.ts'', ''browser-channel.test.ts'',
        ''native-correlation.test.ts'', ''native-engine-decode.test.ts'', ''native-surface.test.ts'', ''native-persistent-raw-recovery.test.ts'',
        ''native-reconnect-admission.test.ts'', ''native-reference-capability.test.ts'', ''interop-evidence.test.ts'', ''native-engine-channel.test.ts'',
        ''download-waiter.test.ts'', ''native-browser-fixture.test.ts'', ''native-evaluate-boundaries.test.ts'']

        counts=collections.Counter(x[''file''].rsplit(''/'',1)[-1] for x in r)

        assert set(counts)==set(expected) and all(counts[x]>0 for x in expected),counts

        pathlib.Path(''evidence/web-pure/collected-counts.json'').write_text(json.dumps(dict(counts),indent=2))

        PY_SELECT

        set +e

        pnpm --filter @e2e-dev/web exec vitest run tests/unit/native-reference-bridge.test.ts tests/unit/browser-channel.test.ts tests/unit/native-correlation.test.ts
        tests/unit/native-engine-decode.test.ts tests/unit/native-surface.test.ts tests/unit/native-persistent-raw-recovery.test.ts
        tests/unit/native-reconnect-admission.test.ts tests/unit/native-reference-capability.test.ts tests/unit/interop-evidence.test.ts
        tests/unit/native-engine-channel.test.ts tests/unit/download-waiter.test.ts tests/unit/native-browser-fixture.test.ts tests/unit/native-evaluate-boundaries.test.ts
        --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/web-pure/results.json" > evidence/web-pure/tests.log
        2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > evidence/web-pure/tests.exit

        cat evidence/web-pure/tests.log

        python3 - <<''PY_COUNT''

        import json,collections,pathlib

        c=json.load(open(''evidence/web-pure/collection.json''));r=json.load(open(''evidence/web-pure/results.json''));a=[a for t in
        r[''testResults''] for a in t[''assertionResults'']]

        assert len(a)==len(c) and all(x[''status''] in (''passed'',''failed'') for x in a)

        assert collections.Counter((x[''file''].rsplit(''/'',1)[-1],x[''name'']) for x in c)==collections.Counter((t[''name''].rsplit(''/'',1)[-1],''
        > ''.join(a[''ancestorTitles'']+[a[''title'']])) for t in r[''testResults''] for a in t[''assertionResults''])

        pathlib.Path(''evidence/web-pure/execution-counts.json'').write_text(json.dumps({''collected'':len(c),''executed'':len(a),''passed'':sum(x[''status'']==''passed''
        for x in a),''failed'':sum(x[''status'']==''failed'' for x in a)},indent=2))

        PY_COUNT

        exit "$status"

        '
    - name: Collect and execute core-pure complete files, unchanged original test budgets
      if: ${{ !cancelled() && steps.public_build.outcome == 'success' }}
      run: 'mkdir -p evidence/core-pure

        set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY

        pnpm --filter e2e exec vitest list tests/unit/agent-observation.test.ts tests/unit/agent-screen-update.test.ts tests/unit/mcp-test-lines.test.ts
        --no-staticParse --json="$GITHUB_WORKSPACE/evidence/core-pure/collection.json"

        python3 - <<''PY_SELECT''

        import json,pathlib,collections

        r=json.load(open(''evidence/core-pure/collection.json''));expected=[''agent-observation.test.ts'', ''agent-screen-update.test.ts'',
        ''mcp-test-lines.test.ts'']

        counts=collections.Counter(x[''file''].rsplit(''/'',1)[-1] for x in r)

        assert set(counts)==set(expected) and all(counts[x]>0 for x in expected),counts

        pathlib.Path(''evidence/core-pure/collected-counts.json'').write_text(json.dumps(dict(counts),indent=2))

        PY_SELECT

        set +e

        pnpm --filter e2e exec vitest run tests/unit/agent-observation.test.ts tests/unit/agent-screen-update.test.ts tests/unit/mcp-test-lines.test.ts
        --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/core-pure/results.json" > evidence/core-pure/tests.log
        2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > evidence/core-pure/tests.exit

        cat evidence/core-pure/tests.log

        python3 - <<''PY_COUNT''

        import json,collections,pathlib

        c=json.load(open(''evidence/core-pure/collection.json''));r=json.load(open(''evidence/core-pure/results.json''));a=[a for t
        in r[''testResults''] for a in t[''assertionResults'']]

        assert len(a)==len(c) and all(x[''status''] in (''passed'',''failed'') for x in a)

        assert collections.Counter((x[''file''].rsplit(''/'',1)[-1],x[''name'']) for x in c)==collections.Counter((t[''name''].rsplit(''/'',1)[-1],''
        > ''.join(a[''ancestorTitles'']+[a[''title'']])) for t in r[''testResults''] for a in t[''assertionResults''])

        pathlib.Path(''evidence/core-pure/execution-counts.json'').write_text(json.dumps({''collected'':len(c),''executed'':len(a),''passed'':sum(x[''status'']==''passed''
        for x in a),''failed'':sum(x[''status'']==''failed'' for x in a)},indent=2))

        PY_COUNT

        exit "$status"

        '
    - name: Collect and execute process-signals complete files, unchanged original test budgets
      if: ${{ !cancelled() && steps.public_build.outcome == 'success' }}
      run: 'mkdir -p evidence/process-signals

        set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY

        pnpm --filter @e2e-dev/web exec vitest list tests/unit/native-process-signals.test.ts --no-staticParse --json="$GITHUB_WORKSPACE/evidence/process-signals/collection.json"

        python3 - <<''PY_SELECT''

        import json,pathlib,collections

        r=json.load(open(''evidence/process-signals/collection.json''));expected=[''native-process-signals.test.ts'']

        counts=collections.Counter(x[''file''].rsplit(''/'',1)[-1] for x in r)

        assert set(counts)==set(expected) and all(counts[x]>0 for x in expected),counts

        pathlib.Path(''evidence/process-signals/collected-counts.json'').write_text(json.dumps(dict(counts),indent=2))

        PY_SELECT

        set +e

        pnpm --filter @e2e-dev/web exec vitest run tests/unit/native-process-signals.test.ts --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/process-signals/results.json"
        > evidence/process-signals/tests.log 2>&1

        status=$?

        set -e

        printf ''%s\n'' "$status" > evidence/process-signals/tests.exit

        cat evidence/process-signals/tests.log

        python3 - <<''PY_COUNT''

        import json,collections,pathlib

        c=json.load(open(''evidence/process-signals/collection.json''));r=json.load(open(''evidence/process-signals/results.json''));a=[a
        for t in r[''testResults''] for a in t[''assertionResults'']]

        assert len(a)==len(c) and all(x[''status''] in (''passed'',''failed'') for x in a)

        assert collections.Counter((x[''file''].rsplit(''/'',1)[-1],x[''name'']) for x in c)==collections.Counter((t[''name''].rsplit(''/'',1)[-1],''
        > ''.join(a[''ancestorTitles'']+[a[''title'']])) for t in r[''testResults''] for a in t[''assertionResults''])

        pathlib.Path(''evidence/process-signals/execution-counts.json'').write_text(json.dumps({''collected'':len(c),''executed'':len(a),''passed'':sum(x[''status'']==''passed''
        for x in a),''failed'':sum(x[''status'']==''failed'' for x in a)},indent=2))

        PY_COUNT

        exit "$status"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: node-reference-preflight-${{ matrix.node }}-${{ github.run_id }}
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        node:
        - '22'
        - '24'
        - '26'
        - 22.22.3
        - 24.8.0
    env:
      E2E_TELEMETRY_DISABLED: '1'
      E2E_UPDATE_CHECK_DISABLED: '1'
