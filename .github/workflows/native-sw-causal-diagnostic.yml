# Fixed four-cell comparison, precommitted before execution. Integrator is sole publisher.
# No adaptive retries, new native builds, FIRST_EVENTS browser reruns or formal acceptance claims.
name: Fixed formal versus SW diagnostic comparison (four cells only)
'on':
  push:
    branches:
    - implement/sw-causal-diagnostic-ci
permissions:
  contents: read
concurrency:
  group: sw-causal-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  runtime:
    name: fixed-sw-comparison-${{ matrix.cell }}
    if: ${{ github.ref == 'refs/heads/implement/sw-causal-diagnostic-ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      NATIVE_SHA: ${{ matrix.nativeSha }}
      NATIVE_TREE: ${{ matrix.nativeTree }}
      NATIVE_LOCK_SHA256: 1bc2f7a9e6f6c14d4a65c7c709612d43ba5ab63453ab073d28fa933538a11e97
      E2E_SHA: c98be61c2c01a642c39c8951b466405090e39b04
      E2E_TREE: daddbee93c4ea0b0e1483f892317d0603a2e5843
      E2E_LOCK_SHA256: 3945abab1b9152e71c287d2c0138449762aad74d0322018771cb4b121410629f
      RUSTUP_TOOLCHAIN: 1.99.1
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
      E2E_TELEMETRY_DISABLED: '1'
      E2E_UPDATE_CHECK_DISABLED: '1'
      COMPARISON_CELL: ${{ matrix.cell }}
      COMPARISON_ARM: ${{ matrix.arm }}
    steps:
    - name: Record fixed four-cell comparison, never an adaptive retry
      id: init
      run: 'set -euo pipefail

        umask 077

        export EVIDENCE_DIR="$RUNNER_TEMP/sw-causal-runtime-evidence"

        export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/sw-causal-playwright"

        printf ''EVIDENCE_DIR=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\n'' "$EVIDENCE_DIR" "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

        export PRIOR_EVIDENCE_DIR="$RUNNER_TEMP/sw-prior-runtime-evidence"

        export PRIOR_EVIDENCE_ZIP="$RUNNER_TEMP/sw-prior-runtime-evidence.zip"

        printf ''PRIOR_EVIDENCE_DIR=%s\nPRIOR_EVIDENCE_ZIP=%s\n'' "$PRIOR_EVIDENCE_DIR" "$PRIOR_EVIDENCE_ZIP" >> "$GITHUB_ENV"

        test "$RUNNER_OS" = Linux

        test "$(uname -m)" = x86_64

        test "$(id -u)" -ne 0

        mkdir -m700 "$EVIDENCE_DIR"

        printf ''%s\n'' ''Fixed formal-1/formal-2/diag-1/diag-2 experiment. One original HTTP500 per independent runner;
        no conditional retries, replacement cases, FIRST_EVENTS browser run, native compilation or native tests. Formal
        missing causal hooks is unknown, not a business gate. Global diagnostics, formal cleanup/acceptance and release
        remain unproven.'' > "$EVIDENCE_DIR/SCOPE.txt"

        printf ''%s\n'' ''{"diagnosticOnly":true,"formalAcceptance":false,"FIRST_EVENTS":"not-executed-this-run; historical-proof-pending","HTTP500":"not-run"}''
        > "$EVIDENCE_DIR/required-runtime.json"

        for phase in sources artifact positive dependencies browser-install linkage cases final; do printf ''not-run\n''
        > "$EVIDENCE_DIR/$phase.exit"; done


        test "$GITHUB_RUN_ATTEMPT" = 1

        if [ "$COMPARISON_ARM" = formal ]; then printf ''not-required-formal-no-causal-hooks\n'' > "$EVIDENCE_DIR/positive.exit";
        fi

        '
      timeout-minutes: 1
    - name: Check out immutable recipe separately
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
      timeout-minutes: 1
    - name: Pinned Node
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.19.0
        architecture: x64
      timeout-minutes: 2
    - name: Unchanged formal c98 Web source
      id: e2e
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/e2e
        ref: c98be61c2c01a642c39c8951b466405090e39b04
        path: e2e-source
        persist-credentials: false
      timeout-minutes: 3
    - name: Exact selected formal or temporary diagnostic native source
      id: native
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ matrix.nativeSha }}
        path: native-source
        persist-credentials: false
      timeout-minutes: 3
    - name: Verify exact clean sources, fixture bytes and Linux identity
      id: sources
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/sources.exit"'' EXIT

        node recipe/scripts/sw-causal-runtime/runtime.mjs sources

        cp "$EVIDENCE_DIR/source-identity.json" "$EVIDENCE_DIR/source-identity-before.json"

        uname -a > "$EVIDENCE_DIR/host.txt"

        cat /etc/os-release >> "$EVIDENCE_DIR/host.txt"


        python3 -B recipe/scripts/sw-causal-runtime/reuse.py selection

        '
      timeout-minutes: 1
      env:
        RECIPE_SHA: ${{ github.workflow_sha }}
    - name: Pure scope, artifact reuse and unsafe-process refusal tests
      id: pure
      run: 'set -euo pipefail

        python3 -B recipe/scripts/sw-causal-runtime/pure-checks.py

        python3 -B recipe/scripts/sw-causal-runtime/reuse-checks.py

        node recipe/scripts/sw-causal-runtime/pure-checks.mjs

        node recipe/scripts/sw-causal-runtime/reuse-checks.mjs

        '
      timeout-minutes: 1
    - name: Verify exact selected original envelope and image without native compilation
      id: artifact
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/artifact.exit"'' EXIT

        api=https://api.github.com/repos/levicode/e2e

        fetch() { curl --fail --silent --show-error --location --max-time 60 --proto ''=https'' -H "Authorization: Bearer
        $GH_TOKEN" -H ''Accept: application/vnd.github+json'' -H ''X-GitHub-Api-Version: 2022-11-28'' "$1" -o "$2"; }

        fetch "$api/actions/artifacts/$PRODUCT_ARTIFACT_ID" "$EVIDENCE_DIR/artifact-metadata.json"

        fetch "$api/actions/runs/$PRODUCT_RUN_ID/attempts/$PRODUCT_RUN_ATTEMPT/jobs?per_page=100" "$EVIDENCE_DIR/compile-jobs.json"

        fetch "$api/actions/runs/$PRODUCT_RUN_ID" "$EVIDENCE_DIR/producer-run.json"

        fetch "$api/git/commits/$PRODUCT_RECIPE_SHA" "$EVIDENCE_DIR/producer-commit.json"

        fetch "$api/actions/artifacts/$PRODUCT_ARTIFACT_ID/zip" "$EVIDENCE_DIR/diagnostic-artifact.zip"

        python3 -B recipe/scripts/sw-causal-runtime/reuse.py comparison-artifact > "$EVIDENCE_DIR/artifact-verified.log"
        2>&1

        '
      timeout-minutes: 6
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Validate historical FIRST_EVENTS assertion, owned cleanup and closed scoped witness
      id: positive
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/positive.exit"'' EXIT

        api=https://api.github.com/repos/levicode/e2e/actions

        fetch() { curl --fail --silent --show-error --location --max-time 60 --proto ''=https'' -H "Authorization: Bearer
        $GH_TOKEN" -H ''Accept: application/vnd.github+json'' -H ''X-GitHub-Api-Version: 2022-11-28'' "$1" -o "$2"; }

        fetch "$api/artifacts/12576309519" "$EVIDENCE_DIR/prior-artifact-metadata.json"

        fetch "$api/artifacts/12576309519/zip" "$PRIOR_EVIDENCE_ZIP"

        python3 -B recipe/scripts/sw-causal-runtime/reuse.py positive > "$EVIDENCE_DIR/historical-positive-verified.log"
        2>&1

        '
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 3
      if: ${{ success() && matrix.arm == 'diag' }}
    - name: Pinned pnpm without implicit install
      id: pnpm
      uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
        run_install: false
      timeout-minutes: 2
    - name: Install frozen graph and build unchanged actual core and Web
      id: dependencies
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/dependencies.exit"'' EXIT

        exec > >(tee "$EVIDENCE_DIR/dependencies.log") 2>&1

        test "$(node --version)" = v24.19.0

        test "$(pnpm --version)" = 12.3.4

        pnpm install --frozen-lockfile --ignore-scripts

        pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build

        '
      timeout-minutes: 12
      working-directory: e2e-source
    - name: Install original official Playwright revision1248 Chromium
      id: browser_install
      run: "set -euo pipefail\ntrap 'printf \"%s\\n\" \"$?\" > \"$EVIDENCE_DIR/browser-install.exit\"' EXIT\ntest ! -e\
        \ \"$PLAYWRIGHT_BROWSERS_PATH\"\ninstall_root=$(mktemp -d /tmp/ep-XXXXXX)\nmkdir -m700 \"$install_root/home\"\
        \ \"$install_root/tmp\" \"$install_root/cache\"\nenv -i PATH=\"$(dirname \"$(command -v node)\"):/usr/bin:/bin\"\
        \ HOME=\"$install_root/home\" TMPDIR=\"$install_root/tmp\" XDG_CACHE_HOME=\"$install_root/cache\" CI=1 LANG=C.UTF-8\
        \ \\\n  PLAYWRIGHT_BROWSERS_PATH=\"$PLAYWRIGHT_BROWSERS_PATH\" \\\n  \"$(command -v node)\" packages/web/node_modules/playwright-core/cli.js\
        \ install chromium > \"$EVIDENCE_DIR/browser-install.log\" 2>&1\n"
      timeout-minutes: 10
      working-directory: e2e-source
    - name: Check actual full Chrome156 and diagnostic ELF linkage
      id: linkage
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/linkage.exit"'' EXIT

        for executable in node pnpm git python3 curl ldd which readlink; do command -v "$executable"; done > "$EVIDENCE_DIR/required-executables.txt"

        node recipe/scripts/sw-causal-runtime/runtime.mjs browser

        chrome=$(python3 -c ''import json,os;print(json.load(open(os.environ["EVIDENCE_DIR"]+"/browser-identity.json"))["executable"])'')

        env -i PATH=/usr/bin:/bin LANG=C.UTF-8 ldd "$GITHUB_WORKSPACE/agent-browser" > "$EVIDENCE_DIR/native.ldd.txt"
        2>&1

        env -i PATH=/usr/bin:/bin LANG=C.UTF-8 ldd "$chrome" > "$EVIDENCE_DIR/chrome.ldd.txt" 2>&1

        ! grep -Fq ''not found'' "$EVIDENCE_DIR/native.ldd.txt"

        ! grep -Fq ''not found'' "$EVIDENCE_DIR/chrome.ldd.txt"

        '
      timeout-minutes: 2
    - name: One original HTTP500 in this precommitted cell, without retries
      id: cases
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/cases.exit"'' EXIT

        node recipe/scripts/sw-causal-runtime/runtime.mjs cases-compare

        '
      timeout-minutes: 3
      env:
        RECIPE_SHA: ${{ github.workflow_sha }}
    - name: Retain first failure and verify final exact source/image bytes
      id: final
      run: 'set -uo pipefail

        failed=0

        node recipe/scripts/sw-causal-runtime/runtime.mjs sources > "$EVIDENCE_DIR/source-final.log" 2>&1 || failed=1

        python3 -B - <<''CHECK'' || failed=1

        import hashlib,json,os

        from pathlib import Path

        e=Path(os.environ[''EVIDENCE_DIR'']);w=Path(os.environ[''GITHUB_WORKSPACE''])

        v=json.loads((e/''production-identity.json'').read_text())

        assert hashlib.file_digest((w/''agent-browser'').open(''rb''),''sha256'').hexdigest()==v[''binarySha256'']

        b=json.loads((e/''browser-identity.json'').read_text())

        assert hashlib.file_digest(Path(b[''executable'']).open(''rb''),''sha256'').hexdigest()==b[''sha256'']

        assert json.loads((e/''source-identity-before.json'').read_text())==json.loads((e/''source-identity.json'').read_text())

        CHECK

        printf ''%s\n'' "$failed" > "$EVIDENCE_DIR/final.exit"

        exit "$failed"

        '
      timeout-minutes: 1
      if: ${{ always() && steps.sources.outcome == 'success' }}
      env:
        RECIPE_SHA: ${{ github.workflow_sha }}
    - name: Keep exact runtime job outcomes without pass translation
      id: outcomes
      run: 'printf ''%s\n'' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"

        '
      timeout-minutes: 1
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
    - name: Preserve this fixed cell result, including failures and unknowns
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 3
      with:
        name: sw-fixed-comparison-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ env.EVIDENCE_DIR }}/*.json

          ${{ env.EVIDENCE_DIR }}/*.log

          ${{ env.EVIDENCE_DIR }}/*.txt

          ${{ env.EVIDENCE_DIR }}/*.exit

          ${{ env.EVIDENCE_DIR }}/HTTP500/'
        if-no-files-found: error
        retention-days: 7
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
        - cell: formal-1
          arm: formal
          nativeSha: 88a7b674d45b784f5578369b8d2bb9a07e430eae
          nativeTree: 37e8593d44f514afcfa633c94a374b3213ab7dda
        - cell: formal-2
          arm: formal
          nativeSha: 88a7b674d45b784f5578369b8d2bb9a07e430eae
          nativeTree: 37e8593d44f514afcfa633c94a374b3213ab7dda
        - cell: diag-1
          arm: diag
          nativeSha: 63964550fdc002834203b11343a46819185797a6
          nativeTree: 8ba5e141fb1bb2b0e397152a5e1a9f740e48a46c
        - cell: diag-2
          arm: diag
          nativeSha: 63964550fdc002834203b11343a46819185797a6
          nativeTree: 8ba5e141fb1bb2b0e397152a5e1a9f740e48a46c
