# Prepared locally only; integrator is sole publisher. No formal candidate or333 run changes.
name: Temporary SW causal diagnostic (not formal candidate)
'on':
  push:
    branches:
    - implement/sw-causal-diagnostic-ci
permissions:
  contents: read
concurrency:
  group: sw-causal-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    name: temporary-sw-causal-compile
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    defaults:
      run:
        shell: bash
    env:
      NATIVE_SHA: 63964550fdc002834203b11343a46819185797a6
      NATIVE_TREE: 8ba5e141fb1bb2b0e397152a5e1a9f740e48a46c
      NATIVE_LOCK_SHA256: 1bc2f7a9e6f6c14d4a65c7c709612d43ba5ab63453ab073d28fa933538a11e97
      E2E_SHA: c98be61c2c01a642c39c8951b466405090e39b04
      E2E_TREE: daddbee93c4ea0b0e1483f892317d0603a2e5843
      E2E_LOCK_SHA256: 3945abab1b9152e71c287d2c0138449762aad74d0322018771cb4b121410629f
      RUSTUP_TOOLCHAIN: 1.99.1
      RUST_MIN_STACK: '16777216'
      RUST_BACKTRACE: '1'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
      EVIDENCE_NAME: sw-causal-compile
      VALIDATION_PHASES: recipe-identity binding source-before toolchain format clippy acceptance-tests-check proxy-feature-check
        default-no-run default-tests source-after
      PHASES: recipe-identity binding source-before toolchain format clippy acceptance-tests-check proxy-feature-check default-no-run
        default-tests source-after diagnostic-build diagnostic-capture diagnostic-integrity source-after-build
    outputs:
      validated: ${{ steps.gate.outputs.validated }}
      artifact-id: ${{ steps.binary.outputs.artifact-id }}
      artifact-digest: ${{ steps.binary.outputs.artifact-digest }}
      binary_sha256: ${{ steps.capture.outputs.binary_sha256 }}
      binary_bytes: ${{ steps.capture.outputs.binary_bytes }}
    steps:
    - name: Initialize explicit not-run receipts
      id: init
      run: "set -euo pipefail\nexport EVIDENCE_DIR=\"$RUNNER_TEMP/$EVIDENCE_NAME\"\nexport CARGO_HOME=\"$RUNNER_TEMP/sw-causal-cargo\"\
        \nexport CARGO_TARGET_DIR=\"$RUNNER_TEMP/sw-causal-target\"\nexport VALIDATE=\"$GITHUB_WORKSPACE/recipe/scripts/sw-causal-diagnostic/compile-helper.py\"\
        \nprintf 'EVIDENCE_DIR=%s\\nCARGO_HOME=%s\\nCARGO_TARGET_DIR=%s\\nVALIDATE=%s\\n' \"$EVIDENCE_DIR\" \"$CARGO_HOME\"\
        \ \"$CARGO_TARGET_DIR\" \"$VALIDATE\" >> \"$GITHUB_ENV\"\nmkdir -p \"$EVIDENCE_DIR\"\nfor phase in $PHASES; do\n \
        \ printf 'not-run\\n' > \"$EVIDENCE_DIR/$phase.exit\"\n  : > \"$EVIDENCE_DIR/$phase.stdout.log\"\n  : > \"$EVIDENCE_DIR/$phase.stderr.log\"\
        \ndone\nprintf '%s\\n' 'Temporary SW causal diagnostic source. Fresh native gates and diagnostic-only build; no formal\
        \ candidate, behavior fix, runtime pass or distribution claim.' > \"$EVIDENCE_DIR/SCOPE.txt\"\nprintf '%s\\n' \"$NEEDS_JSON\"\
        \ > \"$EVIDENCE_DIR/upstream-job-results.json\"\nuname -a > \"$EVIDENCE_DIR/host.txt\"\ncat /etc/os-release >> \"\
        $EVIDENCE_DIR/host.txt\"\nid >> \"$EVIDENCE_DIR/host.txt\"\ndate -u >> \"$EVIDENCE_DIR/host.txt\"\ntest \"$RUNNER_OS\"\
        \ = Linux\ntest \"$(uname -m)\" = x86_64\ntest \"$(id -u)\" -ne 0\n"
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
    - name: Check out this immutable recipe
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - name: Read back recipe identity and bind frozen source pins
      id: binding
      run: 'set -euo pipefail

        python3 -B "$VALIDATE" run recipe-identity 30 python3 -B "$VALIDATE" identity recipe "$GITHUB_WORKFLOW_SHA" - - -

        sha256sum recipe/.github/workflows/native-sw-causal-diagnostic.yml recipe/scripts/sw-causal-diagnostic/compile-helper.py
        > "$EVIDENCE_DIR/recipe.sha256"

        python3 -B "$VALIDATE" run binding 30 python3 -B "$VALIDATE" binding

        '
      if: ${{ !cancelled() && steps.recipe.outcome == 'success' }}
    - name: Check out exact native source
      id: source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SHA }}
        path: source
        persist-credentials: false
      if: ${{ !cancelled() && steps.binding.outcome == 'success' }}
    - name: Verify source commit, tree and lock before work
      id: identity
      run: 'python3 -B "$VALIDATE" run source-before 30 python3 -B "$VALIDATE" identity "$GITHUB_WORKSPACE/source" "$NATIVE_SHA"
        "$NATIVE_TREE" cli/Cargo.lock "$NATIVE_LOCK_SHA256"

        '
      if: ${{ !cancelled() && steps.source.outcome == 'success' }}
    - name: Cache registry bytes only, never target artifacts
      id: registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '${{ env.CARGO_HOME }}/registry

          ${{ env.CARGO_HOME }}/git/db'
        key: upstream-registry-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-${{ env.NATIVE_LOCK_SHA256 }}
      if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
    - name: Install and verify pinned official Rust toolchain
      id: rust
      run: 'python3 -B "$VALIDATE" run toolchain 600 bash -euc ''

        rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

        rustc -Vv

        cargo -Vv

        cargo clippy --version

        cargo fmt --version

        test "$(rustc -Vv | sed -n "s/^release: //p")" = "$RUSTUP_TOOLCHAIN"

        test "$(rustc -Vv | sed -n "s/^host: //p")" = x86_64-unknown-linux-gnu

        ''

        '
      if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
    - name: Run every independent native compile gate
      id: compile
      run: 'set -uo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET

        failed=0

        python3 -B "$VALIDATE" run format 120 cargo fmt --all -- --check || failed=1

        python3 -B "$VALIDATE" run clippy 900 cargo clippy --locked --profile dev --no-default-features --all-targets -- -D
        warnings || failed=1

        python3 -B "$VALIDATE" run acceptance-tests-check 900 cargo check --locked --profile dev --no-default-features --features
        acceptance-faults --tests || failed=1

        python3 -B "$VALIDATE" run proxy-feature-check 600 cargo check --locked --profile dev --no-default-features --features
        acceptance-faults --test client-proxy-fixture || failed=1

        python3 -B "$VALIDATE" run default-no-run 1500 cargo test --locked --profile ci --no-default-features --no-run --message-format=json
        || failed=1

        exit "$failed"

        '
      if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
      working-directory: source/cli
    - name: Run all ci default harnesses and require exact regression witnesses
      id: tests
      run: 'set -euo pipefail

        unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE

        trap ''status=$?; printf "%s\n" "$status" > "$EVIDENCE_DIR/default-tests.exit"'' EXIT

        exec > >(tee "$EVIDENCE_DIR/default-tests.stdout.log") 2> >(tee "$EVIDENCE_DIR/default-tests.stderr.log" >&2)

        python3 -B "$VALIDATE" native-tests

        '
      if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
      working-directory: source/cli
    - name: Verify unchanged source even after failures
      id: after
      run: 'python3 -B "$VALIDATE" run source-after 30 python3 -B "$VALIDATE" identity "$GITHUB_WORKSPACE/source" "$NATIVE_SHA"
        "$NATIVE_TREE" cli/Cargo.lock "$NATIVE_LOCK_SHA256"

        '
      if: ${{ always() && steps.identity.outcome == 'success' }}
    - name: Require every fresh native gate before diagnostic production build
      id: native_gate
      if: ${{ always() }}
      run: 'set -euo pipefail

        python3 -B "$VALIDATE" aggregate $VALIDATION_PHASES

        cp "$EVIDENCE_DIR/aggregate.json" "$EVIDENCE_DIR/native-gates.json"

        '
    - name: Build feature-free optimized temporary diagnostic image
      id: build
      if: ${{ !cancelled() && steps.native_gate.outcome == 'success' }}
      working-directory: source/cli
      run: 'set -euo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE

        python3 -B "$VALIDATE" run diagnostic-build 2100 cargo build --locked --profile ci --no-default-features --bin agent-browser
        --message-format=json

        '
    - name: Capture exact diagnostic image and current strict-gate evidence
      id: capture
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      working-directory: source/cli
      run: 'python3 -B "$VALIDATE" run diagnostic-capture 60 python3 -B "$VALIDATE" capture-diagnostic "$RUNNER_TEMP/sw-causal-product"

        '
    - name: Verify diagnostic image and evidence remain unchanged
      id: integrity
      if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
      run: 'python3 -B "$VALIDATE" run diagnostic-integrity 60 python3 -B "$VALIDATE" verify-diagnostic "$RUNNER_TEMP/sw-causal-product"

        '
    - name: Verify unchanged source after any build outcome
      id: after_build
      if: ${{ always() && steps.identity.outcome == 'success' }}
      run: 'python3 -B "$VALIDATE" run source-after-build 30 python3 -B "$VALIDATE" identity "$GITHUB_WORKSPACE/source" "$NATIVE_SHA"
        "$NATIVE_TREE" cli/Cargo.lock "$NATIVE_LOCK_SHA256"

        '
    - name: Aggregate all required receipts without skip-as-pass
      id: gate
      run: 'set -euo pipefail

        python3 -B "$VALIDATE" aggregate $PHASES

        echo ''validated=true'' >> "$GITHUB_OUTPUT"

        '
      if: ${{ always() }}
    - name: Record every actual step outcome
      id: outcomes
      run: 'printf ''%s\n'' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"

        '
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
    - name: Always retain diagnostics
      id: diagnostics
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: sw-causal-compile-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE_DIR }}/
        if-no-files-found: error
        retention-days: 7
      if: ${{ always() }}
    - name: Retain temporary diagnostic only, never formal candidate
      id: binary
      if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: temporary-sw-causal-native-linux-x64-${{ env.NATIVE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/sw-causal-product/
        if-no-files-found: error
        retention-days: 7
    permissions:
      contents: read
    if: ${{ github.ref == 'refs/heads/implement/sw-causal-diagnostic-ci' }}
  runtime:
    name: temporary-sw-causal-runtime
    needs: compile
    if: ${{ !cancelled() && github.ref == 'refs/heads/implement/sw-causal-diagnostic-ci' && needs.compile.result == 'success'
      && needs.compile.outputs.validated == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      NATIVE_SHA: 63964550fdc002834203b11343a46819185797a6
      NATIVE_TREE: 8ba5e141fb1bb2b0e397152a5e1a9f740e48a46c
      NATIVE_LOCK_SHA256: 1bc2f7a9e6f6c14d4a65c7c709612d43ba5ab63453ab073d28fa933538a11e97
      E2E_SHA: c98be61c2c01a642c39c8951b466405090e39b04
      E2E_TREE: daddbee93c4ea0b0e1483f892317d0603a2e5843
      E2E_LOCK_SHA256: 3945abab1b9152e71c287d2c0138449762aad74d0322018771cb4b121410629f
      RUSTUP_TOOLCHAIN: 1.99.1
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
      E2E_TELEMETRY_DISABLED: '1'
      E2E_UPDATE_CHECK_DISABLED: '1'
    steps:
    - name: Initialize diagnostic-only outcome, not formal acceptance
      id: init
      run: 'set -euo pipefail

        umask 077

        export EVIDENCE_DIR="$RUNNER_TEMP/sw-causal-runtime-evidence"

        export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/sw-causal-playwright"

        printf ''EVIDENCE_DIR=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\n'' "$EVIDENCE_DIR" "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

        mkdir -m700 "$EVIDENCE_DIR"

        printf ''%s\n'' ''Temporary native instrumentation only. FIRST_EVENTS positive control then one original HTTP500;
        formal333 untouched. Missing/lost diagnostics remain unknown. No installed distribution, behavior fix, formal cleanup
        or acceptance claim.'' > "$EVIDENCE_DIR/SCOPE.txt"

        printf ''%s\n'' ''{"diagnosticOnly":true,"formalAcceptance":false,"FIRST_EVENTS":"not-run","HTTP500":"not-run"}''
        > "$EVIDENCE_DIR/required-runtime.json"

        for phase in sources artifact dependencies browser-install linkage cases final; do printf ''not-run\n'' > "$EVIDENCE_DIR/$phase.exit";
        done

        '
      timeout-minutes: 1
    - name: Check out immutable recipe separately
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
      timeout-minutes: 1
    - name: Pinned Node
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.19.0
        architecture: x64
      timeout-minutes: 2
    - name: Unchanged formal c98 Web source
      id: e2e
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/e2e
        ref: c98be61c2c01a642c39c8951b466405090e39b04
        path: e2e-source
        persist-credentials: false
      timeout-minutes: 3
    - name: Exact temporary diagnostic native source
      id: native
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: 63964550fdc002834203b11343a46819185797a6
        path: native-source
        persist-credentials: false
      timeout-minutes: 3
    - name: Verify exact clean sources, fixture bytes and Linux identity
      id: sources
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/sources.exit"'' EXIT

        node recipe/scripts/sw-causal-runtime/runtime.mjs sources

        cp "$EVIDENCE_DIR/source-identity.json" "$EVIDENCE_DIR/source-identity-before.json"

        uname -a > "$EVIDENCE_DIR/host.txt"

        cat /etc/os-release >> "$EVIDENCE_DIR/host.txt"

        '
      timeout-minutes: 1
      env:
        RECIPE_SHA: ${{ github.workflow_sha }}
    - name: Fetch and verify only this run and attempt diagnostic artifact
      id: artifact
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/artifact.exit"'' EXIT

        [[ "$DIAGNOSTIC_ARTIFACT_ID" =~ ^[0-9]+$ ]]

        api=https://api.github.com/repos/levicode/e2e/actions

        fetch() { curl --fail --silent --show-error --location --max-time 60 --proto ''=https'' -H "Authorization: Bearer
        $GH_TOKEN" -H ''Accept: application/vnd.github+json'' -H ''X-GitHub-Api-Version: 2022-11-28'' "$1" -o "$2"; }

        fetch "$api/artifacts/$DIAGNOSTIC_ARTIFACT_ID" "$EVIDENCE_DIR/artifact-metadata.json"

        fetch "$api/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" "$EVIDENCE_DIR/compile-jobs.json"

        fetch "$api/artifacts/$DIAGNOSTIC_ARTIFACT_ID/zip" "$EVIDENCE_DIR/diagnostic-artifact.zip"

        python3 -B recipe/scripts/sw-causal-runtime/artifact.py > "$EVIDENCE_DIR/artifact-verified.log" 2>&1

        '
      timeout-minutes: 4
      env:
        GH_TOKEN: ${{ github.token }}
        DIAGNOSTIC_ARTIFACT_ID: ${{ needs.compile.outputs.artifact-id }}
        DIAGNOSTIC_ARTIFACT_DIGEST: ${{ needs.compile.outputs.artifact-digest }}
        DIAGNOSTIC_BINARY_SHA256: ${{ needs.compile.outputs.binary_sha256 }}
        DIAGNOSTIC_BINARY_BYTES: ${{ needs.compile.outputs.binary_bytes }}
    - name: Pinned pnpm without implicit install
      id: pnpm
      uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
      with:
        version: 12.3.4
        run_install: false
      timeout-minutes: 2
    - name: Install frozen graph and build unchanged actual core and Web
      id: dependencies
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/dependencies.exit"'' EXIT

        exec > >(tee "$EVIDENCE_DIR/dependencies.log") 2>&1

        test "$(node --version)" = v24.19.0

        test "$(pnpm --version)" = 12.3.4

        pnpm install --frozen-lockfile --ignore-scripts

        pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build

        '
      timeout-minutes: 12
      working-directory: e2e-source
    - name: Install original official Playwright revision1248 Chromium
      id: browser_install
      run: "set -euo pipefail\ntrap 'printf \"%s\\n\" \"$?\" > \"$EVIDENCE_DIR/browser-install.exit\"' EXIT\ntest ! -e \"\
        $PLAYWRIGHT_BROWSERS_PATH\"\ninstall_root=$(mktemp -d /tmp/ep-XXXXXX)\nmkdir -m700 \"$install_root/home\" \"$install_root/tmp\"\
        \ \"$install_root/cache\"\nenv -i PATH=\"$(dirname \"$(command -v node)\"):/usr/bin:/bin\" HOME=\"$install_root/home\"\
        \ TMPDIR=\"$install_root/tmp\" XDG_CACHE_HOME=\"$install_root/cache\" CI=1 LANG=C.UTF-8 \\\n  PLAYWRIGHT_BROWSERS_PATH=\"\
        $PLAYWRIGHT_BROWSERS_PATH\" \\\n  \"$(command -v node)\" packages/web/node_modules/playwright-core/cli.js install\
        \ chromium > \"$EVIDENCE_DIR/browser-install.log\" 2>&1\n"
      timeout-minutes: 10
      working-directory: e2e-source
    - name: Check actual full Chrome156 and diagnostic ELF linkage
      id: linkage
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/linkage.exit"'' EXIT

        for executable in node pnpm git python3 curl ldd which readlink; do command -v "$executable"; done > "$EVIDENCE_DIR/required-executables.txt"

        node recipe/scripts/sw-causal-runtime/runtime.mjs browser

        chrome=$(python3 -c ''import json,os;print(json.load(open(os.environ["EVIDENCE_DIR"]+"/browser-identity.json"))["executable"])'')

        env -i PATH=/usr/bin:/bin LANG=C.UTF-8 ldd "$GITHUB_WORKSPACE/agent-browser" > "$EVIDENCE_DIR/native.ldd.txt" 2>&1

        env -i PATH=/usr/bin:/bin LANG=C.UTF-8 ldd "$chrome" > "$EVIDENCE_DIR/chrome.ldd.txt" 2>&1

        ! grep -Fq ''not found'' "$EVIDENCE_DIR/native.ldd.txt"

        ! grep -Fq ''not found'' "$EVIDENCE_DIR/chrome.ldd.txt"

        '
      timeout-minutes: 2
    - name: Original successful-registration control then original HTTP500 exactly once
      id: cases
      run: 'set -euo pipefail

        trap ''printf "%s\n" "$?" > "$EVIDENCE_DIR/cases.exit"'' EXIT

        node recipe/scripts/sw-causal-runtime/runtime.mjs cases

        '
      timeout-minutes: 3
      env:
        RECIPE_SHA: ${{ github.workflow_sha }}
    - name: Retain first failure and verify final exact source/image bytes
      id: final
      run: 'set -uo pipefail

        failed=0

        node recipe/scripts/sw-causal-runtime/runtime.mjs sources > "$EVIDENCE_DIR/source-final.log" 2>&1 || failed=1

        python3 -B - <<''CHECK'' || failed=1

        import hashlib,json,os

        from pathlib import Path

        e=Path(os.environ[''EVIDENCE_DIR'']);w=Path(os.environ[''GITHUB_WORKSPACE''])

        v=json.loads((e/''production-identity.json'').read_text())

        assert hashlib.file_digest((w/''agent-browser'').open(''rb''),''sha256'').hexdigest()==v[''binarySha256'']

        b=json.loads((e/''browser-identity.json'').read_text())

        assert hashlib.file_digest(Path(b[''executable'']).open(''rb''),''sha256'').hexdigest()==b[''sha256'']

        assert json.loads((e/''source-identity-before.json'').read_text())==json.loads((e/''source-identity.json'').read_text())

        CHECK

        printf ''%s\n'' "$failed" > "$EVIDENCE_DIR/final.exit"

        exit "$failed"

        '
      timeout-minutes: 1
      if: ${{ always() && steps.sources.outcome == 'success' }}
      env:
        RECIPE_SHA: ${{ github.workflow_sha }}
    - name: Keep exact runtime job outcomes without pass translation
      id: outcomes
      run: 'printf ''%s\n'' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"

        '
      timeout-minutes: 1
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
    - name: Always preserve closed raw diagnostic evidence, not profiles or executables
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 3
      with:
        name: sw-causal-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: '${{ env.EVIDENCE_DIR }}/*.json

          ${{ env.EVIDENCE_DIR }}/*.log

          ${{ env.EVIDENCE_DIR }}/*.txt

          ${{ env.EVIDENCE_DIR }}/*.exit

          ${{ env.EVIDENCE_DIR }}/FIRST_EVENTS/

          ${{ env.EVIDENCE_DIR }}/HTTP500/'
        if-no-files-found: error
        retention-days: 7
