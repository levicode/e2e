name: Independent exact mask-reader diagnosis
'on':
  push:
    branches:
    - implement/pixel-coverage-probe-ci
permissions:
  contents: read
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 2b9e0a00ee6466e55c52dacdba1d4f1bece2e2aa
  NATIVE_SOURCE_TREE: 5d92121a84c82082e5c826737ffeb19e92ea4857
jobs:
  pixel-coverage-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Download exact historical runtime with API and ZIP checks
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/download-interrupt-runtime.py
    - name: Verify explicit producer source, compiler and bytes
      run: node scripts/ci/verify-interrupt-runtime.ts "$RUNNER_TEMP/interrupt-native-runtime"
    - name: Install exact owned browser dependencies
      run: '"$E2E_AGENT_BROWSER_EXECUTABLE" install --with-deps'
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: a725793cbc19f34dad85a4cae53e991b62017b70
        path: fixture-source
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: 2b9e0a00ee6466e55c52dacdba1d4f1bece2e2aa
        path: native-source
        persist-credentials: false
    - name: Verify frozen sources and identify the installed native Chrome
      run: "set -euo pipefail\ntest \"$(git -C fixture-source rev-parse HEAD)\" = a725793cbc19f34dad85a4cae53e991b62017b70\n\
        test \"$(git -C fixture-source rev-parse HEAD^{tree})\" = b3d223124aeb23dc1dff6c76d484bc6835ddf0ce\ntest\
        \ \"$(git -C native-source rev-parse HEAD)\" = 2b9e0a00ee6466e55c52dacdba1d4f1bece2e2aa\ntest \"$(git -C\
        \ native-source rev-parse HEAD^{tree})\" = 5d92121a84c82082e5c826737ffeb19e92ea4857\ntest -z \"$(git -C\
        \ fixture-source status --porcelain)\"\ntest -z \"$(git -C native-source status --porcelain)\"\necho 'b6bf4263f0e89e75e4f40d4068e6c1610f1041a95b589579fc9d61fca871a6f9\
        \  scripts/ci/pixel-coverage-diagnostic.mjs' | sha256sum -c -\nsha256sum fixture-source/packages/e2e/tests/helpers/fixture-app.ts\
        \ fixture-source/packages/e2e/tests/helpers/fixture-pages/home.ts native-source/cli/src/native/client_capture.rs\
        \ scripts/ci/pixel-coverage-diagnostic.mjs > evidence/probe-source.sha256\npython3 - <<'PY_CHROME'\nimport\
        \ pathlib,os,hashlib,json,subprocess\nroot=pathlib.Path.home()/'.agent-browser/browsers'\npaths=[p for d\
        \ in root.glob('chrome-*') for p in [d/'chrome',d/'chrome-linux64/chrome'] if p.is_file()]\nassert len(paths)==1,\
        \ 'Expected exactly one freshly installed native Chrome'\np=paths[0].resolve();h=hashlib.sha256()\nwith\
        \ p.open('rb') as f:\n for b in iter(lambda:f.read(1048576),b''):h.update(b)\nversion=subprocess.check_output([str(p),'--version'],text=True,timeout=5).strip()\n\
        pathlib.Path('evidence/chrome.json').write_text(json.dumps({'path':str(p),'version':version,'sha256':h.hexdigest(),'ownedDisposableOnly':True},indent=2)+'\\\
        n')\nwith open(os.environ['GITHUB_ENV'],'a') as f:f.write('CHROME_BIN='+str(p)+'\\n')\nPY_CHROME\n"
    - name: Run one independent closed mask-reader measurement
      run: 'set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN AGENT_BROWSER_CDP AGENT_BROWSER_AUTO_CONNECT AGENT_BROWSER_PROVIDER

        node scripts/ci/pixel-coverage-diagnostic.mjs "$GITHUB_WORKSPACE/fixture-source" "$GITHUB_WORKSPACE/native-source"
        "$GITHUB_WORKSPACE/evidence"

        node --input-type=module - <<''JS''

        import fs from ''node:fs'';import assert from ''node:assert/strict'';

        const r=JSON.parse(fs.readFileSync(''evidence/pixel-coverage-diagnostic.json'',''utf8''));

        assert.equal(r.acceptanceEvidence,false);assert.equal(r.cleanup,true);assert.ok([''reader-passed'',''refused''].includes(r.status));

        JS

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: pixel-coverage-independent-measurement
        path: evidence/
        if-no-files-found: error
        retention-days: 7
