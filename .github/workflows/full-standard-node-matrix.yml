        ROOT=pathlib.Path.cwd();PACKAGES=['e2e','web','mobile','github','kernel','lightpanda','eas','smol','limrun','decision','testmu'];ROOTS=['packages/'+p+'/dist'\
        \ for p in PACKAGES]+['packages/e2e/docs','packages/e2e/skills','packages/e2e/README.md']\n\
        def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()\n\
        def cmd(*a):return subprocess.check_output(a,text=True).strip()\ndef inventory():\n\
