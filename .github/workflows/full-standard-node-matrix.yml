    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      id: download_build
      if: ${{ !cancelled() && steps.source.outcome == 'success' }}
      with:
        artifact-ids: ${{ needs.build_1.outputs.artifact_id }}
        path: js-build-bundle
        merge-multiple: true
    - name: build-identity
      id: build_identity
      if: ${{ !cancelled() && steps.download_build.outcome == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        python3 evidence/tools/build-assets.py identity

        ) 2>&1 | tee evidence/build-identity.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/build-identity.exit

        exit "$s"

        '
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: ${{ steps.build_identity.outputs.node_version }}
        cache: pnpm
    - name: Actual versions
      id: versions
      run: 'node --version > evidence/node.version

        pnpm --version > evidence/pnpm.version

        npm --version > evidence/npm.version

        '
    - name: dependencies
      id: dependencies
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm install --frozen-lockfile

        ) 2>&1 | tee "evidence/dependencies.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/dependencies.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.versions.outcome
        == 'success' }}
    - name: restore-build
      id: restore_build
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        python3 evidence/tools/build-assets.py restore

        ) 2>&1 | tee evidence/restore-build.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/restore-build.exit

        exit "$s"

        '
    - name: Restore source-bound ordinary producer
      id: download_ordinary
      if: ${{ !cancelled() && steps.restore_build.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ github.token }}
        RUNTIME_KIND: ordinary
      run: python3 evidence/tools/download-runtime.py
    - name: Restore distinct source-bound test-only fault producer
      id: download_fault
      if: ${{ !cancelled() && steps.restore_build.outcome == 'success' && matrix.lane
        == 'web' }}
      env:
        GH_TOKEN: ${{ github.token }}
        RUNTIME_KIND: fault
      run: python3 evidence/tools/download-runtime.py
    - name: verify-runtime
      id: verify_runtime
      if: ${{ !cancelled() && steps.download_ordinary.outcome == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        node evidence/tools/verify-runtimes.ts

        ) 2>&1 | tee evidence/verify-runtime.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/verify-runtime.exit

        exit "$s"

        '
      env:
        NEED_FAULT: ${{ matrix.lane == 'web' && '1' || '0' }}
    - name: native-browser-codecs
      id: native_browser_codecs
      run: "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY\
        \ OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\n\"$E2E_AGENT_BROWSER_EXECUTABLE\"\
        \ install --with-deps\nif ! command -v ffmpeg >/dev/null || ! command -v ffprobe\
        \ >/dev/null; then\n sudo apt-get update\n sudo apt-get install -y ffmpeg\n\
        fi\nffmpeg -version\nffprobe -version\n) 2>&1 | tee \"evidence/native-browser-codecs.log\"\
        \ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/native-browser-codecs.exit\"\
        \nexit \"$s\"\n"
      if: ${{ !cancelled() && steps.verify_runtime.outcome == 'success' }}
    - name: playwright-browser-install
      id: playwright_browser_install
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps

