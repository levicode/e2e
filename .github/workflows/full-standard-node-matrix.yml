    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      id: download_build
      if: ${{ !cancelled() && steps.source.outcome == 'success' }}
      with:
        artifact-ids: ${{ needs.build_2.outputs.artifact_id }}
        path: js-build-bundle
        merge-multiple: true
    - name: build-identity
      id: build_identity
      if: ${{ !cancelled() && steps.download_build.outcome == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        python3 evidence/tools/build-assets.py identity

        ) 2>&1 | tee evidence/build-identity.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/build-identity.exit

        exit "$s"

        '
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: ${{ steps.build_identity.outputs.node_version }}
        cache: pnpm
    - name: Actual versions
      id: versions
      run: 'node --version > evidence/node.version

        pnpm --version > evidence/pnpm.version

        npm --version > evidence/npm.version

        '
    - name: dependencies
      id: dependencies
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm install --frozen-lockfile

        ) 2>&1 | tee "evidence/dependencies.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/dependencies.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.versions.outcome
        == 'success' }}
    - name: restore-build
      id: restore_build
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        python3 evidence/tools/build-assets.py restore

        ) 2>&1 | tee evidence/restore-build.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/restore-build.exit

        exit "$s"

        '
    - name: Restore source-bound ordinary producer
      id: download_ordinary
      if: ${{ !cancelled() && steps.restore_build.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ github.token }}
        RUNTIME_KIND: ordinary
      run: python3 evidence/tools/download-runtime.py
    - name: verify-runtime
      id: verify_runtime
      if: ${{ !cancelled() && steps.download_ordinary.outcome == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        node evidence/tools/verify-runtimes.ts

        ) 2>&1 | tee evidence/verify-runtime.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/verify-runtime.exit

        exit "$s"

        '
      env:
        NEED_FAULT: '0'
    - name: native-browser-codecs
      id: native_browser_codecs
      run: "set -uo pipefail\nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY\
        \ OPENAI_API_KEY ANTHROPIC_API_KEY\nset +e\n( set -e\n\"$E2E_AGENT_BROWSER_EXECUTABLE\"\
        \ install --with-deps\nif ! command -v ffmpeg >/dev/null || ! command -v ffprobe\
        \ >/dev/null; then\n sudo apt-get update\n sudo apt-get install -y ffmpeg\n\
        fi\nffmpeg -version\nffprobe -version\n) 2>&1 | tee \"evidence/native-browser-codecs.log\"\
        \ns=${PIPESTATUS[0]}\nprintf \"%s\\n\" \"$s\" > \"evidence/native-browser-codecs.exit\"\
        \nexit \"$s\"\n"
      if: ${{ !cancelled() && steps.verify_runtime.outcome == 'success' }}
    - name: playwright-browser-install
      id: playwright_browser_install
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps

        ) 2>&1 | tee "evidence/playwright-browser-install.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/playwright-browser-install.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.native_browser_codecs.outcome == 'success' }}
    - name: browser-identities
      id: browser_identities
      if: ${{ !cancelled() && steps.restore_build.outcome == 'success' && steps.verify_runtime.outcome
        == 'success' && steps.playwright_browser_install.outcome == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        python3 - <<''CHROME''

        import pathlib,json,hashlib,subprocess,os

        paths=[p.resolve() for r in sorted((pathlib.Path.home()/''.agent-browser/browsers'').glob(''chrome-*''),reverse=True)
        for p in (r/''chrome'',r/''chrome-linux64/chrome'') if p.is_file()];assert
        paths

        rows=[{''path'':str(p),''version'':subprocess.check_output([str(p),''--version''],text=True).strip(),''sha256'':hashlib.sha256(p.read_bytes()).hexdigest()}
        for p in paths]

        pathlib.Path(''evidence/native-installed-browsers.json'').write_text(json.dumps(rows,indent=2)+''\n'')

        with open(os.environ[''GITHUB_ENV''],''a'') as f:f.write(''E2E_CHROMIUM_EXECUTABLE=''+str(paths[0])+''\n'')

        CHROME

        pnpm --filter @e2e-dev/web exec node --input-type=module - <<''PW''

        import { chromium } from ''playwright-core'';import {readFileSync,writeFileSync}
        from ''node:fs'';import {createHash} from ''node:crypto'';import {execFileSync}
        from ''node:child_process'';

        const p=chromium.executablePath();writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/playwright-installed-browser.json'',JSON.stringify({path:p,version:execFileSync(p,[''--version''],{encoding:''utf8''}).trim(),sha256:createHash(''sha256'').update(readFileSync(p)).digest(''hex'')},null,2));

        PW

        ) 2>&1 | tee evidence/browser-identities.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/browser-identities.exit

        exit "$s"

        '
    - name: public-browser-install
      id: public_browser_install
      if: ${{ !cancelled() && steps.restore_build.outcome == 'success' && steps.verify_runtime.outcome
        == 'success' && steps.playwright_browser_install.outcome == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        node packages/web/dist/bin.js install chromium --with-deps

        ) 2>&1 | tee evidence/public-browser-install.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/public-browser-install.exit

        exit "$s"

        '
    - name: collect-testbed
      id: collect_testbed
      if: ${{ !cancelled() && steps.browser_identities.outcome == 'success' && steps.public_browser_install.outcome
        == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        mkdir -p evidence/testbed

        (cd apps/testbed && node node_modules/e2e/dist/cli/bin.js list --reporter
        json) > evidence/testbed/collection.json 2> evidence/testbed/collection.stderr

        ) 2>&1 | tee evidence/collect-testbed.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/collect-testbed.exit

        exit "$s"

        '
    - name: testbed
      id: testbed
      if: ${{ !cancelled() && steps.browser_identities.outcome == 'success' && steps.public_browser_install.outcome
        == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        mkdir -p evidence/testbed

        set +e

        pnpm --filter @e2e-dev/testbed test

        s=$?

        printf ''%s\n'' "$s" > evidence/testbed/command.exit

        # Preserve original default report/results even when command fails.

        if test -f apps/testbed/.e2e/report.json; then cp apps/testbed/.e2e/report.json
        evidence/testbed/report.json; fi

        if test -d apps/testbed/.e2e/results; then cp -a apps/testbed/.e2e/results
        evidence/testbed/results; fi

        exit "$s"

        ) 2>&1 | tee evidence/testbed.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/testbed.exit

        exit "$s"

        '
    - name: testbed-coverage
      id: testbed_coverage
      if: ${{ !cancelled() && steps.browser_identities.outcome == 'success' && steps.public_browser_install.outcome
        == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        python3 evidence/tools/validate-testbed.py

        ) 2>&1 | tee evidence/testbed-coverage.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/testbed-coverage.exit

        exit "$s"

        '
    - name: verify-build-unchanged
      id: verify_build_unchanged
      if: ${{ !cancelled() && steps.restore_build.outcome == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        python3 evidence/tools/build-assets.py postcheck

        git diff --exit-code HEAD --

        ) 2>&1 | tee evidence/verify-build-unchanged.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/verify-build-unchanged.exit

        exit "$s"

        '
    - name: runtime-postcheck
      id: runtime_postcheck
      if: ${{ !cancelled() && steps.verify_runtime.outcome == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        node evidence/tools/verify-runtimes.ts

        ) 2>&1 | tee evidence/runtime-postcheck.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/runtime-postcheck.exit

        exit "$s"

        '
    - name: Terminal receipt; required commands may not skip
      if: ${{ always() }}
      env:
        STEP_RESULTS: ${{ toJSON(steps) }}
      run: "python3 - <<'RECEIPT'\nimport json,os,pathlib,hashlib\np=pathlib.Path('evidence');p.mkdir(exist_ok=True);s=json.loads(os.environ['STEP_RESULTS']);states={k:v.get('outcome')\
        \ for k,v in s.items()}\ndef read(f):return (p/f).read_text().strip() if (p/f).exists()\
        \ else None\nr={'schemaVersion':1,'selector':os.environ['NODE_SELECTOR'],'lane':os.environ['LANE'],'consumerRun':os.environ['GITHUB_RUN_ID'],'consumerAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'sourceCommit':read('source.commit'),'sourceTree':read('source.tree'),'nodeVersion':read('node.version'),'commands':states,'success':bool(states)\
        \ and all(v=='success' for v in states.values()),'nativeIsReusedProducer':True}\n\
        for f in ['build-manifest.json','ordinary.manifest.json','fault.manifest.json']:\n\
        \ if (p/f).exists():r[f]=json.loads((p/f).read_text())\n(p/'receipt.json').write_text(json.dumps(r,indent=2)+'\\\
        n');assert r['success'],states\nRECEIPT\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: ${{ always() }}
      with:
        name: full-node-evidence-26-testbed
        path: evidence/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  aggregate:
    name: Full five-Node consumer aggregate (not protected spec/formal32)
    needs:
    - build_0
    - consume_0
    - build_1
    - consume_1
    - build_2
    - consume_2
    - build_3
    - consume_3
    - build_4
    - consume_4
    - testbed
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: full-node-evidence-*
        path: receipts
        merge-multiple: false
    - name: Require every expected instance and successful outcome
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
      run: "python3 - <<'GATE'\nimport json,os,pathlib\njobs=json.loads(os.environ['JOB_RESULTS']);assert\
        \ all(j['result']=='success' for j in jobs.values()),jobs\nexpected={(n,l)\
        \ for n in ['22','24','26','22.22.3','24.8.0'] for l in ['build','core','web','tail']}|{('26','testbed')}\n\
        rows=[json.load(open(p)) for p in pathlib.Path('receipts').glob('*/receipt.json')];assert\
        \ len(rows)==21\nassert {(r['selector'],r['lane']) for r in rows}==expected\n\
        assert all(r['success'] and r['consumerRun']==os.environ['GITHUB_RUN_ID']\
        \ for r in rows)\nassert len({r['sourceCommit'] for r in rows})==len({r['sourceTree']\
        \ for r in rows})==1\nfor n in ['22','24','26','22.22.3','24.8.0']:\n subset=[r\
        \ for r in rows if r['selector']==n];assert len({r['nodeVersion'] for r in\
        \ subset})==1\nprint('All21 required receipts present and successful; this\
        \ is the new expanded consumer orchestration, not historical15min/spec/formal\
        \ acceptance.')\nGATE\n"
