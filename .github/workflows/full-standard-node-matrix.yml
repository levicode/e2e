        with open(os.environ[''GITHUB_ENV''],''a'') as f:f.write(''E2E_CHROMIUM_EXECUTABLE=''+str(paths[0])+''\n'')

        CHROME

        pnpm --filter @e2e-dev/web exec node --input-type=module - <<''PW''

        import { chromium } from ''playwright-core'';import {readFileSync,writeFileSync}
        from ''node:fs'';import {createHash} from ''node:crypto'';import {execFileSync}
        from ''node:child_process'';

        const p=chromium.executablePath();writeFileSync(process.env.GITHUB_WORKSPACE+''/evidence/playwright-installed-browser.json'',JSON.stringify({path:p,version:execFileSync(p,[''--version''],{encoding:''utf8''}).trim(),sha256:createHash(''sha256'').update(readFileSync(p)).digest(''hex'')},null,2));

        PW

        ) 2>&1 | tee evidence/browser-identities.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/browser-identities.exit

        exit "$s"

        '
    - name: collect-e2e
      id: collect_e2e
      if: ${{ !cancelled() && steps.browser_identities.outcome == 'success' && matrix.lane
        == 'core' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

