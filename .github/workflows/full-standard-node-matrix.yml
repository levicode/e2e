    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      id: download_build
      if: ${{ !cancelled() && steps.source.outcome == 'success' }}
      with:
        artifact-ids: ${{ needs.build_2.outputs.artifact_id }}
        path: js-build-bundle
        merge-multiple: true
    - name: build-identity
      id: build_identity
      if: ${{ !cancelled() && steps.download_build.outcome == 'success' }}
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        python3 evidence/tools/build-assets.py identity

        ) 2>&1 | tee evidence/build-identity.log

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > evidence/build-identity.exit

        exit "$s"

        '
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: ${{ steps.build_identity.outputs.node_version }}
        cache: pnpm
    - name: Actual versions
      id: versions
      run: 'node --version > evidence/node.version

        pnpm --version > evidence/pnpm.version

        npm --version > evidence/npm.version

        '
    - name: dependencies
      id: dependencies
      run: 'set -uo pipefail

        unset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN AI_GATEWAY_API_KEY OPENAI_API_KEY
        ANTHROPIC_API_KEY

        set +e

        ( set -e

        pnpm install --frozen-lockfile

        ) 2>&1 | tee "evidence/dependencies.log"

        s=${PIPESTATUS[0]}

        printf "%s\n" "$s" > "evidence/dependencies.exit"

        exit "$s"

        '
      if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.versions.outcome
        == 'success' }}
    - name: restore-build
      id: restore_build
