name: Complete source-bound five-Node consumer matrix
'on':
  workflow_dispatch: {}
  push:
    branches: [ci/final-standard-node-matrix]
permissions:
  contents: read
  actions: read
concurrency:
  group: full-standard-node-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  build_0:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_SELECTOR: '22'
      LANE: build
    outputs:
      artifact_id: ${{ steps.upload_build.outputs.artifact-id }}
      manifest_sha: ${{ steps.pack.outputs.manifest_sha }}
      attempt: ${{ steps.pack.outputs.attempt }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Exact source and reviewed pins
      id: source
      run: "set -euo pipefail\ntest -z \"$(git status --porcelain)\"\nmkdir -p evidence/tools\n\
        git rev-parse HEAD > evidence/source.commit\ngit rev-parse HEAD^{tree} > evidence/source.tree\n\
        git ls-tree -r HEAD | grep -vF $'\\t.github/workflows/full-standard-node-matrix.yml'\
        \ | grep -vF $'\\tscripts/ci/full-standard-runtime-pins.json' > evidence/source-inventory.txt\n\
        printf '%s  %s\\n' '2fea1e2862cbda694f5c232dfcef2637d1c77d64a8d7fb00cc944e46b70709ff' evidence/source-inventory.txt\
        \ | sha256sum -c -\nsha256sum scripts/ci/full-standard-runtime-pins.json >\
        \ evidence/runtime-pins.sha256\npython3 - <<'PINS'\nimport json,re\np=json.load(open('scripts/ci/full-standard-runtime-pins.json'));assert\
        \ p['configured'] is True\nassert p['ordinary']['nativeSource']==p['fault']['nativeSource'];assert\
        \ p['fault']['testOnly'] is True\nassert p['ordinary']['artifactId']!=p['fault']['artifactId'];assert\
        \ p['ordinary']['binarySha256']!=p['fault']['binarySha256']\nassert json.load(open('.github/native-candidate.json'))['commit']==p['ordinary']['nativeSource']['commit']\n\
        for k in ['ordinary','fault']:\n a=p[k];assert isinstance(a['artifactId'],int)\
        \ and a['artifactId']>0 and isinstance(a['artifactSize'],int) and a['artifactSize']>0\n\
        \ assert re.fullmatch('sha256:[a-f0-9]{64}',a['artifactDigest'])\n for f in\
        \ ['manifestSha256','binarySha256']:assert re.fullmatch('[a-f0-9]{64}',a[f])\n\
        \ for obj in [a['nativeSource'],a['expected']['source']]:\n  for f in ['commit','tree']:assert\
        \ re.fullmatch('[a-f0-9]{40}',obj[f]) and set(obj[f])!={'0'}\n assert a['expected']['nativeCommit']==a['nativeSource']['commit']\n\
        \ assert a['expected']['repository']=='levicode/e2e' and a['expected']['platform']=='linux'\
        \ and a['expected']['architecture']=='x64'\n for f in ['runId','runAttempt']:assert\
        \ re.fullmatch('[1-9][0-9]*',a['expected'][f])\nPINS\ncat > evidence/tools/build-assets.py\
        \ <<'HELPER_0'\n\"\"\"CI only: source/Node-bound generated JS assets, never\
        \ node_modules/native binaries.\"\"\"\nimport hashlib,json,os,pathlib,platform,subprocess,sys,tarfile,stat\n\
        ROOT=pathlib.Path.cwd();PACKAGES=['e2e','web','mobile','github','kernel','lightpanda','eas','smol','limrun','decision','testmu'];ROOTS=['packages/'+p+'/dist'\
        \ for p in PACKAGES]+['packages/e2e/docs','packages/e2e/skills','packages/e2e/README.md']\n\
        def sha(p):return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()\n\
        def cmd(*a):return subprocess.check_output(a,text=True).strip()\ndef inventory():\n\
        \ out={}\n for root in ROOTS:\n  p=pathlib.Path(root);assert p.exists(),root\n\
        \  for f in ([p] if p.is_file() else sorted(p.rglob('*'))):\n   assert not\
        \ f.is_symlink(),str(f)\n   if f.is_file():out[str(f)]={'sha256':sha(f),'mode':stat.S_IMODE(f.stat().st_mode),'bytes':f.stat().st_size}\n\
        \ return out\ndef identity():return {'sourceCommit':cmd('git','rev-parse','HEAD'),'sourceTree':cmd('git','rev-parse','HEAD^{tree}'),'sourceInventorySHA256':sha('evidence/source-inventory.txt'),'lockSHA256':sha('pnpm-lock.yaml'),'producerRun':os.environ['GITHUB_RUN_ID'],'producerAttempt':os.environ.get('EXPECTED_BUILD_ATTEMPT',os.environ['GITHUB_RUN_ATTEMPT']),'nodeSelector':os.environ['NODE_SELECTOR'],'platform':platform.system(),'architecture':platform.machine()}\n\
        mode=sys.argv[1];bundle=pathlib.Path('js-build-bundle')\nif mode=='pack':\n\
        \ bundle.mkdir();files=inventory()\n for package in PACKAGES:\n  actual=json.loads(pathlib.Path('packages/'+package+'/package.json').read_text())['version'];assert\
        \ json.loads(pathlib.Path('packages/'+package+'/dist/.build.json').read_text())['version']==actual\n\
        \ m={**identity(),'nodeVersion':cmd('node','--version'),'pnpmVersion':cmd('pnpm','--version'),'typescriptVersion':cmd('pnpm','exec','tsc','--version'),'roots':ROOTS,'files':files,'buildCommand':'pnpm\
        \ run build','buildExit':0}\n with tarfile.open(bundle/'outputs.tar.gz','w:gz')\
        \ as t:\n  for root in ROOTS:t.add(root,arcname=root,recursive=True)\n m['archiveSHA256']=sha(bundle/'outputs.tar.gz');(bundle/'manifest.json').write_text(json.dumps(m,indent=2)+'\\\
        n')\n pathlib.Path('evidence/build-manifest.json').write_text(json.dumps(m,indent=2)+'\\\
        n')\n with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('manifest_sha='+sha(bundle/'manifest.json')+'\\\
        nattempt='+m['producerAttempt']+'\\n')\nelif mode in ('identity','restore','postcheck'):\n\
        \ assert sha(bundle/'manifest.json')==os.environ['EXPECTED_BUILD_MANIFEST_SHA256']\n\
        \ m=json.loads((bundle/'manifest.json').read_text());assert all(m[k]==v for\
        \ k,v in identity().items()),'producer/source/host mismatch'\n assert m['roots']==ROOTS\
        \ and m['buildExit']==0 and m['buildCommand']=='pnpm run build';assert sha(bundle/'outputs.tar.gz')==m['archiveSHA256']\n\
        \ assert __import__('re').fullmatch(r'v[0-9]+\\.[0-9]+\\.[0-9]+',m['nodeVersion'])\n\
        \ if mode=='identity':\n  with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('node_version='+m['nodeVersion']+'\\\
        n')\n elif mode=='restore':\n  assert cmd('node','--version')==m['nodeVersion'];assert\
        \ cmd('pnpm','--version')==m['pnpmVersion']\n  # Clean only declared generated\
        \ roots in this job-owned fresh checkout, never shared data.\n  import shutil\n\
        \  for root in ROOTS:\n   p=pathlib.Path(root)\n   if p.is_dir():shutil.rmtree(p)\n\
        \   elif p.exists():p.unlink()\n  with tarfile.open(bundle/'outputs.tar.gz','r:gz')\
        \ as t:\n   members=t.getmembers();regular=[]\n   for x in members:\n    assert\
        \ not x.name.startswith('/') and '..' not in pathlib.PurePosixPath(x.name).parts\n\
        \    assert any(x.name==r or x.name.startswith(r+'/') for r in ROOTS)\n  \
        \  assert x.isfile() or x.isdir()\n    if x.isfile():regular.append(x.name)\n\
        \   assert len(regular)==len(set(regular)) and set(regular)==set(m['files'])\n\
        \   t.extractall('.',filter='data')\n  assert inventory()==m['files'];pathlib.Path('evidence/build-manifest.json').write_text(json.dumps(m,indent=2)+'\\\
        n')\n else:\n  current=inventory();assert current==m['files'],'test changed\
        \ build assets; retain diff, do not pass altered inputs'\nelse:raise SystemExit('unknown\
        \ mode')\n\nHELPER_0\ncat > evidence/tools/download-runtime.py <<'HELPER_1'\n\
        \"\"\"Restore one reviewed producer artifact; never re-label it as current-run\
        \ compilation.\"\"\"\nimport hashlib, io, json, os, pathlib, stat, urllib.request,\
        \ zipfile\nkind=os.environ['RUNTIME_KIND'];assert kind in ('ordinary','fault')\n\
        allpins=json.loads(pathlib.Path('scripts/ci/full-standard-runtime-pins.json').read_text());assert\
        \ allpins['configured'] is True\np=allpins[kind]\nbase='https://api.github.com/repos/levicode/e2e/actions/artifacts/'+str(p['artifactId'])\n\
        token=os.environ['GH_TOKEN']\ndef api(url):\n    return urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':'Bearer\
        \ '+token,'Accept':'application/vnd.github+json'}),timeout=60)\ntry:\n   \
        \ producer=p['producer']\n    with api('https://api.github.com/repos/levicode/e2e/actions/runs/'+p['expected']['runId']+'/attempts/'+p['expected']['runAttempt'])\
        \ as response: run=json.load(response)\n    assert str(run['id'])==p['expected']['runId']\
        \ and str(run['run_attempt'])==p['expected']['runAttempt']\n    assert run['head_sha']==p['expected']['source']['commit']\
        \ and run['status']=='completed'\n    assert run['workflow_id']==producer['workflowId']\
        \ and run['path']==producer['workflowPath']\n    assert run['conclusion']==producer['runConclusion']\n\
        \    with api('https://api.github.com/repos/levicode/e2e/actions/jobs/'+str(producer['jobId']))\
        \ as response: job=json.load(response)\n    assert str(job['run_id'])==p['expected']['runId']\
        \ and str(job['run_attempt'])==p['expected']['runAttempt']\n    assert job['name']==producer['jobName']\
        \ and job['status']=='completed' and job['conclusion']=='success'\n    pathlib.Path('evidence/'+kind+'-producer.json').write_text(json.dumps({'runId':run['id'],'runAttempt':run['run_attempt'],'headSha':run['head_sha'],'workflowId':run['workflow_id'],'workflowPath':run['path'],'runConclusion':run['conclusion'],'jobId':job['id'],'jobName':job['name'],'jobConclusion':job['conclusion']},indent=2)+'\\\
        n')\n    with api(base) as response: a=json.load(response)\n    assert a['id']==p['artifactId']\
        \ and a['name']==p['artifactName'] and not a['expired']\n    assert a['size_in_bytes']==p['artifactSize']\
        \ and a['digest']==p['artifactDigest']\n    assert str(a['workflow_run']['id'])==p['expected']['runId']\n\
        \    assert a['workflow_run']['head_sha']==p['expected']['source']['commit']\n\
        \    # Follow signed redirect without forwarding GitHub authentication to\
        \ blob storage.\n    class NoRedirect(urllib.request.HTTPRedirectHandler):\n\
        \        def redirect_request(self,*args,**kwargs): return None\n    opener=urllib.request.build_opener(NoRedirect)\n\
        \    try:\n        response=opener.open(urllib.request.Request(base+'/zip',headers={'Authorization':'Bearer\
        \ '+token}),timeout=60)\n        raise AssertionError('Artifact endpoint did\
        \ not redirect')\n    except urllib.error.HTTPError as error:\n        assert\
        \ error.code in (301,302,303,307,308)\n        location=error.headers['Location']\n\
        \        assert location.startswith('https://')\n    with urllib.request.urlopen(location,timeout=120)\
        \ as response: data=response.read(p['artifactSize']+1)\n    assert len(data)==p['artifactSize']\
        \ and 'sha256:'+hashlib.sha256(data).hexdigest()==p['artifactDigest']\n  \
        \  target=pathlib.Path(os.environ['RUNNER_TEMP'])/('ci-native-'+kind); target.mkdir()\n\
        \    with zipfile.ZipFile(io.BytesIO(data)) as archive:\n        infos=archive.infolist();\
        \ expected={'agent-browser','compiler.jsonl','manifest.json','rustc.txt'}\n\
        \        assert len(infos)==4 and {x.filename for x in infos}==expected\n\
        \        for info in infos:\n            assert not stat.S_ISLNK(info.external_attr>>16)\n\
        \            with (target/info.filename).open('xb') as output: output.write(archive.read(info))\n\
        \    pathlib.Path('evidence/reused-'+kind+'-artifact.json').write_text(json.dumps({'artifactId':p['artifactId'],'zipDigest':p['artifactDigest'],'producer':p['expected'],'acceptanceEvidence':False},indent=2)+'\\\
        n')\nexcept Exception as error:\n    # Exception text may include a signed\
        \ URL. Only its fixed class is public.\n    raise SystemExit('Runtime artifact\
        \ verification failed: '+type(error).__name__) from None\n\nHELPER_1\ncat\
        \ > evidence/tools/verify-runtimes.ts <<'HELPER_2'\nimport assert from 'node:assert/strict';\n\
        import {readFileSync,readdirSync,lstatSync,chmodSync,appendFileSync,copyFileSync,writeFileSync}\
        \ from 'node:fs';\nimport {join,resolve,isAbsolute} from 'node:path';\nimport\
        \ {createHash} from 'node:crypto';\nimport {verifyArtifact} from '../../scripts/ci/native-runtime.ts';\n\
        const hash=(p:string)=>createHash('sha256').update(readFileSync(p)).digest('hex');\n\
        function verifyCompilerPin(dir:string,p:any,m:any,fault:boolean) {\n const\
        \ c=p.compiler;assert.equal(m.compilerSha256,c.compilerSHA256);assert.equal(m.rustcSha256,c.rustcSHA256);\n\
        \ assert.equal(readFileSync(join(dir,'rustc.txt'),'utf8').split('\\n')[0],c.rustcVersion);\n\
        \ for(const k of ['manifestPath','sourcePath','executable'])assert.equal(m.compilation[k],c[k]);\n\
        \ assert.ok(c.manifestPath.endsWith('/cli/Cargo.toml'));assert.equal(c.sourcePath,c.manifestPath.replace(/Cargo\\\
        .toml$/,'src/main.rs'));assert.ok(c.executable.endsWith('/ci/agent-browser'));\n\
        \ assert.deepEqual(c.command,['cargo','build','--locked','--profile','ci','--no-default-features',...(fault?['--features','acceptance-faults']:[]),'--message-format=json']);\n\
        }\nconst pins=JSON.parse(readFileSync('scripts/ci/full-standard-runtime-pins.json','utf8'));\n\
        assert.equal(pins.configured,true);const current=JSON.parse(readFileSync('.github/native-candidate.json','utf8'));\n\
        assert.deepEqual(pins.ordinary.nativeSource,pins.fault.nativeSource);assert.equal(current.commit,pins.ordinary.nativeSource.commit);\n\
        const ordinaryDir=join(process.env.RUNNER_TEMP!,'ci-native-ordinary');const\
        \ op=pins.ordinary;\nassert.equal(op.expected.platform,process.platform);assert.equal(op.expected.architecture,process.arch);\n\
        const ordinary=verifyArtifact(ordinaryDir,op.manifestSha256,op.expected);const\
        \ om=JSON.parse(readFileSync(join(ordinaryDir,'manifest.json'),'utf8'));\n\
        verifyCompilerPin(ordinaryDir,op,om,false);assert.deepEqual(om.nativeSource,op.nativeSource);assert.equal(hash(ordinary),op.binarySha256);chmodSync(ordinary,0o755);\n\
        appendFileSync(process.env.GITHUB_ENV!,`E2E_AGENT_BROWSER_EXECUTABLE=${ordinary}\\\
        n`);\ncopyFileSync(join(ordinaryDir,'manifest.json'),'evidence/ordinary.manifest.json');\n\
        if(process.env['NEED_FAULT']==='1') {\n const p=pins.fault;assert.equal(p.testOnly,true);const\
        \ dir=join(process.env.RUNNER_TEMP!,'ci-native-fault');\n const files=['agent-browser','compiler.jsonl','manifest.json','rustc.txt'].sort();assert.deepEqual(readdirSync(dir).sort(),files);\n\
        \ for(const f of files)assert.ok(lstatSync(join(dir,f)).isFile());assert.equal(hash(join(dir,'manifest.json')),p.manifestSha256);\n\
        \ const m=JSON.parse(readFileSync(join(dir,'manifest.json'),'utf8'));assert.equal(m.schemaVersion,1);assert.equal(m.kind,'source-built-ci-runtime');assert.equal(m.acceptanceEvidence,false);\n\
        \ for(const [k,v] of Object.entries(p.expected))if(k!=='nativeCommit')assert.deepEqual(m[k],v);\n\
        \ assert.equal(m.platform,process.platform);assert.equal(m.architecture,process.arch);assert.equal(m.nativeRepository,'levicode/agent-browser');assert.deepEqual(m.nativeSource,p.nativeSource);assert.equal(m.nativeSource.commit,p.expected.nativeCommit);\n\
        \ verifyCompilerPin(dir,p,m,true);assert.equal(m.compilation.profile,'ci');assert.deepEqual(m.compilation.features,['acceptance-faults']);for(const\
        \ k of ['manifestPath','sourcePath','executable'])assert.ok(isAbsolute(m.compilation[k]));\n\
        \ for(const [f,k] of [['agent-browser','binarySha256'],['compiler.jsonl','compilerSha256'],['rustc.txt','rustcSha256']])assert.equal(hash(join(dir,f!)),m[k!]);assert.equal(m.binarySha256,p.binarySha256);assert.notEqual(m.binarySha256,op.binarySha256);\n\
        \ const rows=readFileSync(join(dir,'compiler.jsonl'),'utf8').trim().split('\\\
        n').map(x=>JSON.parse(x));const done=rows.filter(x=>x.reason==='build-finished');assert.equal(done.length,1);assert.equal(done[0].success,true);\n\
        \ const binaries=rows.filter(x=>x.reason==='compiler-artifact'&&x.target?.name==='agent-browser'&&x.profile?.test===false);assert.equal(binaries.length,1);const\
        \ b=binaries[0];assert.deepEqual(b.features,['acceptance-faults']);assert.deepEqual(b.target.kind,['bin']);assert.equal(b.manifest_path,m.compilation.manifestPath);assert.equal(b.target.src_path,m.compilation.sourcePath);assert.equal(b.executable,m.compilation.executable);\n\
        \ const fault=resolve(dir,'agent-browser');chmodSync(fault,0o755);appendFileSync(process.env.GITHUB_ENV!,`FULL_NODE_FAULT_EXECUTABLE=${fault}\\\
        n`);copyFileSync(join(dir,'manifest.json'),'evidence/fault.manifest.json');\n\
        }\n\nHELPER_2\ncat > evidence/tools/validate-vitest.py <<'HELPER_3'\nimport\
        \ json,pathlib,collections,sys\np=pathlib.Path(sys.argv[1]);c=json.loads((p/'collection.json').read_text());r=json.loads((p/'results.json').read_text());assert\
        \ isinstance(c,list) and c\nexpected=collections.Counter((x['file'],x['name'])\
        \ for x in c);actual=collections.Counter();optional=[];allrows=[]\noptional_file=(pathlib.Path.cwd()/'packages/web/tests/integration/crosscheck.test.ts').as_posix();optional_name='cross-check\
        \ web-benchmark scenarios every scenario'\nfor f in r['testResults']:\n for\
        \ a in f['assertionResults']:\n  identity=(f['name'],' > '.join(a['ancestorTitles']+[a['title']]));allrows.append(a)\n\
        \  if f['name']==optional_file and a['fullName']==optional_name and a['status']\
        \ in ['pending','skipped']:\n   optional.append({'file':f['name'],'fullName':a['fullName'],'status':'optional-not-executed','reason':'existing\
        \ formal external benchmark contract'})\n   if expected[identity]:expected[identity]-=1\n\
        \  else:actual[identity]+=1\nexpected=+expected\n# Full ordinary Web must\
        \ retain the optional declaration in its actual run report even though Vitest\
        \ list omits static skips.\nif p.name=='ordinary' and p.parent.name=='web':assert\
        \ len(optional)==1\nelse:assert not optional\nout={'listedRequired':sum(expected.values()),'totalReported':len(allrows),'requiredExecutedReports':sum(actual.values()),'requiredPassed':sum(a['status']=='passed'\
        \ for a in allrows),'optionalNotExecuted':optional,'missing':list((expected-actual).elements()),'extra':list((actual-expected).elements()),'counts':{k:r.get(k)\
        \ for k in ['numTotalTests','numPassedTests','numFailedTests','numPendingTests','numTodoTests']},'commandExit':int((p/'command.exit').read_text())};(p/'coverage.json').write_text(json.dumps(out,indent=2)+'\\\
        n')\nassert expected==actual,'required collection/result identity mismatch'\n\
        assert r['numTotalTests']==len(allrows) and r['numFailedTests']==0 and r['numPendingTests']==len(optional)\
        \ and r.get('numTodoTests',0)==0\nassert out['requiredPassed']==sum(actual.values())\
        \ and out['commandExit']==0 and r.get('success') is True\n\nHELPER_3\ncat\
        \ > evidence/tools/validate-scripts.py <<'HELPER_4'\nimport json,pathlib\n\
        p=pathlib.Path('evidence/scripts');expected={pathlib.Path(x).resolve().as_posix()\
        \ for x in (p/'selected-files.txt').read_text().splitlines()};rows=[json.loads(x)\
        \ for x in (p/'events.jsonl').read_text().splitlines()]\n# Require successful\
        \ terminal file wrappers, not merely test:enqueue discovery.\nterminal={pathlib.Path(x['file']).resolve().as_posix()\
        \ for x in rows if x.get('file') and x['type']=='test:pass' and x.get('nesting')==0\
        \ and not x.get('skip') and not x.get('todo')}\nmissing=sorted(expected-terminal);bad=[x\
        \ for x in rows if x['type'] in ['test:fail','test:interrupted'] or x.get('skip')\
        \ or x.get('todo')];summaries=[x['summary'] for x in rows if x['type']=='test:summary'];global_summaries=[x\
        \ for x in summaries if not x.get('file')]\nout={'selectedFiles':len(expected),'terminalSuccessfulFiles':len(expected&terminal),'missing':missing,'badEvents':bad,'summaries':summaries,'commandExit':int((p/'command.exit').read_text())};(p/'coverage.json').write_text(json.dumps(out,indent=2)+'\\\
        n')\nassert expected and not missing and not bad and global_summaries and\
        \ out['commandExit']==0\nfor summary in global_summaries:\n assert summary['success']\
        \ is True\n counts=summary['counts'];assert counts['tests']>0\n for k in ['cancelled','skipped','todo']:assert\
        \ counts[k]==0\n assert counts.get('failed',0)==0 # success is mandatory even\
        \ on typings/versions omitting this supplementary count\n\nHELPER_4\ncat >\
        \ evidence/tools/validate-testbed.py <<'HELPER_5'\nimport json,pathlib\np=pathlib.Path('evidence/testbed');c=json.loads((p/'collection.json').read_text());r=json.loads((p/'report.json').read_text());pairs=c['pairs'];run=r['run'];results=run['results'];expected={x['id']:x\
        \ for x in pairs};actual={x['id']:x for x in results};assert len(expected)==len(pairs)\
        \ and len(actual)==len(results)\nallowed_file='tests/smoke.e2e.ts';allowed_title=['skips\
        \ itself when the playground has no marketplace'];allowed_skip={'cause':'explicit','reason':'the\
        \ playground has no marketplace'}\nskips=[]\nfor x in results:\n if x['status']!='skipped':continue\n\
        \ # Exact existing skip API contract; never a prefix, environment inability,\
        \ or hidden replacement pass.\n assert x['file']==allowed_file and x['titlePath']==allowed_title\
        \ and x['selected'] is True and x['repeat']==0 and not x.get('serialGroupId')\n\
        \ assert x['skip']==allowed_skip and len(x['attempts'])==1\n a=x['attempts'][0];assert\
        \ a['status']=='skipped' and a['skip']==allowed_skip and a['cleanup']=='complete'\
        \ and not a.get('error') and not a['secondaryErrors']\n assert a['steps']\
        \ and all(s['status']=='passed' and not s.get('error') for s in a['steps'])\n\
        \ assert any(s['api']=='app.open' for s in a['steps'])\n # count() is an unrecorded\
        \ read in locator/screen.ts; source-bound control flow reaches explicit skip\
        \ only after awaited Marketplace count===0.\n skips.append({'id':x['id'],'kind':'expected-runtime-skip','reason':allowed_skip['reason'],'attemptExecuted':True,'appOpenRecorded':True,'countEvidence':'unchanged\
        \ source control-flow plus exact runtime branch; not a fabricated count step'})\n\
        out={'collectionCount':len(pairs),'historicalExpectedCount':80,'historicalCountDifference':len(pairs)-80,'resultCount':len(results),'missing':sorted(set(expected)-set(actual)),'extra':sorted(set(actual)-set(expected)),'summary':run['summary'],'outerExit':int((p/'command.exit').read_text()),'runExit':run['exitCode'],'runStatus':run['status'],'expectedRuntimeSkips':skips,'passedCases':sum(x['status']=='passed'\
        \ for x in results),'serialGroups':run.get('serialGroups',[])}\n(p/'coverage.json').write_text(json.dumps(out,indent=2)+'\\\
        n');assert set(expected)==set(actual)\nfor k,x in expected.items():\n y=actual[k];assert\
        \ y['repeat']==0 and x['target']==y['targetId'] and x.get('agent')==y.get('agent')\
        \ and x['file']==y['file'] and x['titlePath']==y['titlePath']\nassert out['outerExit']==run['exitCode']==0\
