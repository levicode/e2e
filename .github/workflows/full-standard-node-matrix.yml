        \ and a['artifactId']>0 and isinstance(a['artifactSize'],int) and a['artifactSize']>0\n\
        \ assert re.fullmatch('sha256:[a-f0-9]{64}',a['artifactDigest'])\n for f in\
        \ ['manifestSha256','binarySha256']:assert re.fullmatch('[a-f0-9]{64}',a[f])\n\
        \ for obj in [a['nativeSource'],a['expected']['source']]:\n  for f in ['commit','tree']:assert\
