        \ evidence/runtime-pins.sha256\npython3 - <<'PINS'\nimport json,re\np=json.load(open('scripts/ci/full-standard-runtime-pins.json'));assert\
        \ p['configured'] is True\nassert p['ordinary']['nativeSource']==p['fault']['nativeSource'];assert\
