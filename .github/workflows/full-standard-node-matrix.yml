        \      skip:data?.skip,todo:data?.todo,details:data?.details?{type:data.details.type,duration_ms:data.details.duration_ms,error:data.details.error?{message:String(data.details.error.message),code:data.details.error.code}:undefined}:undefined};\n\
        \    if(type==='test:summary') row.summary=data;\n    appendFileSync(process.env.E2E_SCRIPT_EVENT_PATH,JSON.stringify(row)+'\\\
        n');\n    if(type==='test:fail'||type==='test:pass') yield `${type} ${data.name}\\\
