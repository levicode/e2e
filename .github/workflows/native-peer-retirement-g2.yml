name: Native peer retirement and real reuse (finite G2)
'on':
  push:
    branches:
    - implement/native-peer-retirement-g2-ci
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: native-peer-retirement-g2-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 4292ef0710fa0517bbe38aac762ebc88f0123d91
  NATIVE_SOURCE_TREE: 5d28268b90ee0c8497f100ba4582d7b99c25cf32
jobs:
  native-runtime:
    uses: ./.github/workflows/native-runtime.yml
  native-interop-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - name: Compile acceptance-faults exact test harness only
      shell: bash
      run: "set -euo pipefail\nmkdir -p evidence\ncd native/cli\ntest \"$(git rev-parse\
        \ HEAD)\" = \"$NATIVE_SOURCE_SHA\"\ntest \"$(git rev-parse HEAD^{tree})\"\
        \ = \"$NATIVE_SOURCE_TREE\"\ntest -z \"$(git status --porcelain)\"\nrustup\
        \ toolchain install 1.99.1 --profile minimal\nrustc +1.99.1 -Vv > \"$GITHUB_WORKSPACE/evidence/rustc-version.txt\"\
        \ncargo +1.99.1 -Vv > \"$GITHUB_WORKSPACE/evidence/cargo-version.txt\"\nunset\
        \ RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS\n\
        export CARGO_TARGET_DIR=\"$RUNNER_TEMP/native-regressions-target\"\ncargo\
        \ +1.99.1 test --locked --profile ci --timings --no-default-features --features\
        \ acceptance-faults --bin agent-browser -j1 --no-run --message-format=json\
        \ > \"$GITHUB_WORKSPACE/evidence/harness.jsonl\" 2> \"$GITHUB_WORKSPACE/evidence/harness-build.log\"\
        \npython3 - <<'PY_HARNESS'\nimport json, os\nfrom pathlib import Path\nout\
        \ = Path(os.environ['GITHUB_WORKSPACE']) / 'evidence'\npaths = set()\nbuild_finished\
        \ = []\nfor line in (out / 'harness.jsonl').read_text().splitlines():\n  \
        \  record = json.loads(line)\n    if record.get('reason') == 'build-finished':\n\
        \        build_finished.append(record.get('success') is True)\n    if (record.get('reason')\
        \ == 'compiler-artifact'\n        and record.get('target', {}).get('name')\
        \ == 'agent-browser'\n        and 'bin' in record.get('target', {}).get('kind',\
        \ [])\n        and record.get('profile', {}).get('test') is True\n       \
        \ and record.get('features') == ['acceptance-faults']\n        and record.get('executable')):\n\
        \        paths.add(record['executable'])\nif build_finished != [True]:\n \
        \   raise SystemExit('Missing or unsuccessful final compiler build receipt')\n\
        if len(paths) != 1:\n    raise SystemExit(f'Expected exactly one test executable,\
        \ got {len(paths)}')\nharness = paths.pop()\nif not Path(harness).is_file():\n\
        \    raise SystemExit('Compiler-selected harness is missing')\n(out / 'harness.path').write_text(harness\
        \ + '\\n')\nPY_HARNESS\nmkdir -p \"$GITHUB_WORKSPACE/native-harness\"\nharness=\"\
        $(cat \"$GITHUB_WORKSPACE/evidence/harness.path\")\"\ncp \"$harness\" \"$GITHUB_WORKSPACE/native-harness/agent-browser-tests\"\
        \ngit rev-parse HEAD > \"$GITHUB_WORKSPACE/native-harness/native-source.sha\"\
        \ngit rev-parse HEAD^{tree} > \"$GITHUB_WORKSPACE/native-harness/native-source.tree\"\
        \n(cd \"$GITHUB_WORKSPACE/native-harness\"; sha256sum agent-browser-tests\
        \ > SHA256SUMS)\n\nprintf '%s\\n' acceptance-faults > \"$GITHUB_WORKSPACE/native-harness/features.txt\"\
        \nprintf '%s\\n' \"$GITHUB_RUN_ID\" > \"$GITHUB_WORKSPACE/native-harness/producer-run.id\"\
        \n\nmkdir -p \"$GITHUB_WORKSPACE/evidence/cargo-timings\"\ncp -a \"$RUNNER_TEMP/native-regressions-target/cargo-timings/.\"\
        \ \"$GITHUB_WORKSPACE/evidence/cargo-timings/\"\n\nprintf \"harness-sha=%s\\\
        n\" \"$(sha256sum \"$GITHUB_WORKSPACE/native-harness/agent-browser-tests\"\
        \ | cut -d' ' -f1)\" >> \"$GITHUB_OUTPUT\"\n"
      id: compile
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: harness_artifact
      with:
        name: peer-retirement-feature-harness
        path: native-harness/
        if-no-files-found: error
        retention-days: 7
    - name: Run all 30 exact native interop cases
      run: python3 scripts/ci/run-interop-reuse-native-tests.py "$(cat evidence/harness.path)"
        scripts/ci/interop-reuse-native-inventory.json evidence/native-interop
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: peer-retirement-native30-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    outputs:
      compiled: ${{ steps.compile.outcome }}
      harness-sha: ${{ steps.compile.outputs.harness-sha }}
      artifact-id: ${{ steps.harness_artifact.outputs.artifact-id }}
  peer-retirement-encoder:
    needs:
    - native-interop-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native
        persist-credentials: false
    - name: Validate actual FFmpeg only for managed recording fault
      timeout-minutes: 7
      run: "set -euo pipefail\nmkdir -p evidence\ndate -u +%FT%TZ > evidence/encoder-install.started\n\
        cat /etc/os-release > evidence/encoder-host.txt\nprobe() {\n command -v ffmpeg\
        \ >/dev/null || return 1\n timeout 20 ffmpeg -v error -f lavfi -i color=c=black:s=64x64:d=0.2\
        \ -c:v libvpx -y \"$RUNNER_TEMP/encoder-preflight.webm\" || return 1\n timeout\
        \ 20 ffmpeg -v error -i \"$RUNNER_TEMP/encoder-preflight.webm\" -frames:v\
        \ 1 -f null - || return 1\n}\nif ! probe > evidence/encoder-first-probe.log\
        \ 2>&1; then\n timeout 120 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20\
        \ -o Acquire::https::Timeout=20 update 2>&1 | tee evidence/encoder-apt-update.log\n\
        \ timeout 30 apt-get --simulate install ffmpeg > evidence/encoder-default-plan.log\n\
        \ timeout 30 apt-get --simulate --no-install-recommends install ffmpeg > evidence/encoder-minimal-plan.log\n\
        \ python3 - <<'PY_PLANS'\nimport pathlib,json\np=pathlib.Path('evidence')\n\
        def names(f):return sorted({x.split()[1] for x in (p/f).read_text().splitlines()\
        \ if x.startswith('Inst ')})\na=names('encoder-default-plan.log');b=names('encoder-minimal-plan.log');assert\
        \ set(b)<=set(a)\njson.dump({'defaultCount':len(a),'noRecommendsCount':len(b),'retained':b,'removedRecommendedOnly':sorted(set(a)-set(b))},open(p/'encoder-package-plan.json','w'),indent=2)\n\
        PY_PLANS\n timeout 180 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20\
        \ -o Acquire::https::Timeout=20 --no-install-recommends install -y ffmpeg\
        \ 2>&1 | tee evidence/encoder-apt-install.log\n probe > evidence/encoder-final-probe.log\
        \ 2>&1\nfi\nffmpeg -version > evidence/ffmpeg-version.txt\ndate -u +%FT%TZ\
        \ > evidence/encoder-install.finished\ndpkg-query -W -f='${Package} ${Version}\\\
        n' > evidence/installed-packages.txt\nsha256sum \"$(readlink -f \"$(command\
        \ -v ffmpeg)\")\" > evidence/encoder-binaries.sha256\n"
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.native-interop-tests.outputs.artifact-id }}
        path: native-harness
        merge-multiple: true
    - name: Verify exact same-run feature harness
      env:
        EXPECTED_HARNESS_SHA: ${{ needs.native-interop-tests.outputs.harness-sha }}
      run: 'set -euo pipefail

        test "$(git -C native rev-parse HEAD)" = "$NATIVE_SOURCE_SHA"

        test "$(git -C native rev-parse HEAD^{tree})" = "$NATIVE_SOURCE_TREE"

        test "$(cat native-harness/native-source.sha)" = "$NATIVE_SOURCE_SHA"

        test "$(cat native-harness/native-source.tree)" = "$NATIVE_SOURCE_TREE"

        test "$(cat native-harness/producer-run.id)" = "$GITHUB_RUN_ID"

        test "$(cat native-harness/features.txt)" = acceptance-faults

        printf ''%s  %s\n'' "$EXPECTED_HARNESS_SHA" native-harness/agent-browser-tests
        | sha256sum --check

        (cd native-harness; sha256sum --check SHA256SUMS)

        chmod +x native-harness/agent-browser-tests

        cp native-harness/native-source.* native-harness/features.txt native-harness/producer-run.id
        evidence/

        '
    - name: Run one ignored real managed encoder phase-one fault, not Chrome evidence
      run: python3 scripts/ci/run-interop-encoder-contract.py native-harness/agent-browser-tests
        evidence/encoder1 scripts/ci/interop-encoder-inventory.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: peer-retirement-encoder1-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
    if: ${{ always() && needs.native-interop-tests.outputs.compiled == 'success' }}
  reuse-browser:
    needs:
    - native-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from
        "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Download exact same-run native artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 3
      with:
        artifact-ids: ${{ needs.native-runtime.outputs.artifact-id }}
        path: ${{ runner.temp }}/ci-native-runtime
        merge-multiple: true
    - name: Verify exact source, compiler, host and binary
      timeout-minutes: 1
      env:
        EXPECTED_MANIFEST_SHA256: ${{ needs.native-runtime.outputs.manifest-sha256
          }}
        PRODUCER_ATTEMPT: ${{ needs.native-runtime.outputs.run-attempt }}
      run: node scripts/ci/native-runtime.ts verify "$RUNNER_TEMP/ci-native-runtime"
        "$EXPECTED_MANIFEST_SHA256" "$PRODUCER_ATTEMPT"
      id: verify
    - name: Install native Chrome without unconditional OS font downloads
      timeout-minutes: 9
      run: 'set -euo pipefail

        date -u +%FT%TZ > evidence/native-install.started

        "$E2E_AGENT_BROWSER_EXECUTABLE" install 2>&1 | tee evidence/native-install.log

        python3 scripts/ci/check-focused-chrome.py

        date -u +%FT%TZ > evidence/native-install.finished'
      id: chrome
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
      id: build
    - name: Typecheck and run 109 finite interop units
      run: 'set -euo pipefail

        pnpm --filter @e2e-dev/web exec tsc --noEmit -p tsconfig.interop-check.json

        pnpm --filter @e2e-dev/web exec node -e ''const assert=require("node:assert/strict");assert.equal(require("playwright-core/package.json").version,"1.64.1")''

        pnpm --filter @e2e-dev/web exec vitest run --config vitest.interop-unit.config.ts
        --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/evidence/interop-units.json"
        2>&1 | tee evidence/interop-units.log

        python3 - <<''PY_UNITS''

        import json

        r=json.load(open(''evidence/interop-units.json''));assert r[''numTotalTests'']==r[''numPassedTests'']==109
        and r[''numFailedTests'']==r[''numPendingTests'']==0

        PY_UNITS

        '
    - name: Run exactly four real owned and borrowed retirement cases
      if: ${{ always() && steps.verify.outcome == 'success' && steps.chrome.outcome
        == 'success' && steps.build.outcome == 'success' }}
      run: "set -euo pipefail\ncp \"$RUNNER_TEMP/ci-native-runtime/manifest.json\"\
        \ evidence/native-runtime.manifest.json\nsha256sum \"$E2E_AGENT_BROWSER_EXECUTABLE\"\
        \ > evidence/native-executable.sha256\npnpm --filter @e2e-dev/web exec vitest\
        \ list --config vitest.interop-reuse.config.ts --no-staticParse --json=\"\
        $GITHUB_WORKSPACE/evidence/reuse-collection.json\"\npython3 - <<'PY_COLLECT'\n\
        import json\nr=json.load(open('evidence/reuse-collection.json'));assert len(r)==4\n\
        assert sorted(x['file'].rsplit('/',1)[-1] for x in r)==['surface-of-native-retirement-close.test.ts']*2+['surface-of-native-reuse.test.ts']*2\n\
        PY_COLLECT\nexport E2E_INTEROP_EVIDENCE_DIR=\"$GITHUB_WORKSPACE/evidence/reuse\"\
        \nunset GH_TOKEN GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN\nset +e\npnpm --filter\
        \ @e2e-dev/web exec vitest run --config vitest.interop-reuse.config.ts --reporter=verbose\
        \ --reporter=json --outputFile.json=\"$GITHUB_WORKSPACE/evidence/reuse-results.json\"\
        \ 2>&1 | tee evidence/reuse.log\nstatus=${PIPESTATUS[0]}\nset -e\nprintf '%s\\\
        n' \"$status\" > evidence/reuse.exit\npython3 - <<'PY_RESULTS'\nimport json,pathlib\n\
        r=json.load(open('evidence/reuse-results.json'));a=[x for t in r['testResults']\
        \ for x in t['assertionResults']]\ncounts={k:r[k] for k in ['numTotalTests','numPassedTests','numFailedTests','numPendingTests']};json.dump(counts,open('evidence/reuse-counts.json','w'),indent=2)\n\
        assert len(a)==r['numTotalTests']==4 and r['numPendingTests']==0\nfiles=['reuse-surface-owned.json','reuse-surface-borrowed.json','peer-terminal-before-dispose.json','peer-terminal-after-dispose.json']\n\
        p=pathlib.Path('evidence/reuse');assert {x.name for x in p.glob('*.json')}==set(files)\n\
        receipts={f:json.load(open(p/f)) for f in files};json.dump(receipts,open('evidence/reuse-receipts.json','w'),indent=2)\n\
        assert r['numPassedTests']==4 and r['numFailedTests']==0\nassert all(x['runtime']=='passed'\
        \ and x['cleanup']=='passed' for x in receipts.values())\nfor ownership in\
        \ ['owned','borrowed']:\n x=receipts['reuse-surface-'+ownership+'.json'];assert\
        \ all(x[k] is True for k in ['samePid','differentContexts','samePlaywrightBrowser','oldContextRemoved','serverClosed'])\n\
        \ assert x['oldCloseEvents']==x['secondCloseEvents']==1\n assert x['endpointResolutions']==(1\
        \ if ownership=='borrowed' else 0)\n if ownership=='borrowed':assert x['borrowedHostPreserved']\
        \ is True and x['testHostReaped'] is True\nfor phase in ['before-dispose','after-dispose']:\n\
        \ x=receipts['peer-terminal-'+phase+'.json'];assert x['phase']==phase and\
        \ x['closeEvents']==1\nPY_RESULTS\ntest \"$status\" -eq 0\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: peer-retirement-real4-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
