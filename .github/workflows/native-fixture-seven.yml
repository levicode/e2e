# Frozen source overlay pending recipe review. Test-only; never production.
name: Seven native pure fixtures (default5 plus feature2; P06 recovery expected RED)
'on':
  push:
    branches:
    - implement/native-fixture-seven-ci
permissions:
  contents: read
concurrency:
  group: native-fixture-seven-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixtures:
    if: ${{ github.ref == 'refs/heads/implement/native-fixture-seven-ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      RUST_MIN_STACK: '16777216'
      RUST_BACKTRACE: '1'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
    - name: Initialize not-run receipts and isolated build directories
      id: init
      timeout-minutes: 1
      run: 'set -euo pipefail

        umask 077

        export EVIDENCE_DIR="$RUNNER_TEMP/native-fixture-seven-evidence"

        export CARGO_HOME="$RUNNER_TEMP/native-fixture-seven-cargo"

        export CARGO_TARGET_DIR="$RUNNER_TEMP/native-fixture-seven-target"

        export VALIDATE="$GITHUB_WORKSPACE/recipe/scripts/native-fixture-seven/fixture-recipe.py"

        printf ''EVIDENCE_DIR=%s\nCARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nVALIDATE=%s\n'' "$EVIDENCE_DIR" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$VALIDATE" >> "$GITHUB_ENV"

        mkdir -m700 "$EVIDENCE_DIR"

        for phase in recipe-identity source-before apply-overlay toolchain node-version format clippy acceptance-tests-check proxy-feature-check default-harness-compile
        default-harness-inventory faults-harness-compile faults-harness-inventory p06-characterization p06-recovery-red cold-unarmed misleading-query response-watermark
        trace-raw-ack-restoration trace-unacknowledged-raw query-matcher source-after; do printf ''not-run\n'' > "$EVIDENCE_DIR/$phase.exit"; done

        printf ''%s\n'' ''Default5 + feature2 exact Rust pure-fixture tests. P06 characterization expected PASS; recovery entry expected genuine RED;2 retirement
        producer candidates expected PASS. No production build/browser/full native suite/retirement count change.'' > "$EVIDENCE_DIR/SCOPE.txt"

        uname -a > "$EVIDENCE_DIR/host.txt"

        cat /etc/os-release >> "$EVIDENCE_DIR/host.txt"

        test "$RUNNER_OS" = Linux

        test "$(uname -m)" = x86_64

        test "$(id -u)" -ne 0

        '
    - name: Check out immutable recipe
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - name: Bind exact recipe
      id: recipe_identity
      timeout-minutes: 1
      run: python3 -B "$VALIDATE" run recipe-identity 30 python3 -B "$VALIDATE" recipe "$GITHUB_WORKSPACE/recipe" "$GITHUB_WORKFLOW_SHA"
    - name: Check out immutable reviewed native test-only source
      id: source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/agent-browser
        ref: 64315733808267b10be34f179f2a2daf4fd644ee
        fetch-depth: 2
        path: source
        persist-credentials: false
    - name: Verify published source and exact reviewed test overlay
      id: overlay
      timeout-minutes: 2
      run: 'set -euo pipefail

        python3 -B "$VALIDATE" run source-before 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" published

        python3 -B "$VALIDATE" run apply-overlay 30 python3 -B "$VALIDATE" apply "$GITHUB_WORKSPACE/source"

        '
    - name: Cache registry bytes only, never build or test executables
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      timeout-minutes: 3
      with:
        path: '${{ env.CARGO_HOME }}/registry

          ${{ env.CARGO_HOME }}/git/db'
        key: fixture-registry-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-1bc2f7a9e6f6c14d4a65c7c709612d43ba5ab63453ab073d28fa933538a11e97
    - name: Install pinned official Rust toolchain
      id: rust
      timeout-minutes: 11
      run: 'python3 -B "$VALIDATE" run toolchain 600 bash -euc ''

        rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

        rustc -Vv

        cargo -Vv

        cargo clippy --version

        cargo fmt --version

        test "$(rustc -Vv | sed -n "s/^release: //p")" = "$RUSTUP_TOOLCHAIN"

        test "$(rustc -Vv | sed -n "s/^host: //p")" = x86_64-unknown-linux-gnu

        ''

        '
    - name: Select pinned Node for browser-free production matcher fixture
      id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      timeout-minutes: 2
      with:
        node-version: 24.19.0
        architecture: x64
    - name: Verify actual Node version
      id: node_version
      timeout-minutes: 1
      run: python3 -B "$VALIDATE" run node-version 30 bash -euc 'test "$(node --version)" = v24.19.0; node --version'
    - name: Preserve strict format clippy and independent compile gates
      id: strict_compile
      timeout-minutes: 43
      working-directory: source/cli
      run: 'set -uo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET

        failed=0

        python3 -B "$VALIDATE" run format 120 cargo fmt --all -- --check || failed=1

        python3 -B "$VALIDATE" run clippy 900 cargo clippy --locked --profile dev --no-default-features --all-targets -- -D warnings || failed=1

        python3 -B "$VALIDATE" run acceptance-tests-check 900 cargo check --locked --profile dev --no-default-features --features acceptance-faults --tests || failed=1

        python3 -B "$VALIDATE" run proxy-feature-check 600 cargo check --locked --profile dev --no-default-features --features acceptance-faults --test client-proxy-fixture
        || failed=1

        exit "$failed"

        '
    - name: Compile default exact-test harness only with dev profile
      id: default_compile
      timeout-minutes: 26
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' }}
      working-directory: source/cli
      run: 'set -euo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET

        python3 -B "$VALIDATE" run default-harness-compile 1500 cargo test --locked --profile dev --no-default-features --bin agent-browser --no-run --message-format=json

        '
    - name: Compile faults exact-test harness only with dev profile
      id: faults_compile
      timeout-minutes: 26
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' }}
      working-directory: source/cli
      run: 'set -euo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET

        python3 -B "$VALIDATE" run faults-harness-compile 1500 cargo test --locked --profile dev --no-default-features --features acceptance-faults --bin agent-browser
        --no-run --message-format=json

        '
    - name: Verify default test ELF features and exact inventory
      id: default_inventory
      timeout-minutes: 2
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run default-harness-inventory 90 python3 -B "$VALIDATE" harness "$GITHUB_WORKSPACE/source" default
    - name: Verify faults test ELF features and exact inventory
      id: faults_inventory
      timeout-minutes: 2
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.faults_compile.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run faults-harness-inventory 90 python3 -B "$VALIDATE" harness "$GITHUB_WORKSPACE/source" faults
    - name: P06 current behavior characterization must pass
      id: characterization
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome == 'success'
        }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case p06-characterization

        '
    - name: P06 recovery entry remains a genuine failing assertion
      id: recovery_red
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome == 'success'
        && steps.characterization.outcome == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case p06-recovery-red

        '
    - name: Cold unarmed producer exact test must pass independently
      id: cold_unarmed
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome == 'success'
        }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case cold-unarmed

        '
    - name: Misleading query producer exact test must pass independently
      id: misleading_query
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome == 'success'
        }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case misleading-query

        '
    - name: Network reader-ahead evaluation gate characterization must pass
      id: response_watermark
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome == 'success'
        }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case response-watermark

        '
    - name: Feature-gated pure trace fixture trace-raw-ack-restoration
      id: trace_raw_ack_restoration
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.faults_compile.outcome == 'success' && steps.faults_inventory.outcome == 'success'
        }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case trace-raw-ack-restoration'
    - name: Feature-gated pure trace fixture trace-unacknowledged-raw
      id: trace_unacknowledged_raw
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.faults_compile.outcome == 'success' && steps.faults_inventory.outcome == 'success'
        }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case trace-unacknowledged-raw'
    - name: Execute patched production MATCH_QUERY fixture without browser
      id: query_matcher
      timeout-minutes: 2
      if: ${{ !cancelled() && steps.overlay.outcome == 'success' && steps.node_version.outcome == 'success' }}
      working-directory: source
      run: python3 -B "$VALIDATE" run query-matcher 60 node cli/tests/fixtures/native-observation-query-matcher.cjs
    - name: Verify exact source overlay after success or failure
      id: source_after
      timeout-minutes: 1
      if: ${{ always() && steps.overlay.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run source-after 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" applied
    - name: Reconcile independent ledgers without turning expected RED green
      id: summary
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: python3 -B "$VALIDATE" summary
    - name: Preserve exact step outcomes
      timeout-minutes: 1
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: printf '%s\n' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"
    - name: Always retain fixture logs and identity receipts, not binaries
      timeout-minutes: 5
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-fixture-seven-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE_DIR }}/
        if-no-files-found: error
        retention-days: 7
