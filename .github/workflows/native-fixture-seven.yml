# Dedicated support trigger only; every selected regression must genuinely pass.
name: 'SW late-detach production repair: twelve exact passing regressions'
'on':
  push:
    branches:
    - implement/sw-late-detach-architecture-ci
permissions:
  contents: read
concurrency:
  group: sw-late-detach-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixtures:
    if: ${{ github.ref == 'refs/heads/implement/sw-late-detach-architecture-ci' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      RUST_MIN_STACK: '16777216'
      RUST_BACKTRACE: '1'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
    - name: Initialize not-run receipts and isolated build directories
      id: init
      timeout-minutes: 1
      run: 'set -euo pipefail

        umask 077

        export EVIDENCE_DIR="$RUNNER_TEMP/sw-late-detach-repair-evidence"

        export CARGO_HOME="$RUNNER_TEMP/sw-late-detach-repair-cargo"

        export CARGO_TARGET_DIR="$RUNNER_TEMP/sw-late-detach-repair-target"

        export VALIDATE="$GITHUB_WORKSPACE/recipe/scripts/native-fixture-seven/fixture-recipe.py"

        printf ''EVIDENCE_DIR=%s\nCARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nVALIDATE=%s\n'' "$EVIDENCE_DIR" "$CARGO_HOME" "$CARGO_TARGET_DIR" "$VALIDATE"
        >> "$GITHUB_ENV"

        mkdir -m700 "$EVIDENCE_DIR"

        for phase in recipe-identity parser-self-tests source-before apply-overlay toolchain format clippy acceptance-tests-check proxy-feature-check
        default-harness-compile default-harness-inventory failed-live-exact-detach-after-decision-keeps-owner-healthy failed-live-exact-detach-after-wait-preserves-failed-retired-error
        error-ack-never-reaches-ready-commit-gate failed-live-pending-wait-honors-independent-operation-cancel failed-live-pending-wait-rejects-wrong-session-detach
        failed-live-pending-wait-rejects-target-destroyed-alone failed-live-pending-wait-rejects-replaced-watermark-subscription failed-terminal-target-destroyed-alone-fails-promptly
        enrollment-observer-failure-never-publishes-ready retirement-waits-for-applied-detach-without-publishing-ready pending-failure-preserves-error-without-retirement-authority
        failed-terminal-preserves-errors-and-refuses-ready-authority source-after; do printf ''not-run\n'' > "$EVIDENCE_DIR/$phase.exit"; done

        printf ''%s\n'' ''Exactly twelve SW late-detach repair regressions, all expected PASS. Reviewed production change, one default dev test
        harness. No browser, product image, seven-suite, query matcher, full native suite or retirement change. Historical architecture RED101
        remains unchanged in its original run.'' > "$EVIDENCE_DIR/SCOPE.txt"

        uname -a > "$EVIDENCE_DIR/host.txt"

        cat /etc/os-release >> "$EVIDENCE_DIR/host.txt"

        test "$RUNNER_OS" = Linux

        test "$(uname -m)" = x86_64

        test "$(id -u)" -ne 0

        '
    - name: Check out immutable recipe
      id: recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 2
      with:
        ref: ${{ github.workflow_sha }}
        path: recipe
        persist-credentials: false
    - name: Bind exact recipe
      id: recipe_identity
      timeout-minutes: 1
      run: python3 -B "$VALIDATE" run recipe-identity 30 python3 -B "$VALIDATE" recipe "$GITHUB_WORKSPACE/recipe" "$GITHUB_WORKFLOW_SHA"
    - name: Run pure parser and source-identity negative tests
      id: parser_tests
      timeout-minutes: 1
      run: python3 -B "$VALIDATE" run parser-self-tests 30 python3 -B "$(dirname "$VALIDATE")/test-recipe.py"
    - name: Check out immutable reviewed SW production repair source
      id: source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 3
      with:
        repository: levicode/agent-browser
        ref: fa8bcdfcb4797ecc495d9e5337d7ea373709f63f
        fetch-depth: 2
        path: source
        persist-credentials: false
    - name: Verify published source and exact reviewed production change
      id: overlay
      timeout-minutes: 2
      run: 'set -euo pipefail

        python3 -B "$VALIDATE" run source-before 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" published

        python3 -B "$VALIDATE" run apply-overlay 30 python3 -B "$VALIDATE" apply "$GITHUB_WORKSPACE/source"

        '
    - name: Cache registry bytes only, never build or test executables
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      timeout-minutes: 3
      with:
        path: '${{ env.CARGO_HOME }}/registry

          ${{ env.CARGO_HOME }}/git/db'
        key: fixture-registry-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-1bc2f7a9e6f6c14d4a65c7c709612d43ba5ab63453ab073d28fa933538a11e97
    - name: Install pinned official Rust toolchain
      id: rust
      timeout-minutes: 11
      run: 'python3 -B "$VALIDATE" run toolchain 600 bash -euc ''

        rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy

        rustc -Vv

        cargo -Vv

        cargo clippy --version

        cargo fmt --version

        test "$(rustc -Vv | sed -n "s/^release: //p")" = "$RUSTUP_TOOLCHAIN"

        test "$(rustc -Vv | sed -n "s/^host: //p")" = x86_64-unknown-linux-gnu

        ''

        '
    - name: Preserve strict format clippy and independent compile gates
      id: strict_compile
      timeout-minutes: 43
      working-directory: source/cli
      run: 'set -uo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET

        failed=0

        python3 -B "$VALIDATE" run format 120 cargo fmt --all -- --check || failed=1

        python3 -B "$VALIDATE" run clippy 900 cargo clippy --locked --profile dev --no-default-features --all-targets -- -D warnings || failed=1

        python3 -B "$VALIDATE" run acceptance-tests-check 900 cargo check --locked --profile dev --no-default-features --features acceptance-faults
        --tests || failed=1

        python3 -B "$VALIDATE" run proxy-feature-check 600 cargo check --locked --profile dev --no-default-features --features acceptance-faults
        --test client-proxy-fixture || failed=1

        exit "$failed"

        '
    - name: Compile default exact-test harness only with dev profile
      id: default_compile
      timeout-minutes: 26
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' }}
      working-directory: source/cli
      run: 'set -euo pipefail

        unset RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_TARGET

        python3 -B "$VALIDATE" run default-harness-compile 1500 cargo test --locked --profile dev --no-default-features --bin agent-browser --no-run
        --message-format=json

        '
    - name: Verify default test ELF features and exact inventory
      id: default_inventory
      timeout-minutes: 2
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run default-harness-inventory 90 python3 -B "$VALIDATE" harness "$GITHUB_WORKSPACE/source" default
    - name: failed-live-exact-detach-after-decision-keeps-owner-healthy must pass exactly once with zero ignored
      id: failed_live_exact_detach_after_decision_keeps_owner_healthy
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case failed-live-exact-detach-after-decision-keeps-owner-healthy

        '
    - name: failed-live-exact-detach-after-wait-preserves-failed-retired-error must pass exactly once with zero ignored
      id: failed_live_exact_detach_after_wait_preserves_failed_retired_error
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case failed-live-exact-detach-after-wait-preserves-failed-retired-error

        '
    - name: error-ack-never-reaches-ready-commit-gate must pass exactly once with zero ignored
      id: error_ack_never_reaches_ready_commit_gate
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case error-ack-never-reaches-ready-commit-gate

        '
    - name: failed-live-pending-wait-honors-independent-operation-cancel must pass exactly once with zero ignored
      id: failed_live_pending_wait_honors_independent_operation_cancel
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case failed-live-pending-wait-honors-independent-operation-cancel

        '
    - name: failed-live-pending-wait-rejects-wrong-session-detach must pass exactly once with zero ignored
      id: failed_live_pending_wait_rejects_wrong_session_detach
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case failed-live-pending-wait-rejects-wrong-session-detach

        '
    - name: failed-live-pending-wait-rejects-target-destroyed-alone must pass exactly once with zero ignored
      id: failed_live_pending_wait_rejects_target_destroyed_alone
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case failed-live-pending-wait-rejects-target-destroyed-alone

        '
    - name: failed-live-pending-wait-rejects-replaced-watermark-subscription must pass exactly once with zero ignored
      id: failed_live_pending_wait_rejects_replaced_watermark_subscription
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case failed-live-pending-wait-rejects-replaced-watermark-subscription

        '
    - name: failed-terminal-target-destroyed-alone-fails-promptly must pass exactly once with zero ignored
      id: failed_terminal_target_destroyed_alone_fails_promptly
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case failed-terminal-target-destroyed-alone-fails-promptly

        '
    - name: enrollment-observer-failure-never-publishes-ready must pass exactly once with zero ignored
      id: enrollment_observer_failure_never_publishes_ready
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case enrollment-observer-failure-never-publishes-ready

        '
    - name: retirement-waits-for-applied-detach-without-publishing-ready must pass exactly once with zero ignored
      id: retirement_waits_for_applied_detach_without_publishing_ready
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case retirement-waits-for-applied-detach-without-publishing-ready

        '
    - name: pending-failure-preserves-error-without-retirement-authority must pass exactly once with zero ignored
      id: pending_failure_preserves_error_without_retirement_authority
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case pending-failure-preserves-error-without-retirement-authority

        '
    - name: failed-terminal-preserves-errors-and-refuses-ready-authority must pass exactly once with zero ignored
      id: failed_terminal_preserves_errors_and_refuses_ready_authority
      timeout-minutes: 3
      if: ${{ !cancelled() && steps.strict_compile.outcome == 'success' && steps.default_compile.outcome == 'success' && steps.default_inventory.outcome
        == 'success' }}
      run: 'unset AGENT_BROWSER_CLEANUP_DIAGNOSTIC_FILE AGENT_BROWSER_ACCEPTANCE_PHASE_FILE

        python3 -B "$VALIDATE" case failed-terminal-preserves-errors-and-refuses-ready-authority

        '
    - name: Verify exact production source after success or failure
      id: source_after
      timeout-minutes: 1
      if: ${{ always() && steps.overlay.outcome == 'success' }}
      run: python3 -B "$VALIDATE" run source-after 30 python3 -B "$VALIDATE" source "$GITHUB_WORKSPACE/source" applied
    - name: Require all twelve exact regressions and strict gates to pass
      id: summary
      timeout-minutes: 1
      if: ${{ always() && steps.recipe.outcome == 'success' }}
      run: python3 -B "$VALIDATE" summary
    - name: Preserve exact step outcomes
      timeout-minutes: 1
      if: ${{ always() }}
      env:
        STEP_OUTCOMES: ${{ toJSON(steps) }}
      run: printf '%s\n' "$STEP_OUTCOMES" > "$EVIDENCE_DIR/step-outcomes.json"
    - name: Always retain raw logs, ledgers and source identities, never binaries
      timeout-minutes: 5
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: sw-late-detach-repair-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.EVIDENCE_DIR }}/
        if-no-files-found: error
        retention-days: 7
