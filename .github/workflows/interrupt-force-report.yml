name: Interrupt report contract and native ownership (focused reuse)
'on':
  push:
    branches:
    - implement/interrupt-force-report-ci
permissions:
  contents: read
concurrency:
  group: interrupt-force-report-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 2b9e0a00ee6466e55c52dacdba1d4f1bece2e2aa
  NATIVE_SOURCE_TREE: 5d92121a84c82082e5c826737ffeb19e92ea4857
jobs:
  original-interrupt:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Download exact historical runtime with API and ZIP checks
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/download-interrupt-runtime.py
    - name: Verify explicit producer source, compiler and bytes
      run: node scripts/ci/verify-interrupt-runtime.ts "$RUNNER_TEMP/interrupt-native-runtime"
    - name: Install exact owned browser dependencies
      run: '"$E2E_AGENT_BROWSER_EXECUTABLE" install --with-deps'
    - name: Build actual public core and web adapter
      run: pnpm run build
    - name: Install original core fixture Playwright Chromium
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
    - name: Collect and execute exact full file
      run: 'set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN

        pnpm --filter e2e exec vitest list tests/integration/interrupt-signals.test.ts --no-staticParse --json="$GITHUB_WORKSPACE/evidence/collection.json"

        node --input-type=module - <<''JS''

        import fs from ''node:fs''; import assert from ''node:assert/strict'';

        const items=JSON.parse(fs.readFileSync(''evidence/collection.json'',''utf8'')); assert.equal(items.length,6);

        JS

        set +e

        pnpm --filter e2e exec vitest run tests/integration/interrupt-signals.test.ts --bail=0 --reporter=default
        --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/results.json" 2>&1 | tee evidence/test.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/test.exit

        node --input-type=module - <<''JS''

        import fs from ''node:fs''; import assert from ''node:assert/strict'';

        const r=JSON.parse(fs.readFileSync(''evidence/results.json'',''utf8'')); const rows=r.testResults.flatMap(t=>t.assertionResults);

        assert.equal(rows.length,6); assert.equal(r.numPendingTests,0); assert.ok(rows.every(x=>x.status===''passed''||x.status===''failed''));
        assert.equal(r.numFailedTests,0); assert.equal(r.numPassedTests,6);

        JS

        exit "$status"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: original-interrupt-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  native-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - run: pnpm install --frozen-lockfile
    - name: Download exact historical runtime with API and ZIP checks
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/ci/download-interrupt-runtime.py
    - name: Verify explicit producer source, compiler and bytes
      run: node scripts/ci/verify-interrupt-runtime.ts "$RUNNER_TEMP/interrupt-native-runtime"
    - name: Install exact owned browser dependencies
      run: '"$E2E_AGENT_BROWSER_EXECUTABLE" install --with-deps'
    - name: Build actual public core and web adapter
      run: pnpm run build
    - name: Install original core fixture Playwright Chromium
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
    - name: Collect and execute exact full file
      run: 'set -euo pipefail

        unset GH_TOKEN GITHUB_TOKEN

        pnpm --filter e2e exec vitest list tests/integration/native-interrupt-ownership.test.ts --no-staticParse
        --json="$GITHUB_WORKSPACE/evidence/collection.json"

        node --input-type=module - <<''JS''

        import fs from ''node:fs''; import assert from ''node:assert/strict'';

        const items=JSON.parse(fs.readFileSync(''evidence/collection.json'',''utf8'')); assert.equal(items.length,4);

        JS

        set +e

        pnpm --filter e2e exec vitest run tests/integration/native-interrupt-ownership.test.ts --bail=0 --reporter=default
        --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/results.json" 2>&1 | tee evidence/test.log

        status=${PIPESTATUS[0]}

        set -e

        printf ''%s\n'' "$status" > evidence/test.exit

        node --input-type=module - <<''JS''

        import fs from ''node:fs''; import assert from ''node:assert/strict'';

        const r=JSON.parse(fs.readFileSync(''evidence/results.json'',''utf8'')); const rows=r.testResults.flatMap(t=>t.assertionResults);

        assert.equal(rows.length,4); assert.equal(r.numPendingTests,0); assert.ok(rows.every(x=>x.status===''passed''||x.status===''failed''));
        assert.equal(r.numFailedTests,0); assert.equal(r.numPassedTests,4);

        JS

        exit "$status"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: native-ownership-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
