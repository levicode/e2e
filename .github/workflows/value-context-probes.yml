name: Focused I04 value compatibility and independent context-binding feasibility
'on':
  push:
    branches:
    - implement/value-and-context-probes-ci
permissions:
  contents: read
concurrency:
  group: value-context-probes-${{ github.ref }}
  cancel-in-progress: false
env:
  E2E_TELEMETRY_DISABLED: '1'
  E2E_UPDATE_CHECK_DISABLED: '1'
  NATIVE_SOURCE_SHA: 26731d39b99fddac3390ac6b1894a08d6dfebaa3
  NATIVE_SOURCE_TREE: 27a3a16e31344aa4535721aee19e407dc37c493e
jobs:
  metadata-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - &id002
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
    - &id003
      name: Capture exact recipe source and reject unfilled pins
      run: 'set -euo pipefail

        mkdir -p evidence

        [[ "$NATIVE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]

        test "$NATIVE_SOURCE_SHA" != 0000000000000000000000000000000000000000

        test -z "$(git status --porcelain --untracked-files=no)"

        git rev-parse HEAD > evidence/e2e-source.sha

        git rev-parse HEAD^{tree} > evidence/e2e-source.tree

        printf ''%s\n'' "$GITHUB_RUN_ID" > evidence/run.id

        node --version > evidence/node.version

        node --input-type=module -e ''import fs from "node:fs";import assert from
        "node:assert/strict";const p=JSON.parse(fs.readFileSync(".github/native-candidate.json","utf8"));assert.equal(p.commit,process.env.NATIVE_SOURCE_SHA);assert.equal(p.repository,"levicode/agent-browser");''

        '
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: levicode/agent-browser
        ref: ${{ env.NATIVE_SOURCE_SHA }}
        path: native-source
        persist-credentials: false
    - name: Run exact-source existing scripted metadata fixtures
      run: "set -euo pipefail\ntest \"$(git -C native-source rev-parse HEAD)\" = \"\
        $NATIVE_SOURCE_SHA\"\ntest \"$(git -C native-source rev-parse HEAD^{tree})\"\
        \ = \"$NATIVE_SOURCE_TREE\"\ntest -z \"$(git -C native-source status --porcelain)\"\
        \nfor fixture in author-metadata locator-projection query-matcher visibility;\
        \ do\n node \"native-source/cli/tests/fixtures/native-observation-$fixture.cjs\"\
        \ 2>&1 | tee \"evidence/$fixture.log\"\ndone\nsha256sum native-source/cli/src/native/client_observation.rs\
        \ native-source/cli/tests/fixtures/native-observation-{author-metadata,locator-projection,query-matcher,visibility}.cjs\
        \ > evidence/fixture-source.sha256\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: i04-scripted-metadata-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  native-runtime:
    uses: ./.github/workflows/native-runtime.yml
  public-value:
    needs: native-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - *id001
    - &id004
      uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
    - *id002
    - *id003
    - run: pnpm install --frozen-lockfile
    - name: Verify same-run source-built production runtime
      uses: ./.github/actions/native-runtime
      with:
        artifact-id: ${{ needs.native-runtime.outputs.artifact-id }}
        manifest-sha256: ${{ needs.native-runtime.outputs.manifest-sha256 }}
        run-attempt: ${{ needs.native-runtime.outputs.run-attempt }}
    - name: Build actual public core and web adapter
      run: 'pnpm --filter e2e run build

        pnpm --filter @e2e-dev/web run build'
    - name: Collect exactly three and run unchanged public value obligations
      run: "set -euo pipefail\nprintf '%s  %s\\n' '0d980d9404d815b189b5ae2155219598bc37ba32066558bd72ba655e00fc7346'\
        \ 'packages/web/tests/integration/observation-control-values.test.ts' | sha256sum\
        \ --check\nnode --input-type=module - <<'JS'\nimport fs from 'node:fs';\n\
        fs.writeFileSync('evidence/i04.tsconfig.json',JSON.stringify({extends:'../tsconfig.base.json',compilerOptions:{noEmit:true,lib:['ES2023','DOM','DOM.Iterable']},include:['../packages/web/tests/integration/observation-control-values.test.ts']}));\n\
        JS\npnpm exec tsc -p evidence/i04.tsconfig.json --noEmit\npnpm exec oxlint\
        \ packages/web/tests/integration/observation-control-values.test.ts\npnpm\
        \ --filter @e2e-dev/web exec vitest list tests/integration/observation-control-values.test.ts\
        \ --no-staticParse --json=\"$GITHUB_WORKSPACE/evidence/value.collect.json\"\
        \nnode --input-type=module - <<'JS'\nimport fs from 'node:fs';import assert\
        \ from 'node:assert/strict';\nconst rows=JSON.parse(fs.readFileSync('evidence/value.collect.json','utf8'));\n\
        assert.deepEqual(rows.map(x=>x.name),[\n 'keeps output and button values absent\
        \ in native observations, queries, and old cache anchors',\n 'preserves empty\
        \ and nonempty control values with distinct observation and exact-query tokens',\n\
        \ 'withholds password and protected-editor values through actual native observation\
        \ and query']);\nassert(rows.every(x=>x.file.endsWith('/tests/integration/observation-control-values.test.ts')));\n\
        JS\nsha256sum \"$E2E_AGENT_BROWSER_EXECUTABLE\" > evidence/native-executable.sha256\n\
        cp \"$RUNNER_TEMP/ci-native-runtime/manifest.json\" evidence/native-runtime.manifest.json\n\
        unset GH_TOKEN GITHUB_TOKEN\nset +e\npnpm --filter @e2e-dev/web exec vitest\
        \ run tests/integration/observation-control-values.test.ts --reporter=verbose\
        \ --reporter=json --outputFile.json=\"$GITHUB_WORKSPACE/evidence/value.vitest.json\"\
        \ 2>&1 | tee evidence/value.log\nstatus=${PIPESTATUS[0]}\nset -e\nprintf '%s\\\
        n' \"$status\" > evidence/value.exit\nnode --input-type=module - <<'JS'\n\
        import fs from 'node:fs';import assert from 'node:assert/strict';\nconst r=JSON.parse(fs.readFileSync('evidence/value.vitest.json','utf8'));\n\
        assert.equal(r.numTotalTests,3);assert.equal(r.numPassedTests,3);assert.equal(r.numFailedTests,0);assert.equal(r.numPendingTests,0);assert.equal(r.success,true);\n\
        JS\ntest \"$status\" -eq 0\n"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: i04-public-value-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
  context-binding-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - *id001
    - *id004
    - *id002
    - *id003
    - run: pnpm install --frozen-lockfile
    - name: Install lockfile-bound Playwright Chromium
      run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
    - name: Run independent disposable-context feasibility (not native acceptance)
      run: 'set -euo pipefail

        printf ''%s  %s\n'' ''3c835eaf4b9ca97a81115131dfe2222c317ad3287295a8e32e41cdd7eba704f5''
        ''scripts/ci/context-binding-probe.mjs'' | sha256sum --check

        export PW_PACKAGE="$(realpath packages/web/node_modules/playwright-core)"

        export CHROME_BIN="$(cd packages/web && node --input-type=module -e ''import
        { chromium } from "playwright-core"; console.log(chromium.executablePath())'')"

        test -x "$CHROME_BIN"

        node --check scripts/ci/context-binding-probe.mjs

        "$CHROME_BIN" --version > evidence/chromium.version

        sha256sum "$CHROME_BIN" > evidence/chromium.sha256

        sha256sum "$PW_PACKAGE/package.json" "$PW_PACKAGE/lib/coreBundle.js" > evidence/playwright-source.sha256

        unset GH_TOKEN GITHUB_TOKEN

        set +e

        node scripts/ci/context-binding-probe.mjs > evidence/context-probe.result.json
        2> evidence/context-probe.stderr.log

        status=$?

        set -e

        printf ''%s\n'' "$status" > evidence/context-probe.exit

        node --input-type=module - <<''JS''

        import assert from ''node:assert/strict'';

        import fs from ''node:fs'';

        const r=JSON.parse(fs.readFileSync(''evidence/context-probe.result.json'',''utf8''));

        assert.equal(r.failure,undefined); assert.equal(r.cleanupFailure,undefined);

        assert.equal(r.playwright,''1.64.1'');

        assert.equal(r.chromiumLaunches,1);

        assert.equal(r.cleanup?.ownedChromiumExited,true);

        assert.deepEqual(r.cases.map(x=>x.name),[''naive-attach-context-mismatch'',''real-context-rendezvous-feasibility'',''cross-client-viewport-cache-divergence'',''native-style-context-disposal-retires-pages'']);

        assert(r.cases.every(x=>x.pass===true));

        JS

        test "$status" -eq 0

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: context-binding-feasibility-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 7
